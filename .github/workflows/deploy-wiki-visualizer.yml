name: Deploy Wiki Visualizer

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'README.md'
      - 'ARTICLES.md'
      - 'Notes/**'
      - 'Azure/**'
      - 'paper/**'
      - 'book/**'
      - 'product/**'
      - '.github/workflows/deploy-wiki-visualizer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 演进页的提交历史与图谱快照需要完整 git 历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/visualizer/package-lock.json

      - name: Install dependencies
        working-directory: wiki/visualizer
        run: npm ci

      - name: Install Python dependencies
        # history.py 解析差距报告 frontmatter 的 trends 与 topics.yml
        run: pip install pyyaml

      - name: Sync content (articles, graph, history, stats)
        run: python3 wiki/visualizer/scripts/sync-content.py

      - name: Build
        working-directory: wiki/visualizer
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/wiki
          cp -r wiki/visualizer/dist/* _site/wiki/

      - name: Build articles search page
        run: python3 wiki/scripts/build-articles-search.py _site/articles

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}wiki/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
