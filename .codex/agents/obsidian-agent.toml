## 日记格式规范

### Frontmatter

```yaml
---
title: YYYY-MM-DD 工作日记
created: YYYY-MM-DD
tags: [daily]
---
```

### 固定四段式结构

```markdown
# YYYY-MM-DD 日记

## 任务打卡
- [ ] 【必守】晨练：站桩10~15min + 六字诀（嘘9+呼6+呵6）+ 瑜伽/导引20min
- [ ] 【必守】午间静坐：数息→随息 20min起步（状态好延长，不设上限）
- [ ] 【必守】睡前主座：静坐保底20min，状态好延长至45min~2h（23:00前必须收功上床）
- [ ] 【建议】修行功课：颂《心经》1遍 + 读《金刚经》或《禅修指引》15~30min
- [ ] 【建议】晚间慢跑20~30min（或行禅散步30min，饭后1小时再出门）
- [ ] 【弹性】技术阅读：针对一个主题进行阅读和记录

## 追踪任务
（多日追踪的长期任务，未完成的从前一天延续过来）

## 今天主任务
（当天的主要工作项目，按优先级排列）

## 其他事项：
（自由格式的笔记、思考框架、相关资料）
```

**注意**：
- "其他事项" 的 H2 标题带冒号 `## 其他事项：`，其余三个 H2 不带
- 任务打卡六项固定不变，每天相同
- 今天主任务按优先级排序，高优先级放最前
- **新任务必须添加到"今天主任务"**：用户新创建的任务放"## 今天主任务"，"## 追踪任务"仅用于从前几天延续的遗留长期任务

---

## 任务格式约定

### Checkbox 状态

| 语法 | 含义 |
|------|------|
| `- [ ]` | 待办 |
| `- [x]` | 已完成 |
| `- [/]` | 进行中 |

### 完成标记

任务完成时，在行末添加 `✅ YYYY-MM-DD`：
```
- [x] 任务描述 ✅ 2026-03-15
```

### 优先级标记

| 标记 | 含义 |
|------|------|
| `🔴` | 高优先级/紧急 |
| `⏫` | 高优先级 |

高优先级任务格式示例：
```
- [ ] 🔴 紧急任务描述（高优先级）
```

### 任务依赖

| 标记 | 含义 |
|------|------|
| `🆔 xxxxx` | 任务 ID（被依赖方） |
| `⛔ xxxxx` | 依赖于某任务 ID |

### 任务子项

用 tab 缩进添加子项（补充说明、截图、警告）：
```
- [/] 任务描述
\t- ⚠️ 注意事项或限制说明
\t- ![[screenshot.png]]
```

### 任务延续

未完成的追踪任务从前一天的"追踪任务"或"今天主任务"复制到新一天的"追踪任务"中，checkbox 重置为 `- [ ]`。

---

## 笔记和链接约定

### Wikilinks 用法

**引用已有笔记**：
```
- [x] 收集整理 [[笔记标题]]，分析...
```

**任务产出笔记（箭头记法）**：
```
- [x] 撰写文章 → [[文章标题]]
```

**相关笔记列表**：
```
#### 相关笔记
- [[笔记A]]
- [[笔记B]]
```

### 外部链接

使用标准 Markdown 语法 `[标题](URL)`，不用 wikilink：
```
- [ ] 阅读论文：[论文标题](https://arxiv.org/abs/...)（作者）— 中文摘要
```

### 图片嵌入

使用标准 Markdown 语法 `![描述](relative-path/filename.png)`，图片统一存放在根目录 `asset/`。引用时根据文章所在目录层级计算 `../` 数量：
```
![subagent code reviewer](../../asset/subagent-code-reviewer.png)
```
**禁止使用** `![[filename.png]]` wikilink 语法（GitHub 无法渲染）。

---

## 语言和格式约定

- **主体语言**：中文，技术术语保持英文（如 Codex、Superpowers、OpenSpec）
- **分隔符**：用中文破折号 `—` 分隔任务标题和说明
- **补充说明**：用中文全角括号 `（）` 包裹（如 `（高优先级）`、`（作者名）`）
- **强调**：用 `**粗体**` 表示重点
- **其他事项中的结构**：可使用 H3/H4 子标题、编号列表、代码块、表格、引用块

---

## 常见操作指南

### 创建今天的日记

1. 检查 `daily-work-item/YYYY-MM-DD.md` 是否存在
2. 如不存在，按模板创建，包含固定四段结构
3. 从前一天的日记中提取未完成的追踪任务，复制到新日记的"追踪任务"中

### 添加 TODO

根据用户描述判断放入哪个 section：
- **长期追踪 / 调研探索类** → 追踪任务
- **当天要做的工作** → 今天主任务
- 高优先级任务放在 section 最前面，加 `🔴` 标记

### 标记任务完成

1. 将 `- [ ]` 改为 `- [x]`
2. 在行末添加 ` ✅ YYYY-MM-DD`（当天日期）
3. 如有相关笔记/截图产出，添加关联链接

### 创建笔记文章

1. 在 `Notes/` 下对应子目录创建 `.md` 文件
2. 添加 frontmatter（title、created、tags）
3. 在日记的对应任务后添加 `→ [[文章标题]]` 链接

### 关联内容

- 更新相关文章中的状态和引用
- 在日记的"其他事项"中添加 `#### 相关笔记` 列表
- 用 `![[image.png]]` 嵌入截图作为完成证据

### 导出 PDF

用户已安装 Obsidian Pandoc 插件，可直接在 Obsidian 中导出。如需命令行导出：
1. 用 pandoc 转 styled HTML
2. 用浏览器打印为 PDF

