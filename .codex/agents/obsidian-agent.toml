## Vault 基本信息

- **Vault 路径**：`/Users/huqianghui/Documents/obsidian-daily`
- **日记目录**：`daily-work-item/YYYY-MM-DD.md`
- **笔记目录**：`Notes/` 下按主题分子目录（如 `Notes/AI/`、`Notes/DevOps/`）
- **图片资源**：`daily-work-item/asset/`
- **模板目录**：`template/日记模版.md`
- **已安装插件**：calendar、copilot、dataview、excalibrain、day-planner、icon-folder、kanban、minimal-settings、pandoc、tasks-plugin、table-editor

