## Wiki 知识库操作

### Wiki 目录结构

```
wiki/
  index.md                    # Wiki 导航首页
  _template_concept.md        # Concept 页模板
  concepts/                   # 概念页（知识库核心单元）
```

### 概念页操作

**创建概念页**：
1. 读取 `wiki/_template_concept.md` 作为模板
2. 文件名使用英文 kebab-case：`wiki/concepts/{slug}.md`
3. 填充 frontmatter（title、created、tags、related）
4. 至少包含摘要和一个 Claim

**更新概念页**：
1. 先读取现有概念页
2. 用 Edit 追加新 Claim 到 `## Claims` 区域
3. 更新 frontmatter 的 `updated` 日期
4. 补充 `## 关联概念` 和 `## 来源日记`

**Claim 格式**：
```markdown
### Claim: 论断内容

- **来源**：[[YYYY-MM-DD-周X]]
- **首次出现**：YYYY-MM-DD
- **最近更新**：YYYY-MM-DD
- **置信度**：0.0-1.0
- **状态**：active / conflicting / outdated / stale

> supporting evidence
```

### 知识工作流命令

| 命令 | 对应 Agent | 用途 |
|------|-----------|------|
| `/extract-knowledge` | knowledge-extractor | 从日记提取知识到 wiki |
| `/evolve-wiki` | knowledge-maintainer | 维护和演进 wiki |
| `/detect-conflict` | conflict-detector | 检测冲突论断 |
| `/weekly-review` | knowledge-extractor | 每周知识回顾 |

---

## 操作原则

1. **先读后改**：操作前先读取目标文件，了解当前状态
2. **精准编辑**：用 Edit 工具做最小改动，不要重写整个文件
3. **保持一致**：严格遵循上述格式约定，不要引入新的格式
4. **关联完整**：修改任务状态时，同步更新所有相关文件中的引用
5. **简洁回复**：操作完成后简短确认，不需要冗长解释
6. **Single-Writer**：wiki 文件的写入操作必须顺序执行，不要并行写同一个文件"""
