<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .t { font-size: 13px; fill: #cbd5e1; }
    .s { font-size: 11px; fill: #94a3b8; }
    .h { font-size: 15px; fill: #e2e8f0; font-weight: 600; }
    .ok { fill: #2dd4bf; }
    .bad { fill: #fbbf24; }
    .cap { fill: #f87171; }
    .plan { stroke: #334155; stroke-dasharray: 5 4; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.35); } }
    .flow { stroke: #2dd4bf; stroke-width: 3; stroke-dasharray: 10 14; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -48; } }
    .breathe { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  </style>
  <rect width="960" height="360" rx="14" fill="#0f172a"/>
  <text x="24" y="32" class="h">数字人会话的两条独立限制叠加后的时间线（实测，2026-10-03）</text>
  <text x="24" y="52" class="s">速率限制：每滚动 60 秒最多新建 3 个（关闭不退还，窗口锚定创建时刻）｜并发限制：同时活跃最多 5 个（关闭立刻释放）</text>

  <!-- time axis -->
  <line x1="60" y1="150" x2="900" y2="150" stroke="#475569" stroke-width="2"/>
  <line x1="60" y1="150" x2="900" y2="150" class="flow" opacity=".6"/>
  <g class="s" text-anchor="middle">
    <text x="60" y="172">0 s</text>
    <text x="300" y="172">60 s</text>
    <text x="540" y="172">120 s</text>
    <text x="780" y="172">180 s</text>
    <text x="900" y="172">t</text>
  </g>
  <g stroke="#475569">
    <line x1="60" y1="144" x2="60" y2="156"/><line x1="300" y1="144" x2="300" y2="156"/>
    <line x1="540" y1="144" x2="540" y2="156"/><line x1="780" y1="144" x2="780" y2="156"/>
  </g>

  <!-- rolling 60 s window of #1 : 12s -> 72s -->
  <rect x="108" y="100" width="240" height="100" fill="#2dd4bf" opacity=".07"/>
  <line x1="108" y1="100" x2="108" y2="200" class="plan" stroke-width="1.5"/>
  <line x1="348" y1="100" x2="348" y2="200" class="plan" stroke-width="1.5"/>
  <text x="228" y="94" class="s" text-anchor="middle">#1 的 60 秒窗口（12 s → 72 s）</text>

  <!-- builds: #1 12s, #2 24s, #3 36s  (x = 60 + t*4) -->
  <g>
    <circle cx="108" cy="150" r="9" class="ok"/><text x="108" y="128" class="t" text-anchor="middle">#1 ✓</text><text x="108" y="196" class="s" text-anchor="middle">12 s</text>
    <circle cx="156" cy="150" r="9" class="ok"/><text x="156" y="128" class="t" text-anchor="middle">#2 ✓</text><text x="156" y="196" class="s" text-anchor="middle">24 s</text>
    <circle cx="204" cy="150" r="9" class="ok"/><text x="204" y="128" class="t" text-anchor="middle">#3 ✓</text><text x="204" y="196" class="s" text-anchor="middle">36 s</text>
  </g>
  <!-- #4 attempt 39-50s rejected -->
  <g>
    <circle cx="260" cy="150" r="9" class="bad pulse"/>
    <text x="260" y="128" class="t" text-anchor="middle">#4 ✗ rate_limit_exceeded</text>
    <text x="260" y="196" class="s" text-anchor="middle">50 s · Retry after 23 s → 73 s ≈ 12 + 60</text>
  </g>
  <!-- window rolls, #4 #5 ok at ~75, 88 -->
  <g>
    <circle cx="360" cy="150" r="9" class="ok"/><text x="360" y="128" class="t" text-anchor="middle">#4 ✓</text><text x="360" y="196" class="s" text-anchor="middle">≈75 s</text>
    <circle cx="412" cy="150" r="9" class="ok"/><text x="412" y="128" class="t" text-anchor="middle">#5 ✓ → 并发 5</text><text x="412" y="196" class="s" text-anchor="middle">≈88 s</text>
  </g>
  <!-- #6 capacity -->
  <g>
    <circle cx="560" cy="150" r="9" class="cap pulse"/>
    <text x="560" y="128" class="t" text-anchor="middle">#6 ✗ avatar_service_resource_exhausted</text>
    <text x="560" y="196" class="s" text-anchor="middle">并发已满 5 · 关掉 1 个后可再建</text>
  </g>
  <!-- particle -->
  <circle r="5" fill="#fbbf24" class="breathe">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,150 L900,150"/>
  </circle>

  <!-- bottom: two takeaways -->
  <g>
    <rect x="60" y="232" width="400" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="258" class="h" style="font-size:13px">关闭不退还速率额度</text>
    <text x="80" y="280" class="s">36 s 把 #1–#3 全部关闭，39 s 立刻开 #4 仍被拒</text>
    <text x="80" y="298" class="s">倒计时锚定 #1 的创建时刻：50 + 23 = 73 ≈ 12 + 60</text>
    <text x="80" y="316" class="s">速率计的是「创建事件」，与会话是否活着无关</text>

    <rect x="500" y="232" width="400" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="520" y="258" class="h" style="font-size:13px">5 个并发能到，但不能一下子到</text>
    <text x="520" y="280" class="s">同一秒发起 5 个：#4、#5 直接被速率限制拒掉</text>
    <text x="520" y="298" class="s">到 5 并发必须分两批，约 2 分钟</text>
    <text x="520" y="316" class="s">5 人同时点「开始」只有 3 人进得去 → 进场要错开或排队</text>
  </g>
</svg>
