<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .t { font-size: 15px; fill: #cbd5e1; }
    .s { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 18px; fill: #e2e8f0; font-weight: 600; }
    .ok { fill: #2dd4bf; }
    .bad { fill: #fbbf24; }
    .cap { fill: #f87171; }
    .lead { stroke: #475569; stroke-width: 1; stroke-dasharray: 3 3; }
    .plan { stroke: #334155; stroke-dasharray: 5 4; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.35); } }
    .flow { stroke: #2dd4bf; stroke-width: 3; stroke-dasharray: 10 14; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -48; } }
    .breathe { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  </style>
  <rect width="1100" height="470" rx="14" fill="#0f172a"/>
  <text x="28" y="36" class="h">数字人会话的两条独立限制叠加后的时间线（实测，2026-10-03）</text>
  <text x="28" y="58" class="s">速率限制：每滚动 60 秒最多新建 3 个，关闭不退还，窗口锚定创建时刻　｜　并发限制：同时活跃最多 5 个，关闭立刻释放</text>

  <!-- x = 70 + t * 5 -->
  <rect x="130" y="104" width="300" height="96" fill="#2dd4bf" opacity=".07"/>
  <line x1="130" y1="104" x2="130" y2="200" class="plan" stroke-width="1.5"/>
  <line x1="430" y1="104" x2="430" y2="200" class="plan" stroke-width="1.5"/>
  <text x="280" y="98" class="s" text-anchor="middle">#1 的 60 秒窗口（12 s → 72 s）</text>

  <line x1="70" y1="182" x2="1030" y2="182" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="182" x2="1030" y2="182" class="flow" opacity=".6"/>
  <g stroke="#475569">
    <line x1="70" y1="176" x2="70" y2="188"/><line x1="370" y1="176" x2="370" y2="188"/>
    <line x1="670" y1="176" x2="670" y2="188"/><line x1="970" y1="176" x2="970" y2="188"/>
  </g>
  <g class="s" text-anchor="middle">
    <text x="70" y="204">0 s</text><text x="370" y="204">60 s</text>
    <text x="670" y="204">120 s</text><text x="970" y="204">180 s</text>
  </g>

  <g class="t" text-anchor="middle">
    <circle cx="130" cy="182" r="9" class="ok"/><text x="130" y="160">#1 ✓</text>
    <circle cx="190" cy="182" r="9" class="ok"/><text x="190" y="160">#2 ✓</text>
    <circle cx="250" cy="182" r="9" class="ok"/><text x="250" y="160">#3 ✓</text>
    <circle cx="320" cy="182" r="9" class="bad pulse"/><text x="320" y="160" fill="#fbbf24">#4 ✗</text>
    <circle cx="445" cy="182" r="9" class="ok"/><text x="445" y="160">#4 ✓</text>
    <circle cx="510" cy="182" r="9" class="ok"/><text x="510" y="160">#5 ✓</text>
    <circle cx="570" cy="182" r="9" class="cap pulse"/><text x="570" y="160" fill="#f87171">#6 ✗</text>
  </g>

  <g class="s">
    <line x1="570" y1="191" x2="570" y2="230" class="lead"/>
    <text x="578" y="234"><tspan fill="#f87171">#6 ✗ 约 100 s</tspan>　avatar_service_resource_exhausted　并发已满 5，关 1 个即可再建</text>

    <line x1="445" y1="191" x2="445" y2="262" class="lead"/><line x1="510" y1="191" x2="510" y2="262" class="lead"/>
    <text x="518" y="266"><tspan fill="#2dd4bf">#4 ✓ 约 75 s　#5 ✓ 约 88 s</tspan>　最老一次滚出窗口后再建 2 个 → 并发 5（约需 2 分钟）</text>

    <line x1="320" y1="191" x2="320" y2="294" class="lead"/>
    <text x="328" y="298"><tspan fill="#fbbf24">#4 ✗ 50 s</tspan>　rate_limit_exceeded · Retry after 23 s → 73 s ≈ 12 + 60　（#1–#3 已于 36 s 全部关闭，仍不退还）</text>

    <line x1="130" y1="191" x2="130" y2="326" class="lead"/>
    <text x="138" y="330"><tspan fill="#2dd4bf">#1 #2 #3 ✓ 12 / 24 / 36 s</tspan>　每 12 秒建 1 个 → 并发 3，速率额度用尽</text>
  </g>

  <circle r="5" fill="#fbbf24" class="breathe">
    <animateMotion dur="6s" repeatCount="indefinite" path="M70,182 L1030,182"/>
  </circle>

  <g>
    <rect x="70" y="362" width="460" height="88" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="388" class="h" style="font-size:15px">关闭不退还速率额度</text>
    <text x="90" y="412" class="s">倒计时锚定 #1 的创建时刻：50 + 23 = 73 ≈ 12 + 60</text>
    <text x="90" y="434" class="s">速率计的是「创建事件」，与会话是否还活着无关</text>

    <rect x="570" y="362" width="460" height="88" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="590" y="388" class="h" style="font-size:15px">5 个并发能到，但不能一下子到</text>
    <text x="590" y="412" class="s">同一秒发起 5 个：第 4、5 个直接被速率限制拒掉</text>
    <text x="590" y="434" class="s">5 人同时点「开始」只有 3 人进得去 → 进场要错开或排队</text>
  </g>
</svg>
