<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="particle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes flowDash { to { stroke-dashoffset: -76; } }
    .flow { stroke-dasharray: 18 20; animation: flowDash 1.6s linear infinite; }
  </style>

  <rect width="1200" height="640" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="638" rx="17" fill="none" stroke="#1e293b"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#e2e8f0">一次部署里的三条认证链路</text>
  <text x="1160" y="46" font-size="13" fill="#64748b" text-anchor="end">全部是同一个 Entra 工作账号，只是凭据各自缓存</text>

  <!-- lane 1: CLI -->
  <text x="40" y="92" font-size="15" font-weight="700" fill="#5eead4">① CLI → 平台 API</text>
  <path id="l1" d="M250 130 H1050" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow"/>
  <circle r="7" fill="url(#particle)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
  <rect x="40" y="104" width="210" height="52" rx="10" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="145" y="135" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="middle">ms auth login</text>
  <rect x="330" y="104" width="230" height="52" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="445" y="128" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Entra 交互登录一次</text>
  <text x="445" y="146" font-size="13" fill="#94a3b8" text-anchor="middle">账号的 home tenant 决定租户</text>
  <rect x="640" y="104" width="190" height="52" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="735" y="128" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">MSAL 令牌缓存</text>
  <text x="735" y="146" font-size="13" fill="#94a3b8" text-anchor="middle">本机，静默续期</text>
  <rect x="910" y="104" width="250" height="52" rx="10" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1035" y="128" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">Power Platform API</text>
  <text x="1035" y="146" font-size="13" fill="#7dd3fc" text-anchor="middle">init · build · deploy · share</text>

  <!-- lane 2: git -->
  <text x="40" y="212" font-size="15" font-weight="700" fill="#5eead4">② git → 平台托管仓库</text>
  <path id="l2" d="M250 250 H1050" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow"/>
  <circle r="7" fill="url(#particle)"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
  <rect x="40" y="224" width="210" height="52" rx="10" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="145" y="255" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="middle">git push</text>
  <rect x="330" y="224" width="230" height="52" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="445" y="248" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Git Credential Manager</text>
  <text x="445" y="266" font-size="13" fill="#94a3b8" text-anchor="middle">按仓库域名走 Entra OAuth</text>
  <rect x="640" y="224" width="190" height="52" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="735" y="248" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">系统钥匙串</text>
  <text x="735" y="266" font-size="13" fill="#94a3b8" text-anchor="middle">access + refresh token</text>
  <rect x="910" y="224" width="250" height="52" rx="10" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1035" y="248" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">环境内的 Git 仓库</text>
  <text x="1035" y="266" font-size="13" fill="#7dd3fc" text-anchor="middle">scope：Power Platform API</text>

  <!-- lane 3: end user -->
  <text x="40" y="332" font-size="15" font-weight="700" fill="#fbbf24">③ 最终用户 → 应用</text>
  <path id="l3" d="M250 370 H1050" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow"/>
  <circle r="7" fill="url(#particleAmber)"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
  <rect x="40" y="344" width="210" height="52" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="145" y="375" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">打开 Play URL</text>
  <rect x="330" y="344" width="230" height="52" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="445" y="368" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">宿主做 Entra 登录</text>
  <text x="445" y="386" font-size="13" fill="#94a3b8" text-anchor="middle">Conditional Access 生效</text>
  <rect x="640" y="344" width="190" height="52" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="735" y="368" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">play 权限 + 许可</text>
  <text x="735" y="386" font-size="13" fill="#94a3b8" text-anchor="middle">两项都要满足</text>
  <rect x="910" y="344" width="250" height="52" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1035" y="368" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">加载应用 iframe</text>
  <text x="1035" y="386" font-size="13" fill="#fcd34d" text-anchor="middle">应用代码不处理登录</text>

  <!-- governance band -->
  <rect x="40" y="436" width="1120" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-dasharray="7 6"/>
  <text x="64" y="466" font-size="15" font-weight="700" fill="#cbd5e1">租户治理（三条链路共同受约束）</text>
  <text x="64" y="494" font-size="13" fill="#94a3b8">事前：Conditional Access、DLP / ACP、分享限制、可选的部署人工审批、是否允许外部 artifact 部署</text>
  <text x="64" y="518" font-size="13" fill="#94a3b8">事后：Microsoft 365 admin center 中的应用清单、运行健康与使用分析</text>

  <text x="40" y="584" font-size="13" fill="#94a3b8">①② 是作者侧，决定"能不能发布"；③ 是使用侧，决定"谁能打开"。三者都不需要应用代码参与，凭据也都不进仓库。</text>
  <text x="40" y="608" font-size="13" fill="#64748b">琥珀色 = 最终用户链路；虚线框 = 平台之上的租户策略层。</text>
</svg>
