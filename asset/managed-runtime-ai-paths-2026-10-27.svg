<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4fa"/><stop offset="1" stop-color="#f2f4fa"/></linearGradient><radialGradient id="pt_teal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#26a696"/><stop offset="1" stop-color="#26a696" stop-opacity="0"/></radialGradient><marker id="ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#26a696"/></marker><radialGradient id="pt_sky" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#0c89c0"/><stop offset="1" stop-color="#0c89c0" stop-opacity="0"/></radialGradient><marker id="ar_sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0c89c0"/></marker><radialGradient id="pt_violet" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#2a0693"/><stop offset="1" stop-color="#2a0693" stop-opacity="0"/></radialGradient><marker id="ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a0693"/></marker><radialGradient id="pt_amber" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#c38f09"/><stop offset="1" stop-color="#c38f09" stop-opacity="0"/></radialGradient><marker id="ar_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c38f09"/></marker><radialGradient id="pt_gray" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#7a899f"/><stop offset="1" stop-color="#7a899f" stop-opacity="0"/></radialGradient><marker id="ar_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a899f"/></marker><radialGradient id="pt_red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#920707"/><stop offset="1" stop-color="#920707" stop-opacity="0"/></radialGradient><marker id="ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#920707"/></marker><radialGradient id="pt_rose" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#950419"/><stop offset="1" stop-color="#950419" stop-opacity="0"/></radialGradient><marker id="ar_rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#950419"/></marker><radialGradient id="pt_green" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#23a954"/><stop offset="1" stop-color="#23a954" stop-opacity="0"/></radialGradient><marker id="ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#23a954"/></marker></defs>
<style>@keyframes flowDash { to { stroke-dashoffset: -76; } } .flow { stroke-dasharray: 18 20; animation: flowDash 1.6s linear infinite; } @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } } .pulse { animation: pulse 2.2s ease-in-out infinite; }</style>
<rect width="1400" height="900" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="898" rx="17" fill="none" stroke="#f3f5f9"/>
<text x="36" y="46" font-size="22" font-weight="700" fill="#2e4d6b" text-anchor="start">在 managed app 里调用 AI：两条通路、一条实验通道、三条死路</text>
<text x="36" y="72" font-size="14" font-weight="400" fill="#5e718d" text-anchor="start">所有可行路线都经过宿主 http/send 和 API Hub，形态都是"请求—等待—一次性返回文本"</text>
<rect x="30" y="96" width="330" height="600" rx="14" fill="#2a0693" fill-opacity="0.04" stroke="#2a0693" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="46" y="120" font-size="14" font-weight="700" fill="#2a0693" text-anchor="start">应用（浏览器里的 SPA）</text>
<rect x="48" y="136" width="294" height="170" rx="12" fill="#f4f3fa" stroke="#2a0693" stroke-width="1.6"/>
<text x="64" y="163" font-size="15" font-weight="700" fill="#210792" text-anchor="start">问答面板</text>
<text x="64" y="187" font-size="13" font-weight="400" fill="#220495" text-anchor="start">用户提问、多轮上下文</text>
<text x="64" y="211" font-size="13" font-weight="400" fill="#220495" text-anchor="start">加载态：超过 10 秒提示"仍在处理"</text>
<text x="64" y="235" font-size="13" font-weight="400" fill="#220495" text-anchor="start">解析回答里的 RELATED 行</text>
<text x="64" y="259" font-size="13" font-weight="400" fill="#220495" text-anchor="start">渲染成应用内链接</text>
<rect x="48" y="326" width="294" height="130" rx="12" fill="#f4f3fa" stroke="#2a0693" stroke-width="1.6"/>
<text x="64" y="353" font-size="15" font-weight="700" fill="#210792" text-anchor="start">本地预检索（可选）</text>
<text x="64" y="377" font-size="13" font-weight="400" fill="#220495" text-anchor="start">从内置快照找相关数据行</text>
<text x="64" y="401" font-size="13" font-weight="400" fill="#220495" text-anchor="start">或前端检索文章块（Fuse.js）</text>
<text x="64" y="425" font-size="13" font-weight="400" fill="#220495" text-anchor="start">CSP 禁 Worker：只能主线程</text>
<rect x="48" y="476" width="294" height="200" rx="12" fill="#faf3f3" stroke="#920707" stroke-width="1.6"/>
<text x="64" y="503" font-size="15" font-weight="700" fill="#940505" text-anchor="start">走不通的两条</text>
<text x="64" y="527" font-size="13" font-weight="400" fill="#940505" text-anchor="start">✗ iframe 嵌 agent 网页聊天</text>
<text x="64" y="551" font-size="13" font-weight="400" fill="#940505" text-anchor="start">   CSP frame-src 'self'</text>
<text x="64" y="575" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">   嵌入代码还要求关闭认证</text>
<text x="64" y="599" font-size="13" font-weight="400" fill="#940505" text-anchor="start">✗ 直接 fetch 模型 API</text>
<text x="64" y="623" font-size="13" font-weight="400" fill="#940505" text-anchor="start">   CSP connect-src 'self'</text>
<rect x="400" y="136" width="250" height="540" rx="12" fill="#f1f6fb" stroke="#0c89c0" stroke-width="1.6" class="pulse"/>
<text x="416" y="163" font-size="15" font-weight="700" fill="#055b94" text-anchor="start">宿主 + API Hub</text>
<text x="416" y="187" font-size="13" font-weight="400" fill="#036696" text-anchor="start">http/send 校验 apiId</text>
<text x="416" y="211" font-size="13" font-weight="400" fill="#036696" text-anchor="start">与连接 runtimeUrl</text>
<text x="416" y="235" font-size="13" font-weight="400" fill="#036696" text-anchor="start">注入当前用户的凭据</text>
<text x="416" y="259" font-size="13" font-weight="400" fill="#036696" text-anchor="start"></text>
<text x="416" y="283" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">单次请求约 120 秒</text>
<text x="416" y="307" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">不能把流式响应</text>
<text x="416" y="331" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">交给调用方</text>
<text x="416" y="355" font-size="13" font-weight="400" fill="#036696" text-anchor="start"></text>
<text x="416" y="379" font-size="13" font-weight="400" fill="#967903" text-anchor="start">④ 实验性的 Cowork 通道</text>
<text x="416" y="403" font-size="13" font-weight="400" fill="#967903" text-anchor="start">由宿主直连，不经 Connector</text>
<rect x="700" y="110" width="670" height="130" rx="12" fill="#faf3f3" stroke="#920707" stroke-width="1.6"/>
<text x="716" y="137" font-size="15" font-weight="700" fill="#960303" text-anchor="start">✗ ① Copilot Studio agent（四种 harness 都同步调不到）</text>
<text x="716" y="161" font-size="13" font-weight="400" fill="#940505" text-anchor="start">Copilot Studio Connector：ExecuteCopilotAsyncV2 必填回调地址 notificationUrl，浏览器收不到</text>
<text x="716" y="185" font-size="13" font-weight="400" fill="#940505" text-anchor="start">改走 Work IQ copilot_chat + agentId：调用成功但 agentId 被忽略，回答来自本体</text>
<text x="716" y="209" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">替代：workflow 异步中转（应用写表 → workflow 调 agent → 写回 → 轮询）</text>
<path d="M650 200 C675 200 675 174 696 174" fill="none" stroke="#920707" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="700" y="260" width="670" height="130" rx="12" fill="#f1fbfb" stroke="#26a696" stroke-width="1.6"/>
<text x="716" y="287" font-size="15" font-weight="700" fill="#0b8e72" text-anchor="start">② Work IQ Copilot MCP → M365 Copilot</text>
<text x="716" y="311" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">MCP tools/call copilot_chat · SSO · 用户自己的身份</text>
<text x="716" y="335" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">不用建 agent；提示词里塞数据快照 + 术语 + RELATED 输出协议</text>
<text x="716" y="359" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">计费：Work IQ API 单独按量，Premium 不覆盖</text>
<path id="p2" d="M650 324 C675 324 675 324 696 324" fill="none" stroke="#26a696" stroke-width="2.3" class="flow" marker-end="url(#ar_teal)"/>
<circle r="6" fill="url(#pt_teal)"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<rect x="700" y="410" width="670" height="130" rx="12" fill="#f1fbfb" stroke="#26a696" stroke-width="1.6"/>
<text x="716" y="437" font-size="15" font-weight="700" fill="#0b8e72" text-anchor="start">③ Azure OpenAI Connector + 前端检索</text>
<text x="716" y="461" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">Chat Completions；检索与引用完全自己掌控，可精确到段落</text>
<text x="716" y="485" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">API key 连接，不支持 SSO，通常共享作者的连接</text>
<text x="716" y="509" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">计费：token；进阶可接 Azure AI Search Connector</text>
<path id="p3" d="M650 474 C675 474 675 474 696 474" fill="none" stroke="#26a696" stroke-width="2.3" class="flow" marker-end="url(#ar_teal)"/>
<circle r="6" fill="url(#pt_teal)"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
<rect x="700" y="560" width="670" height="130" rx="12" fill="#f6f8fb" stroke="#7a899f" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="716" y="587" font-size="15" font-weight="700" fill="#384b61" text-anchor="start">✗ Connector → GitHub Copilot harness agent</text>
<text x="716" y="611" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">Connector 没有对应操作 · Agentic Runtime 只回 SSE 流</text>
<text x="716" y="635" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">应用又不能直连——三层同时堵住，官方确认的已知限制</text>
<text x="716" y="659" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">替代：后台 workflow 跑它，结果写表给应用读</text>
<path id="p4" d="M650 624 H696" fill="none" stroke="#7a899f" stroke-width="2.3" stroke-dasharray="6 6" marker-end="url(#ar_gray)"/>
<path id="p5" d="M342 220 H396" fill="none" stroke="#2a0693" stroke-width="2.3" class="flow" marker-end="url(#ar_violet)"/>
<circle r="6" fill="url(#pt_violet)"><animateMotion dur="0.8s" begin="0.0s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
<rect x="700" y="710" width="670" height="110" rx="12" fill="#fbf8f1" stroke="#c38f09" stroke-width="1.6" class="pulse"/>
<text x="716" y="737" font-size="15" font-weight="700" fill="#967903" text-anchor="start">④ 宿主 cowork/streamPrompt（实验性）</text>
<text x="716" y="761" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">不经 Connector：宿主直连 Cowork 后端，SSE 拆成 text / tool / file / done 事件流式推回</text>
<text x="716" y="785" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">"Experimental — not part of the stable protocol"；默认关闭、需手工 token、SDK 未封装</text>
<path id="p6" d="M525 676 V765 H696" fill="none" stroke="#c38f09" stroke-width="2.3" class="flow" marker-end="url(#ar_amber)"/>
<circle r="6" fill="url(#pt_amber)"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
<text x="40" y="846" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">① 曾被误判为可行：Work IQ 对任意 agentId 都返回成功并原样回显，要用裸问题加对照组才看得出 agent 没有接手</text>
</svg>