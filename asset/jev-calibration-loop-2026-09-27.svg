<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
    <radialGradient id="pT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ccfbf1"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="pA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fef3c7"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <style>
    @keyframes dash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 12 14; animation: dash 1.6s linear infinite; }
    .flowSlow { stroke-dasharray: 8 18; animation: dash 3.2s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
  </style>
  <rect width="1160" height="560" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="558" rx="17" fill="none" stroke="#1e293b"/>
  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">企业级校准决策闭环：两层校准 + 业务策略 + 结果回流</text>
  <text x="640" y="46" font-size="13" fill="#475569">模型层校准由供给方训练；应用层校准与策略由使用方用自己的结果标签完成</text>

  <!-- ===== forward chain (y=190) ===== -->
  <!-- input -->
  <rect x="40" y="160" width="130" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="105" y="185" font-size="12.5" fill="#cbd5e1" text-anchor="middle">软件状态 + 问题</text>
  <text x="105" y="204" font-size="11" fill="#64748b" text-anchor="middle">Choice / Score / Noul</text>
  <!-- jev -->
  <rect x="210" y="150" width="170" height="80" rx="10" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="295" y="176" font-size="13" font-weight="700" fill="#ccfbf1" text-anchor="middle">System One（Jev）</text>
  <text x="295" y="196" font-size="11" fill="#99f6e4" text-anchor="middle">并行采样 · 一次前向</text>
  <text x="295" y="214" font-size="11" fill="#99f6e4" text-anchor="middle">输出 分布 + confidence</text>
  <text x="295" y="250" font-size="11" fill="#2dd4bf" text-anchor="middle">① 模型层校准（RLCD，训练时）</text>
  <!-- calibration layer -->
  <rect x="425" y="150" width="180" height="80" rx="10" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="515" y="176" font-size="13" font-weight="700" fill="#e0e7ff" text-anchor="middle">应用层校准层</text>
  <text x="515" y="196" font-size="11" fill="#c7d2fe" text-anchor="middle">P(正确 | 任务, confidence,</text>
  <text x="515" y="214" font-size="11" fill="#c7d2fe" text-anchor="middle">客群, 状态) · 不改模型权重</text>
  <text x="515" y="250" font-size="11" fill="#818cf8" text-anchor="middle">② 应用层校准（用企业结果标签拟合）</text>
  <!-- policy -->
  <rect x="650" y="150" width="180" height="80" rx="10" fill="#3b2f0b" stroke="#fbbf24"/>
  <text x="740" y="176" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">业务策略</text>
  <text x="740" y="196" font-size="11" fill="#fde68a" text-anchor="middle">阈值 = f(校准概率,</text>
  <text x="740" y="214" font-size="11" fill="#fde68a" text-anchor="middle">错误成本, 复核成本)</text>
  <text x="740" y="250" font-size="11" fill="#fbbf24" text-anchor="middle">③ 阈值来自业务数据，不拍脑袋</text>
  <!-- outcomes -->
  <g font-size="12" text-anchor="middle">
    <rect x="890" y="120" width="120" height="36" rx="8" fill="#134e4a" stroke="#2dd4bf"/><text x="950" y="143" fill="#ccfbf1">AUTO 自动执行</text>
    <rect x="890" y="172" width="120" height="36" rx="8" fill="#3b2f0b" stroke="#fbbf24"/><text x="950" y="195" fill="#fef3c7">REVIEW 二次校验</text>
    <rect x="890" y="224" width="120" height="36" rx="8" fill="#4c0519" stroke="#f43f5e"/><text x="950" y="247" fill="#ffe4e6">HUMAN 人工处理</text>
  </g>
  <!-- arrows forward -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow">
    <path d="M170 190 H 208" marker-end="url(#arT)"/>
    <path d="M380 190 H 423" marker-end="url(#arT)"/>
    <path d="M605 190 H 648" marker-end="url(#arT)"/>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="2" class="flow">
    <path d="M830 175 C 860 175, 860 138, 888 138" marker-end="url(#arA)"/>
    <path d="M830 190 H 888" marker-end="url(#arA)"/>
    <path d="M830 205 C 860 205, 860 242, 888 242" marker-end="url(#arA)"/>
  </g>
  <circle r="5" fill="url(#pT)" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M170 190 H 208 M380 190 H 423 M605 190 H 648"/></circle>
  <circle r="5" fill="url(#pT)" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M172 190 L 830 190 L 888 190"/></circle>

  <!-- ===== outcome labels & feedback (bottom) ===== -->
  <rect x="890" y="310" width="230" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="1005" y="334" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">结果标签（ground truth 代理）</text>
  <text x="1005" y="353" font-size="11" fill="#94a3b8" text-anchor="middle">人工最终决定 · 人工覆写 · 业务结果</text>
  <text x="1005" y="370" font-size="11" fill="#94a3b8" text-anchor="middle">只有预测没有结果 = 不能验证校准</text>
  <path d="M950 260 V 308" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arA)"/>

  <!-- feedback boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="330" width="230" height="110" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <text x="155" y="354" font-weight="700" fill="#ccfbf1">Validation 验证（不改模型）</text>
    <text x="155" y="376" font-size="11" fill="#94a3b8">按 confidence 分桶对实际正确率</text>
    <text x="155" y="394" font-size="11" fill="#94a3b8">可靠性表 / ECE / Brier</text>
    <text x="155" y="412" font-size="11" fill="#94a3b8">分任务、分客群、分时段做</text>
    <text x="155" y="430" font-size="11" fill="#2dd4bf" class="pulse">先做这一层</text>

    <rect x="310" y="330" width="230" height="110" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="425" y="354" font-weight="700" fill="#e0e7ff">Calibration 校准（通常不改模型）</text>
    <text x="425" y="376" font-size="11" fill="#94a3b8">拟合小校准模型：raw 0.92 → 真实 0.84</text>
    <text x="425" y="394" font-size="11" fill="#94a3b8">输入含任务类型 / 客群 / 元数据</text>
    <text x="425" y="412" font-size="11" fill="#94a3b8">漂移监测 → 定期重校准</text>
    <text x="425" y="430" font-size="11" fill="#818cf8" class="pulse">再做这一层</text>

    <rect x="580" y="330" width="250" height="110" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="705" y="354" font-weight="700" fill="#fef3c7">Post-training 后训练（改模型）</text>
    <text x="705" y="376" font-size="11" fill="#94a3b8">A 领域适配 SFT：学企业自己的决策规则</text>
    <text x="705" y="394" font-size="11" fill="#94a3b8">B RLCD 式校准训练：把握与结果一致</text>
    <text x="705" y="412" font-size="11" fill="#94a3b8">C 策略学习 · 需客户明确授权（默认不训）</text>
    <text x="705" y="430" font-size="11" fill="#fbbf24" class="pulse">最后才考虑</text>
  </g>
  <!-- feedback arrows -->
  <g fill="none" stroke="#64748b" stroke-width="2" class="flowSlow">
    <path d="M890 345 H 842" marker-end="url(#arA)"/>
    <path d="M580 385 H 542" marker-end="url(#arA)"/>
    <path d="M310 385 H 272" marker-end="url(#arA)"/>
  </g>
  <!-- loops back up -->
  <path d="M155 330 V 290 Q 155 275 170 275 H 515 Q 515 275 515 260 V 232" fill="none" stroke="#818cf8" stroke-width="1.8" class="flowSlow" marker-end="url(#arA)"/>
  <path d="M705 330 V 300 Q 705 285 690 285 H 310 Q 295 285 295 270 V 232" fill="none" stroke="#fbbf24" stroke-width="1.8" class="flowSlow" marker-end="url(#arA)"/>
  <circle r="5" fill="url(#pA)" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M890 345 H 842 M580 385 H 272"/></circle>

  <!-- footer -->
  <rect x="40" y="470" width="1080" height="64" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="60" y="495" font-size="12" fill="#cbd5e1">错误/分歧挖掘循环：历史记录 → bad case（人工覆写、低置信却错、高置信却错）→ 训练 / 校准 → 评估 → 影子部署 → 生产 → 新 bad case</text>
  <text x="60" y="518" font-size="12" fill="#64748b">RLCD 解决"不确定性可被软件利用"，不解决"决策是否正确"；企业自己的"历史决策 + 最终结果"在标签质量足够时可成为比前沿模型共识更好的校准信号</text>
</svg>
