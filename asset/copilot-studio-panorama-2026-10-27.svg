<text x="834" y="227" font-size="13" font-weight="400" fill="#c4b5fd" text-anchor="start">或 ms CLI 写代码</text>
<text x="834" y="251" font-size="13" font-weight="400" fill="#c4b5fd" text-anchor="start">给人用的界面</text>
<rect x="30" y="372" width="1010" height="170" rx="14" fill="#fbbf24" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
