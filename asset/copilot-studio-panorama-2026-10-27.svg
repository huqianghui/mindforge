<text x="40" y="756" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">① agent 按创建时选定的 harness 落到对应运行时，创建后不能互转</text>
<text x="40" y="782" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">② workflow 的 agent 节点可以调用 GitHub Copilot harness 的 agent</text>
<text x="40" y="808" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">③ app 跑在 Copilot Managed Runtime，与 Power Apps 播放器无关</text>
<text x="720" y="756" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">④ 三类构建物共用环境、Dataverse、Connector、DLP——共享的是地基，不是运行时</text>
<text x="720" y="782" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">⑤ 环境、连接与 DLP 在 Power Platform admin center 管</text>
<text x="720" y="808" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">⑥ managed app 清单、使用量与 Credits 在 Microsoft 365 admin center 看</text>
