<text x="312" y="485" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">Bash 容器、只回流式</text>
<text x="312" y="509" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">Connector 调不了 ✗</text>
