<text x="1106" y="157" font-size="15" font-weight="700" fill="#ffe4e6" text-anchor="start">Microsoft 365 admin center</text>
<text x="1106" y="181" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Apps：managed app 清单</text>
<text x="1106" y="205" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">运行健康、使用分析</text>
<text x="1106" y="229" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Copilot → Cost management</text>
<text x="1106" y="253" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Credits 消耗</text>
<text x="1106" y="277" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">用户入口：</text>
<text x="1106" y="301" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">managedapps.cloud.microsoft</text>
<text x="1106" y="325" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">管理员不需被分享即可看到</text>
<rect x="1090" y="420" width="262" height="284" rx="12" fill="#2a1220" stroke="#fb7185" stroke-width="1.6"/>
<text x="1106" y="447" font-size="15" font-weight="700" fill="#ffe4e6" text-anchor="start">Power Platform admin center</text>
<text x="1106" y="471" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Manage → Environments</text>
<text x="1106" y="495" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">创建、类型、到期警告</text>
<text x="1106" y="519" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Security → Data and privacy</text>
<text x="1106" y="543" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Data policy（DLP）</text>
<text x="1106" y="567" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Azure Virtual Network policies</text>
<text x="1106" y="591" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">Environment groups</text>
<text x="1106" y="615" font-size="13" font-weight="400" fill="#fda4af" text-anchor="start">普通账号打开策略页是空的</text>
