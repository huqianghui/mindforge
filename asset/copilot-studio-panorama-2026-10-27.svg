<text x="66" y="485" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">前身 Power Virtual Agents</text>
<text x="66" y="509" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">可被 Connector 调用 ✓</text>
