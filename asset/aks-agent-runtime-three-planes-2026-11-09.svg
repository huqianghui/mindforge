<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1030" width="1400" height="1030" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .cluster { fill: none; stroke: #38bdf8; stroke-width: 1.6; stroke-dasharray: 12 6; }
      .zone { fill: #0d1729; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .zoneX { fill: #0c1d33; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .zl { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .zls { fill: #94a3b8; font-size: 13px; }
      .cl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .native { fill: #0f2a2a; stroke: #2dd4bf; stroke-width: 1.6; }
      .comm { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .build { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 1.8; stroke-dasharray: 7 4; animation: pulse 2.6s ease-in-out infinite; }
      .ext { fill: #1e293b; stroke: #64748b; stroke-width: 1.4; }
      .deny { fill: #2a1215; stroke: #f87171; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .h { fill: #f1f5f9; font-size: 15px; font-weight: 600; }
      .hc { fill: #f1f5f9; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .t { fill: #cbd5e1; font-size: 13px; }
      .tc { fill: #cbd5e1; font-size: 13px; text-anchor: middle; }
      .tr { fill: #fecaca; font-size: 13px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.1; stroke-dasharray: 7 6; animation: dash 1.2s linear infinite; }
      .flowRed { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 4 5; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.3; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .lgh { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      @keyframes dash { to { stroke-dashoffset: -26; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1030" rx="16"/>
  <text class="title" x="30" y="44">AKS 上的 agent runtime：三个平面与信任边界</text>
  <text class="sub" x="30" y="72">青绿实线 = AKS 原生提供；蓝色 = 社区组件可直接选；琥珀虚线 = 需要自己补的部分。编号为一次请求的数据流</text>

  <!-- 顶部：渠道 / 存储 / 外部资源 -->
  <rect class="ext" x="52" y="96" width="95" height="50" rx="8"/><text class="hc" x="99" y="126">Teams</text>
  <rect class="ext" x="159" y="96" width="95" height="50" rx="8"/><text class="hc" x="206" y="126">API / CLI</text>
  <rect class="ext" x="266" y="96" width="95" height="50" rx="8"/><text class="hc" x="313" y="126">Cron</text>
  <rect class="ext" x="373" y="96" width="95" height="50" rx="8"/><text class="hc" x="420" y="126">A2A</text>

  <rect class="ext" x="510" y="96" width="380" height="50" rx="8"/>
  <text class="hc" x="700" y="118">Blob / ACR</text>
  <text class="tc" x="700" y="137">checkpoint、artifact、transcript</text>

  <rect class="ext" x="950" y="96" width="230" height="50" rx="8"/>
  <text class="hc" x="1065" y="118">模型 · Git · ADO</text>
  <text class="tc" x="1065" y="137">真实资源</text>
  <rect class="ext" x="1192" y="96" width="158" height="50" rx="8"/>
  <text class="hc" x="1271" y="126">Key Vault</text>

  <!-- AKS 集群边界 -->
  <rect class="cluster" x="30" y="170" width="1340" height="620" rx="14"/>
  <text class="cl" x="48" y="195">AKS 集群</text>

  <!-- 三个平面区域 -->
  <rect class="zone" x="50" y="208" width="420" height="472" rx="10"/>
  <text class="zl" x="66" y="232">会话平面</text><text class="zls" x="140" y="232">可信 · 普通节点池</text>
  <rect class="zoneX" x="490" y="208" width="420" height="472" rx="10"/>
  <text class="zl" x="506" y="232">执行平面</text><text class="zls" x="580" y="232">不可信 · Kata 节点池</text>
  <rect class="zone" x="930" y="208" width="420" height="472" rx="10"/>
  <text class="zl" x="946" y="232">治理平面</text><text class="zls" x="1020" y="232">可信</text>

  <!-- 会话平面卡片 -->
  <rect class="build" x="70" y="248" width="380" height="80" rx="10"/>
  <text class="h" x="90" y="274">渠道适配器</text>
  <text class="t" x="90" y="296">认证入站，记下说话人</text>
  <text class="t" x="90" y="316">算会话键，按私有回复地址回写结果</text>

  <rect class="build" x="70" y="358" width="380" height="150" rx="10"/>
  <text class="h" x="90" y="384">Session Service</text>
  <text class="t" x="90" y="408">会话 ID 稳定，背后的沙箱可以替换</text>
  <text class="t" x="90" y="430">收件箱：落盘后才 ACK，同会话一次一轮</text>
  <text class="t" x="90" y="452">状态机：运行 / 暂停 / 恢复 / 过期</text>
  <text class="t" x="90" y="474">到期索引扫描 + 标签对账清孤儿</text>
  <text class="t" x="90" y="496">多副本时要有 lease 与 fencing</text>

  <rect class="build" x="70" y="538" width="380" height="122" rx="10"/>
  <text class="h" x="90" y="564">Agent 定义与注册</text>
  <text class="t" x="90" y="588">CRD + controller 解析模型、工具、文件包</text>
  <text class="t" x="90" y="610">全部解析通过才生成不可变 revision</text>
  <text class="t" x="90" y="632">生成 A2A Agent Card 供发现</text>

  <!-- 执行平面卡片 -->
  <rect class="comm" x="510" y="248" width="380" height="80" rx="10"/>
  <text class="h" x="530" y="274">沙箱编排</text>
  <text class="t" x="530" y="296">agent-sandbox / OpenSandbox</text>
  <text class="t" x="530" y="316">模板、预热池、Claim、暂停恢复、快照</text>

  <rect class="native" x="510" y="358" width="380" height="210" rx="10"/>
  <text class="h" x="530" y="384">Kata 沙箱 Pod（每会话一个）</text>
  <text class="t" x="530" y="410">• harness：Claude Code / Codex / Copilot CLI</text>
  <text class="t" x="530" y="434">• 工具：shell、构建测试、浏览器、stdio MCP</text>
  <text class="t" x="530" y="458">• 工作区 + harness 自己的会话文件</text>
  <text class="t" x="530" y="482">• 执行守护进程：控制面进来的唯一入口</text>
  <text class="t" x="530" y="512">独立 guest kernel，harness 免确认运行</text>
  <text class="t" x="530" y="534">被劫持的最坏结果限定在这个 VM 里</text>

  <rect class="deny" x="510" y="590" width="380" height="70" rx="10"/>
  <text class="h" x="530" y="616" fill="#fecaca">不挂 SA token · 不放密钥</text>
  <text class="tr" x="530" y="640">出站默认拒绝；IMDS、API Server 都不可达</text>

  <!-- 治理平面卡片 -->
  <rect class="comm" x="950" y="248" width="380" height="96" rx="10"/>
  <text class="h" x="970" y="274">出站网关</text>
  <text class="t" x="970" y="296">mTLS 证书 → 存活 Pod → 唯一会话</text>
  <text class="t" x="970" y="318">agentgateway / Envoy；LLM、MCP 同一入口</text>

  <rect class="comm" x="950" y="374" width="380" height="96" rx="10"/>
  <text class="h" x="970" y="400">资源级授权（ReBAC）</text>
  <text class="t" x="970" y="422">生效权限 = 申请 ∩ 批准 ∩ 实时检查</text>
  <text class="t" x="970" y="444">OpenFGA；申请不等于授予</text>

  <rect class="comm" x="950" y="500" width="380" height="72" rx="10"/>
  <text class="h" x="970" y="526">凭据注入</text>
  <text class="t" x="970" y="550">放行后在出站时加 header，沙箱拿不到</text>

  <rect class="build" x="950" y="592" width="380" height="68" rx="10"/>
  <text class="h" x="970" y="618">审计 · 配额 · 计量</text>
  <text class="t" x="970" y="642">按会话 / agent / 租户归集</text>

  <!-- AKS 原生原语条 -->
  <text class="zl" x="50" y="716">AKS 原生原语</text>
  <rect class="native" x="50" y="730" width="250" height="44" rx="8"/><text class="hc" x="175" y="757">Pod Sandboxing（Kata）</text>
  <rect class="native" x="314" y="730" width="250" height="44" rx="8"/><text class="hc" x="439" y="757">Workload Identity</text>
  <rect class="native" x="578" y="730" width="250" height="44" rx="8"/><text class="hc" x="703" y="757">节点池 / NAP</text>
  <rect class="native" x="842" y="730" width="250" height="44" rx="8"/><text class="hc" x="967" y="757">CSI：Files / Disk / Blob</text>
  <rect class="native" x="1106" y="730" width="244" height="44" rx="8"/><text class="hc" x="1228" y="757">Cilium 网络策略</text>

  <!-- 数据流 -->
  <path class="flow" d="M260,146 V246" marker-end="url(#arr)"/>
  <path class="flow" d="M260,328 V356" marker-end="url(#arr)"/>
  <path class="flow" d="M450,392 H480 V288 H508" marker-end="url(#arr)"/>
  <path class="flow" d="M450,470 H508" marker-end="url(#arr)"/>
  <path class="flow" d="M830,248 V148" marker-end="url(#arr)"/>
  <path class="flow" d="M890,420 H920 V296 H948" marker-end="url(#arr)"/>
  <path class="flow" d="M1140,344 V372" marker-end="url(#arr)"/>
  <path class="flow" d="M1140,470 V498" marker-end="url(#arr)"/>
  <path class="flow" d="M1330,536 H1360 V121 H1352" marker-end="url(#arr)"/>
  <path class="flow" d="M1065,248 V148" marker-end="url(#arr)"/>
  <!-- 反向禁止 -->
  <path class="flowRed" d="M510,625 H470" marker-end="url(#arrRed)"/>
  <text x="482" y="612" fill="#f87171" font-size="18" font-weight="700" text-anchor="middle">✗</text>

  <!-- 粒子 -->
  <circle r="5" fill="#5eead4">
    <animateMotion dur="7s" repeatCount="indefinite" path="M260,146 V356 M450,470 H508"/>
  </circle>
  <circle r="5" fill="#5eead4">
    <animateMotion dur="5s" repeatCount="indefinite" path="M890,420 H920 V296 H1140 V498"/>
  </circle>

  <!-- 编号徽章 -->
  <circle class="badge" cx="280" cy="196" r="12"/><text class="bn" x="280" y="201">①</text>
  <circle class="badge" cx="280" cy="342" r="12"/><text class="bn" x="280" y="347">②</text>
  <circle class="badge" cx="494" cy="340" r="12"/><text class="bn" x="494" y="345">③</text>
  <circle class="badge" cx="480" cy="452" r="12"/><text class="bn" x="480" y="457">④</text>
  <circle class="badge" cx="850" cy="198" r="12"/><text class="bn" x="850" y="203">⑤</text>
  <circle class="badge" cx="920" cy="350" r="12"/><text class="bn" x="920" y="355">⑥</text>
  <circle class="badge" cx="1160" cy="358" r="12"/><text class="bn" x="1160" y="363">⑦</text>
  <circle class="badge" cx="1160" cy="484" r="12"/><text class="bn" x="1160" y="489">⑧</text>
  <circle class="badge" cx="1085" cy="198" r="12"/><text class="bn" x="1085" y="203">⑨</text>
  <circle class="badge" cx="452" cy="644" r="12"/><text class="bn" x="452" y="649">⑩</text>

  <!-- 图例 -->
  <line x1="30" y1="812" x2="1370" y2="812" stroke="#1e293b" stroke-width="1.4"/>
  <text class="lgh" x="30" y="840">数据流说明</text>
  <text class="lg" x="30" y="872">① 渠道请求先到适配器：认证、记下说话人、算出会话键</text>
  <text class="lg" x="30" y="900">② 适配器把消息写进 Session Service 的收件箱，落盘后才确认</text>
  <text class="lg" x="30" y="928">③ Session Service 按会话状态调沙箱编排：领取、暂停、恢复、删除</text>
  <text class="lg" x="30" y="956">④ 经执行守护进程写入 AGENTS.md 等文件，按轮启动 harness</text>
  <text class="lg" x="30" y="984">⑤ checkpoint 与产出物转存到沙箱外，沙箱删了会话还能恢复</text>
  <text class="lg" x="710" y="872">⑥ harness 的所有出站只走网关，网关用 Pod 证书认出是哪个会话</text>
  <text class="lg" x="710" y="900">⑦ 逐请求做资源级授权，三者交集都满足才放行</text>
  <text class="lg" x="710" y="928">⑧ 放行后从 Key Vault 取凭据注入，沙箱全程看不到原值</text>
  <text class="lg" x="710" y="956">⑨ 带着凭据的请求转发到模型、Git、ADO 等真实资源</text>
  <text class="lg" x="710" y="984">⑩ 反方向一律禁止：沙箱不能调用控制面，只能产出数据</text>
</svg>
