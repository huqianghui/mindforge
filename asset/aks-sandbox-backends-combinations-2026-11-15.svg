<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .col { fill: #0d1526; stroke: #334155; stroke-width: 1.2; }
      .ch { fill: #f8fafc; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .cs { fill: #94a3b8; font-size: 13px; text-anchor: middle; }
      .rowl { fill: #64748b; font-size: 13px; font-weight: 600; }
      .cp { fill: #111827; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .self { fill: #2a2110; stroke: #fbbf24; stroke-width: 1.5; }
      .asb { fill: #10302d; stroke: #2dd4bf; stroke-width: 1.5; }
      .osb { fill: #13213a; stroke: #38bdf8; stroke-width: 1.5; }
      .kata { fill: #2a1618; stroke: #f87171; stroke-width: 1.3; }
      .gain { fill: #0f1f1a; stroke: #2dd4bf; stroke-width: 1; }
      .h { fill: #f1f5f9; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13px; }
      .ok { fill: #5eead4; font-size: 13px; }
      .no { fill: #fca5a5; font-size: 13px; }
      .flow { fill: none; stroke: #e2e8f0; stroke-width: 1.8; stroke-dasharray: 6 5; animation: dash 1.3s linear infinite; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .lgh { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .sw { stroke-width: 1.4; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="1000" rx="16"/>
  <text class="title" x="30" y="44">agent-sandbox 和 OpenSandbox 的三种用法：每一层由谁提供</text>
  <text class="sub" x="30" y="72">三种用法都在执行平面里。纵向是"控制面 → 访问层 → 编排层 → 隔离层（Kata Pod）"，颜色表示这一层由谁提供：青绿 = agent-sandbox，蓝 = OpenSandbox，琥珀 = 要自己补</text>

  <!-- row labels -->
  <text class="rowl" x="30" y="150">控制面</text>
  <text class="rowl" x="30" y="262">访问层</text>
  <text class="rowl" x="30" y="420">编排层</text>
  <text class="rowl" x="30" y="552">隔离层</text><text class="rowl" x="30" y="570">（Pod）</text>
  <text class="rowl" x="30" y="680">得到</text>
  <text class="rowl" x="30" y="800">代价</text>

  <!-- column 1 -->
  <rect class="col" x="100" y="90" width="420" height="790" rx="14"/>
  <text class="ch" x="310" y="118">① 只用 agent-sandbox</text>
  <rect class="cp" x="120" y="132" width="380" height="48" rx="8"/>
  <text class="t" x="136" y="161">你的控制面：调 Kubernetes API 提交 Claim</text>
  <rect class="self" x="120" y="200" width="380" height="110" rx="10"/>
  <text class="h" x="136" y="224">自己补：访问层</text>
  <text class="t" x="136" y="248">镜像里放守护进程（sandboxd / envd / 自写）</text>
  <text class="t" x="136" y="269">执行命令、读写文件；常驻服务型 agent 可不要</text>
  <text class="t" x="136" y="290">入口经 sandbox-router（HTTP，按请求头）</text>
  <rect class="asb" x="120" y="330" width="380" height="150" rx="10"/>
  <text class="h" x="136" y="354">agent-sandbox controller</text>
  <text class="t" x="136" y="378">SandboxTemplate：平台写的 Pod 蓝图</text>
  <text class="t" x="136" y="399">SandboxWarmPool：常备 N 个</text>
  <text class="t" x="136" y="420">SandboxClaim：控制面每个会话提交一个</text>
  <text class="t" x="136" y="441">Sandbox：单例 Pod + PVC + Service，</text>
  <text class="t" x="136" y="462">Running / Suspended，shutdownTime 回收</text>
  <rect class="kata" x="120" y="500" width="380" height="100" rx="10"/>
  <text class="h" x="136" y="524">Kata Pod</text>
  <text class="t" x="136" y="548">你的镜像 + 你的守护进程</text>
  <text class="t" x="136" y="569">模板生成的 NetworkPolicy（默认封内网段）</text>
  <rect class="gain" x="120" y="620" width="380" height="110" rx="10"/>
  <text class="ok" x="136" y="646">✓ 纯 Kubernetes 对象，GitOps、RBAC 都是原生的</text>
  <text class="ok" x="136" y="668">✓ 预热池 + Claim，领取约 3 秒</text>
  <text class="ok" x="136" y="690">✓ 默认网络策略较严</text>
  <text class="ok" x="136" y="712">✓ PVC 跨暂停保留</text>
  <rect class="gain" x="120" y="745" width="380" height="120" rx="10"/>
  <text class="no" x="136" y="771">✗ 访问层要自己补（sandboxd 尚早期）</text>
  <text class="no" x="136" y="793">✗ router 默认不鉴权</text>
  <text class="no" x="136" y="815">✗ 暂停只留 PVC，容器层文件会丢</text>
  <text class="no" x="136" y="837">✗ 没有出站域名策略和凭据注入</text>

  <!-- column 2 -->
  <rect class="col" x="540" y="90" width="420" height="790" rx="14"/>
  <text class="ch" x="750" y="118">② 只用 OpenSandbox</text>
  <rect class="cp" x="560" y="132" width="380" height="48" rx="8"/>
  <text class="t" x="576" y="161">你的控制面：调 REST / SDK</text>
  <rect class="osb" x="560" y="200" width="380" height="110" rx="10"/>
  <text class="h" x="576" y="224">lifecycle server + execd + egress 边车</text>
  <text class="t" x="576" y="248">REST 管生命周期；execd 被注入沙箱，</text>
  <text class="t" x="576" y="269">执行命令、读写文件；请求带出站策略时</text>
  <text class="t" x="576" y="290">加 egress 边车（按域名放行、凭据注入）</text>
  <rect class="osb" x="560" y="330" width="380" height="150" rx="10"/>
  <text class="h" x="576" y="354">OpenSandbox controller</text>
  <text class="t" x="576" y="378">BatchSandbox：一次可要 N 个</text>
  <text class="t" x="576" y="399">Pool：buffer 上下限的预热池</text>
  <text class="t" x="576" y="420">SandboxSnapshot：commit Job 把 rootfs</text>
  <text class="t" x="576" y="441">推到镜像仓库，恢复时用快照建 Pod</text>
  <text class="t" x="576" y="462">同一套 API 也能跑在本地 Docker 上</text>
  <rect class="kata" x="560" y="500" width="380" height="100" rx="10"/>
  <text class="h" x="576" y="524">Kata Pod</text>
  <text class="t" x="576" y="548">任意镜像，execd 由初始化容器拷进去</text>
  <text class="t" x="576" y="569">默认不建 NetworkPolicy</text>
  <rect class="gain" x="560" y="620" width="380" height="110" rx="10"/>
  <text class="ok" x="576" y="646">✓ 访问层现成（execd），镜像不用改</text>
  <text class="ok" x="576" y="668">✓ 暂停保留整个 rootfs</text>
  <text class="ok" x="576" y="690">✓ 出站域名策略、Credential Vault</text>
  <text class="ok" x="576" y="712">✓ 多语言 SDK，本地 Docker 可开发</text>
  <rect class="gain" x="560" y="745" width="380" height="120" rx="10"/>
  <text class="no" x="576" y="771">✗ 多一个 Python server 要运维</text>
  <text class="no" x="576" y="793">✗ 不带策略时出站不限制</text>
  <text class="no" x="576" y="815">✗ Pool 不套用 server 的 Kata 配置，</text>
  <text class="no" x="576" y="837">   漏写 runtimeClassName 就静默跑 runc</text>

  <!-- column 3 -->
  <rect class="col" x="980" y="90" width="400" height="790" rx="14"/>
  <text class="ch" x="1180" y="118">③ OpenSandbox 叠在 agent-sandbox 上</text>
  <rect class="cp" x="1000" y="132" width="360" height="48" rx="8"/>
  <text class="t" x="1016" y="161">你的控制面：调 REST / SDK（和 ② 一样）</text>
  <rect class="osb" x="1000" y="200" width="360" height="110" rx="10"/>
  <text class="h" x="1016" y="224">lifecycle server + execd</text>
  <text class="t" x="1016" y="248">workload_provider 设成 agent-sandbox</text>
  <text class="t" x="1016" y="269">server 不建 BatchSandbox，改建核心 Sandbox</text>
  <text class="t" x="1016" y="290">需要额外 RBAC 和带 toleration 的模板</text>
  <rect class="asb" x="1000" y="330" width="360" height="150" rx="10"/>
  <text class="h" x="1016" y="354">agent-sandbox controller（只用核心）</text>
  <text class="t" x="1016" y="378">只用核心 Sandbox</text>
  <text class="t" x="1016" y="399">不经过 Template / WarmPool / Claim</text>
  <text class="t" x="1016" y="420">TTL 映射成 shutdownTime</text>
  <text class="t" x="1016" y="441">暂停映射成 Suspended</text>
  <text class="t" x="1016" y="462">两边的 API 版本要对得上</text>
  <rect class="kata" x="1000" y="500" width="360" height="100" rx="10"/>
  <text class="h" x="1016" y="524">Kata Pod</text>
  <text class="t" x="1016" y="548">execd 照样注入</text>
  <text class="t" x="1016" y="569">没有模板，就没有默认网络策略</text>
  <rect class="gain" x="1000" y="620" width="360" height="110" rx="10"/>
  <text class="ok" x="1016" y="646">✓ 访问层用 OpenSandbox 的 execd</text>
  <text class="ok" x="1016" y="668">✓ 底层沙箱对象统一成 agent-sandbox</text>
  <text class="ok" x="1016" y="690">✓ 集群里别的工具按 Sandbox 统一盘点</text>
  <rect class="gain" x="1000" y="745" width="360" height="120" rx="10"/>
  <text class="no" x="1016" y="771">✗ 用不上 agent-sandbox 的预热池</text>
  <text class="no" x="1016" y="793">✗ 没有默认网络策略</text>
  <text class="no" x="1016" y="815">✗ 暂停不再存 rootfs，快照目前</text>
  <text class="no" x="1016" y="837">   只能从 BatchSandbox 生成</text>

  <!-- arrows down each column -->
  <path class="flow" d="M310,180 L310,198" marker-end="url(#arr)"/>
  <path class="flow" d="M310,310 L310,328" marker-end="url(#arr)"/>
  <path class="flow" d="M310,480 L310,498" marker-end="url(#arr)"/>
  <path class="flow" d="M750,180 L750,198" marker-end="url(#arr)"/>
  <path class="flow" d="M750,310 L750,328" marker-end="url(#arr)"/>
  <path class="flow" d="M750,480 L750,498" marker-end="url(#arr)"/>
  <path class="flow" d="M1180,180 L1180,198" marker-end="url(#arr)"/>
  <path class="flow" d="M1180,310 L1180,328" marker-end="url(#arr)"/>
  <path class="flow" d="M1180,480 L1180,498" marker-end="url(#arr)"/>

  <text class="lgh" x="30" y="918">怎么读</text>
  <text class="lg" x="30" y="944">两个项目在编排层是同类，可以二选一；OpenSandbox 还带一套成熟的访问层（lifecycle server + execd），它能架在任一种编排层上，这就是 ③ 成立的原因</text>
  <text class="lg" x="30" y="968">用 ① 时访问层要自己补（琥珀色）；如果 agent 本身是常驻服务、只需 router 转发 HTTP，也可以不要。最底下的 Kata 三种用法都一样，都只靠 runtimeClassName</text>
</svg>
