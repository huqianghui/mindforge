<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="60%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .hub { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2.4; animation: pulse 2.4s ease-in-out infinite; }
      .zone { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 8 6; }
      .zl { fill: #7dd3fc; font-size: 14px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hHub { fill: #fde68a; font-size: 19px; font-weight: 700; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tHub { fill: #fef3c7; font-size: 14px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lt { fill: #fde68a; font-size: 13px; }
      .legH { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .leg { fill: #cbd5e1; font-size: 13.5px; }
      .legN { fill: #5eead4; font-size: 13.5px; font-weight: 700; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="800" rx="16"/>
  <text class="title" x="30" y="44">我和 AI 画 SVG 的流程，以及三个使用场景</text>
  <text class="sub" x="30" y="72">我说要什么、看图提意见；AI 写坐标、渲染自检；画好的图用在文章、网页、PPT 三个场景</text>

  <!-- ===== 人 ===== -->
  <rect class="zone" x="30" y="92" width="300" height="470" rx="12"/>
  <text class="zl" x="46" y="116">人：意图与判断</text>
  <rect class="box" x="50" y="130" width="260" height="120" rx="10"/>
  <text class="h" x="66" y="160">① 说意图</text>
  <text class="t" x="66" y="186">一句话需求 + 一张参考样例</text>
  <text class="t" x="66" y="208">配色、字号写在规则文件里</text>
  <text class="t" x="66" y="230">从不手算坐标</text>

  <rect class="box" x="50" y="400" width="260" height="140" rx="10"/>
  <text class="h" x="66" y="430">④ 看图</text>
  <text class="t" x="66" y="456">PNG / 浏览器 / Obsidian 预览</text>
  <text class="t" x="66" y="478">重叠、出框、错位一眼可见</text>
  <text class="t" x="66" y="500">判断信息对不对、够不够</text>
  <text class="t" x="66" y="522">比读几百行 XML 快得多</text>

  <!-- ===== AI ===== -->
  <rect class="zone" x="370" y="92" width="300" height="470" rx="12"/>
  <text class="zl" x="386" y="116">AI：生成与自检</text>
  <rect class="boxBlue" x="390" y="130" width="260" height="120" rx="10"/>
  <text class="h" x="406" y="160">② 写 / 改 SVG</text>
  <text class="t" x="406" y="186">rect · path · text 的坐标</text>
  <text class="t" x="406" y="208">SMIL 粒子 + CSS 流动光带</text>
  <text class="t" x="406" y="230">按状态分层配色</text>

  <rect class="boxBlue" x="390" y="400" width="260" height="140" rx="10"/>
  <text class="h" x="406" y="430">③ 渲染自检</text>
  <text class="t" x="406" y="456">rsvg-convert 渲染成 PNG</text>
  <text class="t" x="406" y="478">AI 读图找文字重叠、出框</text>
  <text class="t" x="406" y="500">加宽画布、拆行、改引线</text>
  <text class="t" x="406" y="522">再渲染，直到干净</text>

  <!-- ===== 中心：源文件 ===== -->
  <rect class="hub" x="720" y="195" width="280" height="270" rx="14" filter="url(#glow)"/>
  <text class="hHub" x="740" y="232">SVG 文件</text>
  <text class="tHub" x="740" y="266">纯文本 XML</text>
  <text class="tHub" x="740" y="292">人看到的是图</text>
  <text class="tHub" x="740" y="318">AI 读到的是坐标与路径</text>
  <text class="tHub" x="740" y="344">单张约 5~16 KB</text>
  <text class="tHub" x="740" y="370">git diff 逐行可读</text>
  <text class="tHub" x="740" y="396">改颜色 = 一次文本替换</text>
  <text class="tHub" x="740" y="436">仓库里约 140 张，嵌在 88 篇文章</text>

  <!-- ===== 出口 ===== -->
  <rect class="zone" x="1045" y="92" width="330" height="470" rx="12"/>
  <text class="zl" x="1061" y="116">我的三个使用场景</text>
  <rect class="box" x="1065" y="128" width="290" height="125" rx="10"/>
  <text class="h" x="1081" y="158">A · 文章配图</text>
  <text class="t" x="1081" y="184">Obsidian / GitHub 原生播放</text>
  <text class="t" x="1081" y="206">只用 SMIL + CSS，不写 JS</text>
  <text class="t" x="1081" y="228">alt 加 |900 限宽</text>

  <rect class="box" x="1065" y="268" width="290" height="125" rx="10"/>
  <text class="h" x="1081" y="298">B · 网页</text>
  <text class="t" x="1081" y="324">React 组件按数据画 SVG</text>
  <text class="t" x="1081" y="346">AI 写的是生成 SVG 的代码</text>
  <text class="t" x="1081" y="368">每个圆点可 hover / click</text>

  <rect class="box" x="1065" y="408" width="290" height="125" rx="10"/>
  <text class="h" x="1081" y="438">C · PPT 与视频</text>
  <text class="t" x="1081" y="464">静态：SVG → PNG 嵌 pptx</text>
  <text class="t" x="1081" y="486">动态：逐帧截图 → MP4</text>
  <text class="t" x="1081" y="508">PPT 里自动循环播放</text>

  <!-- ===== 数据流 ===== -->
  <path class="flow" d="M310 190 H386" marker-end="url(#arr)"/>
  <path id="p2" class="flow" d="M650 190 H690 V260 H716" marker-end="url(#arr)"/>
  <path id="p3" class="flow" d="M720 400 H690 V470 H654" marker-end="url(#arr)"/>
  <path class="flow" d="M390 470 H314" marker-end="url(#arr)"/>
  <path class="flowAmber" d="M520 398 V254" marker-end="url(#arrAmber)"/>
  <path class="flowAmber" d="M180 398 V254" marker-end="url(#arrAmber)"/>
  <path id="p6" class="flow" d="M1000 330 H1025 V190 H1061" marker-end="url(#arr)"/>
  <path class="flow" d="M1025 330 H1061" marker-end="url(#arr)"/>
  <path class="flow" d="M1025 330 V470 H1061" marker-end="url(#arr)"/>

  <circle r="7" fill="url(#dot)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="7" fill="url(#dot)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="7" fill="url(#dot)"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>

  <circle class="badge" cx="349" cy="170" r="12"/><text class="bn" x="349" y="175">1</text>
  <circle class="badge" cx="704" cy="225" r="12"/><text class="bn" x="704" y="230">2</text>
  <circle class="badge" cx="704" cy="435" r="12"/><text class="bn" x="704" y="440">3</text>
  <circle class="badge" cx="352" cy="450" r="12"/><text class="bn" x="352" y="455">4</text>
  <circle class="badgeAmber" cx="180" cy="326" r="12"/><text class="bn" x="180" y="331">5</text>
  <text class="lt" x="200" y="331">截图 + 一句话</text>
  <text class="lt" x="532" y="331">不过关就回改</text>
  <circle class="badge" cx="1025" cy="262" r="12"/><text class="bn" x="1025" y="267">6</text>

  <!-- ===== 图例 ===== -->
  <line x1="30" y1="585" x2="1370" y2="585" stroke="#1e293b" stroke-width="1.2"/>
  <text class="legH" x="30" y="612">编号说明</text>
  <text class="legN" x="30" y="642">①</text>
  <text class="leg" x="52" y="642">人只给意图：一句话 + 一张参考样例；配色、字号下限、布局规范</text>
  <text class="leg" x="52" y="664">写在 Agent 的规则文件里，每次自动带上</text>
  <text class="legN" x="30" y="696">②</text>
  <text class="leg" x="52" y="696">AI 把意图翻译成坐标：卡片 rect、连线 path、粒子 animateMotion、</text>
  <text class="leg" x="52" y="718">光带 stroke-dashoffset，全部是可读文本</text>
  <text class="legN" x="30" y="750">③</text>
  <text class="leg" x="52" y="750">渲染成 PNG 让 AI 读图检查；AI 只能估算字宽，不渲染就容易文字重叠</text>

  <text class="legN" x="720" y="642">④</text>
  <text class="leg" x="742" y="642">人看图判断：好不好看、信息对不对，一眼就能看出</text>
  <text class="legN" x="720" y="676">⑤</text>
  <text class="leg" x="742" y="676">修改用截图 + 一句话（"右下角图例压住了来源"），回到 ②</text>
  <text class="legN" x="720" y="710">⑥</text>
  <text class="leg" x="742" y="710">按场景使用：文章里直接嵌入、保留动画；网页里由代码按数据画；</text>
  <text class="leg" x="742" y="732">PPT 不播 SVG 动画，静态图转 PNG，动画录成 MP4</text>
  <text class="leg" x="742" y="764" fill="#94a3b8">青绿 = 主流程　琥珀 = 回改循环与中心产物</text>
</svg>
