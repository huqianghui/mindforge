<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .zone { fill: #0d1729; stroke: #2dd4bf; stroke-width: 1.4; stroke-dasharray: 9 5; }
      .zoneB { fill: #0e1a2e; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 9 5; }
      .zoneP { fill: #15122a; stroke: #a78bfa; stroke-width: 1.4; stroke-dasharray: 9 5; }
      .zoneG { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .zl { font-size: 15px; font-weight: 600; }
      .card { fill: #10302d; stroke: #2dd4bf; stroke-width: 1.5; }
      .cardB { fill: #13213a; stroke: #38bdf8; stroke-width: 1.5; }
      .cardP { fill: #1f1838; stroke: #a78bfa; stroke-width: 1.5; }
      .cardA { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 1.8; animation: pulse 2.2s ease-in-out infinite; }
      .cardG { fill: #0f172a; stroke: #475569; stroke-width: 1.2; }
      .h { fill: #f1f5f9; font-size: 15px; font-weight: 600; }
      .hg { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13px; }
      .tg { fill: #94a3b8; font-size: 13px; }
      .m { fill: #a5f3fc; font-size: 12.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .num { fill: #fde68a; font-size: 13px; font-weight: 600; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1.2s linear infinite; }
      .flowA { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1.2s linear infinite; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.3; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .lgh { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      @keyframes dash { to { stroke-dashoffset: -26; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="960" rx="16"/>
  <text class="title" x="30" y="44">多副本会话执行：队列决定谁收消息，数据库决定谁能写结果</text>
  <text class="sub" x="30" y="72">我在 AKS 上搭的最小实现：三副本 + Service Bus 会话队列 + PostgreSQL lease 与 fencing token；右下是参考实现现在的做法</text>

  <!-- Service Bus -->
  <rect class="zoneB" x="30" y="100" width="300" height="480" rx="14"/>
  <text class="zl" x="48" y="126" fill="#7dd3fc">Service Bus（会话队列）</text>
  <rect class="cardB" x="50" y="146" width="260" height="190" rx="10"/>
  <text class="h" x="68" y="172">队列 turns</text>
  <text class="t" x="68" y="198">每条消息带 session_id</text>
  <text class="t" x="68" y="220">同一会话的消息同一时刻</text>
  <text class="t" x="68" y="242">只交给一个接收者，按序</text>
  <text class="t" x="68" y="268">会话锁 30 秒，接收者续</text>
  <text class="t" x="68" y="290">最多投递 10 次，之后进死信</text>
  <text class="num" x="68" y="318">认证走 Workload Identity</text>
  <rect class="cardB" x="50" y="356" width="260" height="206" rx="10"/>
  <text class="h" x="68" y="382">会话锁在什么时候放手</text>
  <text class="t" x="68" y="408">优雅退出：主动关闭，立刻</text>
  <text class="t" x="68" y="430">连接断开（进程被杀）：</text>
  <text class="t" x="68" y="452">实测 4 ~ 16 秒</text>
  <text class="t" x="68" y="478">进程卡住但连接还在：</text>
  <text class="t" x="68" y="500">等锁超时，实测 35 秒</text>
  <text class="num" x="68" y="530">锁丢了它知道，但挡不住</text>
  <text class="num" x="68" y="550">旧主已经发出去的写入</text>

  <!-- Replicas -->
  <rect class="zone" x="370" y="100" width="560" height="480" rx="14"/>
  <text class="zl" x="388" y="126" fill="#5eead4">会话执行器 × 3（普通节点池，Deployment）</text>
  <rect class="card" x="390" y="146" width="250" height="160" rx="10"/>
  <text class="h" x="408" y="172">副本 A（持有会话 S）</text>
  <text class="t" x="408" y="198">领到 S 的会话锁</text>
  <text class="t" x="408" y="220">抢 S 的 lease，拿到 token</text>
  <text class="t" x="408" y="242">执行这一轮（驱动 harness）</text>
  <text class="t" x="408" y="264">每秒续 lease + 续会话锁</text>
  <text class="num" x="408" y="290">SIGTERM：做完这一轮再交出</text>
  <rect class="cardG" x="660" y="146" width="250" height="160" rx="10"/>
  <text class="hg" x="678" y="172">副本 B / C</text>
  <text class="tg" x="678" y="198">在等下一个可用的会话</text>
  <text class="tg" x="678" y="220">拿到 S 的会话锁，但 lease</text>
  <text class="tg" x="678" y="242">还被占着时：守住会话锁，</text>
  <text class="tg" x="678" y="264">等旧 lease 过期再接手</text>
  <text class="num" x="678" y="290">不能 abandon（见下）</text>
  <rect class="cardA" x="390" y="326" width="520" height="236" rx="10"/>
  <text class="h" x="408" y="352">写结果：唯一带条件的一步</text>
  <text class="m" x="408" y="380">update sessions set applied_seq = :seq</text>
  <text class="m" x="408" y="400"> where id = :s and token = :my_token</text>
  <text class="m" x="408" y="420">   and applied_seq = :seq - 1</text>
  <text class="t" x="408" y="448">影响 0 行就是被拒：要么自己已经是旧主（token 被抢），</text>
  <text class="t" x="408" y="470">要么前一轮还没落地（序号接不上）</text>
  <text class="t" x="408" y="496">token 被抢 → 放手，不确认消息，交给新主</text>
  <text class="t" x="408" y="518">序号接不上 → 送进死信并写明原因，不能悄悄确认掉</text>
  <text class="num" x="408" y="546">这一步挡住的是"写"，挡不住"同时在执行"</text>

  <!-- PostgreSQL -->
  <rect class="zoneP" x="970" y="100" width="400" height="480" rx="14"/>
  <text class="zl" x="988" y="126" fill="#c4b5fd">PostgreSQL（状态与 lease）</text>
  <rect class="cardP" x="990" y="146" width="360" height="200" rx="10"/>
  <text class="h" x="1008" y="172">sessions 表</text>
  <text class="m" x="1008" y="198">id · owner · token · lease_until</text>
  <text class="m" x="1008" y="218">applied_seq</text>
  <text class="t" x="1008" y="246">抢 lease：没人持有 / 已过期 / 本来就是自己</text>
  <text class="t" x="1008" y="268">才成功，每次成功 token 加一</text>
  <text class="t" x="1008" y="294">lease 10 秒，每秒续一次</text>
  <text class="num" x="1008" y="322">跨区域（策略限制）：一次更新约 28 ms</text>
  <rect class="cardP" x="990" y="366" width="360" height="196" rx="10"/>
  <text class="h" x="1008" y="392">outputs 表 = 副作用落地点</text>
  <text class="t" x="1008" y="418">真实系统里对应：推代码、建 PR、</text>
  <text class="t" x="1008" y="440">回消息、写工单</text>
  <text class="t" x="1008" y="466">这些副作用多数不经过数据库，</text>
  <text class="t" x="1008" y="488">token 要一路带到执行它的地方：</text>
  <text class="t" x="1008" y="510">出站网关、provider 的执行点</text>
  <text class="num" x="1008" y="538">（第 04 篇的授权决策点就是个好位置）</text>

  <!-- 流 -->
  <path class="flow" d="M310,190 L388,190" marker-end="url(#arr)"/>
  <circle class="badge" cx="349" cy="172" r="11"/><text class="bn" x="349" y="177">1</text>
  <path class="flow" d="M560,306 L560,312 L945,312 L945,200 L986,200" marker-end="url(#arr)"/>
  <circle class="badge" cx="945" cy="250" r="11"/><text class="bn" x="945" y="255">2</text>
  <path class="flow" d="M610,306 L610,320 L960,320 L960,290 L986,290" marker-end="url(#arr)"/>
  <circle class="badge" cx="860" cy="320" r="11"/><text class="bn" x="860" y="325">3</text>
  <path class="flowA" d="M910,410 L988,410" marker-end="url(#arrA)"/>
  <circle class="badge" cx="949" cy="392" r="11"/><text class="bn" x="949" y="397">4</text>
  <path class="flow" d="M390,500 C340,500 340,300 312,300" marker-end="url(#arr)"/>
  <circle class="badge" cx="350" cy="400" r="11"/><text class="bn" x="350" y="405">5</text>

  <!-- 参考实现 -->
  <rect class="zoneG" x="30" y="610" width="560" height="170" rx="14"/>
  <text class="zl" x="48" y="636" fill="#94a3b8">参考实现现在的做法</text>
  <text class="t" x="48" y="664">控制面单副本 + SQLite，Deployment 用 Recreate</text>
  <text class="t" x="48" y="688">代码注释写明：没有分布式 lease，同一个库不能跑两个调度器</text>
  <text class="t" x="48" y="712">启动时先"围栏"：把所有做到一半的事标成中断再重新核对</text>
  <text class="t" x="48" y="736">——这一步默认自己是唯一的主，多跑一个副本就会互相打断</text>
  <text class="num" x="48" y="764">第 05 篇实测：删 Pod 后 5 秒恢复，每次发版都会停这么一下</text>

  <rect class="zoneG" x="620" y="610" width="750" height="170" rx="14"/>
  <text class="zl" x="638" y="636" fill="#94a3b8">我第一版踩的坑</text>
  <text class="t" x="638" y="664">新副本拿到会话锁、发现 lease 被占时，我让它 abandon 这条消息、放开会话。</text>
  <text class="t" x="638" y="688">三个副本轮流抢，每次 abandon 投递次数加一，10 秒的 lease 还没过期，</text>
  <text class="t" x="638" y="712">第 1、2 轮就耗光 10 次投递进了死信。第 3 轮被序号检查拒绝——没写错，</text>
  <text class="t" x="638" y="736">但会话就此卡死。改成"守住会话锁、等旧 lease 过期"之后，同样的硬杀</text>
  <text class="num" x="638" y="764">15 秒接管，三轮全部落地</text>

  <!-- 说明 -->
  <text class="lgh" x="40" y="830">编号说明</text>
  <text class="lg" x="40" y="858">① 副本向队列要"下一个可用的会话"，拿到会话锁后才收得到这个会话的消息</text>
  <text class="lg" x="40" y="884">② 抢 lease，成功时 token 加一；这个 token 是之后所有写入的凭证</text>
  <text class="lg" x="40" y="910">③ 执行期间每秒同时续 lease 和会话锁；进程卡住时两样都会断</text>
  <text class="lg" x="720" y="858">④ 结果按 token 和序号带条件写入，旧主的写入在这里被拒</text>
  <text class="lg" x="720" y="884">⑤ 写成功后才确认消息；顺序反过来，崩在中间就会丢一轮</text>
  <text class="lg" x="720" y="910">队列和数据库各管一半，少了哪一半都不行（见下图对照实验）</text>
</svg>
