<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .zone { fill: none; stroke: #334155; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .zt { fill: #94a3b8; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hT { fill: #5eead4; font-size: 16px; font-weight: 600; }
      .hA { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .hB { fill: #ddd6fe; font-size: 16px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tG { fill: #94a3b8; font-size: 13.5px; }
      .tick { fill: #94a3b8; font-size: 13px; text-anchor: middle; }
      .grid { stroke: #1e293b; stroke-width: 1; }
      .hop { stroke-width: 1.4; rx: 6; }
      .hopT { fill: #0f2a2a; stroke: #2dd4bf; }
      .hopA { fill: #2a1f0b; stroke: #fbbf24; }
      .hopB { fill: #1e1b3a; stroke: #a78bfa; }
      .ht { fill: #e2e8f0; font-size: 13px; text-anchor: middle; }
      .barT { fill: #2dd4bf; }
      .barA { fill: #fbbf24; }
      .barB { fill: #a78bfa; }
      .card { fill: #13213a; stroke-width: 1.6; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .grow { animation: grow 2.4s ease-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
      @keyframes grow { from { transform: scaleX(0.15); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900" rx="16"/>
  <text class="title" x="30" y="44">同一个问题，三种后端：多一层编排，多十秒</text>
  <text class="sub" x="30" y="72">三者共用同一份检索结果、同一套 [n] + RELATED 协议；差别全在应用之后经过了几层</text>

  <!-- hops -->
  <rect class="zone" x="24" y="92" width="1352" height="300" rx="12"/>
  <text class="zt" x="44" y="118">请求经过的层（从左到右）</text>

  <text class="hT" x="44" y="168">Azure OpenAI</text>
  <rect class="hop hopT" x="250" y="146" width="150" height="36"/><text class="ht" x="325" y="169">应用检索</text>
  <rect class="hop hopT" x="420" y="146" width="200" height="36"/><text class="ht" x="520" y="169">Azure OpenAI connector</text>
  <rect class="hop hopT" x="640" y="146" width="160" height="36"/><text class="ht" x="720" y="169">模型部署</text>
  <text class="tG" x="830" y="169">直达，一跳生成</text>

  <text class="hA" x="44" y="248">Work IQ</text>
  <text class="tG" x="44" y="270">M365 Copilot 本体</text>
  <rect class="hop hopA" x="250" y="226" width="150" height="36"/><text class="ht" x="325" y="249">应用检索</text>
  <rect class="hop hopA" x="420" y="226" width="200" height="36"/><text class="ht" x="520" y="249">Work IQ connector</text>
  <rect class="hop hopA" x="640" y="226" width="180" height="36"/><text class="ht" x="730" y="249">Copilot 编排</text>
  <rect class="hop hopA" x="840" y="226" width="200" height="36"/><text class="ht" x="940" y="249">企业搜索 grounding</text>
  <rect class="hop hopA" x="1060" y="226" width="140" height="36"/><text class="ht" x="1130" y="249">自动模型</text>
  <text class="tG" x="250" y="286">另：自动抓取提示词里的网址作 grounding（fileUris）</text>

  <text class="hB" x="44" y="332">Copilot Studio</text>
  <text class="tG" x="44" y="354">agent（+ agentId）</text>
  <rect class="hop hopB" x="250" y="310" width="150" height="36"/><text class="ht" x="325" y="333">应用检索</text>
  <rect class="hop hopB" x="420" y="310" width="200" height="36"/><text class="ht" x="520" y="333">Work IQ connector</text>
  <rect class="hop hopB" x="640" y="310" width="180" height="36"/><text class="ht" x="730" y="333">Copilot 编排</text>
  <rect class="hop hopB" x="840" y="310" width="200" height="36"/><text class="ht" x="940" y="333">agent 编排 + 指令</text>
  <rect class="hop hopB" x="1060" y="310" width="140" height="36"/><text class="ht" x="1130" y="333">选定模型</text>
  <rect class="hop hopB" x="1220" y="310" width="140" height="36" stroke-dasharray="4 3"/><text class="ht" x="1290" y="333">Web 搜索?</text>
  <text class="tG" x="250" y="372">资料外的问题才触发网页搜索，回答里声明来源</text>

  <!-- latency -->
  <rect class="zone" x="24" y="408" width="1352" height="230" rx="12"/>
  <text class="zt" x="44" y="434">实测耗时（同一问题，授权之后，秒）</text>
  <line class="grid" x1="250" y1="452" x2="250" y2="590"/>
  <line class="grid" x1="530" y1="452" x2="530" y2="590"/>
  <line class="grid" x1="810" y1="452" x2="810" y2="590"/>
  <line class="grid" x1="1090" y1="452" x2="1090" y2="590"/>
  <line class="grid" x1="1370" y1="452" x2="1370" y2="590" opacity="0"/>
  <text class="tick" x="250" y="612">0</text>
  <text class="tick" x="530" y="612">10</text>
  <text class="tick" x="810" y="612">20</text>
  <text class="tick" x="1090" y="612">30</text>
  <text class="tick" x="1346" y="612">40</text>

  <text class="hT" x="44" y="480">Azure OpenAI</text>
  <rect class="barT grow" x="250" y="464" width="129" height="24" rx="4"/>
  <text class="t" x="392" y="481">4.6 秒（线上另测 8.4 秒，输入 token 更多）</text>

  <text class="hA" x="44" y="526">Work IQ</text>
  <rect x="250" y="510" width="420" height="24" rx="4" fill="#fbbf24" opacity="0.18"/>
  <rect class="barA grow" x="670" y="510" width="308" height="24" rx="4"/>
  <text class="t" x="990" y="527">15–26 秒</text>

  <text class="hB" x="44" y="572">agent</text>
  <rect x="250" y="556" width="700" height="24" rx="4" fill="#a78bfa" opacity="0.18"/>
  <rect class="barB grow" x="950" y="556" width="308" height="24" rx="4"/>
  <text class="t" x="1268" y="573">25–36 秒</text>

  <!-- trade-off cards -->
  <rect class="zone" x="24" y="654" width="1352" height="226" rx="12"/>
  <text class="zt" x="44" y="680">选哪种</text>

  <rect class="card" x="44" y="694" width="430" height="168" rx="9" stroke="#2dd4bf"/>
  <text class="hT" x="62" y="722">Azure OpenAI：要快、要可控</text>
  <text class="t" x="62" y="750">模型、提示词、检索全在自己手里</text>
  <text class="t" x="62" y="772">返回 usage，成本按 token 可算</text>
  <text class="t" x="62" y="794">不要求用户有 M365 Copilot</text>
  <text class="tG" x="62" y="822">代价：自己的 Azure 资源、key 管理、</text>
  <text class="tG" x="62" y="844">共享身份；没有企业 grounding、不上网</text>

  <rect class="card" x="486" y="694" width="430" height="168" rx="9" stroke="#fbbf24"/>
  <text class="hA" x="504" y="722">Work IQ：用户自己的 M365 身份</text>
  <text class="t" x="504" y="750">无需 Azure 资源，SSO，每人各自连接</text>
  <text class="t" x="504" y="772">能用上企业搜索 grounding</text>
  <text class="t" x="504" y="794">零维护：没有 agent、没有部署</text>
  <text class="tG" x="504" y="822">代价：模型不可选、慢、返回要剥</text>
  <text class="tG" x="504" y="844">六层包装；Preview connector</text>

  <rect class="card" x="928" y="694" width="430" height="168" rx="9" stroke="#a78bfa"/>
  <text class="hB" x="946" y="722">agent：要选模型、要网页兜底</text>
  <text class="t" x="946" y="750">在 agent 里固定或比较模型</text>
  <text class="t" x="946" y="772">资料外的问题查公开网络并声明</text>
  <text class="t" x="946" y="794">同一个 agent 也给 Teams 用户直接用</text>
  <text class="tG" x="946" y="822">代价：最慢；改指令、换模型都要</text>
  <text class="tG" x="946" y="844">重新发布；用户要能看到这个 agent</text>
</svg>
