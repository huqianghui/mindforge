<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloBlur5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="pTeal5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pAmber5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes flowDashE { to { stroke-dashoffset: -76; } }
    @keyframes pulseE { 0%,100% { opacity: 0.12; } 50% { opacity: 0.55; } }
    @keyframes shimmerE { 0%,100% { opacity: 0.78; } 50% { opacity: 1; } }
    .flowE  { stroke-dasharray: 18 20; animation: flowDashE 1.6s linear infinite; }
    .flowE2 { stroke-dasharray: 4 34;  animation: flowDashE 1.6s linear infinite; }
    .haloE  { animation: pulseE 2s ease-in-out infinite; }
    .nodeE  { animation: shimmerE 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="540" rx="18" fill="url(#bg5)"/>
  <rect x="1" y="1" width="1158" height="538" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">VITRA 数据管线：把人类视频变成机器人的"互联网语料"</text>
  <text x="1124" y="46" font-size="13" fill="#475569" text-anchor="end">全自动 · 无人工标注 · 100 万 episode / 2600 万帧</text>

  <!-- connector track: top row L->R, curve down, bottom row R->L -->
  <path d="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 139"
        fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

  <!-- teal flow: data pipeline (through 数据集) -->
  <path class="flowE" d="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 725"
        fill="none" stroke="#14b8a6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path class="flowE2" d="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 725"
        fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- amber flow: training stage (数据集 -> 预训练 -> 微调/真机) -->
  <path class="flowE" d="M 725 388 H 139"
        fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path class="flowE2" d="M 725 388 H 139"
        fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- particles along full path -->
  <circle r="7" fill="url(#pTeal5)" filter="url(#softGlow5)">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 139"/>
  </circle>
  <circle r="5" fill="url(#pTeal5)" filter="url(#softGlow5)">
    <animateMotion dur="9s" begin="3s" repeatCount="indefinite"
      path="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 139"/>
  </circle>
  <circle r="6" fill="url(#pAmber5)" filter="url(#softGlow5)">
    <animateMotion dur="9s" begin="6s" repeatCount="indefinite"
      path="M 133 168 H 1021 Q 1128 168 1128 278 Q 1128 388 1021 388 H 139"/>
  </circle>

  <!-- ============ top row: pipeline stages (teal) ============ -->
  <g class="nodeE">
    <rect x="43" y="136" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="133" y="162" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">① 人类第一视角视频</text>
    <text x="133" y="184" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">无标注 · 无分段 · 无动作标签</text>
  </g>
  <g class="nodeE">
    <rect x="266" y="136" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="356" y="162" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">② 活动分析与切分</text>
    <text x="356" y="184" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">原子级手部动作片段</text>
  </g>
  <g class="nodeE">
    <rect x="489" y="136" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="579" y="162" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">③ 语言描述生成</text>
    <text x="579" y="184" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">"右手拿起木块"</text>
  </g>
  <g class="nodeE">
    <rect x="712" y="136" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="802" y="162" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">④ 3D 重建</text>
    <text x="802" y="184" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">逐帧手部姿态 + 相机运动</text>
  </g>
  <g class="nodeE">
    <rect x="935" y="136" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="1025" y="162" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">⑤ VLA 三要素对齐</text>
    <text x="1025" y="184" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">指令 + 帧 + 3D 动作序列</text>
  </g>

  <!-- ============ bottom row: dataset -> pretrain -> finetune (right to left) ============ -->
  <g class="nodeE">
    <rect x="935" y="356" width="180" height="64" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="1025" y="382" font-size="15" font-weight="600" fill="#ccfbf1" text-anchor="middle">⑥ 手部 VLA 数据集</text>
    <text x="1025" y="404" font-size="11" fill="#5eead4" opacity="0.85" text-anchor="middle">100 万 episode · 2600 万帧</text>
  </g>

  <!-- pretrain: amber pulse -->
  <rect class="haloE" x="606" y="350" width="192" height="76" rx="18" fill="none"
        stroke="#fbbf24" stroke-width="10" filter="url(#haloBlur5)"/>
  <g>
    <rect x="612" y="356" width="180" height="64" rx="14" fill="#33270a" stroke="#fbbf24" stroke-width="2"/>
    <text x="702" y="382" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">⑦ 灵巧手 VLA 预训练</text>
    <text x="702" y="404" font-size="11" fill="#fcd34d" text-anchor="middle">零样本预测人手动作</text>
  </g>

  <g class="nodeE">
    <rect x="326" y="356" width="180" height="64" rx="14" fill="#241d0a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="416" y="382" font-size="15" font-weight="600" fill="#fde68a" text-anchor="middle">⑧ 少量真机微调</text>
    <text x="416" y="404" font-size="11" fill="#d9a915" text-anchor="middle">机器人动作空间对齐人手子集</text>
  </g>
  <g class="nodeE">
    <rect x="43" y="356" width="180" height="64" rx="14" fill="#241d0a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="133" y="382" font-size="15" font-weight="600" fill="#fde68a" text-anchor="middle">⑨ 真机灵巧操作</text>
    <text x="133" y="404" font-size="11" fill="#d9a915" text-anchor="middle">未见物体/背景成功率超基线</text>
  </g>

  <!-- side caption -->
  <text x="1146" y="280" font-size="11.5" fill="#5eead4" opacity="0.75" text-anchor="middle" transform="rotate(90 1146 280)">全自动，无人工标注</text>

  <!-- key insight -->
  <text x="580" y="470" font-size="13" fill="#94a3b8" text-anchor="middle">类比：人类视频 = 机器人的网络文本 · 这条管线 = 机器人的"分词器"（把原始素材变成模型能吃的格式）</text>

  <!-- legend -->
  <g font-size="12.5">
    <circle cx="46" cy="506" r="6" fill="#2dd4bf"/>
    <text x="60" y="511" fill="#94a3b8">数据工程段（视频 → 标准 VLA 格式）</text>
    <circle cx="380" cy="506" r="6" fill="#fbbf24"/>
    <text x="394" y="511" fill="#94a3b8">训练段（预训练 → 微调 → 真机）· scaling：视频越多越多样，成功率越高</text>
    <text x="1124" y="511" fill="#475569" text-anchor="end">来源：VITRA（MSRA × 清华，ICRA 2026）</text>
  </g>
</svg>
