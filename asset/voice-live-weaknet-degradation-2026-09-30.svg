<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2dd4bf"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#fbbf24"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#f87171"/></marker>
    <marker id="aV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    @keyframes flowDash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%,100% { opacity: 0.18; } 50% { opacity: 0.7; } }
    @keyframes shimmer { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes breathe { 0%,100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 1; } }
    .flow  { stroke-dasharray: 10 12; animation: flowDash 1.4s linear infinite; }
    .flowA { stroke-dasharray: 8 12;  animation: flowDash 1.7s linear infinite; }
    .flowR { stroke-dasharray: 8 10;  animation: flowDash 1.1s linear infinite; }
    .flowV { stroke-dasharray: 8 12;  animation: flowDash 1.9s linear infinite; }
    .halo  { animation: pulse 2s ease-in-out infinite; }
    .live  { animation: shimmer 3.5s ease-in-out infinite; }
    .warn  { animation: breathe 2.2s ease-in-out infinite; }
  </style>

  <rect width="1160" height="660" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="658" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="21" font-weight="700" fill="#e2e8f0">弱网下数字人的失效机制与自适应阶梯 — 1080p 卡死不是丢包本身，是重传赶不上播放时刻</text>
  <text x="36" y="66" font-size="12" fill="#64748b">红 = 失效链（office-bad：UDP 800/400 kbps · 3% 丢包 · 120 ms 单向）· 青绿 = 健康 / 照片数字人 · 琥珀 = 降级态 · 紫 = 兜底 · 2026.09 实测</text>

  <!-- ===== A. mechanism ===== -->
  <text x="36" y="98" font-size="12.5" font-weight="700" fill="#94a3b8">A. 失效链：为什么 1080p 视频数字人在 1% 丢包下一帧都解不出来，还把同一条连接上的音频拖坏</text>

  <rect x="40" y="112" width="150" height="56" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.3"/>
  <text x="115" y="134" font-size="11.5" fill="#fca5a5" text-anchor="middle">丢包 1%~3%</text>
  <text x="115" y="151" font-size="9.5" fill="#94a3b8" text-anchor="middle">RTT 300~870 ms</text>
  <path d="M190 140 L 218 140" fill="none" stroke="#f87171" stroke-width="2" class="flowR" marker-end="url(#aR)"/>

  <rect x="222" y="112" width="160" height="56" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.3"/>
  <text x="302" y="134" font-size="11.5" fill="#fca5a5" text-anchor="middle">接收端发 NACK 重传</text>
  <text x="302" y="151" font-size="9.5" fill="#94a3b8" text-anchor="middle">pliCount = 0，不请求关键帧</text>
  <path d="M382 140 L 410 140" fill="none" stroke="#f87171" stroke-width="2" class="flowR" marker-end="url(#aR)"/>

  <rect x="414" y="112" width="210" height="56" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.6" class="warn"/>
  <text x="519" y="131" font-size="11.5" fill="#fca5a5" text-anchor="middle">重传要等 ≥ 1 个 RTT（609 ms）</text>
  <text x="519" y="147" font-size="10" fill="#fcd34d" text-anchor="middle">> 抖动缓冲预算 369 ms</text>
  <text x="519" y="161" font-size="9.5" fill="#94a3b8" text-anchor="middle">补回的包已过播放时刻 → 整帧丢弃</text>
  <path d="M624 140 L 652 140" fill="none" stroke="#f87171" stroke-width="2" class="flowR" marker-end="url(#aR)"/>

  <rect x="656" y="112" width="200" height="56" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.3"/>
  <text x="756" y="134" font-size="11.5" fill="#fca5a5" text-anchor="middle">H.264 P 帧依赖前帧</text>
  <text x="756" y="151" font-size="9.5" fill="#94a3b8" text-anchor="middle">gop_size=10 → 整个 GOP 不可解</text>
  <path d="M856 140 L 884 140" fill="none" stroke="#f87171" stroke-width="2" class="flowR" marker-end="url(#aR)"/>

  <rect x="888" y="104" width="232" height="72" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.6" filter="url(#softGlow)" class="live"/>
  <text x="1004" y="126" font-size="11.5" font-weight="700" fill="#fca5a5" text-anchor="middle">1080p：0 fps，仍吃 ~1 Mbps</text>
  <text x="1004" y="143" font-size="9.5" fill="#94a3b8" text-anchor="middle">画面停在首帧；freezeCount=0 是假象</text>
  <text x="1004" y="159" font-size="9.5" fill="#fcd34d" text-anchor="middle">判健康看 framesPerSecond 是否 null</text>

  <!-- audio starvation -->
  <path d="M1004 176 L 1004 204" fill="none" stroke="#f87171" stroke-width="2" class="flowR" marker-end="url(#aR)"/>
  <rect x="656" y="208" width="464" height="50" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.3"/>
  <text x="888" y="228" font-size="11.5" fill="#fca5a5" text-anchor="middle">画面与声音共用一条 RTP 传输 → 胖视频流饿死音频</text>
  <text x="888" y="246" font-size="10" fill="#94a3b8" text-anchor="middle">面试官声音 31% 由丢包隐藏算法合成（对照：关画面后 2.5%）· 排队使 RTT 多 340 ms</text>

  <!-- photo avatar branch -->
  <rect x="40" y="188" width="584" height="70" rx="10" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="1.3"/>
  <text x="332" y="210" font-size="11.5" font-weight="700" fill="#5eead4" text-anchor="middle">同一档位下 512² 照片数字人照常播（18~37 fps）</text>
  <text x="332" y="228" font-size="10" fill="#99f6e4" text-anchor="middle">一帧只占 1~2 个 RTP 包，多数帧一次到齐，不依赖重传；码率下限 500~850 kbps 不再降</text>
  <text x="332" y="246" font-size="9.5" fill="#64748b" text-anchor="middle">Azure 发送端按 REMB 自适应确实生效：lisa 2382 → 1415 → 1053 → 718 kbps 贴着 bwe 走，但救不了 1080p 的可解码性</text>

  <!-- ===== B. adaptive ladder ===== -->
  <text x="36" y="298" font-size="12.5" font-weight="700" fill="#94a3b8">B. 自适应阶梯：全部自动、不给用户选档；触发用音频健康度，不用冻结次数</text>

  <rect x="40" y="316" width="300" height="96" rx="12" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="1.6" filter="url(#softGlow)" class="live"/>
  <text x="190" y="340" font-size="12" font-weight="700" fill="#5eead4" text-anchor="middle">S0 健康：数字人画面 + 声音</text>
  <text x="190" y="358" font-size="10" fill="#99f6e4" text-anchor="middle">video 与 audio 两条 RTP 轨，同一 avatar 连接</text>
  <text x="190" y="374" font-size="10" fill="#99f6e4" text-anchor="middle">音频补偿 &lt; 5% · framesPerSecond 有值</text>
  <text x="190" y="396" font-size="9.5" fill="#64748b" text-anchor="middle">P2：说明页预热期采 5~10 s RTT 与补偿率，决定起始形态</text>

  <path d="M340 364 L 428 364" fill="none" stroke="#fbbf24" stroke-width="2.2" class="flowA" marker-end="url(#aA)"/>
  <text x="384" y="352" font-size="9.5" fill="#fcd34d" text-anchor="middle">P0 触发：concealedSamples</text>
  <text x="384" y="380" font-size="9.5" fill="#fcd34d" text-anchor="middle">连续两个 2 s 窗 &gt; 10%</text>

  <rect x="432" y="316" width="300" height="96" rx="12" fill="#1c1a12" stroke="#fbbf24" stroke-width="1.6" filter="url(#softGlow)" class="live"/>
  <text x="582" y="340" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">S1 关画面保声音</text>
  <text x="582" y="358" font-size="10" fill="#fde68a" text-anchor="middle">重建 avatar 连接，offer 保留 m=video 但 a=inactive</text>
  <text x="582" y="374" font-size="10" fill="#fde68a" text-anchor="middle">音频 ~100 kbps · 补偿 31% → 2.5% · RTT 876 → 534 ms</text>
  <text x="582" y="396" font-size="9.5" fill="#64748b" text-anchor="middle">界面切音波球并提示；同会话内完成，不动语音 WS</text>

  <path d="M732 364 L 820 364" fill="none" stroke="#a78bfa" stroke-width="2.2" class="flowV" marker-end="url(#aV)"/>
  <text x="776" y="352" font-size="9.5" fill="#c4b5fd" text-anchor="middle">P4 触发：UDP 3478</text>
  <text x="776" y="380" font-size="9.5" fill="#c4b5fd" text-anchor="middle">不可达 / 自愈 3 次失败</text>

  <rect x="824" y="316" width="296" height="96" rx="12" fill="#1a1426" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="972" y="340" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle">S2 无 avatar 会话</text>
  <text x="972" y="358" font-size="10" fill="#ddd6fe" text-anchor="middle">重建不带 avatar 的会话，音频以 PCM 走 WebSocket</text>
  <text x="972" y="374" font-size="10" fill="#ddd6fe" text-anchor="middle">Azure 只下发 UDP TURN，封 UDP 则无画面也无声音</text>
  <text x="972" y="396" font-size="9.5" fill="#64748b" text-anchor="middle">代价一次重连；交付手册同时写明放行 UDP 3478</text>

  <!-- independent items -->
  <rect x="40" y="436" width="530" height="96" rx="10" fill="#111827" stroke="#334155" stroke-width="1.1"/>
  <text x="56" y="458" font-size="11.5" font-weight="700" fill="#cbd5e1">与形态无关的两项</text>
  <text x="56" y="480" font-size="10.5" fill="#cbd5e1">P1 上行降 16 kHz：麦克风 PCM16 24 kHz + base64 约 600 kbps，300 kbps 上行时把自己的 SDP 挤死（自伤）</text>
  <text x="56" y="500" font-size="10.5" fill="#cbd5e1">P3 媒体死亡提示：码率归零到 ICE 报 disconnected 有 4 s 空窗，复用 P0 采样即时提示</text>
  <text x="56" y="520" font-size="9.5" fill="#64748b">码率只能建会话时定：session.update 改 avatar.video.bitrate 被静默忽略（回显仍 2000000）</text>

  <rect x="590" y="436" width="530" height="96" rx="10" fill="#1f1315" stroke="#f87171" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="606" y="458" font-size="11.5" font-weight="700" fill="#fca5a5">明确不做</text>
  <text x="606" y="480" font-size="10.5" fill="#cbd5e1">给用户选"网络档位" · 自己实现码率自适应（Azure 已做，会互相打架）</text>
  <text x="606" y="500" font-size="10.5" fill="#cbd5e1">SDP b=AS 压码率（被忽略，仍 1.9 Mbps） · 用冻结次数当健康指标（1080p 上失效）</text>
  <text x="606" y="520" font-size="10.5" fill="#cbd5e1">上行改走 WebRTC（官方 WebRTC 模式不支持 avatar，等放开再看）</text>

  <text x="36" y="566" font-size="10" fill="#64748b">唯一的码率杠杆是服务端 session.avatar.video.bitrate（500k 使 1080p 从 1.5 Mbps 降到 460 kbps）；待验：压到 500 kbps 后一帧约 2~3 包，1% 丢包下能否恢复可解码。</text>
  <text x="36" y="586" font-size="10" fill="#64748b">照片数字人默认码率只比视频数字人低约 2.4 倍（645 vs 1548 kbps），不是一个数量级；真正拉开差距靠 bitrate 上限而不是换角色。</text>
  <text x="36" y="606" font-size="10" fill="#64748b">说话与静音的码率倒挂：1080p 视频数字人读题期 1.1~1.4 Mbps，switch_to_idle 后 2.5~3.5 Mbps——面试大部分时间处在最贵的"听"阶段。</text>
  <text x="36" y="626" font-size="10" fill="#64748b">限速必须在 OS 层做（macOS dnctl/pfctl 只限 UDP）：DevTools 限速不影响 WebRTC；限全部流量会把后端到 Azure 的 TLS 握手也弄死，与生产拓扑不符。</text>
</svg>
