<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title{fill:#e2e8f0;font-weight:700;}
      .sub{fill:#94a3b8;}
      .name{font-weight:700;}
      .desc{fill:#cbd5e1;}
      .who{fill:#64748b;font-style:italic;}
    </style>
    <path id="rail" d="M140 205 H620"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="410" rx="18" fill="#0f172a"/>

  <text x="380" y="42" text-anchor="middle" font-size="21" class="title">ToolMode 光谱：从「工具即接口」到「代码即接口」</text>
  <text x="380" y="67" text-anchor="middle" font-size="13" class="sub">Direct → CodeMode → CodeModeOnly（模型越强越往右）</text>

  <!-- rail -->
  <use href="#rail" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <use href="#rail" stroke="url(#track)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <use href="#rail" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 34" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.6s" repeatCount="indefinite"/>
  </use>

  <!-- flowing particles -->
  <circle r="5" fill="#ffffff">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#e2e8f0">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#e2e8f0">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>

  <!-- Node 1: Direct -->
  <g>
    <text x="140" y="158" text-anchor="middle" font-size="12" class="who">Claude Code · Codex mini</text>
    <circle cx="140" cy="205" r="26" fill="#38bdf8">
      <animate attributeName="r" values="26;29;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.82;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#082f49">1</text>
    <text x="140" y="270" text-anchor="middle" font-size="16" class="name" fill="#38bdf8">Direct</text>
    <text x="140" y="294" text-anchor="middle" font-size="12" class="desc">每个工具 = 一个 JSON</text>
    <text x="140" y="312" text-anchor="middle" font-size="12" class="desc">function call，点名直调</text>
  </g>

  <!-- Node 2: CodeMode -->
  <g>
    <text x="380" y="158" text-anchor="middle" font-size="12" class="who">混合 / 过渡态</text>
    <circle cx="380" cy="205" r="26" fill="#fbbf24">
      <animate attributeName="r" values="26;29;26" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.82;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#451a03">2</text>
    <text x="380" y="270" text-anchor="middle" font-size="16" class="name" fill="#fbbf24">CodeMode</text>
    <text x="380" y="294" text-anchor="middle" font-size="12" class="desc">可直调，也可在 JS 里</text>
    <text x="380" y="312" text-anchor="middle" font-size="12" class="desc">批量编排工具 API</text>
  </g>

  <!-- Node 3: CodeModeOnly -->
  <g>
    <text x="620" y="158" text-anchor="middle" font-size="12" class="who">Codex gpt-6-astra</text>
    <circle cx="620" cy="205" r="26" fill="#a78bfa">
      <animate attributeName="r" values="26;29;26" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.82;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="620" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#2e1065">3</text>
    <text x="620" y="270" text-anchor="middle" font-size="16" class="name" fill="#a78bfa">CodeModeOnly</text>
    <text x="620" y="294" text-anchor="middle" font-size="12" class="desc">工具只能写 JS 调用</text>
    <text x="620" y="312" text-anchor="middle" font-size="12" class="desc">全走 node_repl</text>
  </g>

  <!-- bottom caption -->
  <text x="140" y="368" text-anchor="middle" font-size="12.5" fill="#64748b">← 能力做成「更多的工具」</text>
  <text x="620" y="368" text-anchor="middle" font-size="12.5" fill="#64748b">能力做成「一种语言」→</text>
  <text x="380" y="368" text-anchor="middle" font-size="12.5" fill="#475569">bash 是被 JS 调用的工具之一，不是 node_repl 的竞争者</text>
</svg>
