<text class="t" x="50" y="772">① 蓝色是 1080p 档。同为 1080p，H3 Max Turbo 一段 10 秒是 $0.80，LTX Pro 是 $1.70，相差一倍多。</text>
<text class="t" x="50" y="802">② Kling 按音频选项计价，schema 里没有分辨率档；开音频后单价比无音频高 50%。</text>
<text class="t" x="50" y="832">③ H3 Max / Turbo 返回的视频可能比请求长约 0.7 秒，按秒计费时实际金额以账单为准。</text>
<text class="t" x="50" y="862">④ 价格取自微软集成公告的价格表（USD／视频秒，Public Preview 口径），公告称几周内会更新到 Azure 定价页，使用前要复核。</text>
