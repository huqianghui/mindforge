<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="particle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    @keyframes flowDash { to { stroke-dashoffset: -76; } }
    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }
    .flow { stroke-dasharray: 18 20; animation: flowDash 1.6s linear infinite; }
    .halo { animation: pulse 2s ease-in-out infinite; }
  </style>

  <rect width="1200" height="660" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="658" rx="17" fill="none" stroke="#1e293b"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#e2e8f0">托管方式选型：按需求逐级提问</text>
  <text x="1160" y="46" font-size="13" fill="#64748b" text-anchor="end">左侧回答"否"往下走，"是"往右落到候选平台</text>

  <!-- "no" spine -->
  <path id="spine" d="M320 156 L320 216 M320 296 L320 356 M320 436 L320 496" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M320 156 L320 210" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowGray)"/>
  <path d="M320 296 L320 350" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowGray)"/>
  <path d="M320 436 L320 490" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowGray)"/>
  <text x="334" y="192" font-size="13" fill="#64748b">否</text>
  <text x="334" y="332" font-size="13" fill="#64748b">否</text>
  <text x="334" y="472" font-size="13" fill="#64748b">否</text>

  <!-- Q1 -->
  <rect x="60" y="76" width="520" height="80" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Q1 面向公开互联网，或必须用自有域名？</text>
  <text x="84" y="134" font-size="13" fill="#94a3b8">SEO、匿名访问、品牌域名、外部读者</text>
  <path id="a1" d="M580 116 L700 116" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
  <text x="630" y="106" font-size="13" fill="#2dd4bf">是</text>
  <rect x="706" y="76" width="434" height="80" rx="12" fill="#042f2e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="730" y="108" font-size="15" font-weight="700" fill="#ccfbf1">GitHub Pages / Static Web Apps</text>
  <text x="730" y="134" font-size="13" fill="#5eead4">纯静态即可；要自带后端则选 App Service</text>

  <!-- Q2 -->
  <rect x="60" y="216" width="520" height="80" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="248" font-size="15" font-weight="700" fill="#e2e8f0">Q2 主要是文档、列表、门户与协作？</text>
  <text x="84" y="274" font-size="13" fill="#94a3b8">新闻、部门站点、文档库、简单表单</text>
  <path id="a2" d="M580 256 L700 256" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
  <text x="630" y="246" font-size="13" fill="#2dd4bf">是</text>
  <rect x="706" y="216" width="434" height="80" rx="12" fill="#042f2e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="730" y="248" font-size="15" font-weight="700" fill="#ccfbf1">SharePoint Online</text>
  <text x="730" y="274" font-size="13" fill="#5eead4">复杂前端需 SPFx 或嵌入外部应用</text>

  <!-- Q3 -->
  <rect x="60" y="356" width="520" height="80" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="388" font-size="15" font-weight="700" fill="#e2e8f0">Q3 企业内部 SPA，数据靠 Connector 就够？</text>
  <text x="84" y="414" font-size="13" fill="#94a3b8">要 Entra 登录、按人/组分享、沿用 M365 治理</text>
  <path id="a3" d="M580 396 L700 396" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
  <circle r="6" fill="url(#particle)"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
  <text x="630" y="386" font-size="13" fill="#fbbf24">是</text>
  <rect x="706" y="356" width="434" height="80" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <rect x="706" y="356" width="434" height="80" rx="12" fill="none" stroke="#fbbf24" stroke-width="8" class="halo"/>
  <text x="730" y="388" font-size="15" font-weight="700" fill="#fde68a">Copilot Managed Runtime</text>
  <text x="730" y="414" font-size="13" fill="#fcd34d">Copilot Studio 或 ms CLI 创作；先确认许可</text>

  <!-- Q4 -->
  <rect x="60" y="496" width="520" height="80" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="528" font-size="15" font-weight="700" fill="#e2e8f0">Q4 需要容器、多服务、异步作业或 Dapr？</text>
  <text x="84" y="554" font-size="13" fill="#94a3b8">事件驱动扩缩容、Jobs、服务间通信</text>
  <path id="a4" d="M580 536 L700 536" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
  <text x="630" y="526" font-size="13" fill="#2dd4bf">是</text>
  <rect x="706" y="496" width="210" height="80" rx="12" fill="#042f2e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="811" y="530" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="middle">Container Apps</text>
  <text x="811" y="554" font-size="13" fill="#5eead4" text-anchor="middle">自管镜像与网络</text>
  <rect x="930" y="496" width="210" height="80" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="1035" y="530" font-size="15" font-weight="700" fill="#cbd5e1" text-anchor="middle">否 → App Service</text>
  <text x="1035" y="554" font-size="13" fill="#94a3b8" text-anchor="middle">常规 Web + API</text>

  <text x="40" y="616" font-size="13" fill="#94a3b8">Q3 回答"前端是，后端不够"时，常见做法是组合：Managed Runtime 做前端与治理，复杂 API 放到 App Service / Container Apps。</text>
  <text x="40" y="640" font-size="13" fill="#64748b">琥珀色 = 本文主角。各平台不是功能多少的排序，而是从需求反推。</text>
</svg>
