<rect x="1" y="1" width="1398" height="888" rx="17" fill="none" stroke="#1e293b"/>
<text x="36" y="46" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start">参考应用拆解：几乎不用平台能力的 managed app</text>
<text x="36" y="72" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">只有"共享状态"和"AI 问答"走 Connector；其余全靠构建期快照与浏览器原生能力</text>
