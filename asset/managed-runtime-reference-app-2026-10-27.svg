<text x="64" y="367" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">同源数据</text>
<text x="64" y="391" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">提示词里也引用它</text>
<rect x="48" y="456" width="264" height="220" rx="12" fill="#111827" stroke="#64748b" stroke-width="1.6"/>
<text x="64" y="483" font-size="15" font-weight="700" fill="#cbd5e1" text-anchor="start">重新构建并部署</text>
<text x="64" y="507" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">快照 + 术语表打包进 bundle</text>
<text x="64" y="531" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">约 3.6 MB JS</text>
<text x="64" y="555" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">页面写明"数据截至 / 刷新于"</text>
<text x="64" y="579" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">标题旁"Live, version x.y"</text>
<text x="64" y="603" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">+ What's new 横幅</text>
