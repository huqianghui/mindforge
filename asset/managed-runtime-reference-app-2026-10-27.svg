<text x="394" y="427" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="start">共享筛选状态</text>
<text x="394" y="451" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">所有图表、表格读同一份条件</text>
