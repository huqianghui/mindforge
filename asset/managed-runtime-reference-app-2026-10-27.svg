<text x="394" y="577" font-size="15" font-weight="700" fill="#dcfce7" text-anchor="start">浏览器原生能力</text>
<text x="394" y="601" font-size="13" font-weight="400" fill="#86efac" text-anchor="start">mailto: 预填收件人 / 抄送 / 正文</text>
<text x="394" y="625" font-size="13" font-weight="400" fill="#86efac" text-anchor="start">SheetJS 导出 Excel</text>
<text x="394" y="649" font-size="13" font-weight="400" fill="#86efac" text-anchor="start">jsPDF + html2canvas 导出 PDF</text>
<rect x="714" y="550" width="322" height="126" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="730" y="577" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">规则引擎</text>
<text x="730" y="601" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">优先核查：行动 / 核查 / 备注三级</text>
<text x="730" y="625" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">每条带"为什么"</text>
<text x="730" y="649" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">负责人分派规则写在页面上</text>
<rect x="1090" y="96" width="280" height="600" rx="14" fill="#fbbf24" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="1106" y="120" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start">只有两个 Connector</text>
<rect x="1106" y="136" width="248" height="240" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6" class="pulse"/>
<text x="1122" y="163" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">SharePoint</text>
<text x="1122" y="187" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">行动项列表：状态、备注</text>
<text x="1122" y="211" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">异常值审核列表：决定</text>
