<text x="1122" y="427" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">Work IQ Copilot MCP</text>
<text x="1122" y="451" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">问答面板 → M365 Copilot</text>
<text x="1122" y="475" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">以用户自己的身份</text>
<text x="1122" y="499" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">RELATED 行关联回术语</text>
<text x="1122" y="523" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">SSO，首次打开静默建连接</text>
<rect x="1106" y="600" width="248" height="76" rx="12" fill="#111827" stroke="#64748b" stroke-width="1.6"/>
<text x="1122" y="627" font-size="15" font-weight="700" fill="#cbd5e1" text-anchor="start">计费可见</text>
<text x="1122" y="651" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">reportApiConsumption</text>
