<text x="730" y="163" font-size="15" font-weight="700" fill="#ede9fe" text-anchor="start">规划建议</text>
<text x="730" y="187" font-size="13" font-weight="400" fill="#c4b5fd" text-anchor="start">规则结论 + 数据依据</text>
<text x="730" y="211" font-size="13" font-weight="400" fill="#c4b5fd" text-anchor="start">+ 建议动作</text>
