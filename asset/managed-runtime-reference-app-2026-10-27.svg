<text x="1122" y="259" font-size="13" font-weight="400" fill="#fde68a" text-anchor="start">的人共享"</text>
<text x="1122" y="283" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">异常值审核前不计入合计</text>
<text x="1122" y="307" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">下次刷新脚本也能读到</text>
