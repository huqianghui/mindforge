<text x="718" y="717" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">人的判断回流到下一次刷新</text>
<text x="40" y="752" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">① 每周一脚本算好数据和建议，打包进 bundle 重新部署：零 Connector、零调用费、秒开</text>
<text x="40" y="778" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">② 一份术语表同时服务面板、页面标注和问答提示词</text>
<text x="40" y="804" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">③ 行动项状态与异常值审核写进 SharePoint 列表，所有人实时共享</text>
<text x="40" y="830" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">④ 数据周更，人对数据的判断实时共享，并在下次刷新时被脚本读回——共享数据模式的最小版本</text>
<text x="40" y="856" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">能用浏览器原生能力的就不用 Connector：mailto 代替 Outlook，前端导出代替 OneDrive / Excel Connector</text>
