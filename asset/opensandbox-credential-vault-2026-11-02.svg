<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <radialGradient id="particle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .boxWarn { fill: #2a1215; stroke: #f87171; stroke-width: 1.4; }
      .zone { fill: none; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zoneAmber { fill: #17130a; stroke: #fbbf24; stroke-width: 1.4; stroke-dasharray: 8 5; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .zlAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .hRed { fill: #fca5a5; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tDark { fill: #0b1220; font-size: 13.5px; font-weight: 600; }
      .code { fill: #a7f3d0; font-size: 13.5px; font-family: Menlo, Consolas, monospace; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .tRed { fill: #fecaca; font-size: 13.5px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #cbd5e1; font-size: 13.5px; }
      .elh { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1010" rx="16"/>
  <text class="title" x="30" y="44">OpenSandbox：从申请沙箱、凭据注入到暂停恢复</text>
  <text class="sub" x="30" y="72">①~⑥ 是一次正常使用；⑦⑧ 是暂停与恢复，恢复后凭据必须由可信的一方重新注入</text>

  <!-- ===== 第一行：控制链 ===== -->
  <rect class="box" x="30" y="100" width="230" height="92" rx="10"/>
  <text class="h" x="46" y="126">应用后端</text>
  <text class="t" x="46" y="150">用多语言 SDK 调用</text>
  <text class="t" x="46" y="172">持有真实凭据，属于可信侧</text>
  <rect class="box" x="300" y="100" width="250" height="92" rx="10"/>
  <text class="h" x="316" y="126">lifecycle server</text>
  <text class="t" x="316" y="150">统一的沙箱生命周期 API</text>
  <text class="t" x="316" y="172">本地 Docker 与 K8s 同一套接口</text>
  <rect class="box" x="590" y="100" width="330" height="92" rx="10"/>
  <text class="h" x="606" y="126">自定义资源</text>
  <text class="code" x="606" y="150">BatchSandbox · Pool</text>
  <text class="code" x="606" y="172">SandboxSnapshot</text>
  <rect class="box" x="960" y="100" width="410" height="92" rx="10"/>
  <text class="h" x="976" y="126">controller（三个 reconciler）</text>
  <text class="t" x="976" y="150">分配池中 pod、调度任务、处理到期</text>
  <text class="t" x="976" y="172">执行暂停时的快照提交</text>

  <path class="flow" d="M260,146 L300,146" marker-end="url(#arr)"/>
  <circle class="badge" cx="280" cy="128" r="12"/><text class="bn" x="280" y="133">①</text>
  <path class="flow" d="M550,146 L590,146" marker-end="url(#arr)"/>
  <circle class="badge" cx="570" cy="128" r="12"/><text class="bn" x="570" y="133">②</text>
  <path class="flowGray" d="M920,146 L960,146" marker-end="url(#arrGray)"/>
  <text class="tGray" x="922" y="132">watch</text>

  <!-- ===== Pool ===== -->
  <rect class="zone" x="30" y="226" width="530" height="380" rx="12"/>
  <text class="zl" x="48" y="250">Pool：两级容量</text>
  <rect x="50" y="268" width="180" height="40" fill="#2dd4bf" rx="4"/>
  <text class="tDark" x="62" y="293">已分配</text>
  <rect x="230" y="268" width="160" height="40" fill="#164e63" stroke="#38bdf8" stroke-width="1.2"/>
  <text class="t" x="242" y="293">buffer：Ready 待领</text>
  <rect x="390" y="268" width="80" height="40" fill="#2a1f0b" stroke="#fbbf24" stroke-width="1.6"/>
  <text class="hAmber" x="400" y="293">启动中</text>
  <rect x="470" y="268" width="70" height="40" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
  <text class="tGray" x="478" y="293">余量</text>
  <text class="t" x="50" y="334">bufferMin ≤ buffer ≤ bufferMax，分配只从 buffer 里取</text>
  <text class="t" x="50" y="356">poolMin ≤ 总数 ≤ poolMax，启动中的不算可用</text>
  <text class="tGray" x="50" y="378">每轮最多扩缩 maxUnavailable 个（默认 25%），不会一窝蜂起 pod</text>

  <text class="h" x="50" y="410">归还后怎么处理（recycleStrategy）</text>
  <rect class="box" x="50" y="422" width="152" height="86" rx="8"/>
  <text class="h" x="64" y="448">Delete</text>
  <text class="t" x="64" y="472">默认，换新 pod</text>
  <text class="t" x="64" y="494">每次从干净状态起</text>
  <rect class="boxBlue" x="214" y="422" width="152" height="86" rx="8"/>
  <text class="h" x="228" y="448">Restart</text>
  <text class="t" x="228" y="472">原地重启容器</text>
  <text class="t" x="228" y="494">清掉进程状态</text>
  <rect class="boxWarn" x="378" y="422" width="162" height="86" rx="8"/>
  <text class="hRed" x="392" y="448">Noop</text>
  <text class="tRed" x="392" y="472">原样放回，最快</text>
  <text class="tRed" x="392" y="494">文件和进程漏给下一位</text>
  <rect class="boxGray" x="50" y="522" width="490" height="68" rx="8"/>
  <text class="t" x="64" y="548">池子用尽：BatchSandbox 标 PoolAllocationPending，每 5 秒重查</text>
  <text class="t" x="64" y="572">等待窗口内仍没有空位，服务端返回可重试的 429</text>

  <!-- ===== 沙箱 pod ===== -->
  <rect class="zoneAmber" x="590" y="226" width="780" height="270" rx="12"/>
  <text class="zlAmber" x="608" y="250">沙箱 pod（runtimeClassName 可指定 kata-vm-isolation）</text>
  <rect class="box" x="608" y="264" width="360" height="104" rx="10"/>
  <text class="h" x="624" y="290">workload 容器</text>
  <text class="code" x="624" y="316">ANTHROPIC_API_KEY=fake-key</text>
  <text class="t" x="624" y="340">claude -p、git clone、curl 照常用</text>
  <text class="tGray" x="624" y="360">环境变量、命令行、文件里都没有真密钥</text>
  <rect class="box" x="608" y="382" width="360" height="98" rx="10"/>
  <text class="h" x="624" y="408">execd</text>
  <text class="t" x="624" y="432">命令执行、文件读写、代码运行的 API</text>
  <text class="t" x="624" y="454">SDK 经 ingress 网关访问它</text>
  <rect class="boxAmber" x="990" y="264" width="362" height="216" rx="10"/>
  <text class="hAmber" x="1006" y="290">egress sidecar + Credential Vault</text>
  <text class="t" x="1006" y="316">dns+nft 模式透明拦截所有出站</text>
  <text class="t" x="1006" y="340">网络策略默认拒绝，只放行白名单域名</text>
  <text class="t" x="1006" y="364">按 scheme、host、method、path 匹配</text>
  <text class="t" x="1006" y="386">恰好命中一条绑定才注入真实凭据</text>
  <text class="t" x="1006" y="410">vault 只在 sidecar 进程内存里</text>
  <text class="tGray" x="1006" y="436">同 pod 有 Istio 之类透明代理时不能启用</text>
  <text class="tGray" x="1006" y="458">vault 读不到就失败关闭（503 或断连）</text>

  <!-- 上游 -->
  <rect class="box" x="990" y="518" width="362" height="88" rx="10"/>
  <text class="h" x="1006" y="544">上游 API</text>
  <text class="code" x="1006" y="568">api.anthropic.com/v1/*</text>
  <text class="t" x="1006" y="590">收到的是真实 x-api-key</text>
  <rect class="boxGray" x="608" y="518" width="360" height="88" rx="10"/>
  <text class="h" x="624" y="544">不等于凭据消失了</text>
  <text class="tGray" x="624" y="568">后端和 sidecar 仍在可信边界内；</text>
  <text class="tGray" x="624" y="590">拿不到 token 不代表不能滥用它的权限</text>

  <!-- ===== 流程线 ===== -->
  <!-- ③ controller → Pool → pod -->
  <path class="flow" d="M1165,192 L1165,212 L300,212 L300,268" marker-end="url(#arr)"/>
  <circle class="badge" cx="740" cy="212" r="12"/><text class="bn" x="740" y="217">③</text>
  <!-- ④ 后端写 vault -->
  <path class="flowAmber" d="M145,192 L145,206 L20,206 L20,620 L1380,620 L1380,372 L1352,372" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="700" cy="620" r="12"/><text class="bn" x="700" y="625">④</text>
  <!-- ⑤ SDK → execd -->
  <circle class="badge" cx="944" cy="408" r="12"/><text class="bn" x="944" y="413">⑤</text>
  <!-- ⑥ workload → sidecar → 上游 -->
  <path id="credPath" class="flow" d="M968,316 L990,316" marker-end="url(#arr)"/>
  <path class="flow" d="M1171,480 L1171,518" marker-end="url(#arr)"/>
  <circle class="badge" cx="979" cy="298" r="12"/><text class="bn" x="979" y="303">⑥</text>
  <path id="pp" d="M800,316 L1171,316 L1171,560" fill="none" stroke="none"/>
  <circle r="6" fill="url(#particle)">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pp"/></animateMotion>
  </circle>

  <!-- ===== 暂停与恢复 ===== -->
  <rect class="zone" x="30" y="640" width="1340" height="152" rx="12"/>
  <text class="zl" x="48" y="664">暂停与恢复（仅 replicas=1 的 BatchSandbox）</text>
  <rect class="box" x="48" y="680" width="240" height="96" rx="10"/>
  <circle class="badge" cx="70" cy="704" r="12"/><text class="bn" x="70" y="709">⑦</text>
  <text class="h" x="90" y="709">设 pause: true</text>
  <text class="t" x="64" y="736">controller 建 SandboxSnapshot</text>
  <text class="t" x="64" y="758">在源节点跑提交 Job</text>
  <rect class="box" x="312" y="680" width="240" height="96" rx="10"/>
  <text class="h" x="328" y="706">rootfs 推到镜像仓库</text>
  <text class="t" x="328" y="732">格式 rootfs-v1（默认）</text>
  <text class="t" x="328" y="754">或带 VM 状态的 qemu-v1</text>
  <rect class="box" x="576" y="680" width="240" height="96" rx="10"/>
  <text class="h" x="592" y="706">pod 删除，池位释放</text>
  <text class="t" x="592" y="732">删快照记录不会删镜像，</text>
  <text class="t" x="592" y="754">保留和清理要自己管</text>
  <rect class="box" x="840" y="680" width="240" height="96" rx="10"/>
  <circle class="badge" cx="862" cy="704" r="12"/><text class="bn" x="862" y="709">⑧</text>
  <text class="h" x="882" y="709">pause: false 恢复</text>
  <text class="t" x="856" y="736">同一个沙箱 ID</text>
  <text class="t" x="856" y="758">从快照镜像重建 pod</text>
  <rect class="boxWarn" x="1104" y="680" width="248" height="96" rx="10"/>
  <text class="hRed" x="1120" y="706">vault 是空的</text>
  <text class="tRed" x="1120" y="732">sidecar 是新进程，注入暂停；</text>
  <text class="tRed" x="1120" y="754">可信控制面要重新写入凭据</text>
  <path class="flow" d="M288,728 L312,728" marker-end="url(#arr)"/>
  <path class="flow" d="M552,728 L576,728" marker-end="url(#arr)"/>
  <path class="flow" d="M816,728 L840,728" marker-end="url(#arr)"/>
  <path class="flow" d="M1080,728 L1104,728" marker-end="url(#arr)"/>

  <!-- ===== 图例 ===== -->
  <text class="elh" x="30" y="828">流程图例</text>
  <text class="el" x="30" y="854">① 后端用 SDK 申请沙箱，同时声明默认拒绝的出站策略并开启 Credential Proxy</text>
  <text class="el" x="30" y="880">② lifecycle server 把请求落成 BatchSandbox，poolRef 指向预热好的 Pool</text>
  <text class="el" x="30" y="906">③ controller 从 Pool 的 buffer 里直接分配一个就绪 pod，不走调度往返</text>
  <text class="el" x="30" y="932">④ 后端把真实凭据和绑定规则写进 sidecar 的 vault，沙箱进程读不到这份数据</text>
  <text class="el" x="720" y="854">⑤ SDK 经 ingress 网关调 execd，在沙箱里执行命令或代码</text>
  <text class="el" x="720" y="880">⑥ workload 用假密钥发 HTTPS 请求，sidecar 命中绑定后换上真实凭据转发</text>
  <text class="el" x="720" y="906">⑦ 暂停：提交 rootfs 快照、推送镜像，删除 pod 并释放池位</text>
  <text class="el" x="720" y="932">⑧ 恢复：按同一 ID 重建，但 vault 在内存里没带过来，需要重新注入</text>
  <text class="tGray" x="30" y="972">设计含义：真实凭据的来源（Key Vault 或秘密管理系统的引用）要留在沙箱之外的控制面，恢复流程里显式包含"重新注入凭据"这一步</text>
</svg>
