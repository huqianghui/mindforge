<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .zl { fill: #94a3b8; font-size: 14px; font-weight: 700; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .src { fill: #0e2238; stroke: #0ea5e9; stroke-width: 1.4; }
      .snk { fill: #1e1638; stroke: #8b5cf6; stroke-width: 1.4; }
      .snkW { fill: #2a1416; stroke: #f87171; stroke-width: 1.4; }
      .ok { fill: #10302d; stroke: #2dd4bf; stroke-width: 1.2; }
      .no { fill: #2a1416; stroke: #f87171; stroke-width: 1.2; }
      .key { fill: #2a2110; stroke: #fbbf24; stroke-width: 1.4; }
      .bt { fill: #f1f5f9; font-size: 15px; font-weight: 700; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tg { fill: #5eead4; font-size: 13.5px; font-weight: 600; }
      .tr { fill: #fca5a5; font-size: 13.5px; font-weight: 600; }
      .ty { fill: #fcd34d; font-size: 13.5px; font-weight: 600; }
      .num { fill: #38bdf8; }
      .numW { fill: #f87171; }
      .nt { fill: #0b1220; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .flow { stroke: #38bdf8; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .flowW { stroke: #f87171; stroke-width: 2.2; fill: none; stroke-dasharray: 4 6; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .lgh { fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.3; } }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect class="bg" width="1400" height="1120" rx="16"/>
  <text class="title" x="30" y="44">五类日志各落在哪里：每条都能回答一部分问题，但彼此之间串不起来</text>
  <text class="sub" x="30" y="72">从上往下：日志从哪里产生 → 落到哪里 → 能回答什么 → 回答不了什么；红框是这次在集群上实际看到的缺口</text>

  <!-- 行标签 -->
  <text class="zl" x="30" y="104">产生</text>
  <text class="zl" x="30" y="304">落到</text>

  <!-- ===== 产生 ===== -->
  <rect class="src" x="30" y="114" width="254" height="140" rx="10"/>
  <circle class="num" cx="54" cy="140" r="12"/><text class="nt" x="54" y="145">1</text>
  <text class="bt" x="74" y="146">管理操作</text>
  <text class="t" x="46" y="174">Portal 上改 Team、Policy、</text>
  <text class="t" x="46" y="196">Sandbox、挂起和删除 Agent，</text>
  <text class="t" x="46" y="218">最终都是对 K8s API 的</text>
  <text class="t" x="46" y="240">一次写入</text>

  <rect class="src" x="301" y="114" width="254" height="140" rx="10"/>
  <circle class="num" cx="325" cy="140" r="12"/><text class="nt" x="325" y="145">2</text>
  <text class="bt" x="345" y="146">Agent 输出</text>
  <text class="t" x="317" y="174">harness 和会话记录器打到</text>
  <text class="t" x="317" y="196">stdout 的内容，可能包含</text>
  <text class="t" x="317" y="218">对话原文；内容由 Agent</text>
  <text class="t" x="317" y="240">自己决定，不可信</text>

  <rect class="src" x="572" y="114" width="254" height="140" rx="10"/>
  <circle class="num" cx="596" cy="140" r="12"/><text class="nt" x="596" y="145">3</text>
  <text class="bt" x="616" y="146">模型调用</text>
  <text class="t" x="588" y="174">每次请求经过 LiteLLM，</text>
  <text class="t" x="588" y="196">带着 Agent 自己的 key；</text>
  <text class="t" x="588" y="218">网关同时写一行结构化</text>
  <text class="t" x="588" y="240">请求日志到 stdout</text>

  <rect class="src" x="843" y="114" width="254" height="140" rx="10"/>
  <circle class="num" cx="867" cy="140" r="12"/><text class="nt" x="867" y="145">4</text>
  <text class="bt" x="887" y="146">出站连接</text>
  <text class="t" x="859" y="174">Agent 访问 GitHub、内网</text>
  <text class="t" x="859" y="196">API 等；靠 Istio sidecar</text>
  <text class="t" x="859" y="218">的访问日志记录，登记过</text>
  <text class="t" x="859" y="240">的域名能看到 SNI</text>

  <rect class="src" x="1114" y="114" width="256" height="140" rx="10"/>
  <circle class="num" cx="1138" cy="140" r="12"/><text class="nt" x="1138" y="145">5</text>
  <text class="bt" x="1158" y="146">平台组件</text>
  <text class="t" x="1130" y="174">operator、Portal、准入</text>
  <text class="t" x="1130" y="196">webhook、ingress、</text>
  <text class="t" x="1130" y="218">oauth2-proxy 的日志、</text>
  <text class="t" x="1130" y="240">K8s 事件和指标</text>

  <!-- arrows down -->
  <path class="flowW" d="M157,254 L157,306" marker-end="url(#aW)"/>
  <path class="flowW" d="M428,254 L428,306" marker-end="url(#aW)"/>
  <path class="flow" d="M699,254 L699,306" marker-end="url(#a)"/>
  <path class="flowW" d="M970,254 L970,306" marker-end="url(#aW)"/>
  <path class="flowW" d="M1242,254 L1242,306" marker-end="url(#aW)"/>

  <!-- ===== 落到 ===== -->
  <rect class="snkW pulse" x="30" y="314" width="254" height="150" rx="10"/>
  <text class="bt" x="46" y="342">AKS 审计日志</text>
  <text class="t" x="46" y="368">要在诊断设置里单独打开</text>
  <text class="t" x="46" y="390">kube-audit 类别</text>
  <text class="tr" x="46" y="416">这个集群没开；Portal</text>
  <text class="tr" x="46" y="438">自己也不记操作日志</text>

  <rect class="snkW pulse" x="301" y="314" width="254" height="150" rx="10"/>
  <text class="bt" x="317" y="342">ADX 的 Agent 日志库</text>
  <text class="t" x="317" y="368">由可选的观测 chart 采集，</text>
  <text class="t" x="317" y="390">按命名空间关联 owner 和 Team</text>
  <text class="tr" x="317" y="416">没装；Kata 节点上 Container</text>
  <text class="tr" x="317" y="438">Insights 的采集也起不来</text>

  <rect class="snk" x="572" y="314" width="254" height="150" rx="10"/>
  <text class="bt" x="588" y="342">LiteLLM 的 PostgreSQL</text>
  <text class="t" x="588" y="368">花费日志：key、team、用户、</text>
  <text class="t" x="588" y="390">模型、token、花费、trace ID</text>
  <text class="ty" x="588" y="416">prompt 和 response 也存</text>
  <text class="ty" x="588" y="438">在这里，保留多久要定</text>

  <rect class="snkW pulse" x="843" y="314" width="254" height="150" rx="10"/>
  <text class="bt" x="859" y="342">容器日志里的访问日志</text>
  <text class="t" x="859" y="368">sidecar 的 JSON 访问日志，</text>
  <text class="t" x="859" y="390">按命名空间查出站目标</text>
  <text class="tr" x="859" y="416">Agent Pod 里没有 sidecar，</text>
  <text class="tr" x="859" y="438">这条日志实际是空的</text>

  <rect class="snkW pulse" x="1114" y="314" width="256" height="150" rx="10"/>
  <text class="bt" x="1130" y="342">ADX 的平台日志库</text>
  <text class="t" x="1130" y="368">平台、Gateway、ingress、</text>
  <text class="t" x="1130" y="390">遥测四张表，外加指标库</text>
  <text class="tr" x="1130" y="416">没装；平台组件跑在 agent 节点，</text>
  <text class="tr" x="1130" y="438">Container Insights 也采不到</text>

  <!-- ===== 能回答 ===== -->
  <rect class="ok" x="30" y="484" width="254" height="140" rx="10"/>
  <text class="tg" x="46" y="512">谁在什么时候改了哪个</text>
  <text class="tg" x="46" y="534">Policy、删了哪个 Agent</text>
  <text class="t" x="46" y="562">主体是 Portal 的服务账号；</text>
  <text class="t" x="46" y="584">真实操作人要靠 Portal 转发</text>
  <text class="t" x="46" y="606">的身份信息去对</text>

  <rect class="ok" x="301" y="484" width="254" height="140" rx="10"/>
  <text class="tg" x="317" y="512">某个 Agent 在某段时间</text>
  <text class="tg" x="317" y="534">打印了什么</text>
  <text class="t" x="317" y="562">能按 owner、Team 过滤；</text>
  <text class="t" x="317" y="584">内容本身是 Agent 写的，</text>
  <text class="t" x="317" y="606">只能当线索，不能当证据</text>

  <rect class="ok" x="572" y="484" width="254" height="140" rx="10"/>
  <text class="tg" x="588" y="512">哪个 Agent、哪个 Team</text>
  <text class="tg" x="588" y="534">用了哪个模型、花了多少</text>
  <text class="t" x="588" y="562">key 别名里带 Agent 名和</text>
  <text class="t" x="588" y="584">UID，可以直接对到 Agent；</text>
  <text class="t" x="588" y="606">402、429 的原因也在这里</text>

  <rect class="ok" x="843" y="484" width="254" height="140" rx="10"/>
  <text class="tg" x="859" y="512">有 sidecar 时：某个命名</text>
  <text class="tg" x="859" y="534">空间连过哪些域名或 IP</text>
  <text class="t" x="859" y="562">没登记的 HTTPS 目标只有</text>
  <text class="t" x="859" y="584">IP；看不到路径和方法，</text>
  <text class="t" x="859" y="606">分不出读和写</text>

  <rect class="ok" x="1114" y="484" width="256" height="140" rx="10"/>
  <text class="tg" x="1130" y="512">平台为什么拒绝或挂起</text>
  <text class="tg" x="1130" y="534">某个 Agent</text>
  <text class="t" x="1130" y="562">Policy 不生效、准入拒绝、</text>
  <text class="t" x="1130" y="584">owner 检查返回 403，都在</text>
  <text class="t" x="1130" y="606">这几张表和 K8s 事件里</text>

  <!-- ===== 回答不了 ===== -->
  <rect class="no" x="30" y="654" width="1340" height="170" rx="12"/>
  <text class="bt" x="50" y="684">回答不了的那一类问题：某个副作用是哪个用户、哪一轮、哪段模型输出触发的</text>
  <text class="t" x="50" y="714">模型调用的 trace ID 只在 LiteLLM 内部有意义，Agent 输出和出站连接都不带它；Agent 输出按命名空间关联，模型调用按 key 关联，</text>
  <text class="t" x="50" y="738">出站连接按命名空间和时间关联，三者之间没有共同的会话 ID 或轮次 ID，只能按"同一个 Agent、时间相近"去猜。</text>
  <text class="t" x="50" y="768">常驻形态下一个 Agent 就是一个人的长期实例，"同一个 Agent"并不能缩小到某一次任务。要回答系列 11 里那句"每个副作用能追溯到哪一轮"，</text>
  <text class="t" x="50" y="792">需要 harness 或会话层在每一轮生成一个 ID，同时带进模型请求的元数据和出站请求的头里，再由网关两边都记下来。</text>

  <!-- ===== 串联键 ===== -->
  <rect class="key" x="30" y="844" width="1340" height="96" rx="12"/>
  <text class="bt" x="50" y="874">现在能用的关联键</text>
  <text class="t" x="50" y="902">命名空间 → Agent、owner、Team（观测 chart 的 Agent 清单表）；key 别名 → Agent 名和 UID；LiteLLM team → Team 名；</text>
  <text class="t" x="50" y="926">LiteLLM 用户 → owner 的 alias。四个键都只能定位到"哪个 Agent"，定位不到"哪一次任务"</text>

  <!-- ===== 图例 ===== -->
  <line x1="30" y1="962" x2="1370" y2="962" stroke="#1e293b"/>
  <text class="lgh" x="30" y="990">图例</text>
  <rect class="src" x="30" y="1006" width="30" height="18" rx="4"/><text class="lg" x="70" y="1020">日志的产生点，编号 1 到 5 对应正文第六节的顺序</text>
  <rect class="snk" x="30" y="1036" width="30" height="18" rx="4"/><text class="lg" x="70" y="1050">已经在记的落点</text>
  <rect class="snkW" x="30" y="1066" width="30" height="18" rx="4"/><text class="lg" x="70" y="1080">设计上有、这个集群上实际没有数据的落点；红色虚线箭头表示这条路径现在是断的</text>
  <rect class="ok" x="720" y="1006" width="30" height="18" rx="4"/><text class="lg" x="760" y="1020">这条日志能回答的问题</text>
  <rect class="key" x="720" y="1036" width="30" height="18" rx="4"/><text class="lg" x="760" y="1050">跨日志的关联键</text>
  <text class="lg" x="720" y="1080">只有系统节点上的 ingress 和 oauth2-proxy 日志能被 Container Insights 采到</text>
</svg>
