<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="VM 到数字人语音链路；服务内部耗时尚未独立测量">
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.line{stroke:#2dd4bf;stroke-width:3;fill:none}.node{fill:#10233f;stroke:#2dd4bf}.unknown{fill:#10233f;stroke:#fbbf24;stroke-dasharray:5 4}@keyframes pulse{50%{opacity:.5}}.pulse{animation:pulse 2.5s infinite}</style>
<rect width="1100" height="220" rx="18" fill="#0c192d"/>
<path id="route" class="line" d="M75 90 H1025"/>
<circle r="5" fill="#2dd4bf"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
<rect x="18" y="52" width="140" height="76" rx="10" class="node"/><text x="88" y="80" text-anchor="middle" fill="white" font-size="15">美西 2 VM</text><text x="88" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">实时语音输入</text><rect x="173" y="52" width="140" height="76" rx="10" class="node"/><text x="243" y="80" text-anchor="middle" fill="white" font-size="15">East US 应用</text><text x="243" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">WebSocket 代理</text><rect x="328" y="52" width="140" height="76" rx="10" class="unknown pulse"/><text x="398" y="80" text-anchor="middle" fill="white" font-size="15">Speech to Text</text><text x="398" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">已收到最终转写</text><rect x="483" y="52" width="140" height="76" rx="10" class="unknown pulse"/><text x="553" y="80" text-anchor="middle" fill="white" font-size="15">大模型</text><text x="553" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">已收到回答字幕</text><rect x="638" y="52" width="140" height="76" rx="10" class="unknown pulse"/><text x="708" y="80" text-anchor="middle" fill="white" font-size="15">Text to Speech</text><text x="708" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">已收到合成音频</text><rect x="793" y="52" width="140" height="76" rx="10" class="node"/><text x="863" y="80" text-anchor="middle" fill="white" font-size="15">WebRTC</text><text x="863" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">实际媒体传输</text><rect x="948" y="52" width="140" height="76" rx="10" class="node"/><text x="1018" y="80" text-anchor="middle" fill="white" font-size="15">VM 接收端</text><text x="1018" y="106" text-anchor="middle" fill="#b8c7dc" font-size="12">解码与非静音检测</text><text x="550" y="166" text-anchor="middle" fill="#fbbf24" font-size="14">STT / 大模型 / TTS 的独立处理耗时需服务端埋点；此处不分配估算值</text><text x="550" y="196" text-anchor="middle" fill="#b8c7dc" font-size="13">链路按处理逻辑展示，实际流式阶段可能重叠；服务所在区域未逐项验证</text></svg>