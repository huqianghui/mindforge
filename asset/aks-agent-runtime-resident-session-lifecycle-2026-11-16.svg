<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .lane { fill: #0f172a; stroke: #1e293b; stroke-width: 1.2; }
      .lhR { fill: #c4b5fd; font-size: 19px; font-weight: 700; }
      .lhS { fill: #7dd3fc; font-size: 19px; font-weight: 700; }
      .ls { fill: #94a3b8; font-size: 13.5px; }
      .axis { stroke: #2dd4bf; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: flow 1.4s linear infinite; }
      .axisP { stroke: #334155; stroke-width: 3; fill: none; stroke-dasharray: 6 8; }
      .nd { fill: #10302d; stroke: #2dd4bf; stroke-width: 2.4; }
      .ndA { fill: #3a2a08; stroke: #fbbf24; stroke-width: 2.6; animation: pulse 1.8s ease-in-out infinite; }
      .ndP { fill: #0f172a; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .nl { fill: #e2e8f0; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .nlA { fill: #fcd34d; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .nlP { fill: #94a3b8; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .lead { stroke: #475569; stroke-width: 1.2; }
      .card { fill: #111827; stroke: #2dd4bf; stroke-width: 1.1; stroke-opacity: 0.6; }
      .cardA { fill: #1f1a0b; stroke: #fbbf24; stroke-width: 1.4; }
      .cardP { fill: #0f172a; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tA { fill: #fde68a; font-size: 13.5px; }
      .tP { fill: #94a3b8; font-size: 13.5px; }
      .box { fill: #111827; stroke: #334155; stroke-width: 1.2; }
      .bh { fill: #f1f5f9; font-size: 16px; font-weight: 700; }
      .tg { fill: #5eead4; font-size: 13.5px; }
      .tr { fill: #fca5a5; font-size: 13.5px; }
      .lgd { fill: #cbd5e1; font-size: 13px; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.3; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="920" rx="16"/>
  <text class="title" x="30" y="44">状态跟着谁走：常驻实例的一块盘，和会话调度的一串快照</text>
  <text class="sub" x="30" y="72">两条线都是一个用户的一段时间；会话一侧的耗时是系列 05 的实测，常驻一侧来自渲染出的工作负载和 CRD 字段</text>
  <circle class="nd" cx="1000" cy="66" r="7"/><text class="lgd" x="1014" y="71">已有</text>
  <circle class="ndA" cx="1074" cy="66" r="7"/><text class="lgd" x="1088" y="71">关键时刻</text>
  <circle class="ndP" cx="1176" cy="66" r="7"/><text class="lgd" x="1190" y="71">没有 / 计划中</text>

  <!-- ===== 常驻实例泳道 ===== -->
  <rect class="lane" x="20" y="96" width="1360" height="300" rx="12"/>
  <text class="lhR" x="40" y="128">常驻实例</text>
  <text class="ls" x="134" y="128">一个人，一个 Pod，一块盘</text>

  <path class="axis" d="M120,200 L1260,200"/>
  <circle r="5" fill="#5eead4"><animateMotion dur="6s" repeatCount="indefinite" path="M120,200 L1260,200"/></circle>

  <circle class="nd" cx="120" cy="200" r="13"/><text class="nl" x="120" y="176">创建</text>
  <circle class="nd" cx="310" cy="200" r="13"/><text class="nl" x="310" y="176">在线</text>
  <circle class="ndA" cx="500" cy="200" r="13"/><text class="nlA" x="500" y="176">人下线</text>
  <circle class="ndP" cx="690" cy="200" r="13"/><text class="nlP" x="690" y="176">空闲休眠</text>
  <circle class="nd" cx="880" cy="200" r="13"/><text class="nl" x="880" y="176">暂停</text>
  <circle class="nd" cx="1070" cy="200" r="13"/><text class="nl" x="1070" y="176">恢复</text>
  <circle class="nd" cx="1260" cy="200" r="13"/><text class="nl" x="1260" y="176">删除</text>

  <!-- 第一行卡片：1 3 5 7 -->
  <line class="lead" x1="120" y1="213" x2="120" y2="232"/>
  <rect class="card" x="40" y="232" width="250" height="60" rx="8"/>
  <text class="t" x="54" y="256">Operator 建 namespace、</text>
  <text class="t" x="54" y="278">StatefulSet 和 100Gi 盘</text>

  <line class="lead" x1="500" y1="213" x2="500" y2="232"/>
  <rect class="cardA" x="330" y="232" width="340" height="60" rx="8"/>
  <text class="tA" x="344" y="256">Pod 照常运行，agent 在获准范围内</text>
  <text class="tA" x="344" y="278">继续推进，人回来接着看</text>

  <line class="lead" x1="880" y1="213" x2="880" y2="232"/>
  <rect class="card" x="710" y="232" width="340" height="60" rx="8"/>
  <text class="t" x="724" y="256">suspended 设为 true：缩到 0、</text>
  <text class="t" x="724" y="278">去掉入口路由，盘和数据都留着</text>

  <line class="lead" x1="1260" y1="213" x2="1260" y2="232"/>
  <rect class="card" x="1090" y="232" width="270" height="60" rx="8"/>
  <text class="t" x="1104" y="256">删 namespace 连带删 PVC，</text>
  <text class="t" x="1104" y="278">数据能否找回看回收与备份</text>

  <!-- 第二行卡片：2 4 6 -->
  <line class="lead" x1="310" y1="213" x2="310" y2="312"/>
  <rect class="card" x="150" y="312" width="320" height="60" rx="8"/>
  <text class="t" x="164" y="336">主容器请求 4 vCPU / 8Gi，桌面再加</text>
  <text class="t" x="164" y="358">0.5 / 1Gi，用不用都占着</text>

  <line class="lead" x1="690" y1="213" x2="690" y2="312"/>
  <rect class="cardP" x="530" y="312" width="320" height="60" rx="8"/>
  <text class="tP" x="544" y="336">没有空闲自动休眠：</text>
  <text class="tP" x="544" y="358">没人用也不会自己缩到 0</text>

  <line class="lead" x1="1070" y1="213" x2="1070" y2="312"/>
  <rect class="card" x="910" y="312" width="320" height="60" rx="8"/>
  <text class="t" x="924" y="336">Pod 重建并挂回同一块盘，</text>
  <text class="t" x="924" y="358">harness 从盘上读回自己的会话</text>

  <!-- ===== 会话调度泳道 ===== -->
  <rect class="lane" x="20" y="410" width="1360" height="300" rx="12"/>
  <text class="lhS" x="40" y="442">会话调度</text>
  <text class="ls" x="134" y="442">一个会话，借一个沙箱，留一串快照</text>

  <path class="axis" d="M120,514 L1070,514"/>
  <path class="axisP" d="M1070,514 L1260,514"/>
  <circle r="5" fill="#5eead4"><animateMotion dur="5s" repeatCount="indefinite" path="M120,514 L1070,514"/></circle>

  <circle class="nd" cx="120" cy="514" r="13"/><text class="nl" x="120" y="490">领取</text>
  <circle class="nd" cx="310" cy="514" r="13"/><text class="nl" x="310" y="490">一轮</text>
  <circle class="ndA" cx="500" cy="514" r="13"/><text class="nlA" x="500" y="490">checkpoint</text>
  <circle class="nd" cx="690" cy="514" r="13"/><text class="nl" x="690" y="490">暂停</text>
  <circle class="nd" cx="880" cy="514" r="13"/><text class="nl" x="880" y="490">恢复</text>
  <circle class="nd" cx="1070" cy="514" r="13"/><text class="nl" x="1070" y="490">清理</text>
  <circle class="ndP" cx="1260" cy="514" r="13"/><text class="nlP" x="1260" y="490">跨会话记忆</text>

  <line class="lead" x1="120" y1="527" x2="120" y2="546"/>
  <rect class="card" x="40" y="546" width="250" height="60" rx="8"/>
  <text class="t" x="54" y="570">从预热池领现成 Pod，</text>
  <text class="t" x="54" y="592">加初始化约 1.2 秒</text>

  <line class="lead" x1="500" y1="527" x2="500" y2="546"/>
  <rect class="cardA" x="330" y="546" width="340" height="60" rx="8"/>
  <text class="tA" x="344" y="570">rootfs 打成镜像推到 ACR，</text>
  <text class="tA" x="344" y="592">每轮之后一次，31~41 秒</text>

  <line class="lead" x1="880" y1="527" x2="880" y2="546"/>
  <rect class="card" x="710" y="546" width="340" height="60" rx="8"/>
  <text class="t" x="724" y="570">从暂停镜像新建 Pod，9.5~11.2 秒；</text>
  <text class="t" x="724" y="592">出站白名单按当前权限重新下发</text>

  <line class="lead" x1="1260" y1="527" x2="1260" y2="546"/>
  <rect class="cardP" x="1090" y="546" width="270" height="60" rx="8"/>
  <text class="tP" x="1104" y="570">会话删掉，harness 里的</text>
  <text class="tP" x="1104" y="592">上下文也跟着没了</text>

  <line class="lead" x1="310" y1="527" x2="310" y2="626"/>
  <rect class="card" x="150" y="626" width="320" height="60" rx="8"/>
  <text class="t" x="164" y="650">适配器驱动 harness 跑一轮，</text>
  <text class="t" x="164" y="672">结果和副作用意图写进状态库</text>

  <line class="lead" x1="690" y1="527" x2="690" y2="626"/>
  <rect class="card" x="530" y="626" width="320" height="60" rx="8"/>
  <text class="t" x="544" y="650">空闲到阈值再 commit 一次，</text>
  <text class="t" x="544" y="672">然后删 Pod，29~35 秒</text>

  <line class="lead" x1="1070" y1="527" x2="1070" y2="626"/>
  <rect class="card" x="910" y="626" width="320" height="60" rx="8"/>
  <text class="t" x="924" y="650">保留期到，维护循环删沙箱和快照，</text>
  <text class="t" x="924" y="672">对账器从外往里兜底</text>

  <!-- ===== 底部：状态在哪、代价是什么 ===== -->
  <rect class="box" x="20" y="728" width="670" height="172" rx="12"/>
  <text class="bh" x="40" y="760">常驻：状态就是那块 HOME 盘</text>
  <text class="tg" x="40" y="790">+ 不用做快照，恢复只是把盘挂回去</text>
  <text class="tg" x="40" y="814">+ 原生会话、记忆、工作文件天然在一起，跨周也还在</text>
  <text class="tr" x="40" y="842">− 算力按人常驻；盘是 RWO，一个时刻只能挂在一个节点上</text>
  <text class="tr" x="40" y="866">− 迁移只支持源节点健康时的冷迁移，不是故障切换</text>

  <rect class="box" x="710" y="728" width="670" height="172" rx="12"/>
  <text class="bh" x="730" y="760">会话：状态是快照镜像加状态库</text>
  <text class="tg" x="730" y="790">+ 空闲不占 VM，沙箱随时可换，控制面可以做多副本</text>
  <text class="tg" x="730" y="814">+ 每次恢复都按当前权限重新下发，撤销对暂停的会话也生效</text>
  <text class="tr" x="730" y="842">− 每轮两次 commit，恢复要 10 秒左右，进程和 VM 都是新的</text>
  <text class="tr" x="730" y="866">− 会话一删，上下文就没了，长期记忆要放在沙箱外面</text>
</svg>
