<path class="fl" d="M15,828 L15,160" marker-end="url(#a)"/>
<text class="lgh" x="30" y="872">怎么读</text>
<text class="lg" x="30" y="900">底下两层（隔离、沙箱编排）开源和 AKS 已经覆盖得比较好，自己写的主要是配置和兜底；往上走，紫色和蓝色越来越只是"底座"，橙色越来越多</text>
<text class="lg" x="30" y="924">闪烁的两块是最重的自研：③ 会话控制面和 ⑥ 授权模型。它们都要认识会话、终端用户和外部资源上的动作，这正是社区组件不认识的东西（系列 11）</text>
<text class="lg" x="30" y="948">最右一列说明了第一节的结论：如果 agent 是自写 loop、规格又在 Hosted Agents 范围内，橙色的大部分都不用写；要跑现成编码 CLI、更大的沙箱、或逐请求的资源授权，才值得在 AKS 上把这一摞自己搭起来</text>
<text class="lg" x="30" y="972">每一格的细节和实测都在对应篇号里；这张图只回答"这一层有什么现成的、剩下什么要自己写"</text>
</svg>