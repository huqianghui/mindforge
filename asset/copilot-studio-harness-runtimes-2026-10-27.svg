<text x="956" y="196" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start">Copilot Chat harness</text>
<rect x="958" y="212" width="394" height="124" rx="12" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.6"/>
<text x="974" y="239" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="start">M365 Copilot 编排器</text>
<text x="974" y="263" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">Copilot Studio 只写配置</text>
<text x="974" y="287" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">执行在 M365 Copilot 侧</text>
<text x="974" y="311" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">给 Copilot Chat 挂企业知识，仅内部</text>
<rect x="958" y="372" width="394" height="96" rx="12" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.6"/>
<text x="974" y="399" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="start">计费</text>
<text x="974" y="423" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">包含在 M365 Copilot 许可</text>
<text x="974" y="447" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">或按量</text>
<rect x="958" y="504" width="394" height="206" rx="12" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.6"/>
<text x="974" y="531" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="start">能从哪里调用</text>
<text x="974" y="555" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">— 不适用 Connector</text>
<text x="974" y="579" font-size="13" font-weight="400" fill="#7dd3fc" text-anchor="start">   它扩展的是 M365 Copilot Chat</text>
<text x="974" y="603" font-size="13" font-weight="400" fill="#fca5a5" text-anchor="start">✗ Work IQ copilot_chat 的 agentId：实测被忽略</text>
