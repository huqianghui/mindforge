<text x="501" y="196" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start">GitHub Copilot harness</text>
<rect x="503" y="212" width="394" height="124" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6" class="pulse"/>
<text x="519" y="239" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">Agentic Runtime</text>
<text x="519" y="263" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">自己拆步骤、选工具、失败重试</text>
<text x="519" y="287" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">Bash 容器 + 文件系统、读写 Office/PDF</text>
<text x="519" y="311" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">Skills、Memory；只回流式（SSE）</text>
<rect x="503" y="372" width="394" height="96" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="519" y="399" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">计费</text>
<text x="519" y="423" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">构建、测试、评测、运行全按 Credits</text>
<text x="519" y="447" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">M365 Copilot 许可不豁免</text>
<rect x="503" y="504" width="394" height="206" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="519" y="531" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">能从哪里调用</text>
<text x="519" y="555" font-size="13" font-weight="400" fill="#fca5a5" text-anchor="start">✗ Copilot Studio Connector</text>
<text x="519" y="579" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">   没有对应操作，官方确认的已知限制</text>
<text x="519" y="603" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">✓ workflow 的 agent 节点</text>
<text x="519" y="627" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">✓ Teams · M365 Copilot · Web app</text>
<text x="519" y="651" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">… MCP / A2A（Preview）</text>
