<rect x="1" y="1" width="1398" height="848" rx="17" fill="none" stroke="#1e293b"/>
<text x="36" y="46" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start">内部三种 harness：定义在同一处，执行在三套服务里</text>
<text x="36" y="72" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">agent 定义都存在环境的 Dataverse；harness 决定它跑在哪、怎么计费、能从哪里被调用（面向客户的第四种 Customer Conversation 见正文）</text>
<rect x="30" y="92" width="1340" height="56" rx="12" fill="#0d2a18" stroke="#4ade80" stroke-width="1.6"/>
<text x="700.0" y="119" font-size="15" font-weight="700" fill="#dcfce7" text-anchor="middle">agent 定义：instructions · topics · tools · knowledge —— 存在环境的 Dataverse（调用路径里的 dataverse-backed）</text>
<rect x="30" y="172" width="430" height="560" rx="14" fill="#2dd4bf" fill-opacity="0.04" stroke="#2dd4bf" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="46" y="196" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start">Standard harness</text>
<rect x="48" y="212" width="394" height="124" rx="12" fill="#0b2a2a" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="64" y="239" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="start">经典运行时</text>
<text x="64" y="263" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">前身 Power Virtual Agents</text>
<text x="64" y="287" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">按 topics、触发条件、分支走</text>
<text x="64" y="311" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">可配置经典 / 生成式编排</text>
<rect x="48" y="372" width="394" height="96" rx="12" fill="#0b2a2a" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="64" y="399" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="start">计费</text>
<text x="64" y="423" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">原有 Copilot Studio 许可</text>
<text x="64" y="447" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">M365 Copilot 许可的内部用户豁免</text>
<rect x="48" y="504" width="394" height="206" rx="12" fill="#0b2a2a" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="64" y="531" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="start">能从哪里调用</text>
<text x="64" y="555" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">⚠ Copilot Studio Connector（回调式）</text>
<text x="64" y="579" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">   Power Automate 可用，浏览器里的应用不行</text>
<text x="64" y="603" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">✓ Direct Line、client SDK（managed app 的 CSP 挡住）</text>
<text x="64" y="627" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">✓ workflow 的 agent 节点</text>
<text x="64" y="651" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">✓ SharePoint、Teams 等多数渠道</text>
