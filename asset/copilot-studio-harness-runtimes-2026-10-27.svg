<text x="418" y="531" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">1</text>
<circle cx="873" cy="526" r="12" fill="#0a0f1c" stroke="#fbbf24" stroke-width="1.6"/>
<text x="873" y="531" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">2</text>
<circle cx="873" cy="618" r="12" fill="#0a0f1c" stroke="#fbbf24" stroke-width="1.6"/>
<text x="873" y="623" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">3</text>
<text x="40" y="766" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">① Standard 能被 Power Automate 调用；浏览器里的 managed app 哪种 harness 都同步调不到（实测）</text>
<text x="40" y="792" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">② GitHub Copilot harness 接不上 Connector：只回流式、无对应操作、应用又不能直连——三层都堵</text>
<text x="40" y="818" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">③ 它的定位是"用户直接对话的助手"与"后台 workflow 的执行者"，不是给应用当 API 的后端</text>
<text x="720" y="766" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">新建 agent 默认是 GitHub Copilot harness（2026-08 起）；创建后不能互转，要换只能重建</text>
<text x="720" y="792" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">GitHub Copilot harness 只共享 GitHub Copilot 的 SDK 组件，数据不发往 GitHub Copilot 服务</text>
<text x="720" y="818" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">它的沙箱是否每任务独占容器、能否出网，官方未公开</text>
