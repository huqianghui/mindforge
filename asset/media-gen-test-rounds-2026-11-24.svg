<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .done { fill: #0f2a24; stroke: #2dd4bf; stroke-width: 1.8; }
      .cur { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2.2; animation: pulse 2.2s ease-in-out infinite; }
      .plan { fill: #111827; stroke: #334155; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hD { fill: #5eead4; font-size: 16px; font-weight: 600; }
      .hA { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .hG { fill: #cbd5e1; font-size: 16px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tg { fill: #94a3b8; font-size: 13.5px; }
      .flowD { fill: none; stroke: #2dd4bf; stroke-width: 2.4; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowA { fill: none; stroke: #fbbf24; stroke-width: 2.4; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowG { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 5 7; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeA { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .badgeG { fill: #1e293b; stroke: #64748b; stroke-width: 1.4; }
      .bn { fill: #f8fafc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .zone { fill: #0d1729; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .lg { font-size: 13.5px; fill: #cbd5e1; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="780" rx="16"/>
  <text class="title" x="30" y="44">测试分四轮推进：先确认接口，再比共同基线，最后测各自的特色能力</text>
  <text class="sub" x="30" y="72">青绿 = 已完成；琥珀 = 下一步；灰色虚线 = 规划中。每一轮的结论都只在自己的参数条件下成立</text>

  <!-- 0 -->
  <rect class="done" x="30" y="110" width="300" height="250" rx="12"/>
  <circle class="badge" cx="56" cy="138" r="13"/><text class="bn" x="56" y="143">0</text>
  <text class="hD" x="78" y="143">部署与路由确认</text>
  <text class="t" x="50" y="174">五个模型同一个 Foundry 资源</text>
  <text class="t" x="50" y="198">五个 deployment：Succeeded</text>
  <text class="t" x="50" y="222">api-key 鉴权、带 v1 路由全部跑通</text>
  <text class="t" x="50" y="246">Kling 首尾帧图生 API 可用</text>
  <text class="tg" x="50" y="278">第一批七条样片已入实测记录；</text>
  <text class="tg" x="50" y="302">待补：不带 v1 的路由、timings</text>
  <text class="tg" x="50" y="326">字段与内联文件大小上限</text>

  <!-- 1 -->
  <rect class="cur" x="370" y="110" width="300" height="250" rx="12"/>
  <circle class="badgeA" cx="396" cy="138" r="13"/><text class="bn" x="396" y="143">1</text>
  <text class="hA" x="418" y="143">共同基线：Test 01 / 07</text>
  <text class="t" x="390" y="174">雨夜人物，Text-to-Video</text>
  <text class="t" x="390" y="198">五个模型同一条 Prompt</text>
  <text class="t" x="390" y="222">LTX 6 秒 1080p；H3 6 秒 1080P</text>
  <text class="t" x="390" y="246">Kling 6 秒，分辨率按返回值记</text>
  <text class="tg" x="390" y="278">每个模型至少 3 次</text>
  <text class="tg" x="390" y="302">07：同一 Prompt Fast→Pro、</text>
  <text class="tg" x="390" y="326">Turbo→Max，看构图动作留下多少</text>

  <!-- 2 -->
  <rect class="plan" x="710" y="110" width="320" height="250" rx="12"/>
  <circle class="badgeG" cx="736" cy="138" r="13"/><text class="bn" x="736" y="143">2</text>
  <text class="hG" x="758" y="143">音频与镜头：Test 02 / 03</text>
  <text class="t" x="730" y="174">02 宇航员对白：语音、口型、环境音</text>
  <text class="t" x="730" y="198">Kling 另跑一组 multi_prompt</text>
  <text class="t" x="730" y="222">03 海岛航拍：先共同档位对比</text>
  <text class="t" x="730" y="246">LTX Fast 单独两组：</text>
  <text class="t" x="730" y="270">4K / 10 秒，1080p / 24 fps / 20 秒</text>
  <text class="tg" x="730" y="302">看长镜头的地形和光照漂移</text>
  <text class="tg" x="730" y="326">与音画同步</text>

  <!-- 3 -->
  <rect class="plan" x="1070" y="110" width="300" height="250" rx="12"/>
  <circle class="badgeG" cx="1096" cy="138" r="13"/><text class="bn" x="1096" y="143">3</text>
  <text class="hG" x="1118" y="143">参考驱动：Test 04–06</text>
  <text class="t" x="1090" y="174">04 鼓点：H3 Max target_audio_url</text>
  <text class="t" x="1090" y="198">05 人 + 狗：H3 Max 两张参考图</text>
  <text class="t" x="1090" y="222">06 动作迁移：参考图 + 参考视频</text>
  <text class="t" x="1090" y="246">对照组：同素材走图生视频</text>
  <text class="tg" x="1090" y="278">看身份是否漂移、动作是否</text>
  <text class="tg" x="1090" y="302">跟随参考、首帧与参考图</text>
  <text class="tg" x="1090" y="326">两类输入分开记</text>

  <path class="flowD" d="M332,235 L368,235" marker-end="url(#arr)"/>
  <path class="flowA" d="M672,235 L708,235" marker-end="url(#arrA)"/>
  <path class="flowG" d="M1032,235 L1068,235" marker-end="url(#arrG)"/>

  <!-- 记录 -->
  <rect class="zone" x="30" y="396" width="1340" height="200" rx="12"/>
  <text class="h" x="50" y="426">每一次生成都记同一组字段（自动采集 + 人工评分）</text>
  <text class="t" x="50" y="458">自动：模型、平台、deployment、路由、请求参数、输入文件、HTTP 与任务状态、request_id</text>
  <text class="t" x="50" y="484">计时：提交 → COMPLETED、取结果、下载各自分开；有 timings 时单列，不与端到端混填</text>
  <text class="t" x="50" y="510">输出：请求时长 / 实际时长、分辨率、帧率、是否有音轨、文件大小、按单价折算的美元成本</text>
  <text class="t" x="50" y="536">人工（1–5 分）：Prompt 遵循、画质、时间一致性、动作、音频与音画同步，附一句观察</text>
  <text class="tg" x="50" y="566">三次样本只做探索性对比；同一组合样本到 20 次以上再报 P50 / P95 延迟与成功率</text>

  <!-- 汇总 -->
  <rect class="plan" x="30" y="620" width="1340" height="136" rx="12"/>
  <circle class="badgeG" cx="56" cy="648" r="13"/><text class="bn" x="56" y="653">4</text>
  <text class="hG" x="78" y="653">汇总：回到系列 02 的场景假设，逐条确认或推翻</text>
  <text class="t" x="50" y="686">按“每条可用视频的成本”而不是每秒单价比较；可用 = 人工评分各项不低于 3 分</text>
  <text class="t" x="50" y="712">结论写明平台、模型版本、路由和参数条件；跨档位（如 4K 对 1080p）不直接排名</text>
  <text class="tg" x="50" y="738">样片与记录表放进系列的实测篇，失败请求连同响应体一起保留</text>
</svg>
