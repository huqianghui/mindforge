<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    @keyframes flowDash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }
    @keyframes shimmer { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .flow      { stroke-dasharray: 10 12; animation: flowDash 1.4s linear infinite; }
    .flow-amber{ stroke-dasharray: 8 12;  animation: flowDash 1.7s linear infinite; }
    .halo      { animation: pulse 2s ease-in-out infinite; }
    .live      { animation: shimmer 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="620" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="618" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="21" font-weight="700" fill="#e2e8f0">Voice Live 两类数字人头像 — 合成管线分岔，传输链路汇合</text>
  <text x="760" y="44" font-size="13" fill="#475569">viseme 驱动 vs VASA-1 生成 · 2026.09</text>
  <line x1="36" y1="64" x2="66" y2="64" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <text x="72" y="68" font-size="12" fill="#94a3b8">Video Avatar（GA）</text>
  <line x1="216" y1="64" x2="246" y2="64" stroke="#fbbf24" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="252" y="68" font-size="12" fill="#94a3b8">Photo Avatar（Public Preview · VASA-1）</text>
  <text x="530" y="68" font-size="12" fill="#2dd4bf">分岔在合成侧，WebRTC 传输链路两者完全相同</text>

  <!-- ===== 共同输入 ===== -->
  <g filter="url(#softGlow)">
    <rect x="36" y="120" width="150" height="180" rx="12" fill="#101a2e" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="111" y="150" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Azure TTS</text>
  <text x="111" y="170" font-size="11" fill="#64748b" text-anchor="middle">标准 / 自定义音色</text>
  <rect x="52" y="188" width="118" height="42" rx="8" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="111" y="206" font-size="11.5" fill="#2dd4bf" text-anchor="middle">音频波形</text>
  <text x="111" y="222" font-size="10.5" fill="#5eead4" text-anchor="middle">audio stream</text>
  <rect x="52" y="240" width="118" height="42" rx="8" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="111" y="258" font-size="11.5" fill="#2dd4bf" text-anchor="middle">viseme 时间轴</text>
  <text x="111" y="274" font-size="10.5" fill="#5eead4" text-anchor="middle">viseme_id + offset</text>

  <!-- ===== 上通道：Video Avatar ===== -->
  <text x="230" y="112" font-size="14" font-weight="700" fill="#2dd4bf">Video Avatar：素材回放 + viseme 驱动口型</text>

  <path d="M186 210 C 220 210, 230 165, 264 165" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrowTeal)"/>
  <path d="M186 261 C 220 261, 240 185, 264 180" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrowTeal)"/>

  <g filter="url(#softGlow)">
    <rect x="266" y="128" width="190" height="88" rx="12" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5" class="live"/>
  </g>
  <text x="361" y="154" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">实拍素材库</text>
  <text x="361" y="174" font-size="11" fill="#94a3b8" text-anchor="middle">character × style</text>
  <text x="361" y="192" font-size="10.5" fill="#64748b" text-anchor="middle">lisa · casual-sitting …</text>
  <text x="361" y="208" font-size="10.5" fill="#64748b" text-anchor="middle">真人演员摄影棚录制</text>

  <path d="M456 172 L 508 172" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrowTeal)"/>

  <g filter="url(#softGlow)">
    <rect x="510" y="128" width="200" height="88" rx="12" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5" class="live"/>
  </g>
  <text x="610" y="154" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">口型渲染合成</text>
  <text x="610" y="174" font-size="11" fill="#94a3b8" text-anchor="middle">phoneme → viseme → 嘴部动画</text>
  <text x="610" y="192" font-size="10.5" fill="#64748b" text-anchor="middle">身体/姿态来自素材</text>
  <text x="610" y="208" font-size="10.5" fill="#64748b" text-anchor="middle">全身/半身 · crop · background</text>

  <circle r="4" fill="#2dd4bf">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M186 210 C 220 210, 230 165, 264 165 L 456 172 L 508 172"/>
  </circle>

  <!-- ===== 下通道：Photo Avatar ===== -->
  <text x="230" y="352" font-size="14" font-weight="700" fill="#fbbf24">Photo Avatar：单张照片 + VASA-1 逐帧生成</text>

  <path d="M186 226 C 226 226, 226 405, 264 405" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow-amber" marker-end="url(#arrowAmber)"/>

  <g filter="url(#softGlow)">
    <rect x="266" y="368" width="190" height="98" rx="12" fill="#2a230f" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="266" y="368" width="190" height="98" rx="12" fill="#fbbf24" class="halo" opacity="0.15"/>
  </g>
  <text x="361" y="394" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">单张静态照片</text>
  <text x="361" y="414" font-size="11" fill="#94a3b8" text-anchor="middle">512 × 512 · head-only</text>
  <text x="361" y="432" font-size="10.5" fill="#64748b" text-anchor="middle">adrian / amara … 共 30 个</text>
  <text x="361" y="448" font-size="10.5" fill="#64748b" text-anchor="middle">或自建（照片 + consent 音频）</text>

  <path d="M456 417 L 508 417" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow-amber" marker-end="url(#arrowAmber)"/>

  <g filter="url(#softGlow)">
    <rect x="510" y="368" width="200" height="98" rx="12" fill="#2a230f" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="510" y="368" width="200" height="98" rx="12" fill="#fbbf24" class="halo" opacity="0.15"/>
  </g>
  <text x="610" y="392" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">VASA-1 生成模型</text>
  <text x="610" y="410" font-size="10.5" fill="#94a3b8" text-anchor="middle">音频(Wav2Vec2) → Diffusion Transformer</text>
  <text x="610" y="426" font-size="10.5" fill="#94a3b8" text-anchor="middle">人脸潜空间 · holistic dynamics</text>
  <text x="610" y="442" font-size="10.5" fill="#64748b" text-anchor="middle">口型+表情+眨眼+头动 联合生成</text>
  <text x="610" y="458" font-size="10.5" fill="#64748b" text-anchor="middle">512×512 · 流式 ~40fps · 无 viseme 中间层</text>

  <circle r="4" fill="#fbbf24">
    <animateMotion dur="2.9s" repeatCount="indefinite" path="M186 226 C 226 226, 226 405, 264 405 L 456 417 L 508 417"/>
  </circle>

  <!-- ===== 汇合：WebRTC ===== -->
  <path d="M710 172 C 770 172, 780 265, 828 275" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrowTeal)"/>
  <path d="M710 417 C 770 417, 780 325, 828 315" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow-amber" marker-end="url(#arrowAmber)"/>

  <g filter="url(#softGlow)">
    <rect x="830" y="230" width="200" height="130" rx="12" fill="#101a2e" stroke="#2dd4bf" stroke-width="1.5" class="live"/>
  </g>
  <text x="930" y="258" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">同一条 WebRTC</text>
  <text x="930" y="280" font-size="11" fill="#94a3b8" text-anchor="middle">session.avatar.connect（client SDP）</text>
  <text x="930" y="298" font-size="11" fill="#94a3b8" text-anchor="middle">session.avatar.connecting（server SDP）</text>
  <text x="930" y="316" font-size="11" fill="#94a3b8" text-anchor="middle">ICE servers ← session.updated</text>
  <text x="930" y="340" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle">H.264 视频 + 音频</text>

  <path d="M1030 295 L 1076 295" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#arrowTeal)"/>
  <g filter="url(#softGlow)">
    <rect x="1078" y="262" width="58" height="66" rx="10" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5"/>
  </g>
  <text x="1107" y="290" font-size="11.5" font-weight="700" fill="#2dd4bf" text-anchor="middle">浏览器</text>
  <text x="1107" y="308" font-size="10" fill="#5eead4" text-anchor="middle">终端</text>

  <circle r="4" fill="#2dd4bf">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M1030 295 L 1076 295"/>
  </circle>

  <!-- ===== 底部：session.avatar schema 对照 ===== -->
  <rect x="36" y="500" width="1100" height="96" rx="12" fill="#0e1626" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="528" font-size="12.5" font-weight="700" fill="#e2e8f0">session.avatar 校验形状对照</text>
  <text x="56" y="552" font-size="11.5" fill="#2dd4bf">Video：{ "character": "lisa", "style": "casual-sitting", "customized": false, "video": {…} }</text>
  <text x="56" y="572" font-size="11.5" fill="#fbbf24">Photo：{ "type": "photo-avatar", "model": "vasa-1", "character": "adrian", "scene": {…} }</text>
  <text x="56" y="590" font-size="10.5" fill="#64748b">type 是后端路由开关：缺 type 会进 video 素材库按 (character, style) 查找 → avatar_verification_failed；photo 后端无 style 字段，scene 取代 style</text>
</svg>
