<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #0d1729; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .area { fill: #0f1b30; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .cell { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .cellAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .cellDead { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .heapCell { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .pt { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .al { fill: #7dd3fc; font-size: 14px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .code { fill: #a7f3d0; font-size: 14px; font-family: Menlo, Consolas, monospace; }
      .codeS { fill: #a7f3d0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .codeGray { fill: #64748b; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #cbd5e1; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="850" rx="16"/>
  <text class="title" x="30" y="44">赋值和传参时到底发生了什么：Copy、Move、Borrow</text>
  <text class="sub" x="30" y="72">左边是栈（变量自己的那几个字节），右边是堆；青绿箭头是指针，琥珀框是这一步的关键变化</text>

  <!-- ===== 面板 A：Copy ===== -->
  <rect class="panel" x="30" y="92" width="440" height="470" rx="12"/>
  <circle class="badge" cx="54" cy="122" r="13"/><text class="bn" x="54" y="127">1</text>
  <text class="pt" x="76" y="129">i32：Copy</text>
  <text class="code" x="50" y="160">let a = 100;</text>
  <text class="code" x="50" y="182">let b = a;   // a 还能用</text>

  <rect class="area" x="46" y="200" width="200" height="250" rx="8"/>
  <text class="al" x="60" y="222">栈</text>
  <rect class="cell" x="62" y="236" width="168" height="60" rx="8"/>
  <text class="h" x="76" y="260">a</text>
  <text class="code" x="76" y="284">100</text>
  <rect class="cellAmber" x="62" y="320" width="168" height="60" rx="8"/>
  <text class="hAmber" x="76" y="344">b（复制出的新值）</text>
  <text class="code" x="76" y="368">100</text>
  <path class="flowAmber" d="M146,296 L146,320" marker-end="url(#arrAmber)"/>
  <text class="tGray" x="62" y="410">两份独立的值，</text>
  <text class="tGray" x="62" y="432">各管各的，没有共享</text>

  <rect class="area" x="258" y="200" width="196" height="250" rx="8"/>
  <text class="al" x="272" y="222">堆</text>
  <text class="tGray" x="272" y="300">完全不涉及堆</text>
  <text class="tGray" x="272" y="324">和 Java 的 int 一样</text>

  <text class="t" x="50" y="482">i32 实现了 Copy：复制几个字节就是全部，</text>
  <text class="t" x="50" y="506">不存在"两个变量都去释放同一块堆内存"，</text>
  <text class="t" x="50" y="530">所以不需要所有权转移</text>

  <!-- ===== 面板 B：Move ===== -->
  <rect class="panel" x="480" y="92" width="440" height="470" rx="12"/>
  <circle class="badgeAmber" cx="504" cy="122" r="13"/><text class="bn" x="504" y="127">2</text>
  <text class="pt" x="526" y="129">String：Move</text>
  <text class="code" x="500" y="160">let s1 = String::from("hello");</text>
  <text class="code" x="500" y="182">let s2 = s1;  // s1 作废</text>

  <rect class="area" x="496" y="200" width="214" height="250" rx="8"/>
  <text class="al" x="510" y="222">栈</text>
  <rect class="cellDead" x="510" y="234" width="186" height="96" rx="8"/>
  <text class="h" x="524" y="256" style="fill:#94a3b8">s1（已作废）</text>
  <text class="codeGray" x="524" y="278">ptr</text>
  <text class="codeGray" x="524" y="298">len = 5</text>
  <text class="codeGray" x="524" y="318">cap = 5</text>
  <rect class="cellAmber" x="510" y="346" width="186" height="96" rx="8"/>
  <text class="hAmber" x="524" y="368">s2（新的 Owner）</text>
  <text class="codeS" x="524" y="390">ptr</text>
  <text class="codeS" x="524" y="410">len = 5</text>
  <text class="codeS" x="524" y="430">cap = 5</text>
  <path class="flowAmber" d="M603,330 L603,346" marker-end="url(#arrAmber)"/>

  <rect class="area" x="722" y="200" width="182" height="250" rx="8"/>
  <text class="al" x="736" y="222">堆</text>
  <rect class="heapCell" x="738" y="330" width="150" height="56" rx="8"/>
  <text class="code" x="754" y="364">"hello"</text>
  <path class="flow" d="M560,386 C640,386 680,358 738,358" marker-end="url(#arr)"/>
  <circle r="4.5" fill="#5eead4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M560,386 C640,386 680,358 738,358"/></circle>
  <path class="flowGray" d="M560,274 C680,274 700,330 738,342" marker-end="url(#arrGray)"/>
  <text class="tGray" x="738" y="410">堆上的字符没复制，</text>
  <text class="tGray" x="738" y="432">只有一份</text>

  <text class="t" x="500" y="482">只复制栈上 ptr/len/cap 三个字段；若 s1 也</text>
  <text class="t" x="500" y="506">留着，作用域结束时两个都会 drop 同一块堆，</text>
  <text class="t" x="500" y="530">就是 double free。所以 s1 直接作废（E0382）</text>

  <!-- ===== 面板 C：Borrow ===== -->
  <rect class="panel" x="930" y="92" width="440" height="470" rx="12"/>
  <circle class="badge" cx="954" cy="122" r="13"/><text class="bn" x="954" y="127">3</text>
  <text class="pt" x="976" y="129">&amp;String：Borrow</text>
  <text class="code" x="950" y="160">let user = String::from("Alice");</text>
  <text class="code" x="950" y="182">print_name(&amp;user); // 借出去</text>

  <rect class="area" x="946" y="200" width="214" height="250" rx="8"/>
  <text class="al" x="960" y="222">栈</text>
  <rect class="cell" x="960" y="234" width="186" height="96" rx="8"/>
  <text class="h" x="974" y="256">user（Owner）</text>
  <text class="codeS" x="974" y="278">ptr</text>
  <text class="codeS" x="974" y="298">len = 5</text>
  <text class="codeS" x="974" y="318">cap = 5</text>
  <rect class="cellAmber" x="960" y="360" width="186" height="76" rx="8"/>
  <text class="hAmber" x="974" y="384">name: &amp;String</text>
  <text class="t" x="974" y="408">在 print_name 里，</text>
  <text class="t" x="974" y="428">只是一个地址</text>
  <path class="flowAmber" d="M960,398 C948,398 948,300 960,300" marker-end="url(#arrAmber)"/>
  <circle r="4.5" fill="#fbbf24"><animateMotion dur="2.2s" repeatCount="indefinite" path="M960,398 C948,398 948,300 960,300"/></circle>

  <rect class="area" x="1180" y="200" width="174" height="250" rx="8"/>
  <text class="al" x="1194" y="222">堆</text>
  <rect class="heapCell" x="1196" y="252" width="142" height="56" rx="8"/>
  <text class="code" x="1212" y="286">"Alice"</text>
  <path class="flow" d="M1010,274 L1196,280" marker-end="url(#arr)"/>
  <circle r="4.5" fill="#5eead4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1010,274 L1196,280"/></circle>
  <text class="tGray" x="1194" y="340">引用指向栈上的</text>
  <text class="tGray" x="1194" y="362">String 结构，</text>
  <text class="tGray" x="1194" y="384">不直接指向字符；</text>
  <text class="tGray" x="1194" y="406">两层地址</text>

  <text class="t" x="950" y="482">底层就是一个指针，但带着编译期约束：只读、</text>
  <text class="t" x="950" y="506">不能活过 user、函数结束借用就结束。</text>
  <text class="t" x="950" y="530">借用方不负责 drop，所有权一直在 user</text>

  <!-- ===== 底部：Java 对照 与 共享所有权 ===== -->
  <rect class="cell" x="30" y="586" width="660" height="150" rx="10" style="stroke:#38bdf8"/>
  <text class="h" x="48" y="614">对照 Java：User another = user;</text>
  <text class="t" x="48" y="642">复制的是引用，两个变量都能用、都能改同一个对象，什么时候回收交给 GC。</text>
  <text class="t" x="48" y="668">Rust 默认不允许"两个变量都管着同一块堆"的状态，只给三种选择：</text>
  <text class="t" x="48" y="694">交出去（Move）、借出去（&amp;T / &amp;mut T）、明确说要共享（Rc / Arc）。</text>
  <text class="tGray" x="48" y="720">Java int 和 Rust i32 的行为本来就一样，所有权真正管的是像 String 这样持有堆资源的类型。</text>

  <rect class="cell" x="710" y="586" width="660" height="150" rx="10"/>
  <circle class="badge" cx="732" cy="612" r="13"/><text class="bn" x="732" y="617">4</text>
  <text class="h" x="754" y="618">真的需要多个所有者：Rc&lt;T&gt; / Arc&lt;T&gt;</text>
  <text class="code" x="728" y="648">let a = Rc::new(String::from("shared"));</text>
  <text class="code" x="728" y="672">let b = Rc::clone(&amp;a);  // strong_count = 2</text>
  <text class="t" x="728" y="698">引用计数归零时才释放，接近 C++ 的 shared_ptr。</text>
  <text class="tGray" x="728" y="722">和 GC 不同：互相引用成环时计数永远不归零，会泄漏，需要 Weak 打断。</text>

  <!-- 图例 -->
  <text class="h" x="30" y="782">图例</text>
  <circle class="badge" cx="90" cy="777" r="11"/><text class="bn" x="90" y="782">1</text>
  <text class="el" x="108" y="782">Copy：值本身被复制，两边互不影响　</text>
  <circle class="badgeAmber" cx="370" cy="777" r="11"/><text class="bn" x="370" y="782">2</text>
  <text class="el" x="388" y="782">Move：所有权换人，旧变量作废　</text>
  <circle class="badge" cx="640" cy="777" r="11"/><text class="bn" x="640" y="782">3</text>
  <text class="el" x="658" y="782">Borrow：临时访问，所有权不动　</text>
  <circle class="badge" cx="920" cy="777" r="11"/><text class="bn" x="920" y="782">4</text>
  <text class="el" x="938" y="782">Rc/Arc：显式的共享所有权</text>
  <line x1="80" y1="814" x2="112" y2="814" stroke="#2dd4bf" stroke-width="2.2" stroke-dasharray="8 6"/>
  <text class="el" x="122" y="819">青绿：指向堆数据的指针</text>
  <line x1="320" y1="814" x2="352" y2="814" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="8 6"/>
  <text class="el" x="362" y="819">琥珀：这一步新产生的东西（新值、新 Owner、借用引用）</text>
  <line x1="800" y1="814" x2="832" y2="814" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 6"/>
  <text class="el" x="842" y="819">灰色：已经不能再用的旧指针</text>
</svg>
