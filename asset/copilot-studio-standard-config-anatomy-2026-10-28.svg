<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .zone { fill: none; stroke: #334155; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .zt { fill: #94a3b8; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .card { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.5; }
      .cardHot { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; }
      .cardBad { fill: #2a1215; stroke: #f87171; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .cardDim { fill: #111827; stroke: #475569; stroke-width: 1.2; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hA { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .hR { fill: #fca5a5; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tG { fill: #94a3b8; font-size: 13.5px; }
      .tA { fill: #fcd34d; font-size: 13.5px; }
      .tR { fill: #fca5a5; font-size: 13.5px; }
      .m { fill: #e2e8f0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mT { fill: #5eead4; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mA { fill: #fcd34d; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mR { fill: #fca5a5; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mG { fill: #64748b; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { stroke: #2dd4bf; stroke-width: 2; fill: none; stroke-dasharray: 8 6; animation: dash 1.4s linear infinite; }
      .flowR { stroke: #f87171; stroke-width: 2; fill: none; stroke-dasharray: 5 5; animation: dash 1.4s linear infinite; }
      .num { fill: #0f766e; stroke: #5eead4; stroke-width: 1.6; }
      .numA { fill: #92400e; stroke: #fcd34d; stroke-width: 1.6; }
      .nt { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="800" rx="16"/>
  <text class="title" x="30" y="44">一份 Standard agent 配置：门户里填的，Dataverse 里存的</text>
  <text class="sub" x="30" y="72">Overview 页上的模型、指令、Web Search 落在同一行 botcomponent 的一段 YAML 里；渠道和发布状态记在 bot 行上</text>

  <!-- zone L -->
  <rect class="zone" x="24" y="96" width="400" height="500" rx="12"/>
  <text class="zt" x="40" y="122">门户 · Overview / Channels</text>

  <rect class="card" x="40" y="138" width="368" height="74" rx="8"/>
  <circle class="num" cx="62" cy="162" r="11"/><text class="nt" x="62" y="167">1</text>
  <text class="h" x="82" y="167">Select your agent's model</text>
  <text class="t" x="82" y="194">GPT Chat Latest（默认）；还有 GPT-5、Claude 等</text>

  <rect class="card" x="40" y="224" width="368" height="96" rx="8"/>
  <circle class="num" cx="62" cy="248" r="11"/><text class="nt" x="62" y="253">2</text>
  <text class="h" x="82" y="253">Instructions</text>
  <text class="t" x="82" y="280">先用消息里的 SOURCES 答并标 [n]；</text>
  <text class="t" x="82" y="302">没有才查公开网络，开头写明来源</text>

  <rect class="cardDim" x="40" y="332" width="368" height="74" rx="8"/>
  <circle class="num" cx="62" cy="356" r="11"/><text class="nt" x="62" y="361">3</text>
  <text class="h" x="82" y="361">Knowledge</text>
  <text class="tG" x="82" y="388">不挂：资料由应用检索后写进消息</text>

  <rect class="cardHot" x="40" y="418" width="368" height="74" rx="8"/>
  <circle class="numA" cx="62" cy="442" r="11"/><text class="nt" x="62" y="447">4</text>
  <text class="hA" x="82" y="447">Web Search（往下滚才看得到）</text>
  <text class="tA" x="82" y="474">开：Grounding with Bing Search</text>

  <rect class="card" x="40" y="504" width="368" height="78" rx="8"/>
  <circle class="num" cx="62" cy="528" r="11"/><text class="nt" x="62" y="533">5</text>
  <text class="h" x="82" y="533">Channels → Publish</text>
  <text class="t" x="82" y="560">Microsoft 365 and Teams 渠道，再发布</text>

  <!-- zone M -->
  <rect class="zone" x="452" y="96" width="500" height="500" rx="12"/>
  <text class="zt" x="468" y="122">环境 Dataverse · bot / botcomponent 表</text>

  <rect class="card" x="468" y="138" width="468" height="74" rx="8"/>
  <text class="h" x="494" y="163">bot 行</text>
  <text class="m" x="494" y="190">schemaname mf_MindforgeAsk</text>
  <text class="mT" x="740" y="190">publishedon</text>

  <rect class="cardDim" x="468" y="224" width="468" height="70" rx="8"/>
  <text class="tG" x="484" y="248">botcomponent 行（新建即有 14 个，名字以 schema name 开头）</text>
  <text class="mG" x="484" y="276">.topic.ConversationStart  .topic.Fallback  .topic.Signin …</text>

  <rect class="cardHot" x="468" y="306" width="468" height="276" rx="8"/>
  <text class="hA" x="484" y="331">mf_MindforgeAsk.gpt.default</text>
  <text class="tA" x="724" y="331">componenttype 15，data 列</text>
  <text class="m" x="494" y="364">kind: GptComponentMetadata</text>
  <text class="m" x="494" y="388">instructions: |-</text>
  <text class="mG" x="514" y="410">You are the answering backend of …</text>
  <text class="mG" x="514" y="432">- First answer from the SOURCES …</text>
  <text class="m" x="494" y="460">gptCapabilities:</text>
  <text class="mA" x="514" y="482">webBrowsing: true</text>
  <text class="m" x="494" y="510">aISettings:</text>
  <text class="m" x="514" y="532">model:</text>
  <text class="m" x="534" y="554">modelNameHint: GPT56Chat</text>

  <!-- flows L -> M（只走两栏之间的空隙） -->
  <path class="flow" d="M408,176 C440,176 436,549 457,549"/>
  <path class="flow" d="M408,272 C440,272 436,383 457,383"/>
  <path class="flow" d="M408,455 C436,455 436,477 457,477"/>
  <path class="flow" d="M408,543 C444,543 440,190 457,190"/>
  <circle class="num" cx="468" cy="383" r="11"/><text class="nt" x="468" y="388">2</text>
  <circle class="numA" cx="468" cy="477" r="11"/><text class="nt" x="468" y="482">4</text>
  <circle class="num" cx="468" cy="549" r="11"/><text class="nt" x="468" y="554">1</text>
  <circle class="num" cx="468" cy="190" r="11"/><text class="nt" x="468" y="195">5</text>

  <!-- zone R -->
  <rect class="zone" x="980" y="96" width="396" height="500" rx="12"/>
  <text class="zt" x="996" y="122">写坏时的样子与修法</text>

  <rect class="cardBad" x="996" y="138" width="364" height="190" rx="8"/>
  <text class="hR" x="1012" y="163">脚本"全选再键入"之后</text>
  <text class="t" x="1012" y="190">往富文本指令框里自动输入，</text>
  <text class="t" x="1012" y="212">门户随后显示指令为空。查 data 列：</text>
  <text class="mR" x="1012" y="242">0: k</text>
  <text class="mR" x="1012" y="264">1: i</text>
  <text class="mR" x="1012" y="286">2: n   … 上千个按字符编号的键</text>
  <text class="tR" x="1012" y="314">instructions 字段不见了</text>

  <path class="flowR" d="M1178,328 L1178,350"/>

  <rect class="card" x="996" y="352" width="364" height="140" rx="8"/>
  <text class="h" x="1012" y="377">修法：直接 PATCH 这一行</text>
  <text class="m" x="1012" y="406">PATCH …/botcomponents(&lt;id&gt;)</text>
  <text class="m" x="1012" y="428">{ "data": "&lt;正确的 YAML&gt;" }</text>
  <text class="t" x="1012" y="456">格式照抄环境里其他 agent 的</text>
  <text class="t" x="1012" y="478">同一组件；刷新门户即恢复</text>

  <rect class="cardDim" x="996" y="504" width="364" height="78" rx="8"/>
  <text class="tG" x="1012" y="529">经验：门户里手工编辑没问题；</text>
  <text class="tG" x="1012" y="553">程序化修改改 YAML，不要模拟键入</text>

  <path class="flow" d="M936,430 C960,430 960,420 996,420"/>

  <!-- legend -->
  <rect class="zone" x="24" y="616" width="1352" height="166" rx="12"/>
  <circle class="num" cx="50" cy="646" r="11"/><text class="nt" x="50" y="651">1</text>
  <text class="lg" x="72" y="651">模型下拉的显示名和存储名不同：GPT Chat Latest 存为 modelNameHint GPT56Chat；被管理员禁用的模型族在下拉里灰显</text>
  <circle class="num" cx="50" cy="678" r="11"/><text class="nt" x="50" y="683">2</text>
  <text class="lg" x="72" y="683">指令是 instructions 下的一段块文本；应用发来的消息自带资料与规则，指令只定基调和兜底行为</text>
  <circle class="num" cx="50" cy="710" r="11"/><text class="nt" x="50" y="715">3</text>
  <text class="lg" x="72" y="715">不挂知识源，是为了和 Work IQ 后端用同一份检索结果，对比才公平</text>
  <circle class="numA" cx="50" cy="742" r="11"/><text class="nt" x="50" y="747">4</text>
  <text class="lg" x="72" y="747">Web Search 开关就是 gptCapabilities.webBrowsing；开着时 agent 先把问题改写成短英文查询再检索</text>
  <circle class="num" cx="50" cy="772" r="11"/><text class="nt" x="50" y="777">5</text>
  <text class="lg" x="72" y="777">渠道加好、发布成功后，bot 行的 publishedon 才有值——界面转圈时以它为准</text>
</svg>
