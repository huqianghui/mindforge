<text class="tag" x="795" y="120" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="487" y="147">建会话（幂等键，固定应用 revision）</text>
<text class="t" x="487" y="166">投递 prompt、按游标订阅更新</text>
<text class="t" x="487" y="185">中止、恢复；Entra 令牌 → owner</text>
<rect x="820" y="102" width="300" height="110" rx="10" fill="#0f2236" stroke="#38bdf8" stroke-width="1.5"/>
<text class="h" x="832" y="125">身份</text>
<text class="tag" x="1110" y="120" fill="#7dd3fc" text-anchor="end">AKS / Azure</text>
<text class="t" x="832" y="147">终端用户：Entra 令牌</text>
<text class="t" x="832" y="166">服务之间：投影 SA token（OIDC）</text>
<text class="t" x="832" y="185">外部渠道：Teams bot 托管身份</text>
