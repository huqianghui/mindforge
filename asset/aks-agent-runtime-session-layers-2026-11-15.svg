<text class="lgh" x="30" y="1246">怎么读</text>
<text class="lg" x="30" y="1272">1 渠道经会话 API 投递消息；2 消息进收件箱（参考实现：状态库里的表；PoC：Service Bus 会话队列），应用层按会话逐个取出；3 状态机和执行器读写数据层，再调沙箱后端</text>
<text class="lg" x="30" y="1296">4 多副本时，写结果前在 PostgreSQL 抢 lease、带 token 条件写入。元数据层不在热路径上：controller 把应用定义解析成 revision，建会话时固定下来</text>
