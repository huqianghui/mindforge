<text class="tag" x="500" y="538" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="222" y="565">单副本：启动时把做到一半的</text>
<text class="t" x="222" y="584">事全部标成中断，再逐个核对</text>
<text class="t" x="222" y="603">（多副本下要改成按 lease 判断）</text>
<rect x="525" y="520" width="300" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="h" x="537" y="543">渠道作业</text>
<text class="tag" x="815" y="538" fill="#5eead4" text-anchor="end">参考实现</text>
