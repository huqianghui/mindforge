<text class="tag" x="450" y="120" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="222" y="147">Teams 线程 → 会话（线程键映射）</text>
<text class="t" x="222" y="166">定时任务：到点建会话发 prompt</text>
<text class="t" x="222" y="185">CI 流水线模板；agent 调 agent</text>
<rect x="475" y="102" width="330" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
