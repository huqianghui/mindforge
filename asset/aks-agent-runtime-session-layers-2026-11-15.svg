<text class="tag" x="1130" y="538" fill="#fde68a" text-anchor="end">我的 PoC</text>
<text class="t" x="852" y="565">从外往里：按两个标签盘点沙箱</text>
<text class="t" x="852" y="584">和 ACR 快照仓库</text>
<text class="t" x="852" y="603">会话层不认识的才删，默认只报告</text>
<rect x="1155" y="520" width="315" height="110" rx="10" fill="#2a2110" stroke="#fbbf24" stroke-width="1.5"/>
<text class="h" x="1167" y="543">多副本执行器（第 06 篇 PoC）</text>
<text class="tag" x="1460" y="538" fill="#fde68a" text-anchor="end">我的 PoC</text>
<text class="t" x="1167" y="565">拿到会话锁 → 抢 lease（10 秒、</text>
<text class="t" x="1167" y="584">每秒续）→ token 加一</text>
<text class="t" x="1167" y="603">写结果带 token 和序号条件</text>
