<text class="ld" x="36" y="440">控制面服务</text>
<text class="ld" x="36" y="459">参考实现单副本</text>
<text class="ld" x="36" y="478">PoC 三副本</text>
<rect x="210" y="400" width="300" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
