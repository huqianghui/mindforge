<text class="tag" x="620" y="946" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="222" y="973">运行时类引用 + 镜像覆盖、初始文件</text>
<text class="t" x="222" y="992">入口：会话 API / 定时（cron 表达式、时区、</text>
