<style>.title{fill:#f8fafc;font-size:22px;font-weight:700}.sub{fill:#94a3b8;font-size:14px}.h{fill:#f1f5f9;font-size:15px;font-weight:600}.t{fill:#cbd5e1;font-size:13px}.tag{font-size:12px;font-weight:600}.ln{fill:#e2e8f0;font-size:16px;font-weight:700}.ld{fill:#94a3b8;font-size:13px}.fl{fill:none;stroke:#e2e8f0;stroke-width:1.8;stroke-dasharray:7 6;animation:d 1.3s linear infinite}.bn{fill:#0b1220;font-size:13px;font-weight:700;text-anchor:middle}.lg{fill:#cbd5e1;font-size:13.5px}.lgh{fill:#e2e8f0;font-size:15px;font-weight:600}@keyframes d{to{stroke-dashoffset:-26}}</style></defs>
<rect width="1500" height="1330" rx="16" fill="#0b1220"/>
<text class="title" x="30" y="44">会话管理的分层架构（参考实现 + 第 06 篇多副本 PoC）</text>
<text class="sub" x="30" y="72">每张卡片右上角标出处：灰 Kubernetes、蓝 AKS / Azure、紫 社区、青绿 参考实现自己写的、琥珀 我在 PoC 里补的。会话相关的数据模型和逻辑全部是自己写的</text>
<rect x="20" y="92" width="1460" height="130" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="120">接入层</text>
<text class="ld" x="36" y="142">渠道与会话 API</text>
