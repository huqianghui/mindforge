<text class="t" x="537" y="464">可能已发出、已完成</text>
<text class="t" x="537" y="483">重启后按"可能已发出"核对</text>
<rect x="840" y="400" width="300" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="h" x="852" y="423">定时器 / 维护循环</text>
<text class="tag" x="1130" y="418" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="852" y="445">每 15 秒：保留期、应用被删、</text>
<text class="t" x="852" y="464">准备超时（操作超时 + 10 分钟）</text>
<text class="t" x="852" y="483">Durable 空闲到点 → 暂停</text>
<rect x="1155" y="400" width="315" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="h" x="1167" y="423">harness 适配 + 沙箱 provider</text>
<text class="tag" x="1460" y="418" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="1167" y="445">五种 CLI 的命令、输出、续接</text>
<text class="t" x="1167" y="464">分配 / 执行一轮 / checkpoint /</text>
<text class="t" x="1167" y="483">暂停 / 恢复 / 重建 / 中止</text>
<rect x="210" y="520" width="300" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
