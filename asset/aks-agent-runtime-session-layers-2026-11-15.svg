<text class="t" x="222" y="464">每次变化记一条变更日志</text>
<text class="t" x="222" y="483">"新状态 + 副作用意图"同事务写</text>
<rect x="525" y="400" width="300" height="110" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="h" x="537" y="423">执行器（副作用）</text>
<text class="tag" x="815" y="418" fill="#5eead4" text-anchor="end">参考实现</text>
