<text class="tag" x="1460" y="120" fill="#cbd5e1" text-anchor="end">Kubernetes</text>
<text class="t" x="1147" y="147">网关 + Service 暴露会话 API</text>
<text class="t" x="1147" y="166">控制面不对沙箱开放任何入口</text>
<text class="t" x="1147" y="185">（沙箱只能产出数据）</text>
<rect x="20" y="236" width="1460" height="140" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="264">消息层</text>
<text class="ld" x="36" y="286">两种异步做法</text>
<rect x="210" y="246" width="520" height="120" rx="10" fill="#10302d" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="h" x="222" y="269">收件箱建在状态库里（参考实现）</text>
<text class="tag" x="720" y="264" fill="#5eead4" text-anchor="end">参考实现</text>
<text class="t" x="222" y="291">消息带序号落表，写成功才 ACK</text>
<text class="t" x="222" y="310">同步、异步两种投递；同一会话一次只跑一轮</text>
<text class="t" x="222" y="329">单副本自己按序取，不需要外部队列</text>
<text class="t" x="222" y="348">代价：只能一个调度者，重启有几秒空窗</text>
<rect x="745" y="246" width="725" height="120" rx="10" fill="#2a2110" stroke="#fbbf24" stroke-width="1.5"/>
<text class="h" x="757" y="269">外部会话队列（第 06 篇 PoC）</text>
<text class="tag" x="1460" y="264" fill="#fde68a" text-anchor="end">我的 PoC</text>
<text class="t" x="757" y="291">Azure Service Bus 会话队列：按 session_id 分组，同一会话同一时刻只交给一个副本、按序投递</text>
<text class="t" x="757" y="310">会话锁 30 秒，处理中续锁；投递失败超过次数进死信，死信要写明原因</text>
<text class="t" x="757" y="329">队列只决定"谁收消息"，挡不住卡住又醒来的旧主 → 还要数据库 lease + fencing token（见数据层）</text>
<text class="t" x="757" y="348">副本用 Workload Identity 连接（SAS 认证被订阅策略关闭）</text>
<rect x="20" y="390" width="1460" height="250" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
