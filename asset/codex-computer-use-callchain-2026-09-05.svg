<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="particle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes flowDash { to { stroke-dashoffset: -76; } }
    @keyframes shimmer { 0%,100% { opacity: 0.78; } 50% { opacity: 1; } }
    .flow  { stroke-dasharray: 14 16; animation: flowDash 1.6s linear infinite; }
    .flow-slow { stroke-dasharray: 10 22; animation: flowDash 2.4s linear infinite; }
    .node { animation: shimmer 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="620" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="618" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">Codex Computer Use 调用链与 bundled plugin 分发链</text>
  <text x="560" y="46" font-size="13" fill="#475569">App Bundle 即 runtime distribution · 2026-09-05</text>

  <!-- ================= Row 1: runtime call chain ================= -->
  <text x="36" y="92" font-size="14" font-weight="600" fill="#7dd3fc">运行时调用链（青色）</text>

  <!-- track -->
  <path d="M 200 165 H 990" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flow" d="M 200 165 H 990" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <circle r="6" fill="url(#particle)" filter="url(#softGlow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 200 165 H 990"/>
  </circle>

  <!-- nodes row1 -->
  <g class="node">
    <rect x="50" y="120" width="150" height="90" rx="12" fill="#0f2e2a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="125" y="150" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle">Codex Agent</text>
    <text x="125" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">bundled CLI</text>
    <text x="125" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">plugins/MCP 已内建</text>
  </g>
  <g class="node">
    <rect x="255" y="120" width="180" height="90" rx="12" fill="#0f2e2a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="345" y="150" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle">computer-use plugin</text>
    <text x="345" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">plugin.json / skills/</text>
    <text x="345" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">.mcp.json 指向 helper</text>
  </g>
  <g class="node">
    <rect x="490" y="120" width="200" height="90" rx="12" fill="#0f2e2a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="590" y="150" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle">SkyComputerUseClient</text>
    <text x="590" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">MCP server（native）</text>
    <text x="590" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">启动依赖签名/进程树</text>
  </g>
  <g class="node">
    <rect x="745" y="120" width="200" height="90" rx="12" fill="#0f2e2a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="845" y="150" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle">SkyComputerUseService</text>
    <text x="845" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Mach-O arm64</text>
    <text x="845" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">桌面操作真正执行者</text>
  </g>
  <g class="node">
    <rect x="990" y="105" width="130" height="120" rx="12" fill="#122036" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1055" y="132" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">macOS APIs</text>
    <text x="1055" y="154" font-size="11" fill="#94a3b8" text-anchor="middle">Accessibility</text>
    <text x="1055" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Screen Capture</text>
    <text x="1055" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">Mouse / Keyboard</text>
    <text x="1055" y="208" font-size="11" fill="#94a3b8" text-anchor="middle">App discovery</text>
  </g>

  <!-- protocol labels -->
  <text x="227" y="150" font-size="11" fill="#475569" text-anchor="middle">plugin</text>
  <text x="462" y="150" font-size="11" fill="#475569" text-anchor="middle">MCP</text>
  <text x="717" y="150" font-size="11" fill="#475569" text-anchor="middle">XPC</text>
  <text x="967" y="150" font-size="11" fill="#475569" text-anchor="middle">TCC</text>

  <!-- ================= Row 2: distribution chain ================= -->
  <text x="36" y="300" font-size="14" font-weight="600" fill="#fbbf24">分发与 reconcile 链（琥珀色）——payload 随 App Bundle 走</text>

  <path d="M 230 385 H 960" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flow-slow" d="M 230 385 H 960" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <circle r="6" fill="url(#particleAmber)" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 230 385 H 960"/>
  </circle>

  <g class="node">
    <rect x="50" y="330" width="180" height="110" rx="12" fill="#2a1e0d" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="140" y="358" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">App Bundle 内 payload</text>
    <text x="140" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">ChatGPT.app/Contents/</text>
    <text x="140" y="396" font-size="10.5" fill="#94a3b8" text-anchor="middle">Resources/plugins/</text>
    <text x="140" y="412" font-size="10.5" fill="#94a3b8" text-anchor="middle">openai-bundled/plugins/</text>
    <text x="140" y="428" font-size="10.5" fill="#94a3b8" text-anchor="middle">computer-use/</text>
  </g>
  <g class="node">
    <rect x="330" y="330" width="200" height="110" rx="12" fill="#2a1e0d" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="430" y="358" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">bundled marketplace</text>
    <text x="430" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">启动时 reconcile/install</text>
    <text x="430" y="396" font-size="10.5" fill="#94a3b8" text-anchor="middle">日志：bundled_plugins_</text>
    <text x="430" y="412" font-size="10.5" fill="#94a3b8" text-anchor="middle">marketplace_added</text>
  </g>
  <g class="node">
    <rect x="630" y="330" width="220" height="110" rx="12" fill="#2a1e0d" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="740" y="358" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">用户目录 cache</text>
    <text x="740" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">~/.codex/plugins/cache/</text>
    <text x="740" y="396" font-size="10.5" fill="#94a3b8" text-anchor="middle">openai-bundled/computer-use/</text>
    <text x="740" y="412" font-size="10.5" fill="#94a3b8" text-anchor="middle">&lt;version&gt;/</text>
  </g>
  <g class="node">
    <rect x="950" y="330" width="170" height="110" rx="12" fill="#123528" stroke="#34d399" stroke-width="2" filter="url(#softGlow)"/>
    <text x="1035" y="358" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle">active runtime</text>
    <text x="1035" y="380" font-size="10.5" fill="#a7f3d0" text-anchor="middle">~/.codex/computer-use/</text>
    <text x="1035" y="396" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Codex Computer Use.app</text>
    <text x="1035" y="412" font-size="10.5" fill="#a7f3d0" text-anchor="middle">→ 供运行时调用 ✅</text>
  </g>

  <!-- ================= bottom note ================= -->
  <g font-size="12">
    <rect x="50" y="490" width="1070" height="90" rx="12" fill="#111827" stroke="#1e293b"/>
    <text x="72" y="520" fill="#e2e8f0" font-weight="600">为什么 standalone CLI 没有 Computer Use：</text>
    <text x="72" y="544" fill="#94a3b8">① payload 只随 App Bundle 分发（Intel x64 构建甚至不含它）——不是 feature flag 关掉了，是文件根本不在；</text>
    <text x="72" y="566" fill="#94a3b8">② 即使手动挂载 marketplace，native helper 仍依赖签名与 launch context——App Bundle + helper + TCC 权限是一个整体。</text>
  </g>
</svg>
