<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloBlur4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="pTeal4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pAmber4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes flowDashD { to { stroke-dashoffset: -76; } }
    @keyframes pulseD { 0%,100% { opacity: 0.12; } 50% { opacity: 0.55; } }
    @keyframes shimmerD { 0%,100% { opacity: 0.78; } 50% { opacity: 1; } }
    .flowD  { stroke-dasharray: 18 20; animation: flowDashD 1.6s linear infinite; }
    .flowD2 { stroke-dasharray: 4 34;  animation: flowDashD 1.6s linear infinite; }
    .haloD  { animation: pulseD 2s ease-in-out infinite; }
    .nodeD  { animation: shimmerD 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="580" rx="18" fill="url(#bg4)"/>
  <rect x="1" y="1" width="1158" height="578" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">空间智能分层栈：状态在下，转移在中，行动在上</text>
  <text x="1124" y="46" font-size="13" fill="#475569" text-anchor="end">左侧上行 = 状态与预测 · 右侧下行 = 目标与动作</text>

  <!-- upward flow (left): state pipeline -->
  <path d="M 210 505 V 105" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flowD" d="M 210 505 V 105" fill="none" stroke="#14b8a6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path class="flowD2" d="M 210 505 V 105" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <circle r="6" fill="url(#pTeal4)" filter="url(#softGlow4)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 210 505 V 105"/>
  </circle>
  <circle r="5" fill="url(#pTeal4)" filter="url(#softGlow4)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M 210 505 V 105"/>
  </circle>
  <text x="196" y="300" font-size="11.5" fill="#5eead4" opacity="0.8" text-anchor="middle" transform="rotate(-90 196 300)">传感器数据 → 状态 → 预测 上行</text>

  <!-- downward flow (right): goal/action -->
  <path d="M 950 105 V 505" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flowD" d="M 950 105 V 505" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path class="flowD2" d="M 950 105 V 505" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle r="6" fill="url(#pAmber4)" filter="url(#softGlow4)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 950 105 V 505"/>
  </circle>
  <circle r="5" fill="url(#pAmber4)" filter="url(#softGlow4)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M 950 105 V 505"/>
  </circle>
  <text x="966" y="300" font-size="11.5" fill="#fcd34d" opacity="0.8" text-anchor="middle" transform="rotate(90 966 300)">任务目标 → 候选动作 → 执行 下行</text>

  <!-- Layer 4 (top): planning & action -->
  <g class="nodeD">
    <rect x="255" y="80" width="650" height="78" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="580" y="110" font-size="16" font-weight="600" fill="#ccfbf1" text-anchor="middle">④ 规划与行动</text>
    <text x="580" y="134" font-size="11.5" fill="#5eead4" opacity="0.85" text-anchor="middle">VLA 连续控制 · MPC 式规划（在世界模型里"演"几百条候选再挑）· 任务分解</text>
  </g>

  <!-- Layer 3: world model — the thin layer, amber pulse -->
  <rect class="haloD" x="249" y="180" width="662" height="92" rx="18" fill="none"
        stroke="#fbbf24" stroke-width="10" filter="url(#haloBlur4)"/>
  <g>
    <rect x="255" y="186" width="650" height="80" rx="14" fill="#33270a" stroke="#fbbf24" stroke-width="2"/>
    <text x="580" y="214" font-size="16" font-weight="700" fill="#fef3c7" text-anchor="middle">③ 世界模型：p( s(t+1) | s(t), a(t) ) —— 状态转移</text>
    <text x="580" y="236" font-size="11.5" fill="#fcd34d" text-anchor="middle">"如果我这么做，世界会变成什么样" · 四种实现：像素（视频）/ 特征（潜空间）/ 几何（3D+物理引擎）/ 方程（仿真器）</text>
    <text x="580" y="256" font-size="11" fill="#d9a915" text-anchor="middle">当前栈里最薄的一层——感知和行动两头都比它成熟</text>
  </g>

  <!-- Layer 2: 3D representation & spatial reasoning -->
  <g class="nodeD">
    <rect x="255" y="294" width="650" height="78" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="580" y="324" font-size="16" font-weight="600" fill="#ccfbf1" text-anchor="middle">② 3D 表征与空间推理</text>
    <text x="580" y="348" font-size="11.5" fill="#5eead4" opacity="0.85" text-anchor="middle">3D 语义地图 · 拓扑关系（物体在哪 / 能不能通过 / 门后面是什么）· 场景记忆</text>
  </g>

  <!-- Layer 1 (bottom): perception & reconstruction -->
  <g class="nodeD">
    <rect x="255" y="400" width="650" height="78" rx="14" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="580" y="430" font-size="16" font-weight="600" fill="#ccfbf1" text-anchor="middle">① 感知与重建：得到状态 s(t) —— "世界现在是什么样"</text>
    <text x="580" y="454" font-size="11.5" fill="#5eead4" opacity="0.85" text-anchor="middle">Gaussian Splatting · SAM 分割 · TRELLIS 物体级 3D 生成 · SLAM 建图定位</text>
  </g>

  <!-- sensors bar -->
  <g>
    <rect x="380" y="506" width="400" height="42" rx="12" fill="#131a2a" stroke="#334155" stroke-width="1.5"/>
    <text x="580" y="532" font-size="12.5" fill="#94a3b8" text-anchor="middle">传感器：相机 / 激光雷达 / 触觉 / IMU —— 物理世界</text>
  </g>

  <!-- legend -->
  <g font-size="12.5">
    <circle cx="46" cy="562" r="6" fill="#2dd4bf"/>
    <text x="60" y="567" fill="#94a3b8">状态与认知（重建=状态估计，回答"现在"）</text>
    <circle cx="440" cy="562" r="6" fill="#fbbf24"/>
    <text x="454" y="567" fill="#94a3b8">预测与决策（世界模型=状态转移，回答"如果"）</text>
    <text x="1124" y="567" fill="#475569" text-anchor="end">SLAM + 动力学模型的经典分工，在新技术栈里依然成立</text>
  </g>
</svg>
