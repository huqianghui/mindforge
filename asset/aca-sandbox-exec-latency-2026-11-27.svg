<circle cx="612.4" cy="275" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="556.4" cy="275" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="562.0" cy="275" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<line x1="592.8" y1="257" x2="592.8" y2="293" stroke="#0b0b0b" stroke-width="2"/>
<text x="592.8" y="249" font-size="13" text-anchor="middle" fill="#0b0b0b">中位 1.26 秒</text>
<path d="M 319.2 267 L 327.2 275 L 319.2 283 L 311.2 275 Z" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
<text x="319.2" y="307" font-size="13" text-anchor="middle" fill="#52514e">新建一次 TLS 连接 0.28 秒</text>
<g font-size="13" fill="#52514e"><circle cx="46" cy="392" r="6" fill="#52514e"/><text x="60" y="397">一次 exec 往返（实测）</text>
<path d="M 236 384 L 244 392 L 236 400 L 228 392 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="252" y="397">到数据面新建一次 TLS 连接（curl 实测，3 次平均）</text></g>
<text x="40" y="425" font-size="13" fill="#52514e">一次 exec ≈ 本地取 token 约 0.5 秒 + GET 沙箱信息 + POST 执行命令，两次请求各要建一次连接；选近的区域能省掉将近一半</text>
</svg>