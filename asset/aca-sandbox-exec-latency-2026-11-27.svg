<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif">
<rect width="1000" height="440" fill="#fcfcfb"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">一次 aca sandbox exec 要多久</text>
<text x="40" y="70" font-size="14" fill="#52514e">本机在亚洲，命令只是 echo hi；每个区域连测 5 次。时间几乎全花在网络往返上，和沙箱本身无关</text>
<line x1="240" y1="105" x2="240" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="240" y="352" font-size="13" text-anchor="middle" fill="#52514e">0 秒</text>
<line x1="380.0" y1="105" x2="380.0" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="380.0" y="352" font-size="13" text-anchor="middle" fill="#52514e">0.5 秒</text>
<line x1="520" y1="105" x2="520" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="520" y="352" font-size="13" text-anchor="middle" fill="#52514e">1 秒</text>
<line x1="660.0" y1="105" x2="660.0" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="660.0" y="352" font-size="13" text-anchor="middle" fill="#52514e">1.5 秒</text>
<line x1="800" y1="105" x2="800" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="800" y="352" font-size="13" text-anchor="middle" fill="#52514e">2 秒</text>
<line x1="940.0" y1="105" x2="940.0" y2="330" stroke="#e7e6e2" stroke-width="1"/>
<text x="940.0" y="352" font-size="13" text-anchor="middle" fill="#52514e">2.5 秒</text>
<text x="40" y="170" font-size="15" font-weight="600" fill="#0b0b0b">centralus（美国中部）</text>
<line x1="240" y1="165" x2="940.0" y2="165" stroke="#d6d5d0" stroke-width="1"/>
<circle cx="844.8" cy="165" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="858.8" cy="165" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="797.2" cy="165" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="816.8" cy="165" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="898.0" cy="165" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
