<path d="M 399.9 157 L 407.9 165 L 399.9 173 L 391.9 165 Z" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="399.9" y="197" font-size="13" text-anchor="middle" fill="#52514e">新建一次 TLS 连接 0.57 秒</text>
<text x="40" y="280" font-size="15" font-weight="600" fill="#0b0b0b">eastasia（东亚）</text>
<line x1="240" y1="275" x2="940.0" y2="275" stroke="#d6d5d0" stroke-width="1"/>
<circle cx="592.8" cy="275" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
