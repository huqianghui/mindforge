<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="tlparticle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="tlglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes tlPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes tlFlow { to { stroke-dashoffset: -48; } }
    @keyframes tlBreathe { 0%,100% { opacity: 0.9; } 50% { opacity: 0.5; } }
    .tl-hot   { animation: tlPulse 1.8s ease-in-out infinite; }
    .tl-flow  { stroke-dasharray: 10 14; animation: tlFlow 1.2s linear infinite; }
    .tl-soft  { animation: tlBreathe 2.4s ease-in-out infinite; }
  </style>

  <!-- background -->
  <rect width="1160" height="640" rx="18" fill="url(#tlbg)"/>
  <rect x="1" y="1" width="1158" height="638" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- header -->
  <text x="36" y="42" font-size="21" font-weight="700" fill="#e2e8f0">对话轮次延迟分解：说完话 → 文本 / 语音返回（多轮中位数）</text>
  <text x="1124" y="42" font-size="13" fill="#475569" text-anchor="end">单并发 · 同 session 连续 3 轮 · 2026-09-15 实测</text>

  <!-- legend -->
  <g font-size="12" fill="#94a3b8">
    <rect x="36" y="66" width="12" height="12" rx="2" fill="#38bdf8"/>
    <text x="54" y="76">VAD 判停</text>
    <rect x="130" y="66" width="12" height="12" rx="2" fill="#2dd4bf"/>
    <text x="148" y="76">用户转写终稿（STT）</text>
    <rect x="292" y="66" width="12" height="12" rx="2" fill="#64748b"/>
    <text x="310" y="76">response.create → created（含跨洲 RTT）</text>
    <rect x="570" y="66" width="12" height="12" rx="2" fill="#fbbf24"/>
    <text x="588" y="76">首个文本 delta</text>
    <rect x="694" y="66" width="12" height="12" rx="2" fill="#f472b6"/>
    <text x="712" y="76">首段回复音频</text>
    <rect x="812" y="66" width="12" height="12" rx="2" fill="#a78bfa" opacity="0.65"/>
    <text x="830" y="76">→ response.done（回复生成完毕）</text>
  </g>

  <!-- time grid: 0..3.0s, 280 px/s, x0=210 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="210" y1="118" x2="210" y2="412"/>
    <line x1="350" y1="118" x2="350" y2="412"/>
    <line x1="490" y1="118" x2="490" y2="412"/>
    <line x1="630" y1="118" x2="630" y2="412"/>
    <line x1="770" y1="118" x2="770" y2="412"/>
    <line x1="910" y1="118" x2="910" y2="412"/>
    <line x1="1050" y1="118" x2="1050" y2="412"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="210" y="112">0s</text>
    <text x="350" y="112">0.5s</text>
    <text x="490" y="112">1.0s</text>
    <text x="630" y="112">1.5s</text>
    <text x="770" y="112">2.0s</text>
    <text x="910" y="112">2.5s</text>
    <text x="1050" y="112">3.0s</text>
  </g>

  <!-- anchor marker: 说完话 = 0s -->
  <line x1="210" y1="118" x2="210" y2="412" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  <text x="204" y="130" font-size="11" fill="#fbbf24" text-anchor="end" transform="rotate(-90 204 130)"></text>

  <!-- ── Group 1: production proxy (avatar) ─────────────────────────── -->
  <text x="36" y="142" font-size="14" font-weight="600" fill="#e2e8f0">生产环境（后端 proxy · avatar 开启 · gpt-4.1-mini）</text>
  <text x="1124" y="142" font-size="11" fill="#64748b" text-anchor="end">external persona：回复由 response.create 触发（brain=0 建模）· n=5 session</text>

  <!-- lane 轮1: VAD 0.77 STT 1.02 created 1.27 首文本 1.48 done 2.05 -->
  <text x="200" y="169" font-size="12" fill="#94a3b8" text-anchor="end">轮 1</text>
  <g>
    <rect x="210" y="154" width="215.6" height="22" fill="#38bdf8" rx="2"/>
    <rect x="425.6" y="154" width="70" height="22" fill="#2dd4bf"/>
    <rect x="495.6" y="154" width="70" height="22" fill="#64748b"/>
    <rect x="565.6" y="154" width="58.8" height="22" fill="#fbbf24"/>
    <rect x="624.4" y="154" width="159.6" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="425.6" y="150">0.77</text>
    <text x="495.6" y="150">1.02</text>
    <text x="565.6" y="150">1.27</text>
    <text x="624.4" y="150">1.48</text>
    <text x="784" y="150">2.05</text>
  </g>

  <!-- lane 轮2: 0.87 1.06 1.31 1.56 2.17 -->
  <text x="200" y="203" font-size="12" fill="#94a3b8" text-anchor="end">轮 2</text>
  <g>
    <rect x="210" y="188" width="243.6" height="22" fill="#38bdf8" rx="2"/>
    <rect x="453.6" y="188" width="53.2" height="22" fill="#2dd4bf"/>
    <rect x="506.8" y="188" width="70" height="22" fill="#64748b"/>
    <rect x="576.8" y="188" width="70" height="22" fill="#fbbf24"/>
    <rect x="646.8" y="188" width="170.8" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="453.6" y="184">0.87</text>
    <text x="506.8" y="184">1.06</text>
    <text x="576.8" y="184">1.31</text>
    <text x="646.8" y="184">1.56</text>
    <text x="817.6" y="184">2.17</text>
  </g>

  <!-- lane 轮3: 0.89 1.06 1.32 1.52 2.10 -->
  <text x="200" y="237" font-size="12" fill="#94a3b8" text-anchor="end">轮 3</text>
  <g>
    <rect x="210" y="222" width="249.2" height="22" fill="#38bdf8" rx="2"/>
    <rect x="459.2" y="222" width="47.6" height="22" fill="#2dd4bf"/>
    <rect x="506.8" y="222" width="72.8" height="22" fill="#64748b"/>
    <rect x="579.6" y="222" width="56" height="22" fill="#fbbf24"/>
    <rect x="635.6" y="222" width="162.4" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="459.2" y="218">0.89</text>
    <text x="506.8" y="218">1.06</text>
    <text x="579.6" y="218">1.32</text>
    <text x="635.6" y="218">1.52</text>
    <text x="798" y="218">2.10</text>
  </g>

  <!-- group1 particle: flows along lane1 -->
  <circle r="5" fill="url(#tlparticle)" filter="url(#tlglow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 210 165 L 784 165"/>
  </circle>

  <!-- group1 note -->
  <text x="210" y="262" font-size="11" fill="#64748b" class="tl-soft">avatar 模式：回复音频走 WebRTC 轨（WS 上无 response.audio.delta）——「数字人开口」时刻 ≈ 下方首段音频 + avatar 渲染增量，需浏览器层实测</text>

  <!-- ── Group 2: direct, no avatar ─────────────────────────────────── -->
  <text x="36" y="294" font-size="14" font-weight="600" fill="#e2e8f0">直连对照（同区域同 VAD 配置 · 无 avatar）</text>
  <text x="1124" y="294" font-size="11" fill="#64748b" text-anchor="end">VAD 自动回复（create_response=true）· 语音返回可测 · n=3 session</text>

  <!-- lane 轮1: VAD 0.77 STT/created 1.00 首文本 1.21 首音频 1.39 done 2.29 -->
  <text x="200" y="321" font-size="12" fill="#94a3b8" text-anchor="end">轮 1</text>
  <g>
    <rect x="210" y="306" width="215.6" height="22" fill="#38bdf8" rx="2"/>
    <rect x="425.6" y="306" width="64.4" height="22" fill="#2dd4bf"/>
    <rect x="490" y="306" width="58.8" height="22" fill="#fbbf24"/>
    <rect x="548.8" y="306" width="50.4" height="22" fill="#f472b6"/>
    <rect x="599.2" y="306" width="252" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="425.6" y="302">0.77</text>
    <text x="490" y="302">1.00</text>
    <text x="548.8" y="302">1.21</text>
    <text x="599.2" y="302">1.39</text>
    <text x="851.2" y="302">2.29</text>
  </g>

  <!-- lane 轮2: 0.86 1.05 首文本 1.26 首音频 1.47 done 2.69 -->
  <text x="200" y="355" font-size="12" fill="#94a3b8" text-anchor="end">轮 2</text>
  <g>
    <rect x="210" y="340" width="240.8" height="22" fill="#38bdf8" rx="2"/>
    <rect x="450.8" y="340" width="56" height="22" fill="#2dd4bf"/>
    <rect x="506.8" y="340" width="56" height="22" fill="#fbbf24"/>
    <rect x="562.8" y="340" width="58.8" height="22" fill="#f472b6"/>
    <rect x="621.6" y="340" width="341.6" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="450.8" y="336">0.86</text>
    <text x="506.8" y="336">1.05</text>
    <text x="562.8" y="336">1.26</text>
    <text x="621.6" y="336">1.47</text>
    <text x="963.2" y="336">2.69</text>
  </g>

  <!-- lane 轮3: 0.96 1.11 首文本 1.33 首音频 1.59 done 2.98 -->
  <text x="200" y="389" font-size="12" fill="#94a3b8" text-anchor="end">轮 3</text>
  <g>
    <rect x="210" y="374" width="268.8" height="22" fill="#38bdf8" rx="2"/>
    <rect x="478.8" y="374" width="42" height="22" fill="#2dd4bf"/>
    <rect x="520.8" y="374" width="61.6" height="22" fill="#fbbf24"/>
    <rect x="582.4" y="374" width="72.8" height="22" fill="#f472b6"/>
    <rect x="655.2" y="374" width="389.2" height="22" fill="#a78bfa" opacity="0.65" rx="2"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="478.8" y="370">0.96</text>
    <text x="520.8" y="370">1.11</text>
    <text x="582.4" y="370">1.33</text>
    <text x="655.2" y="370">1.59</text>
    <text x="1044.4" y="370">2.98</text>
  </g>

  <!-- group2 particle -->
  <circle r="5" fill="url(#tlparticle)" filter="url(#tlglow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 210 317 L 851 317"/>
  </circle>

  <!-- key callout: voice-to-voice TTFB -->
  <g class="tl-hot">
    <rect x="588" y="410" width="286" height="24" rx="12" fill="#f472b6" opacity="0.14" stroke="#f472b6" stroke-width="1"/>
    <text x="731" y="426" font-size="12" font-weight="600" fill="#f9a8d4" text-anchor="middle">说完话 → 听到回复：中位 ≈1.5s（1.39~1.59）</text>
  </g>

  <!-- ── bottom strips ──────────────────────────────────────────────── -->
  <line x1="36" y1="452" x2="1124" y2="452" stroke="#1e293b" stroke-width="1"/>

  <!-- session setup chain -->
  <text x="36" y="478" font-size="12" font-weight="600" fill="#94a3b8">会话建立（每 session 一次，生产中位）</text>
  <g font-size="11.5" fill="#cbd5e1">
    <rect x="340" y="462" width="128" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="404" y="478" text-anchor="middle">匿名 token 0.93s</text>
    <rect x="496" y="462" width="112" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="552" y="478" text-anchor="middle">WS 连接 0.81s</text>
    <rect x="636" y="462" width="150" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="711" y="478" text-anchor="middle">proxy.connected 0.10s</text>
    <rect x="814" y="462" width="152" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="890" y="478" text-anchor="middle">session.updated 0.14s</text>
    <text x="990" y="478" fill="#64748b">合计 ≈2.0s</text>
  </g>
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.6">
    <line x1="468" y1="474" x2="496" y2="474" class="tl-flow"/>
    <line x1="608" y1="474" x2="636" y2="474" class="tl-flow"/>
    <line x1="786" y1="474" x2="814" y2="474" class="tl-flow"/>
  </g>

  <!-- text-turn chain -->
  <text x="36" y="520" font-size="12" font-weight="600" fill="#94a3b8">文本轮对照（response.create 起算，中位）</text>
  <g font-size="11.5" fill="#cbd5e1">
    <rect x="340" y="504" width="120" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="400" y="520" text-anchor="middle">created 0.26s</text>
    <rect x="488" y="504" width="120" height="24" rx="6" fill="#12203a" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="548" y="520" text-anchor="middle">首文本 0.51s</text>
    <rect x="636" y="504" width="164" height="24" rx="6" fill="#12203a" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="718" y="520" text-anchor="middle">首音频 0.63s（直连）</text>
    <rect x="828" y="504" width="150" height="24" rx="6" fill="#12203a" stroke="#334155"/>
    <text x="903" y="520" text-anchor="middle">done 1.05 / 1.41s</text>
  </g>
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.6">
    <line x1="460" y1="516" x2="488" y2="516" class="tl-flow"/>
    <line x1="608" y1="516" x2="636" y2="516" class="tl-flow"/>
    <line x1="800" y1="516" x2="828" y2="516" class="tl-flow"/>
  </g>

  <!-- footnotes -->
  <text x="36" y="566" font-size="11" fill="#475569">锚点 0s = 候选人语音内容实时推流完毕（说完话）；100ms/块 24kHz PCM16 实时节奏推流，说完后持续静音模拟真实麦克风；条内数字为该事件的累计中位秒数</text>
  <text x="36" y="586" font-size="11" fill="#475569">客户端在开发机（跨洲连 Sweden Central，含公网 RTT）；生产组每轮回复由转写终稿瞬间发 response.create 触发（外部 brain 延迟另计）；短回复（1~2 句）口径</text>
  <text x="36" y="606" font-size="11" fill="#475569">测试脚本：backend/scripts/voice_turn_latency.py（WS 协议层，单并发；--direct 为直连无 avatar 对照）· 生产 5 session × 3 轮全部成功，直连 3 × 3 全部成功</text>
</svg>
