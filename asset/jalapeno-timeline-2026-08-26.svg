<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="pastLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="tlparticle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="tlglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes tlFlow { to { stroke-dashoffset: -64; } }
    @keyframes nowPulse {
      0%,100% { r: 13; opacity: 0.9; }
      50%     { r: 26; opacity: 0.15; }
    }
    @keyframes nowCore { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
    @keyframes beacon  { 0%,100% { opacity: 0.85; } 50% { opacity: 0.35; } }
    .tl-flow  { stroke-dasharray: 14 18; animation: tlFlow 1.4s linear infinite; }
    .now-ring { animation: nowPulse 2s ease-out infinite; }
    .now-core { animation: nowCore 2s ease-in-out infinite; }
    .beacon   { animation: beacon 2.4s ease-in-out infinite; }
  </style>

  <!-- background -->
  <rect width="1160" height="420" rx="18" fill="url(#tlbg)"/>
  <rect x="1" y="1" width="1158" height="418" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- header -->
  <text x="36" y="48" font-size="21" font-weight="700" fill="#e2e8f0">Jalapeño 时间线：OpenAI 走到了哪一步</text>
  <text x="1124" y="48" font-size="13" fill="#475569" text-anchor="end">完整周期 ≈ 2~3 年，“九个月”仅指架构设计环节</text>

  <!-- ============ main axis ============ -->
  <!-- base track -->
  <line x1="70" y1="230" x2="1090" y2="230" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- past segment: 2024 -> NOW (x=620), flowing -->
  <line x1="70" y1="230" x2="620" y2="230" stroke="url(#pastLine)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line class="tl-flow" x1="70" y1="230" x2="620" y2="230" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- future segment: dashed, dim -->
  <line x1="620" y1="230" x2="1090" y2="230" stroke="#334155" stroke-width="5" stroke-dasharray="6 12" stroke-linecap="round" opacity="0.85"/>

  <!-- moving particles on past segment -->
  <circle r="6" fill="url(#tlparticle)" filter="url(#tlglow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 70 230 H 620"/>
  </circle>
  <circle r="4.5" fill="url(#tlparticle)" filter="url(#tlglow)">
    <animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite" path="M 70 230 H 620"/>
  </circle>
  <circle r="5" fill="url(#tlparticle)" filter="url(#tlglow)">
    <animateMotion dur="4.5s" begin="3s" repeatCount="indefinite" path="M 70 230 H 620"/>
  </circle>

  <!-- year ticks -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="100" y="262">2024</text>
    <text x="280" y="262">2025</text>
    <text x="500" y="262">2026.06</text>
    <text x="590" y="262">2026.08</text>
    <text x="760" y="262">2026 年底</text>
    <text x="925" y="262">2027</text>
    <text x="1065" y="262">2028 H1</text>
  </g>

  <!-- ============ milestones: past (teal, above/below alternating) ============ -->
  <!-- 2024 -->
  <circle cx="100" cy="230" r="9" fill="#0d1424" stroke="#2dd4bf" stroke-width="3"/>
  <line x1="100" y1="219" x2="100" y2="150" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="100" y="118" font-size="14.5" font-weight="600" fill="#ccfbf1">合作立项</text>
    <text x="100" y="138" font-size="11.5" fill="#5eead4" opacity="0.85">与 Broadcom·台积电合作曝光</text>
  </g>

  <!-- 2025 -->
  <circle cx="280" cy="230" r="9" fill="#0d1424" stroke="#2dd4bf" stroke-width="3"/>
  <line x1="280" y1="241" x2="280" y2="310" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="280" y="332" font-size="14.5" font-weight="600" fill="#ccfbf1">公布长期合作</text>
    <text x="280" y="352" font-size="11.5" fill="#5eead4" opacity="0.85">宣布 2026 年开始部署的计划</text>
  </g>

  <!-- 2026.06 -->
  <circle cx="500" cy="230" r="9" fill="#0d1424" stroke="#2dd4bf" stroke-width="3"/>
  <line x1="500" y1="219" x2="500" y2="150" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="500" y="118" font-size="14.5" font-weight="600" fill="#ccfbf1">正式发布 Jalapeño</text>
    <text x="500" y="138" font-size="11.5" fill="#5eead4" opacity="0.85">样片交付 · Intelligence Processor</text>
  </g>

  <!-- ============ NOW marker: 2026.08 ============ -->
  <circle class="now-ring" cx="620" cy="230" r="13" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle class="now-core" cx="620" cy="230" r="10" fill="#fbbf24" filter="url(#tlglow)"/>
  <line x1="620" y1="217" x2="620" y2="150" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <g text-anchor="middle">
    <rect x="544" y="76" width="152" height="26" rx="13" fill="#33270a" stroke="#fbbf24" stroke-width="1.5" class="beacon"/>
    <text x="620" y="94" font-size="13" font-weight="700" fill="#fef3c7">◉ 当前位置 2026.08</text>
    <text x="620" y="124" font-size="14.5" font-weight="600" fill="#fde68a">首测结果公布</text>
    <text x="620" y="143" font-size="11.5" fill="#fcd34d" opacity="0.9">InferenceX 跑分 · 生产认证进行中</text>
  </g>

  <!-- ============ future milestones (amber/dim) ============ -->
  <!-- end 2026 -->
  <circle cx="760" cy="230" r="9" fill="#0d1424" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="241" x2="760" y2="310" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <g text-anchor="middle">
    <text x="760" y="332" font-size="14.5" font-weight="600" fill="#fde68a">开始部署（小批量）</text>
    <text x="760" y="352" font-size="11.5" fill="#d9a915">“begin deploying” ≠ 大规模量产</text>
  </g>

  <!-- 2027 -->
  <circle cx="925" cy="230" r="9" fill="#0d1424" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="925" y1="219" x2="925" y2="150" stroke="#475569" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="925" y="118" font-size="14.5" font-weight="600" fill="#94a3b8">产能 ramp</text>
    <text x="925" y="138" font-size="11.5" fill="#64748b">能否快速放量，高度不确定</text>
  </g>

  <!-- 2028 H1 -->
  <circle cx="1065" cy="230" r="9" fill="#0d1424" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="1065" y1="241" x2="1065" y2="310" stroke="#475569" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="1065" y="332" font-size="14.5" font-weight="600" fill="#94a3b8">Full tilt</text>
    <text x="1065" y="352" font-size="11.5" fill="#64748b">Hock Tan：全速量产</text>
  </g>

  <!-- ============ legend ============ -->
  <g font-size="12.5">
    <circle cx="46" cy="392" r="6" fill="#2dd4bf"/>
    <text x="60" y="397" fill="#94a3b8">已发生（公开报道确认）</text>
    <circle cx="240" cy="392" r="6" fill="#fbbf24"/>
    <text x="254" y="397" fill="#94a3b8">当前 / 官方目标</text>
    <circle cx="410" cy="392" r="6" fill="#334155"/>
    <text x="424" y="397" fill="#94a3b8">厂商预期（未验证）</text>
    <text x="1124" y="397" fill="#475569" text-anchor="end">数据来源：OpenAI · Broadcom · CNBC（2026.06–08）</text>
  </g>
</svg>
