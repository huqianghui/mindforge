<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .done { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .cur { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .plan { fill: #111827; stroke: #334155; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .h15 { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .hGray { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .tDim { fill: #64748b; font-size: 13.5px; }
      .tAmber { fill: #fcd34d; font-size: 13.5px; }
      .mono { fill: #e2e8f0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .monoDim { fill: #94a3b8; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .axisDone { stroke: #2dd4bf; stroke-width: 4; stroke-dasharray: 10 6; animation: dash 1.2s linear infinite; }
      .axisPlan { stroke: #334155; stroke-width: 3; stroke-dasharray: 6 6; }
      .nDone { fill: #0f766e; stroke: #5eead4; stroke-width: 2; }
      .nCur { fill: #92400e; stroke: #fcd34d; stroke-width: 2.4; animation: pulse 1.6s ease-in-out infinite; }
      .nPlan { fill: #1e293b; stroke: #475569; stroke-width: 2; }
      .bn { fill: #f0fdfa; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .lg { font-size: 13.5px; fill: #cbd5e1; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="640" rx="16"/>
  <text class="title" x="30" y="44">从新建到被应用调用：Standard agent 的七步</text>
  <text class="sub" x="30" y="72">青绿已完成、琥珀进行中、灰色待做（截至 2026-10-27）；问答页的第二种后端要等第 ⑦ 步</text>

  <line class="axisDone" x1="115" y1="140" x2="490" y2="140"/>
  <line class="axisPlan" x1="490" y1="140" x2="1290" y2="140"/>

  <circle class="nDone" cx="115" cy="140" r="20"/><text class="bn" x="115" y="145">1</text>
  <circle class="nDone" cx="305" cy="140" r="20"/><text class="bn" x="305" y="145">2</text>
  <circle class="nCur" cx="495" cy="140" r="20"/><text class="bn" x="495" y="145">3</text>
  <circle class="nPlan" cx="685" cy="140" r="20"/><text class="bn" x="685" y="145">4</text>
  <circle class="nPlan" cx="875" cy="140" r="20"/><text class="bn" x="875" y="145">5</text>
  <circle class="nPlan" cx="1065" cy="140" r="20"/><text class="bn" x="1065" y="145">6</text>
  <circle class="nPlan" cx="1255" cy="140" r="20"/><text class="bn" x="1255" y="145">7</text>

  <!-- cards -->
  <rect class="done" x="30" y="184" width="170" height="300" rx="10"/>
  <text class="h15" x="44" y="210">选对 harness</text>
  <text class="t" x="44" y="238">New agent 右侧</text>
  <text class="t" x="44" y="260">下拉 → Other ways</text>
  <text class="t" x="44" y="282">to build →</text>
  <text class="t" x="44" y="304">Agent（Standard）</text>
  <text class="tAmber" x="44" y="336">直接点按钮建出的</text>
  <text class="tAmber" x="44" y="358">是 GitHub Copilot</text>
  <text class="tAmber" x="44" y="380">harness</text>
  <text class="tGray" x="44" y="412">创建后不能互转</text>

  <rect class="done" x="220" y="184" width="170" height="300" rx="10"/>
  <text class="h15" x="234" y="210">命名对话框</text>
  <text class="t" x="234" y="238">展开 Agent</text>
  <text class="t" x="234" y="260">settings</text>
  <text class="t" x="234" y="292">Language 保持</text>
  <text class="t" x="234" y="314">English</text>
  <text class="t" x="234" y="346">Solution 选自建</text>
  <text class="mono" x="234" y="378">mf_MindforgeAsk</text>
  <text class="tAmber" x="234" y="410">schema name</text>
  <text class="tAmber" x="234" y="432">一次定终身</text>

  <rect class="cur" x="410" y="184" width="170" height="300" rx="10"/>
  <text class="hAmber" x="424" y="210">配置</text>
  <text class="t" x="424" y="238">选模型</text>
  <text class="t" x="424" y="260">写 Instructions：</text>
  <text class="t" x="424" y="282">只据知识源答、</text>
  <text class="t" x="424" y="304">答不了就说没有</text>
  <text class="t" x="424" y="336">加知识源：</text>
  <text class="t" x="424" y="358">先上传文件</text>
  <text class="tAmber" x="424" y="390">关掉 Web Search</text>
  <text class="tAmber" x="424" y="412">与通用知识</text>
  <text class="tGray" x="424" y="444">当前 2 个警告</text>

  <rect class="plan" x="600" y="184" width="170" height="300" rx="10"/>
  <text class="hGray" x="614" y="210">测试与发布</text>
  <text class="tGray" x="614" y="238">测试面板问几个</text>
  <text class="tGray" x="614" y="260">文章里能找到</text>
  <text class="tGray" x="614" y="282">答案的问题</text>
  <text class="tGray" x="614" y="314">看回答里引用</text>
  <text class="tGray" x="614" y="336">长什么样</text>
  <text class="tGray" x="614" y="368">Publish</text>
  <text class="tDim" x="614" y="400">草稿能否被调用</text>
  <text class="tDim" x="614" y="422">待实测</text>

  <rect class="plan" x="790" y="184" width="170" height="300" rx="10"/>
  <text class="hGray" x="804" y="210">认证与分享</text>
  <text class="tGray" x="804" y="238">Authenticate</text>
  <text class="tGray" x="804" y="260">with Microsoft</text>
  <text class="tGray" x="804" y="292">把 agent 分享给</text>
  <text class="tGray" x="804" y="314">应用的使用者</text>
  <text class="tDim" x="804" y="346">只分享应用、</text>
  <text class="tDim" x="804" y="368">不分享 agent，</text>
  <text class="tDim" x="804" y="390">问答会失败</text>

  <rect class="plan" x="980" y="184" width="170" height="300" rx="10"/>
  <text class="hGray" x="994" y="210">加数据源</text>
  <text class="monoDim" x="994" y="238">list-actions</text>
  <text class="tGray" x="994" y="260">确认动作 Allowed</text>
  <text class="monoDim" x="994" y="292">add data-source</text>
  <text class="monoDim" x="994" y="314">shared_microsoft</text>
  <text class="monoDim" x="994" y="336">copilotstudio</text>
  <text class="tDim" x="994" y="368">连接不可共享，</text>
  <text class="tDim" x="994" y="390">每人首次都要建</text>

  <rect class="plan" x="1170" y="184" width="200" height="300" rx="10"/>
  <text class="hGray" x="1184" y="210">问答页切换后端</text>
  <text class="monoDim" x="1184" y="238">ExecuteCopilot</text>
  <text class="monoDim" x="1184" y="260">AsyncV2</text>
  <text class="tGray" x="1184" y="292">Copilot 参数</text>
  <text class="tGray" x="1184" y="314">= schema name</text>
  <text class="tGray" x="1184" y="346">多轮传上一轮的</text>
  <text class="tGray" x="1184" y="368">conversationId</text>
  <text class="tDim" x="1184" y="400">对比 Work IQ：</text>
  <text class="tDim" x="1184" y="422">质量、引用、延迟</text>

  <!-- legend -->
  <rect class="plan" x="30" y="508" width="1340" height="112" rx="12"/>
  <circle class="nDone" cx="56" cy="540" r="10"/>
  <text class="lg" x="76" y="545">已完成：选对入口、命名时选好解决方案与 schema name——这两步都不可逆，所以先做、先确认</text>
  <circle class="nCur" cx="56" cy="572" r="10"/>
  <text class="lg" x="76" y="577">进行中：门户 Overview 页上配置模型、指令、知识源；Web Search 默认开着，要手动关，否则无法判断回答是否来自自己的知识源</text>
  <circle class="nPlan" cx="56" cy="604" r="10"/>
  <text class="lg" x="76" y="609">待做：④–⑦ 跨两个产品——前两步在 Copilot Studio 门户，后两步在应用仓库里用 ms CLI，分享要在两边各做一次</text>
</svg>
