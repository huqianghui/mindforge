<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 900" width="1340" height="900" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .boxGray { fill: #111827; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .zone { fill: #0d1729; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13px; }
      .tGray { fill: #94a3b8; font-size: 13px; }
      .fit { fill: #5eead4; font-size: 13px; }
      .bill { fill: #fcd34d; font-size: 13px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #a7f3d0; font-size: 13px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>

  <rect class="bg" width="1340" height="900" rx="16"/>
  <text class="title" x="30" y="44">一个任务的流转：从哪里发起、在哪里执行、怎样回到 PR</text>
  <text class="sub" x="30" y="70">session 与执行位置解耦：入口只决定"在哪儿说话"，执行位置决定"能碰到什么、用谁的身份、关机后还跑不跑"</text>

  <!-- ===== A 入口 ===== -->
  <rect class="zone" x="20" y="92" width="232" height="600" rx="12"/>
  <text class="zl" x="36" y="118">发起 / 接续</text>

  <rect class="box" x="36" y="132" width="200" height="92" rx="10"/>
  <text class="h" x="50" y="158">Mobile / Slack / Teams</text>
  <text class="t" x="50" y="182">语音、截图、聊天线程</text>
  <text class="tGray" x="50" y="204">站会上随手派活</text>

  <rect class="box" x="36" y="236" width="200" height="92" rx="10"/>
  <text class="h" x="50" y="262">github.com</text>
  <text class="t" x="50" y="286">从 Issue / PR 页面发起</text>
  <text class="tGray" x="50" y="308">当前页面自动成上下文</text>

  <rect class="box" x="36" y="340" width="200" height="92" rx="10"/>
  <text class="h" x="50" y="366">Copilot CLI</text>
  <text class="t" x="50" y="390">copilot / copilot --cloud</text>
  <text class="tGray" x="50" y="412">-p 可放进脚本</text>

  <rect class="box" x="36" y="444" width="200" height="92" rx="10"/>
  <text class="h" x="50" y="470">VS Code Agents 窗口</text>
  <text class="t" x="50" y="494">编辑器与 Agents 同步</text>
  <text class="tGray" x="50" y="516">多模型并跑 + Judge</text>

  <rect class="boxAmber" x="36" y="548" width="200" height="128" rx="10"/>
  <text class="hAmber" x="50" y="574">Copilot app</text>
  <text class="t" x="50" y="598">Project：多仓库或无仓库</text>
  <text class="t" x="50" y="620">按需起多个 agent</text>
  <text class="t" x="50" y="642">Computer Use 走本机</text>
  <text class="tGray" x="50" y="664">需要人时主动 check in</text>

  <!-- A → B -->
  <path class="flow" d="M 252 392 L 300 392" marker-end="url(#arr)"/>
  <circle class="badge" cx="276" cy="370" r="12"/><text class="bn" x="276" y="375">1</text>

  <!-- ===== B Session ===== -->
  <rect class="boxAmber" x="304" y="200" width="270" height="384" rx="12"/>
  <text class="hAmber" x="322" y="230">同一个 session</text>
  <text class="t" x="322" y="258">各入口看到同一份会话列表</text>
  <text class="t" x="322" y="282">云沙箱关闭时存快照</text>
  <text class="t" x="322" y="306">从任意入口恢复、继续 steer</text>
  <text class="h" x="322" y="344">权限边界</text>
  <text class="t" x="322" y="370">默认只作用于一个组织</text>
  <text class="t" x="322" y="394">访问组织数据要走 SSO</text>
  <text class="t" x="322" y="418">无写权限的仓库自动只读</text>
  <text class="t" x="322" y="442">需审批的工具调用先问人</text>
  <text class="h" x="322" y="480">上下文</text>
  <text class="t" x="322" y="506">Memory、代码搜索</text>
  <text class="t" x="322" y="530">MCP、Connectors、Skills</text>
  <text class="tGray" x="322" y="560">企业 MCP 白名单同样生效</text>

  <!-- B → C -->
  <path class="flow" d="M 574 392 L 622 392" marker-end="url(#arr)"/>
  <circle class="badge" cx="598" cy="370" r="12"/><text class="bn" x="598" y="375">2</text>

  <!-- ===== C 执行位置 ===== -->
  <rect class="zone" x="626" y="92" width="404" height="600" rx="12"/>
  <text class="zl" x="642" y="118">执行位置怎么选</text>

  <rect class="box" x="642" y="132" width="372" height="128" rx="10"/>
  <text class="h" x="658" y="158">本地沙箱（CLI / app / VS Code）</text>
  <text class="t" x="658" y="182">命令在本机跑，MXC 限文件、网络、凭据</text>
  <text class="fit" x="658" y="206">适合：要本机工具链、GUI、Computer Use</text>
  <text class="bill" x="658" y="230">限制：策略可经 MDM 强制，开发者不能削弱</text>
  <text class="tGray" x="658" y="250">合上电脑，任务就停</text>

  <rect class="box" x="642" y="272" width="372" height="128" rx="10"/>
  <text class="h" x="658" y="298">远程 Agent Host（自有机器 / VM）</text>
  <text class="t" x="658" y="322">SSH、dev tunnel 或 --environment-host</text>
  <text class="fit" x="658" y="346">适合：大算力、内网依赖、手机遥控</text>
  <text class="bill" x="658" y="370">限制：机器、网络与依赖由自己维护</text>
  <text class="tGray" x="658" y="390">机器和 Agent Host 必须一直开着</text>

  <rect class="boxAmber" x="642" y="412" width="372" height="128" rx="10"/>
  <text class="hAmber" x="658" y="438">云沙箱（默认）</text>
  <text class="t" x="658" y="462">GitHub 托管 micro-VM，快照恢复，无 1 小时上限</text>
  <text class="fit" x="658" y="486">适合：长任务、离开电脑也要跑、多端接力</text>
  <text class="bill" x="658" y="510">隔离：每个 session 一台 micro-VM</text>
  <text class="tGray" x="658" y="530">用自托管 runner 时仍要走 Actions 环境</text>

  <rect class="box" x="642" y="552" width="372" height="128" rx="10"/>
  <text class="h" x="658" y="578">Actions（Automations / Agentic Workflows）</text>
  <text class="t" x="658" y="602">事件 / API 触发，Markdown 编译成 Actions</text>
  <text class="fit" x="658" y="626">适合：Issue 分流、CI 失败分析等团队流程</text>
  <text class="bill" x="658" y="650">安全：默认只读 + 防火墙 + safe outputs</text>
  <text class="tGray" x="658" y="670">动作署名为 Copilot，不是某个人</text>

  <!-- C → D -->
  <path class="flow" d="M 1030 392 L 1078 392" marker-end="url(#arr)"/>
  <circle class="badge" cx="1054" cy="370" r="12"/><text class="bn" x="1054" y="375">3</text>

  <!-- ===== D 回到 PR ===== -->
  <rect class="zone" x="1082" y="92" width="238" height="600" rx="12"/>
  <text class="zl" x="1098" y="118">回到平台</text>

  <rect class="box" x="1098" y="132" width="206" height="100" rx="10"/>
  <text class="h" x="1112" y="158">Draft PR / artifact</text>
  <text class="t" x="1112" y="182">计划、调研挂到 Issue</text>
  <text class="tGray" x="1112" y="204">gh --attach 附截图证据</text>

  <path class="flow" d="M 1201 232 L 1201 262" marker-end="url(#arr)"/>

  <rect class="box" x="1098" y="266" width="206" height="100" rx="10"/>
  <text class="h" x="1112" y="292">Copilot code review</text>
  <text class="t" x="1112" y="316">Lite / Balanced / Max</text>
  <text class="tGray" x="1112" y="338">可审批合格的 PR</text>

  <path class="flow" d="M 1201 366 L 1201 396" marker-end="url(#arr)"/>
  <circle class="badge" cx="1230" cy="381" r="12"/><text class="bn" x="1230" y="386">4</text>

  <rect class="box" x="1098" y="400" width="206" height="100" rx="10"/>
  <text class="h" x="1112" y="426">Agent Merge</text>
  <text class="t" x="1112" y="450">盯 CI 失败与合并冲突</text>
  <text class="tGray" x="1112" y="472">自动修，可配 auto-merge</text>

  <path class="flow" d="M 1201 500 L 1201 530" marker-end="url(#arr)"/>

  <rect class="boxAmber" x="1098" y="534" width="206" height="142" rx="10"/>
  <text class="hAmber" x="1112" y="560">人审查并合并</text>
  <text class="t" x="1112" y="584">rulesets、必需检查</text>
  <text class="t" x="1112" y="608">Proof of Presence：</text>
  <text class="t" x="1112" y="630">关键审批再走 IdP 认证</text>
  <text class="tGray" x="1112" y="656">（预览）</text>

  <!-- ⑤ 回流：合并结果 → 洞察 -->
  <path class="flowAmber" d="M 1201 676 L 1201 726 L 140 726 L 140 692" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="670" cy="726" r="12"/><text class="bn" x="670" y="731">5</text>

  <!-- 粒子 -->
  <circle r="4" fill="#5eead4"><animateMotion dur="4s" repeatCount="indefinite" path="M 252 392 L 300 392 M 574 392 L 622 392 M 1030 392 L 1078 392"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="3s" repeatCount="indefinite" path="M 1201 232 L 1201 530"/></circle>
  <circle r="4" fill="#fcd34d"><animateMotion dur="5s" repeatCount="indefinite" path="M 1201 676 L 1201 726 L 140 726 L 140 692"/></circle>

  <!-- ===== 图例 ===== -->
  <text class="h" x="30" y="772">编号说明</text>
  <text class="el" x="30" y="798">① 从任一入口发起任务，或接续别处开始的 session</text>
  <text class="el" x="680" y="798">② session 带着权限边界和上下文，被派到某个执行位置</text>
  <text class="el" x="30" y="824">③ 执行产出 draft PR 或 Issue artifact，而不是直接改主干</text>
  <text class="el" x="680" y="824">④ AI review 与 Agent Merge 处理机械问题，人只看判断性问题</text>
  <text class="el" x="30" y="850">⑤ PR 结果（agentic 用户的合并率等）进入 impact dashboard，反过来指导推广</text>
  <text class="tGray" x="30" y="878">青绿 = 适用场景；琥珀 = 隔离与限制。执行位置和入口不是一一绑定的：CLI 可以 --cloud，云会话也能从 VS Code 接着改</text>
</svg>
