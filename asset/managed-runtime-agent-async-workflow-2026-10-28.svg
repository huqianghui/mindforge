<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .zone { fill: none; stroke: #334155; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .zt { fill: #94a3b8; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .plan { fill: #111827; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .done { fill: #0f2a2a; stroke: #5eead4; stroke-width: 2; }
      .open { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.2s ease-in-out infinite; }
      .bad { fill: #2a1215; stroke: #f87171; stroke-width: 1.6; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hT { fill: #99f6e4; font-size: 15px; font-weight: 600; }
      .hA { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .hR { fill: #fca5a5; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tG { fill: #94a3b8; font-size: 13.5px; }
      .tA { fill: #fcd34d; font-size: 13.5px; }
      .tR { fill: #fca5a5; font-size: 13.5px; }
      .tT { fill: #5eead4; font-size: 13.5px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .fP { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .num { fill: #334155; stroke: #94a3b8; stroke-width: 1.6; }
      .nt { fill: #f8fafc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .bar1 { fill: #334155; }
      .bar2 { fill: #475569; }
      .bar3 { fill: #64748b; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" rx="16"/>
  <text class="title" x="30" y="44">经 workflow 中转调用 agent：把"等回答"挪到服务端（未实测）</text>
  <text class="sub" x="30" y="72">灰色虚线 = 规划中的步骤；琥珀色 = 还没解决、决定能否落地的问题；红色 = 已确认不可用</text>

  <!-- zones -->
  <rect class="zone" x="24" y="92" width="330" height="420" rx="12"/>
  <text class="zt" x="40" y="118">浏览器 · managed app</text>
  <rect class="zone" x="380" y="92" width="460" height="420" rx="12"/>
  <text class="zt" x="396" y="118">共享存储 · 应用与 workflow 都能读写</text>
  <rect class="zone" x="866" y="92" width="510" height="420" rx="12"/>
  <text class="zt" x="882" y="118">服务端 · Power Automate / Copilot Studio</text>

  <!-- app -->
  <rect class="plan" x="40" y="136" width="298" height="150" rx="9"/>
  <circle class="num" cx="62" cy="160" r="11"/><text class="nt" x="62" y="165">1</text>
  <text class="h" x="82" y="165">写一行"待答"</text>
  <text class="t" x="56" y="194">问题 + 本地检索出的 SOURCES</text>
  <text class="t" x="56" y="216">状态 = pending，记下行 id</text>
  <text class="tG" x="56" y="246">经数据 Connector 写入</text>
  <text class="tG" x="56" y="268">（同步、一次性返回，可行）</text>

  <rect class="plan" x="40" y="312" width="298" height="182" rx="9"/>
  <circle class="num" cx="62" cy="336" r="11"/><text class="nt" x="62" y="341">4</text>
  <text class="h" x="82" y="341">轮询这一行</text>
  <text class="t" x="56" y="370">每隔几秒读一次状态</text>
  <text class="t" x="56" y="392">answered → 解析 [n] / RELATED</text>
  <text class="t" x="56" y="414">渲染成原文链接</text>
  <text class="tG" x="56" y="444">要有超时与"仍在处理"提示</text>
  <text class="tG" x="56" y="466">页面关掉，结果仍留在表里</text>

  <!-- storage -->
  <rect class="open" x="396" y="136" width="428" height="150" rx="9"/>
  <text class="hA" x="412" y="162">问题写到哪里？决定这条路能否落地</text>
  <text class="t" x="412" y="190">要求：应用能写入、能读回，且新增行</text>
  <text class="t" x="412" y="212">能触发 workflow</text>
  <text class="tA" x="412" y="244">SharePoint 列表：写入是否可用，待实测</text>
  <text class="tG" x="412" y="268">（触发器"新增项时"是现成的）</text>

  <rect class="bad" x="396" y="300" width="208" height="194" rx="9"/>
  <text class="hR" x="412" y="326">Dataverse 表</text>
  <text class="t" x="412" y="354">有"新增行"触发器</text>
  <text class="tR" x="412" y="382">写入动作被 DLP</text>
  <text class="tR" x="412" y="404">屏蔽（本租户）</text>
  <text class="tG" x="412" y="436">要先请管理员</text>
  <text class="tG" x="412" y="458">放开写入</text>

  <rect class="bad" x="616" y="300" width="208" height="194" rx="9"/>
  <text class="hR" x="632" y="326">App state</text>
  <text class="t" x="632" y="354">读写都通、按用户</text>
  <text class="t" x="632" y="376">隔离</text>
  <text class="tR" x="632" y="404">同源存储，</text>
  <text class="tR" x="632" y="426">触发不了 workflow</text>
  <text class="tG" x="632" y="458">只适合本应用自用</text>

  <!-- server -->
  <rect class="plan" x="882" y="136" width="478" height="150" rx="9"/>
  <circle class="num" cx="904" cy="160" r="11"/><text class="nt" x="904" y="165">2</text>
  <text class="h" x="924" y="165">workflow："新增行"触发 → agent 节点</text>
  <text class="t" x="898" y="194">服务端能挂起等待，回调式动作在这里可用</text>
  <text class="tT" x="898" y="222">Standard：Connector 动作本就为此设计</text>
  <text class="tT" x="898" y="246">GitHub Copilot：官方唯一的调用方式</text>
  <text class="tA" x="898" y="270">Copilot Chat agent 能否被指定：未查证</text>

  <rect class="plan" x="882" y="312" width="478" height="182" rx="9"/>
  <circle class="num" cx="904" cy="336" r="11"/><text class="nt" x="904" y="341">3</text>
  <text class="h" x="924" y="341">把回答写回同一行</text>
  <text class="t" x="898" y="370">answer = agent 的回答文本</text>
  <text class="t" x="898" y="392">状态 = answered（失败写 error）</text>
  <text class="t" x="898" y="420">agent 的指令、模型、Web Search</text>
  <text class="t" x="898" y="442">在这里才真正生效</text>
  <text class="tG" x="898" y="472">workflow 用谁的身份调 agent，要另行设计</text>

  <!-- flows -->
  <path class="fP" d="M338,210 L396,210"/>
  <path class="fP" d="M824,210 L882,210"/>
  <path class="fP" d="M1120,286 L1120,312"/>
  <path class="fP" d="M882,404 C850,404 850,250 824,250"/>
  <path class="fP" d="M396,250 C370,250 364,404 338,404"/>
  <circle r="5" fill="#94a3b8"><animateMotion dur="5s" repeatCount="indefinite" path="M338,210 L882,210 L1120,286 L1120,312 L882,404 C850,404 850,250 824,250 L396,250 C370,250 364,404 338,404"/></circle>

  <!-- time budget -->
  <rect class="zone" x="24" y="530" width="1352" height="150" rx="12"/>
  <text class="zt" x="40" y="556">一次提问的时间预算（agent 耗时为实测，其余未测）</text>
  <rect class="bar1" x="40" y="574" width="120" height="34" rx="5"/>
  <text class="t" x="52" y="596">触发延迟</text>
  <rect class="bar2" x="164" y="574" width="520" height="34" rx="5"/>
  <text class="t" x="180" y="596">agent 生成 25 秒以上（含网页检索时更久）</text>
  <rect class="bar3" x="688" y="574" width="180" height="34" rx="5"/>
  <text class="t" x="700" y="596">写回 + 轮询间隔</text>
  <text class="tA" x="890" y="596">合计约半分钟到一分钟</text>
  <text class="t" x="40" y="640">对比：同步的 Azure OpenAI 4–8 秒、Work IQ 15–26 秒。这个延迟不适合"问答"，更适合"提交一个任务、稍后看结果"——</text>
  <text class="t" x="40" y="664">例如定时整理知识库、生成周报，这类工作本来就应该和页面解耦。</text>

  <!-- legend -->
  <rect class="zone" x="24" y="696" width="1352" height="108" rx="12"/>
  <text class="lg" x="44" y="724">① 应用只做同步的数据写入，避开了回调式动作；② workflow 在服务端挂起等待，harness 基本不再是限制</text>
  <text class="lg" x="44" y="750">③ 回答写回同一行，状态字段让页面知道何时可读；④ 轮询把异步结果变回页面上的一条回答</text>
  <text class="lg" x="44" y="776">落地前要先回答琥珀色那一格：找到一个应用能写、能触发 workflow 的存储，否则整条链路起不来</text>
</svg>
