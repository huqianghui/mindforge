<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .zone { fill: none; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .h15 { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .tAmber { fill: #fcd34d; font-size: 13.5px; }
      .mono { fill: #e2e8f0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #a7f3d0; font-size: 13.5px; }
      .elA { fill: #fde68a; font-size: 13.5px; }
      .chipS { fill: #1e3a8a; stroke: #60a5fa; }
      .chipH { fill: none; stroke: #64748b; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="960" rx="16"/>
  <text class="title" x="30" y="44">一次提问的完整路径：检索在应用里，生成在 Microsoft 365 Copilot</text>
  <text class="sub" x="30" y="72">青绿是浏览器里的本地步骤（毫秒级），琥珀是经 Connector 的那一跳（每次 15–20 秒，首次连同授权 74 秒）</text>

  <!-- ===== 浏览器 ===== -->
  <rect class="zone" x="20" y="96" width="700" height="630" rx="12"/>
  <text class="zl" x="36" y="122">浏览器 · 应用代码（不需要任何 Connector）</text>

  <rect class="box" x="40" y="140" width="320" height="150" rx="10"/>
  <text class="h15" x="56" y="166">切词</text>
  <text class="t" x="56" y="192">英文按词，中文按相邻两字（二元组）</text>
  <text class="t" x="56" y="216">去掉"什么""如何"这类问句虚词</text>
  <text class="tGray" x="56" y="242">不引入分词库，bundle 不变大</text>
  <text class="mono" x="56" y="270">"A2UI 和 AG-UI 区别"</text>

  <rect class="box" x="380" y="140" width="320" height="150" rx="10"/>
  <text class="h15" x="396" y="166">给文章打分，取前 5</text>
  <text class="t" x="396" y="192">每个词：idf × 字段权重 × 命中次数</text>
  <text class="mono" x="396" y="218">标题 4 · 标签 3 · 描述 2</text>
  <text class="mono" x="396" y="240">标题行 2 · 开头段 1</text>
  <text class="tGray" x="396" y="268">索引 386 篇约 530 KB，按需加载</text>

  <rect class="box" x="40" y="320" width="320" height="150" rx="10"/>
  <text class="h15" x="56" y="346">拉正文、挑段落</text>
  <text class="t" x="56" y="372">按标题切段，每篇挑最相关 2 段</text>
  <text class="t" x="56" y="396">去掉代码块和图片</text>
  <text class="t" x="56" y="420">每段 ≤ 900 字，每篇 ≤ 1600 字</text>
  <text class="tGray" x="56" y="446">都不相关就取开头一段</text>

  <rect class="box" x="380" y="320" width="320" height="150" rx="10"/>
  <text class="h15" x="396" y="346">拼提示词</text>
  <text class="t" x="396" y="372">只用 SOURCES；答不了就说没有</text>
  <text class="t" x="396" y="396">按提问语言；≤ 300 字；不用表格</text>
  <text class="t" x="396" y="420">行内 [n]；最后一行 RELATED: n</text>
  <text class="tGray" x="396" y="446">附最近 2 轮问答，每轮答 ≤ 400 字</text>

  <rect class="box" x="40" y="500" width="660" height="206" rx="10"/>
  <text class="h15" x="56" y="526">解析与渲染</text>
  <text class="t" x="56" y="552">逐层解包回答（见下一张图）→ 去掉 RELATED 行、取出 1..N 的编号</text>
  <text class="t" x="56" y="576">正文里的 [n] 和下方引用标签都渲染成应用内原文链接</text>
  <rect class="chipS" x="56" y="596" width="150" height="28" rx="14"/>
  <text x="70" y="615" fill="#dbeafe" font-size="13px">1. 用到的来源</text>
  <rect class="chipS" x="214" y="596" width="150" height="28" rx="14"/>
  <text x="228" y="615" fill="#dbeafe" font-size="13px">2. 用到的来源</text>
  <rect class="chipH" x="372" y="596" width="190" height="28" rx="14"/>
  <text x="386" y="615" fill="#94a3b8" font-size="13px">5. 检索到但没用上</text>
  <text class="tGray" x="56" y="652">实心 = 出现在 RELATED 里；空心 = 检索到但模型没用</text>
  <text class="tGray" x="56" y="676">模型没守约（没有 RELATED 行）时，照样列出全部检索结果</text>

  <path class="flow" d="M360,215 L376,215" marker-end="url(#arr)"/>
  <circle class="badge" cx="368" cy="196" r="11"/><text class="bn" x="368" y="201">1</text>
  <path class="flow" d="M540,290 C540,305 200,300 200,316" marker-end="url(#arr)"/>
  <circle class="badge" cx="370" cy="302" r="11"/><text class="bn" x="370" y="307">2</text>
  <path class="flow" d="M360,395 L376,395" marker-end="url(#arr)"/>
  <circle class="badge" cx="368" cy="376" r="11"/><text class="bn" x="368" y="381">3</text>

  <!-- ===== 宿主 ===== -->
  <rect class="zone" x="750" y="96" width="250" height="630" rx="12"/>
  <text class="zl" x="766" y="122">宿主 + API Hub</text>
  <rect class="boxAmber" x="766" y="320" width="218" height="190" rx="10"/>
  <text class="hAmber" x="782" y="346">http/send</text>
  <text class="t" x="782" y="372">校验 apiId 与连接</text>
  <text class="t" x="782" y="396">注入当前用户凭据</text>
  <text class="t" x="782" y="420">单次约 120 秒上限</text>
  <text class="tGray" x="782" y="448">首次调用弹出授权：</text>
  <text class="tGray" x="782" y="470">"Allow … to access</text>
  <text class="tGray" x="782" y="492">your data?"</text>

  <rect class="boxGray" x="766" y="540" width="218" height="166" rx="10"/>
  <text class="h15" x="782" y="566">界面上的等待</text>
  <text class="t" x="782" y="592">发送后显示加载态</text>
  <text class="t" x="782" y="616">超过 10 秒显示</text>
  <text class="t" x="782" y="640">"仍在处理"</text>
  <text class="tGray" x="782" y="668">回答下方标出耗时</text>
  <text class="tGray" x="782" y="690">（如"引用 · 15.0 秒"）</text>

  <!-- ===== 后端 ===== -->
  <rect class="zone" x="1030" y="96" width="350" height="630" rx="12"/>
  <text class="zl" x="1046" y="122">Work IQ → Microsoft 365 Copilot</text>
  <rect class="boxAmber" x="1046" y="140" width="318" height="170" rx="10"/>
  <text class="hAmber" x="1062" y="166">Work IQ Copilot MCP</text>
  <text class="t" x="1062" y="192">Connector 动作，body 是 MCP</text>
  <text class="t" x="1062" y="216">JSON-RPC，直接 tools/call，</text>
  <text class="t" x="1062" y="240">不需要先 initialize</text>
  <text class="mono" x="1062" y="268">name: copilot_chat</text>
  <text class="mono" x="1062" y="290">arguments: { message }</text>

  <rect class="boxBlue" x="1046" y="340" width="318" height="170" rx="10"/>
  <text class="h15" x="1062" y="366">Graph Copilot Chat API</text>
  <text class="t" x="1062" y="392">以当前用户身份调用</text>
  <text class="t" x="1062" y="416">每次调用新开一个会话</text>
  <text class="t" x="1062" y="440">多轮靠提示词里的历史</text>
  <text class="tGray" x="1062" y="468">模型由 M365 Copilot 决定</text>
  <text class="tGray" x="1062" y="490">提示词要求不搜邮件和网页</text>

  <rect class="boxGray" x="1046" y="540" width="318" height="166" rx="10"/>
  <text class="h15" x="1062" y="566">不需要的东西</text>
  <text class="tGray" x="1062" y="592">不建 Copilot Studio agent</text>
  <text class="tGray" x="1062" y="616">不上传知识源、不等索引</text>
  <text class="tGray" x="1062" y="640">来源由应用检索决定，</text>
  <text class="tGray" x="1062" y="664">所以引用是结构化的</text>

  <path class="flowAmber" d="M700,420 L762,420" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="731" cy="400" r="11"/><text class="bn" x="731" y="405">4</text>
  <path class="flowAmber" d="M984,360 C1010,360 1010,225 1042,225" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="1015" cy="300" r="11"/><text class="bn" x="1015" y="305">5</text>
  <path class="flowAmber" d="M1205,310 L1205,336" marker-end="url(#arrAmber)"/>
  <path class="flowAmber" d="M1046,480 C1020,500 1010,525 990,525 L704,525" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="880" cy="525" r="11"/><text class="bn" x="880" y="530">6</text>

  <!-- 图例 -->
  <rect class="boxGray" x="20" y="746" width="1360" height="194" rx="12"/>
  <text class="h15" x="40" y="774">编号说明</text>
  <circle class="badge" cx="52" cy="804" r="11"/><text class="bn" x="52" y="809">1</text>
  <text class="el" x="72" y="809">切出来的词去索引里打分；从文章页"就这篇提问"进来时，当前文章固定排第一</text>
  <circle class="badge" cx="52" cy="836" r="11"/><text class="bn" x="52" y="841">2</text>
  <text class="el" x="72" y="841">只对前 5 篇拉正文，在段落级再按同样的打分挑最相关的段</text>
  <circle class="badge" cx="52" cy="868" r="11"/><text class="bn" x="52" y="873">3</text>
  <text class="el" x="72" y="873">编号段落 + 输出协议 + 最近两轮问答拼成一段提示词，检索结果就是引用来源</text>
  <circle class="badgeAmber" cx="52" cy="900" r="11"/><text class="bn" x="52" y="905">4</text>
  <text class="elA" x="72" y="905">生成的 Service 经 SDK 交给宿主；这是整条路径里唯一出应用域名的一跳</text>
  <circle class="badgeAmber" cx="732" cy="804" r="11"/><text class="bn" x="732" y="809">5</text>
  <text class="elA" x="752" y="809">API Hub 把 JSON-RPC 送到 Work IQ，后者调用 Graph 的 Copilot Chat API</text>
  <circle class="badgeAmber" cx="732" cy="836" r="11"/><text class="bn" x="732" y="841">6</text>
  <text class="elA" x="752" y="841">回答以多层包装的文本返回应用，逐层解包后渲染引用</text>
  <text class="tGray" x="752" y="876">宿主里的 ms app dev 可以跑通整条路径；</text>
  <text class="tGray" x="752" y="900">纯 Vite 下问答页只做检索，并提示需在宿主中运行</text>
</svg>
