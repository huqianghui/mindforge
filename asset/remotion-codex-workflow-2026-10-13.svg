<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .t { font-size: 15px; fill: #e2e8f0; }
    .s { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 18px; fill: #e2e8f0; font-weight: 600; }
    .sec { font-size: 13px; fill: #64748b; letter-spacing: .05em; }
    .box { fill: #111c33; stroke: #2dd4bf; stroke-width: 1.5; }
    .boxa { fill: #1f1a0e; stroke: #fbbf24; stroke-width: 1.5; }
    .boxp { fill: #0f172a; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .flow { stroke: #2dd4bf; stroke-width: 2.5; fill: none; stroke-dasharray: 10 12; animation: dash 1.6s linear infinite; }
    .back { stroke: #fbbf24; stroke-width: 2.5; fill: none; stroke-dasharray: 10 12; animation: dash 1.6s linear infinite; }
    .plan { stroke: #334155; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    @keyframes dash { to { stroke-dashoffset: -44; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="500" rx="14" fill="#0f172a"/>
  <text x="28" y="36" class="h">在 Codex 中使用 Remotion：视觉闭环与三种渲染输出</text>
  <text x="28" y="60" class="s">Codex 负责写代码，内置浏览器负责看效果，Remotion 负责渲染视频</text>

  <text x="40" y="92" class="sec">开发与预览（视觉闭环）</text>
  <!-- top row -->
  <rect x="40" y="104" width="240" height="78" rx="10" class="box"/>
  <text x="160" y="137" class="t" text-anchor="middle">Codex Desktop</text>
  <text x="160" y="160" class="s" text-anchor="middle">Remotion Plugin（含 Skills）</text>

  <rect x="340" y="104" width="240" height="78" rx="10" class="box"/>
  <text x="460" y="137" class="t" text-anchor="middle">Remotion 项目</text>
  <text x="460" y="160" class="s" text-anchor="middle">React 组件 + 素材</text>

  <rect x="640" y="104" width="240" height="78" rx="10" class="box"/>
  <text x="760" y="137" class="t" text-anchor="middle">Remotion Studio</text>
  <text x="760" y="160" class="s" text-anchor="middle">npm run dev → localhost</text>

  <rect x="940" y="104" width="220" height="78" rx="10" class="boxa"/>
  <text x="1050" y="137" class="t" text-anchor="middle">内置浏览器</text>
  <text x="1050" y="160" class="s" text-anchor="middle">播放预览、检查画面</text>

  <path d="M280,143 L336,143" class="flow" marker-end="url(#at)"/>
  <path d="M580,143 L636,143" class="flow" marker-end="url(#at)"/>
  <path d="M880,143 L936,143" class="flow" marker-end="url(#at)"/>
  <text x="308" y="132" class="s" text-anchor="middle">写代码</text>
  <text x="908" y="132" class="s" text-anchor="middle">打开</text>

  <!-- feedback loop -->
  <path d="M1050,182 L1050,222 L160,222 L160,186" class="back" marker-end="url(#aa)"/>
  <circle r="6" fill="#fbbf24">
    <animateMotion dur="4s" repeatCount="indefinite" path="M1050,182 L1050,222 L160,222 L160,186"/>
  </circle>
  <text x="605" y="244" class="t" text-anchor="middle" style="fill:#fbbf24">发现节奏、布局、转场问题 → 修改代码 → 再次预览</text>

  <line x1="28" y1="268" x2="1172" y2="268" stroke="#1e293b"/>
  <text x="40" y="294" class="sec">渲染输出（三条路径）</text>

  <!-- outputs -->
  <rect x="40" y="306" width="340" height="96" rx="10" class="box"/>
  <text x="210" y="336" class="t" text-anchor="middle">CLI 渲染　npx remotion render</text>
  <text x="210" y="360" class="s" text-anchor="middle">本机或服务器启动 Chromium 逐帧截图</text>
  <text x="210" y="380" class="s" text-anchor="middle">FFmpeg 编码，适合批量与自动化</text>

  <rect x="430" y="306" width="340" height="96" rx="10" class="box"/>
  <text x="600" y="336" class="t" text-anchor="middle">浏览器端渲染　Render in browser</text>
  <text x="600" y="360" class="s" text-anchor="middle">在浏览器内用 WebCodecs 编码</text>
  <text x="600" y="380" class="s" text-anchor="middle">无需服务器，仅支持部分 HTML 元素</text>

  <rect x="820" y="306" width="340" height="96" rx="10" class="boxp"/>
  <text x="990" y="336" class="t" text-anchor="middle">云端渲染　Remotion Lambda</text>
  <text x="990" y="360" class="s" text-anchor="middle">按帧段拆分到多个函数并行渲染</text>
  <text x="990" y="380" class="s" text-anchor="middle">适合大规模、对外提供的视频服务</text>

  <path d="M460,286 L210,286 L210,302" class="flow" marker-end="url(#at)"/>
  <path d="M460,286 L600,286 L600,302" class="flow" marker-end="url(#at)"/>
  <path d="M600,286 L990,286 L990,302" class="plan" marker-end="url(#ag)"/>

  <!-- mp4 -->
  <rect x="510" y="434" width="180" height="44" rx="22" fill="#0b3b36" stroke="#2dd4bf" stroke-width="1.5" class="pulse"/>
  <text x="600" y="462" class="t" text-anchor="middle">MP4 / 图片 / 音频</text>
  <path d="M210,402 L210,456 L506,456" class="flow" marker-end="url(#at)"/>
  <path d="M600,402 L600,430" class="flow" marker-end="url(#at)"/>
  <path d="M990,402 L990,456 L694,456" class="plan" marker-end="url(#ag)"/>
</svg>
