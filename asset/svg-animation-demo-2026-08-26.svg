<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="dparticle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="dglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dhalo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    @keyframes demoDash { to { stroke-dashoffset: -76; } }
    @keyframes demoPulse { 0%,100% { opacity: 0.12; } 50% { opacity: 0.65; } }
    .demo-flow { stroke-dasharray: 18 20; animation: demoDash 1.5s linear infinite; }
    .demo-halo { animation: demoPulse 1.8s ease-in-out infinite; }
  </style>

  <rect width="1160" height="300" rx="18" fill="url(#dbg)"/>
  <rect x="1" y="1" width="1158" height="298" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="19" font-weight="700" fill="#e2e8f0">动态 SVG 三个核心技巧</text>
  <text x="270" y="44" font-size="13" fill="#475569">纯 SMIL + CSS，无 JavaScript · 对照本文源码学习</text>

  <!-- panel separators -->
  <line x1="400" y1="70" x2="400" y2="270" stroke="#1e293b" stroke-width="1"/>
  <line x1="780" y1="70" x2="780" y2="270" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== Panel 1: flowing dash ===== -->
  <text x="200" y="92" font-size="15" font-weight="600" fill="#5eead4" text-anchor="middle">① 流动光带</text>
  <path d="M 60 160 H 340" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="demo-flow" d="M 60 160 H 340" fill="none" stroke="#14b8a6" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path class="demo-flow" d="M 60 160 H 340" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.9" stroke-dasharray="4 34"/>
  <text x="200" y="216" font-size="12" fill="#64748b" text-anchor="middle">stroke-dasharray 切虚线</text>
  <text x="200" y="236" font-size="12" fill="#64748b" text-anchor="middle">+ @keyframes 滚动 stroke-dashoffset</text>
  <text x="200" y="256" font-size="11.5" fill="#475569" text-anchor="middle">线没动，动的是虚线相位</text>

  <!-- ===== Panel 2: particle on path ===== -->
  <text x="590" y="92" font-size="15" font-weight="600" fill="#5eead4" text-anchor="middle">② 沿路径粒子</text>
  <path d="M 450 190 Q 520 110 590 160 Q 660 210 730 130" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <circle r="7" fill="url(#dparticle)" filter="url(#dglow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 450 190 Q 520 110 590 160 Q 660 210 730 130"/>
  </circle>
  <circle r="5" fill="url(#dparticle)" filter="url(#dglow)">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M 450 190 Q 520 110 590 160 Q 660 210 730 130"/>
  </circle>
  <text x="590" y="236" font-size="12" fill="#64748b" text-anchor="middle">SMIL 原生 &lt;animateMotion path="…"&gt;</text>
  <text x="590" y="256" font-size="11.5" fill="#475569" text-anchor="middle">begin 错开出发时间，radialGradient 做光球</text>

  <!-- ===== Panel 3: pulse halo ===== -->
  <text x="970" y="92" font-size="15" font-weight="600" fill="#5eead4" text-anchor="middle">③ 呼吸脉冲高亮</text>
  <rect class="demo-halo" x="874" y="124" width="192" height="76" rx="18" fill="none" stroke="#fbbf24" stroke-width="10" filter="url(#dhalo)"/>
  <rect x="880" y="130" width="180" height="64" rx="14" fill="#33270a" stroke="#fbbf24" stroke-width="2"/>
  <text x="970" y="158" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">当前阶段</text>
  <text x="970" y="180" font-size="11.5" fill="#fcd34d" text-anchor="middle">进行中 ◀</text>
  <text x="970" y="236" font-size="12" fill="#64748b" text-anchor="middle">feGaussianBlur 光晕层</text>
  <text x="970" y="256" font-size="11.5" fill="#475569" text-anchor="middle">+ @keyframes 循环 opacity</text>
</svg>
