<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" width="1500" height="1160" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
<style>.title{fill:#f8fafc;font-size:22px;font-weight:700}.sub{fill:#94a3b8;font-size:14px}.h{fill:#f1f5f9;font-size:15px;font-weight:600}.t{fill:#cbd5e1;font-size:13px}.tag{font-size:12px;font-weight:600}.ln{fill:#e2e8f0;font-size:16px;font-weight:700}.ld{fill:#94a3b8;font-size:13px}.fl{fill:none;stroke:#e2e8f0;stroke-width:1.8;stroke-dasharray:7 6;animation:d 1.3s linear infinite}.bn{fill:#0b1220;font-size:13px;font-weight:700;text-anchor:middle}.lg{fill:#cbd5e1;font-size:13.5px}.lgh{fill:#e2e8f0;font-size:15px;font-weight:600}.pulse{animation:p 2.2s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-26}}@keyframes p{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}</style></defs>
<rect width="1500" height="1160" rx="16" fill="#0b1220"/>
<text class="title" x="30" y="44">用开源组件自己搭一套 agent 注册、发现和调用</text>
<text class="sub" x="30" y="72">紫 = 直接用开源组件，橙 = 要自己写的胶水和规则，灰 / 蓝 = Kubernetes 和 Azure 底座。编号是一个 agent 从提交到被调用的顺序</text>
<rect x="20" y="92" width="1460" height="200" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="120">① 定义</text>
<rect x="210" y="102" width="410" height="180" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="222" y="125">CRD：自己定义，或直接用 kagent</text>
<text class="tag" x="610" y="120" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="222" y="147">kagent 的 Agent / ModelConfig / MCP 服务器</text>
<text class="t" x="222" y="166">  CRD 现成可用，偏 A 类（声明式）</text>
<text class="t" x="222" y="185">要覆盖 B、C 类，就自己定义一个 Agent CRD</text>
<text class="t" x="222" y="204">  加 type 字段（第 07 篇第二节）</text>
<text class="t" x="222" y="223">结构规则写成 CEL，提交时就拒绝</text>
<rect x="635" y="102" width="410" height="180" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="647" y="125">skills 包：oras + 任意 OCI 仓库</text>
<text class="tag" x="1035" y="120" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="647" y="147">AGENTS.md、skills、MCP 配置打成 OCI artifact</text>
<text class="t" x="647" y="166">按 digest 引用，Pinned / Track 两种策略</text>
<text class="t" x="647" y="185">ACR、Harbor、GHCR 都行</text>
<text class="t" x="647" y="204">沙箱放文件时按 digest 拉，不按 tag</text>
<rect x="1060" y="102" width="420" height="180" rx="10" fill="#2a1a10" stroke="#fb923c" stroke-width="1.5"/>
<text class="h" x="1072" y="125">要自己写：controller 的语义校验</text>
<text class="tag" x="1470" y="120" fill="#fdba74" text-anchor="end">要自己写</text>
<text class="t" x="1072" y="147">运行时类、模型、镜像仓库是否在批准清单里</text>
<text class="t" x="1072" y="166">代码镜像必须带 digest；tag 解析成 digest</text>
<text class="t" x="1072" y="185">规范化后取内容哈希作 revision，只增不改</text>
<text class="t" x="1072" y="204">原因写进 status，不合格的不往下走</text>
<text class="t" x="1072" y="223">（kagent 只校验自己的类型）</text>
<rect x="20" y="306" width="1460" height="190" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="334">② 注册中心</text>
<rect x="210" y="316" width="410" height="170" rx="10" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
<text class="h" x="222" y="339">方案 A：Kubernetes API 为准</text>
<text class="tag" x="610" y="334" fill="#cbd5e1" text-anchor="end">Kubernetes</text>
<text class="t" x="222" y="361">CRD 就是注册表，RBAC 管可见性</text>
<text class="t" x="222" y="380">controller 再把卡片推给下游目录</text>
<text class="t" x="222" y="399">适合：agent 都跑在 Kubernetes 上</text>
<text class="t" x="222" y="418">缺点：集群外、别的框架看不到</text>
<rect x="635" y="316" width="410" height="170" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="647" y="339">方案 B：Nacos AI 注册中心</text>
<text class="tag" x="1035" y="334" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="647" y="361">托管 A2A AgentCard，带版本、审核、可见性</text>
<text class="t" x="647" y="380">按名字搜索、发现、订阅变更</text>
<text class="t" x="647" y="399">同一处还能登记 MCP server、Skill、Prompt</text>
<text class="t" x="647" y="418">适合：多集群、非 K8s 系统、Java 生态</text>
<rect x="1060" y="316" width="420" height="170" rx="10" fill="#2a1a10" stroke="#fb923c" stroke-width="1.5"/>
<text class="h" x="1072" y="339">要自己写：两边的同步</text>
<text class="tag" x="1470" y="334" fill="#fdba74" text-anchor="end">要自己写</text>
<text class="t" x="1072" y="361">方案 A：controller 生成卡片并发布</text>
<text class="t" x="1072" y="380">  到 well-known 端点或推到 Nacos</text>
<text class="t" x="1072" y="399">方案 B：CRD 状态变化 → 写 Nacos；</text>
<text class="t" x="1072" y="418">  Nacos 里的审核结果 → 回写 status</text>
<text class="t" x="1072" y="437">只同步 Ready 的版本</text>
<rect x="20" y="510" width="1460" height="200" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="538">③ 统一入口</text>
<rect x="210" y="520" width="520" height="180" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="222" y="543">agent 网关（可以用 agentgateway 项目）</text>
<text class="tag" x="720" y="538" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="222" y="565">所有 agent 的入口：按 agent 名路由、转发调用</text>
<text class="t" x="222" y="584">同时代理 A2A（跨框架调用）和 MCP（工具调用）</text>
<text class="t" x="222" y="603">JWT 认证：Entra 签发的令牌</text>
<text class="t" x="222" y="622">授权回调："源 → 目标 → skill"交给外部授权服务</text>
<text class="t" x="222" y="641">和模型网关、出站网关是三种角色，可以同一个项目分开部署</text>
<rect x="745" y="520" width="350" height="180" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="757" y="543">授权：OpenFGA</text>
<text class="tag" x="1085" y="538" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="757" y="565">owner 批准：源 agent 能调目标的哪些 skill</text>
<text class="t" x="757" y="584">  → 一条元组</text>
<text class="t" x="757" y="603">只允许一跳、子会话不继承权限</text>
<text class="t" x="757" y="622">  → 模型里的关系（第 04 补充）</text>
<rect x="1110" y="520" width="370" height="180" rx="10" fill="#0f2236" stroke="#38bdf8" stroke-width="1.5"/>
<text class="h" x="1122" y="543">身份：Entra</text>
<text class="tag" x="1470" y="538" fill="#7dd3fc" text-anchor="end">AKS / Azure</text>
<text class="t" x="1122" y="565">调用方令牌：用户 / agent 自己的身份</text>
<text class="t" x="1122" y="584">Entra Agent ID：每个 agent 独立身份</text>
<text class="t" x="1122" y="603">企业目录：把卡片同步过去，</text>
<text class="t" x="1122" y="622">  让 Teams、Copilot 找得到（第 09 篇）</text>
<rect x="20" y="734" width="1460" height="210" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="762">④ 协议面</text>
<rect x="210" y="744" width="410" height="190" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="222" y="767">A2A：给跨框架的 agent</text>
<text class="tag" x="610" y="762" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="222" y="789">C 类自写 loop、外部平台的 agent</text>
<text class="t" x="222" y="808">卡片在 /.well-known/agent-card.json</text>
<text class="t" x="222" y="827">A2A SDK 有客户端和服务端</text>
<text class="t" x="222" y="846">kagent 的每个 agent 自带 A2A 端点</text>
<rect x="635" y="744" width="410" height="190" rx="10" fill="#1d1733" stroke="#a78bfa" stroke-width="1.5"/>
<text class="h" x="647" y="767">MCP：给编码 harness</text>
<text class="tag" x="1035" y="762" fill="#c4b5fd" text-anchor="end">开源组件</text>
<text class="t" x="647" y="789">沙箱里的 Claude Code、Codex 是 MCP 客户端</text>
<text class="t" x="647" y="808">把会话 API 包成 MCP 工具：建会话、投递、</text>
<text class="t" x="647" y="827">  读更新、读条目、中止</text>
<text class="t" x="647" y="846">参考实现就是这么做的，没有走 A2A</text>
<text class="t" x="647" y="865">MCP Registry / Nacos 登记这些 server</text>
<rect x="1060" y="744" width="420" height="190" rx="10" fill="#2a1a10" stroke="#fb923c" stroke-width="1.5"/>
<text class="h" x="1072" y="767">要自己写：协议到会话 API 的适配</text>
<text class="tag" x="1470" y="762" fill="#fdba74" text-anchor="end">要自己写</text>
<text class="t" x="1072" y="789">A2A 的 task / message → 建子会话、投递一轮</text>
<text class="t" x="1072" y="808">A2A 的流式事件 ← 会话的更新流（带游标）</text>
<text class="t" x="1072" y="827">MCP 工具调用 → 同一套会话 API</text>
<text class="t" x="1072" y="846">B 类经 harness 适配器（第 03 篇），</text>
<text class="t" x="1072" y="865">C 类要求镜像实现约定协议</text>
<rect x="20" y="958" width="1460" height="90" rx="12" fill="#0d1526" stroke="#334155" stroke-width="1.2"/>
<text class="ln" x="36" y="986">⑤ 运行</text>
<rect x="210" y="968" width="1060" height="60" rx="10" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
<text class="h" x="222" y="991">会话控制面 + 沙箱后端（第 03～06 篇）</text>
<text class="tag" x="1260" y="986" fill="#cbd5e1" text-anchor="end">Kubernetes</text>
<text class="t" x="222" y="1013">A 类共用平台 loop；B、C 类每会话一个 Kata 沙箱，由 OpenSandbox / agent-sandbox 分配</text>
<path class="fl" d="M420,282 L420,302" marker-end="url(#a)"/>
<path class="fl" d="M420,486 L420,506" marker-end="url(#a)"/>
<path class="fl" d="M470,700 L470,720" marker-end="url(#a)"/>
<path class="fl" d="M420,934 L420,954" marker-end="url(#a)"/>
<circle cx="440" cy="296" r="12" fill="#e2e8f0"/><text class="bn" x="440" y="301">1</text>
<circle cx="440" cy="500" r="12" fill="#e2e8f0"/><text class="bn" x="440" y="505">2</text>
<circle cx="490" cy="724" r="12" fill="#e2e8f0"/><text class="bn" x="490" y="729">3</text>
<circle cx="440" cy="948" r="12" fill="#e2e8f0"/><text class="bn" x="440" y="953">4</text>
<text class="lgh" x="30" y="1066">怎么读</text>
<text class="lg" x="30" y="1094">开源组件已经覆盖了每一层的"底座"：CRD 和 CEL、oras、Nacos、agentgateway、OpenFGA、A2A 和 MCP 的 SDK。要自己写的是橙色三块：controller 的语义校验和 revision、</text>
<text class="lg" x="30" y="1118">注册中心之间的同步、协议到会话 API 的适配。最省事的组合是：kagent 管 A 类，自定义 CRD 管 B、C 类，agentgateway 统一入口，OpenFGA 管调用授权，Nacos 只在需要跨集群时再加</text>
</svg>