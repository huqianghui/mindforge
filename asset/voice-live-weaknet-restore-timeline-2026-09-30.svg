<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="rtbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="videoLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="audioLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="pT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="rtglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#fbbf24"/></marker>
    <marker id="mR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#f87171"/></marker>
    <marker id="mG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>

  <style>
    @keyframes rtFlow { to { stroke-dashoffset: -64; } }
    @keyframes rtPulse { 0%,100% { r: 11; opacity: 0.9; } 50% { r: 22; opacity: 0.12; } }
    @keyframes rtBreathe { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes rtShimmer { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    .rt-flow  { stroke-dasharray: 14 18; animation: rtFlow 1.4s linear infinite; }
    .rt-flowV { stroke-dasharray: 12 16; animation: rtFlow 1.8s linear infinite; }
    .rt-ring  { animation: rtPulse 2s ease-out infinite; }
    .rt-warn  { animation: rtBreathe 2.2s ease-in-out infinite; }
    .rt-live  { animation: rtShimmer 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="520" rx="18" fill="url(#rtbg)"/>
  <rect x="1" y="1" width="1158" height="518" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="21" font-weight="700" fill="#e2e8f0">弱网自适应端到端实测：第 16 秒关画面，64 秒后开回来，中间抓到一次只差 1 秒的失同步</text>
  <text x="36" y="66" font-size="12" fill="#64748b">1080p 视频数字人 · OS 层 UDP 限速 + 3% 丢包 · 浏览器 getStats 每 2 秒采样 · 时间轴为会话建立后的秒数</text>

  <!-- ============ main axis ============ -->
  <!-- x mapping: t=0 -> 90, t=100s -> 1070 ; 9.8 px/s -->
  <line x1="90" y1="200" x2="1070" y2="200" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- 0~16 s : video on (teal) -->
  <line x1="90" y1="200" x2="247" y2="200" stroke="url(#videoLine)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line class="rt-flow" x1="90" y1="200" x2="247" y2="200" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle r="5" fill="url(#pT)" filter="url(#rtglow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 90 200 H 247"/>
  </circle>

  <!-- 16~80 s : audio only (violet) -->
  <line x1="247" y1="200" x2="874" y2="200" stroke="url(#audioLine)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line class="rt-flowV" x1="247" y1="200" x2="874" y2="200" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle r="5" fill="url(#pV)" filter="url(#rtglow)">
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M 247 200 H 874"/>
  </circle>
  <circle r="4" fill="url(#pV)" filter="url(#rtglow)">
    <animateMotion dur="5.2s" begin="2.6s" repeatCount="indefinite" path="M 247 200 H 874"/>
  </circle>

  <!-- 80~100 s : video restored (teal) -->
  <line x1="874" y1="200" x2="1070" y2="200" stroke="url(#videoLine)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line class="rt-flow" x1="874" y1="200" x2="1070" y2="200" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle r="5" fill="url(#pT)" filter="url(#rtglow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 874 200 H 1070"/>
  </circle>

  <!-- segment labels above axis -->
  <text x="168" y="178" font-size="12" fill="#5eead4" text-anchor="middle">画面 + 声音</text>
  <text x="560" y="178" font-size="12" fill="#c4b5fd" text-anchor="middle">纯音频（重建不带视频轨的会话，约 5 秒静默）</text>
  <text x="972" y="178" font-size="12" fill="#5eead4" text-anchor="middle">画面回来，真的在解码</text>

  <!-- ticks -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="90" y="232">0 s</text>
    <text x="247" y="232">16 s</text>
    <text x="688" y="232">61 s</text>
    <text x="864" y="232">79 s</text>
    <text x="884" y="248">80 s</text>
    <text x="1070" y="232">100 s</text>
  </g>

  <!-- ===== event 1: degrade at 16 s ===== -->
  <circle cx="247" cy="200" r="9" fill="#0a0f1c" stroke="#fbbf24" stroke-width="3"/>
  <circle class="rt-ring" cx="247" cy="200" r="11" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="247" y1="188" x2="247" y2="112" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
  <rect x="150" y="82" width="230" height="30" rx="7" fill="#1c1917" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="265" y="102" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">主触发（免阈值）→ 立刻关画面</text>
  <text x="265" y="128" font-size="11" fill="#94a3b8" text-anchor="middle">视频字节在涨、已解码帧不增，RTT 872 ms</text>
  <text x="265" y="144" font-size="11" fill="#94a3b8" text-anchor="middle">关画面没有任何等待，冷却只管开画面</text>

  <!-- ===== healthy window 61 s marker ===== -->
  <line x1="688" y1="194" x2="688" y2="206" stroke="#a78bfa" stroke-width="2"/>
  <text x="688" y="252" font-size="11" fill="#a78bfa" text-anchor="middle">健康已保持 45 s，够了</text>

  <!-- ===== event 2: verdict rejected at 79 s ===== -->
  <circle cx="864" cy="200" r="8" fill="#0a0f1c" stroke="#f87171" stroke-width="3"/>
  <g class="rt-warn">
    <line x1="859" y1="195" x2="869" y2="205" stroke="#f87171" stroke-width="2.2"/>
    <line x1="869" y1="195" x2="859" y2="205" stroke="#f87171" stroke-width="2.2"/>
  </g>
  <line x1="864" y1="210" x2="864" y2="290" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
  <rect x="640" y="290" width="330" height="30" rx="7" fill="#1c1012" stroke="#f87171" stroke-width="1.2"/>
  <text x="805" y="310" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">第一次恢复判决：被否决，冷却还剩 1 秒</text>
  <text x="805" y="336" font-size="11" fill="#94a3b8" text-anchor="middle">决策层说"链路健康，开画面"，执行层说"avatar 会话创建冷却未满，再等"</text>

  <!-- ===== event 3: restore at 80 s ===== -->
  <circle cx="884" cy="200" r="9" fill="#0a0f1c" stroke="#2dd4bf" stroke-width="3"/>
  <circle class="rt-ring" cx="884" cy="200" r="11" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="884" y1="188" x2="884" y2="112" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
  <rect x="800" y="82" width="250" height="30" rx="7" fill="#0f1a1a" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="925" y="102" font-size="12" font-weight="700" fill="#99f6e4" text-anchor="middle">2 秒后第二次判决通过 → 开画面</text>
  <text x="925" y="128" font-size="11" fill="#94a3b8" text-anchor="middle">降级后 64 s（预估 66 s）；恢复后 10 个窗口</text>
  <text x="925" y="144" font-size="11" fill="#94a3b8" text-anchor="middle">解码帧 +357、视频 3.0 MB；可听补偿率 0.475%</text>

  <!-- ============ lower lane: before fix vs after fix ============ -->
  <text x="36" y="392" font-size="13" font-weight="700" fill="#e2e8f0">被否决的切换该怎么记</text>

  <!-- before fix -->
  <rect x="36" y="406" width="520" height="84" rx="10" fill="#111827" stroke="#f87171" stroke-width="1.2" opacity="0.95"/>
  <text x="56" y="430" font-size="12" font-weight="700" fill="#fca5a5">修复前：决策层把否决记成"已切到视频"</text>
  <line x1="56" y1="450" x2="300" y2="450" stroke="#f87171" stroke-width="2" marker-end="url(#mR)"/>
  <text x="178" y="444" font-size="10.5" fill="#f87171" text-anchor="middle">决策层 → 执行层：开画面</text>
  <line x1="300" y1="466" x2="56" y2="466" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#mG)"/>
  <text x="178" y="481" font-size="10.5" fill="#64748b" text-anchor="middle">否决没有回传</text>
  <text x="320" y="452" font-size="11" fill="#94a3b8">决策层以为画面已开，再也不问</text>
  <text x="320" y="470" font-size="11" fill="#fca5a5">结果：画面永远不回来（前几轮全是这条路）</text>

  <!-- after fix -->
  <rect x="604" y="406" width="520" height="84" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.2" opacity="0.95"/>
  <text x="624" y="430" font-size="12" font-weight="700" fill="#99f6e4">修复后：执行确认后才更新形态记录</text>
  <line x1="624" y1="450" x2="868" y2="450" stroke="#fbbf24" stroke-width="2" marker-end="url(#mA)"/>
  <text x="746" y="444" font-size="10.5" fill="#fbbf24" text-anchor="middle">决策层 → 执行层：开画面</text>
  <line class="rt-flow" x1="868" y1="466" x2="624" y2="466" stroke="#2dd4bf" stroke-width="2" marker-end="url(#mG)"/>
  <text x="746" y="481" font-size="10.5" fill="#5eead4" text-anchor="middle">回传：还差 1 秒，未执行</text>
  <text x="888" y="452" font-size="11" fill="#94a3b8">决策层保持"纯音频"，下个窗口再问</text>
  <text x="888" y="470" font-size="11" fill="#99f6e4">结果：2 秒后通过，64 秒拿回画面</text>

  <!-- legend -->
  <g font-size="11" fill="#64748b">
    <line x1="36" y1="282" x2="66" y2="282" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <text x="72" y="286">画面 + 声音</text>
    <line x1="160" y1="282" x2="190" y2="282" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <text x="196" y="286">纯音频</text>
    <circle cx="270" cy="282" r="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="282" y="286">降级判决（不等待）</text>
    <circle cx="410" cy="282" r="5" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <text x="422" y="286">恢复判决被否决</text>
    <circle cx="540" cy="282" r="5" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="552" y="286">恢复判决通过</text>
  </g>
</svg>
