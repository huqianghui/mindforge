<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4fa"/><stop offset="1" stop-color="#f2f4fa"/></linearGradient><radialGradient id="pt_teal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#26a696"/><stop offset="1" stop-color="#26a696" stop-opacity="0"/></radialGradient><marker id="ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#26a696"/></marker><radialGradient id="pt_sky" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#0c89c0"/><stop offset="1" stop-color="#0c89c0" stop-opacity="0"/></radialGradient><marker id="ar_sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0c89c0"/></marker><radialGradient id="pt_violet" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#2a0693"/><stop offset="1" stop-color="#2a0693" stop-opacity="0"/></radialGradient><marker id="ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a0693"/></marker><radialGradient id="pt_amber" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#c38f09"/><stop offset="1" stop-color="#c38f09" stop-opacity="0"/></radialGradient><marker id="ar_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c38f09"/></marker><radialGradient id="pt_gray" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#7a899f"/><stop offset="1" stop-color="#7a899f" stop-opacity="0"/></radialGradient><marker id="ar_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a899f"/></marker><radialGradient id="pt_red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#920707"/><stop offset="1" stop-color="#920707" stop-opacity="0"/></radialGradient><marker id="ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#920707"/></marker><radialGradient id="pt_rose" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#950419"/><stop offset="1" stop-color="#950419" stop-opacity="0"/></radialGradient><marker id="ar_rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#950419"/></marker><radialGradient id="pt_green" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#23a954"/><stop offset="1" stop-color="#23a954" stop-opacity="0"/></radialGradient><marker id="ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#23a954"/></marker></defs>
<style>@keyframes flowDash { to { stroke-dashoffset: -76; } } .flow { stroke-dasharray: 18 20; animation: flowDash 1.6s linear infinite; } @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } } .pulse { animation: pulse 2.2s ease-in-out infinite; }</style>
<rect width="1400" height="800" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="798" rx="17" fill="none" stroke="#f3f5f9"/>
<text x="36" y="46" font-size="22" font-weight="700" fill="#2e4d6b" text-anchor="start">自定义 Connector：把 Container Apps 上的 API 接进来</text>
<text x="36" y="72" font-size="14" font-weight="400" fill="#5e718d" text-anchor="start">managed app 唯一正规的"自有后端"通道；前提是租户 DLP 允许自定义 Connector</text>
<rect x="30" y="96" width="400" height="560" rx="14" fill="#950419" fill-opacity="0.04" stroke="#950419" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="46" y="120" font-size="14" font-weight="700" fill="#950419" text-anchor="start">Microsoft Entra ID</text>
<rect x="50" y="136" width="360" height="150" rx="12" fill="#faf3f7" stroke="#950419" stroke-width="1.6"/>
<text x="66" y="163" font-size="15" font-weight="700" fill="#99000b" text-anchor="start">API 应用注册</text>
<text x="66" y="187" font-size="13" font-weight="400" fill="#960315" text-anchor="start">暴露 scope</text>
<text x="66" y="211" font-size="13" font-weight="400" fill="#960315" text-anchor="start">api://&lt;api-app-id&gt;/user_impersonation</text>
<text x="66" y="235" font-size="13" font-weight="400" fill="#960315" text-anchor="start">API 用它校验令牌 audience</text>
<rect x="50" y="316" width="360" height="170" rx="12" fill="#faf3f7" stroke="#950419" stroke-width="1.6"/>
<text x="66" y="343" font-size="15" font-weight="700" fill="#99000b" text-anchor="start">Connector 客户端应用注册</text>
<text x="66" y="367" font-size="13" font-weight="400" fill="#960315" text-anchor="start">申请上面的 scope</text>
<text x="66" y="391" font-size="13" font-weight="400" fill="#960315" text-anchor="start">生成客户端密钥</text>
<text x="66" y="415" font-size="13" font-weight="400" fill="#960315" text-anchor="start">重定向 URI 加上 Connector</text>
<text x="66" y="439" font-size="13" font-weight="400" fill="#960315" text-anchor="start">页面给出的 Redirect URL</text>
<rect x="50" y="516" width="360" height="120" rx="12" fill="#faf3f7" stroke="#950419" stroke-width="1.6"/>
<text x="66" y="543" font-size="15" font-weight="700" fill="#99000b" text-anchor="start">用户登录</text>
<text x="66" y="567" font-size="13" font-weight="400" fill="#960315" text-anchor="start">Test 页 / 首次使用时弹出</text>
<text x="66" y="591" font-size="13" font-weight="400" fill="#960315" text-anchor="start">拿到用户的委托令牌</text>
<rect x="460" y="96" width="470" height="560" rx="14" fill="#26a696" fill-opacity="0.04" stroke="#26a696" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="476" y="120" font-size="14" font-weight="700" fill="#26a696" text-anchor="start">Power Platform</text>
<rect x="480" y="136" width="430" height="190" rx="12" fill="#f1fbfb" stroke="#26a696" stroke-width="1.6"/>
<text x="496" y="163" font-size="15" font-weight="700" fill="#0b8e72" text-anchor="start">自定义 Connector 定义</text>
<text x="496" y="187" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">OpenAPI 2.0（Swagger）——3.x 要先转换</text>
<text x="496" y="211" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">host = API 域名；每个操作都要 operationId</text>
<text x="496" y="235" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">（生成的 TypeScript 方法名就来自它）</text>
<text x="496" y="259" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">Security：OAuth 2.0 · Microsoft Entra ID</text>
<text x="496" y="283" font-size="13" font-weight="400" fill="#0c8d74" text-anchor="start">Resource URL = API 应用的 ID URI</text>
<rect x="480" y="356" width="430" height="110" rx="12" fill="#fbf8f1" stroke="#c38f09" stroke-width="1.6" class="pulse"/>
<text x="496" y="383" font-size="15" font-weight="700" fill="#967903" text-anchor="start">API Hub（Connector 运行时）</text>
<text x="496" y="407" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">从微软云端发起调用，不是用户浏览器</text>
<text x="496" y="431" font-size="13" font-weight="400" fill="#c49808" text-anchor="start">所以不需要 CORS，但 API 要对它可达</text>
<rect x="480" y="496" width="205" height="140" rx="12" fill="#f4f3fa" stroke="#2a0693" stroke-width="1.6"/>
<text x="496" y="523" font-size="15" font-weight="700" fill="#210792" text-anchor="start">Managed App</text>
<text x="496" y="547" font-size="13" font-weight="400" fill="#220495" text-anchor="start">ms app add</text>
<text x="496" y="571" font-size="13" font-weight="400" fill="#220495" text-anchor="start">data-source</text>
<text x="496" y="595" font-size="13" font-weight="400" fill="#220495" text-anchor="start">--as action</text>
<rect x="705" y="496" width="205" height="140" rx="12" fill="#f1f6fb" stroke="#0c89c0" stroke-width="1.6"/>
<text x="721" y="523" font-size="15" font-weight="700" fill="#055b94" text-anchor="start">Agent / Workflow</text>
<text x="721" y="547" font-size="13" font-weight="400" fill="#036696" text-anchor="start">Tools 里添加</text>
<text x="721" y="571" font-size="13" font-weight="400" fill="#036696" text-anchor="start">流程里加动作</text>
<rect x="960" y="96" width="410" height="560" rx="14" fill="#0c89c0" fill-opacity="0.04" stroke="#0c89c0" stroke-opacity="0.7" stroke-dasharray="7 6" stroke-width="1.4"/>
<text x="976" y="120" font-size="14" font-weight="700" fill="#0c89c0" text-anchor="start">Azure</text>
<rect x="980" y="136" width="370" height="190" rx="12" fill="#f1f6fb" stroke="#0c89c0" stroke-width="1.6"/>
<text x="996" y="163" font-size="15" font-weight="700" fill="#055b94" text-anchor="start">Container Apps（外部 ingress）</text>
<text x="996" y="187" font-size="13" font-weight="400" fill="#036696" text-anchor="start">https://&lt;app&gt;.&lt;env&gt;.&lt;region&gt;</text>
<text x="996" y="211" font-size="13" font-weight="400" fill="#036696" text-anchor="start">.azurecontainerapps.io</text>
<text x="996" y="235" font-size="13" font-weight="400" fill="#036696" text-anchor="start">/openapi.json 暴露描述</text>
<text x="996" y="259" font-size="13" font-weight="400" fill="#036696" text-anchor="start">内置认证或代码里校验 JWT</text>
<rect x="980" y="356" width="370" height="130" rx="12" fill="#f6f8fb" stroke="#7a899f" stroke-width="1.6"/>
<text x="996" y="383" font-size="15" font-weight="700" fill="#384b61" text-anchor="start">网络选项</text>
<text x="996" y="407" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">公网 HTTPS 最简单</text>
<text x="996" y="431" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">私网：Connector 流量接入 Azure VNet</text>
<text x="996" y="455" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">或本地数据网关</text>
<rect x="980" y="516" width="370" height="120" rx="12" fill="#f6f8fb" stroke="#7a899f" stroke-width="1.6"/>
<text x="996" y="543" font-size="15" font-weight="700" fill="#384b61" text-anchor="start">也可以</text>
<text x="996" y="567" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">API 已在 APIM 后面：</text>
<text x="996" y="591" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">Export to Power Platform 直接生成</text>
<path id="p1" d="M976 230 H914" fill="none" stroke="#0c89c0" stroke-width="2.3" class="flow" marker-end="url(#ar_sky)"/>
<circle r="6" fill="url(#pt_sky)"><animateMotion dur="1.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle cx="945" cy="262" r="12" fill="#f2f4fa" stroke="#0c89c0" stroke-width="1.6"/>
<text x="945" y="267" font-size="13" font-weight="700" fill="#0c89c0" text-anchor="middle">1</text>
<path id="p2" d="M410 210 H476" fill="none" stroke="#950419" stroke-width="2.3" class="flow" marker-end="url(#ar_rose)"/>
<circle r="6" fill="url(#pt_rose)"><animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle cx="442" cy="196" r="12" fill="#f2f4fa" stroke="#950419" stroke-width="1.6"/>
<text x="442" y="201" font-size="13" font-weight="700" fill="#950419" text-anchor="middle">2</text>
<path id="p3" d="M410 400 H476" fill="none" stroke="#950419" stroke-width="2.3" class="flow" marker-end="url(#ar_rose)"/>
<circle r="6" fill="url(#pt_rose)"><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
<circle cx="442" cy="386" r="12" fill="#f2f4fa" stroke="#950419" stroke-width="1.6"/>
<text x="442" y="391" font-size="13" font-weight="700" fill="#950419" text-anchor="middle">3</text>
<path id="p4" d="M582 492 V470" fill="none" stroke="#2a0693" stroke-width="2.3" class="flow" marker-end="url(#ar_violet)"/>
<circle r="6" fill="url(#pt_violet)"><animateMotion dur="1.0s" begin="0.9s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
<circle cx="606" cy="482" r="12" fill="#f2f4fa" stroke="#2a0693" stroke-width="1.6"/>
<text x="606" y="487" font-size="13" font-weight="700" fill="#2a0693" text-anchor="middle">4</text>
<path id="p5" d="M807 492 V470" fill="none" stroke="#0c89c0" stroke-width="2.3" class="flow" marker-end="url(#ar_sky)"/>
<circle r="6" fill="url(#pt_sky)"><animateMotion dur="1.0s" begin="1.1s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
<path id="p6" d="M914 410 H976" fill="none" stroke="#c38f09" stroke-width="2.3" class="flow" marker-end="url(#ar_amber)"/>
<circle r="6" fill="url(#pt_amber)"><animateMotion dur="1.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
<circle cx="945" cy="440" r="12" fill="#f2f4fa" stroke="#c38f09" stroke-width="1.6"/>
<text x="945" y="445" font-size="13" font-weight="700" fill="#c38f09" text-anchor="middle">5</text>
<path id="p7" d="M410 576 C440 576 440 440 476 440" fill="none" stroke="#950419" stroke-width="2.3" class="flow" marker-end="url(#ar_rose)"/>
<circle r="6" fill="url(#pt_rose)"><animateMotion dur="1.6s" begin="1.5s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle>
<text x="40" y="690" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">① 用 Import an OpenAPI from URL 或文件导入；APIM 后面的 API 可直接 Export to Power Platform</text>
<text x="40" y="716" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">② ③ 两个应用注册：API 暴露 scope，客户端申请 scope；Connector Security 页填客户端 ID / 密钥与 Resource URL</text>
<text x="40" y="742" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">④ app、agent、workflow 都能用同一个自定义 Connector，同样受 DLP 管、按 Premium 计</text>
<text x="40" y="768" font-size="13" font-weight="400" fill="#5e718d" text-anchor="start">⑤ API Hub 以用户身份调用，API 能按人做权限；单次约 120 秒上限，不能流式，长任务改成"提交 + 查状态"</text>
</svg>