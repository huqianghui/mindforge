<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .bg { fill: #0f172a; }
    .title { fill: #e2e8f0; font-size: 22px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14px; }
    .box { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; }
    .fe { fill: #134e4a; fill-opacity: 0.4; stroke: #2dd4bf; stroke-width: 2; }
    .h { fill: #e2e8f0; font-size: 17px; font-weight: 600; }
    .t { fill: #cbd5e1; font-size: 13px; }
    .agui { stroke: #c4b5fd; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: flow 1.4s linear infinite; }
    .a2a { stroke: #fbbf24; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: flow 1.4s linear infinite; }
    .mcp { stroke: #2dd4bf; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: flow 1.4s linear infinite; }
    .a2ui { stroke: #38bdf8; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: flow 1.2s linear infinite; }
    .ret { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 4 6; }
    .lA { fill: #c4b5fd; font-size: 15px; font-weight: 700; }
    .lB { fill: #fbbf24; font-size: 15px; font-weight: 700; }
    .lC { fill: #2dd4bf; font-size: 15px; font-weight: 700; }
    .lD { fill: #38bdf8; font-size: 15px; font-weight: 700; }
    .n { fill: #94a3b8; font-size: 13px; }
    .lA, .lB, .lC, .lD, .n { paint-order: stroke; stroke: #0f172a; stroke-width: 6px; stroke-linejoin: round; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
  </style>
  <defs>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="mD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1100" height="660" rx="12"/>
  <text class="title" x="40" y="44">A2UI、AG-UI、A2A、MCP 在一个企业 AI 应用中的组合</text>
  <text class="sub" x="40" y="70">一种常见组合，不是唯一方式：A2UI 不必经 AG-UI 传输，A2A 也不限于图中这种调用</text>

  <!-- frontend -->
  <rect class="fe" x="200" y="96" width="700" height="130" rx="12"/>
  <text class="h" x="220" y="124">React 前端</text>
  <rect class="box" x="230" y="140" width="250" height="68" rx="8"/>
  <text class="h" x="355" y="168" text-anchor="middle">应用 / AG-UI Client</text>
  <text class="t" x="355" y="192" text-anchor="middle">对话、运行状态、工具调用展示</text>
  <rect class="box" x="620" y="140" width="250" height="68" rx="8"/>
  <text class="h" x="745" y="168" text-anchor="middle">A2UI Renderer</text>
  <text class="t" x="745" y="192" text-anchor="middle">用受信组件渲染动态 UI</text>

  <!-- main agent -->
  <rect class="box" x="420" y="320" width="260" height="76" rx="10"/>
  <text class="h" x="550" y="352" text-anchor="middle">主 Agent</text>
  <text class="t" x="550" y="376" text-anchor="middle">理解意图 · 编排 · 生成 A2UI 描述</text>

  <!-- AG-UI -->
  <path class="agui" d="M355,210 L470,316" marker-end="url(#mA)"/>
  <path class="agui" d="M445,318 L330,212" marker-end="url(#mA)"/>
  <text class="lA" x="220" y="270">AG-UI</text>
  <text class="n" x="220" y="290">用户输入 ⇄ 运行事件</text>

  <!-- A2UI -->
  <path class="a2ui" d="M630,316 L740,212" marker-end="url(#mD)"/>
  <text class="lD" x="720" y="262">A2UI 描述</text>
  <text class="n" x="720" y="282">常由 AG-UI 事件流承载</text>

  <!-- finance agent -->
  <rect class="box" x="130" y="500" width="240" height="70" rx="10"/>
  <text class="h" x="250" y="530" text-anchor="middle">财务 Agent</text>
  <text class="t" x="250" y="553" text-anchor="middle">独立团队维护，内部实现不暴露</text>
  <path class="a2a" d="M470,398 L300,496" marker-end="url(#mB)"/>
  <path class="ret" d="M330,500 L480,402" marker-end="url(#mR)"/>
  <text class="lB" x="300" y="440">A2A</text>
  <text class="n" x="402" y="478">返回业务数据</text>

  <!-- enterprise API -->
  <rect class="box" x="730" y="500" width="240" height="70" rx="10"/>
  <text class="h" x="850" y="530" text-anchor="middle">企业 API / 数据</text>
  <text class="t" x="850" y="553" text-anchor="middle">经 MCP Server 受控暴露</text>
  <path class="mcp" d="M630,398 L800,496" marker-end="url(#mC)"/>
  <text class="lC" x="740" y="440">MCP</text>

  <text class="n" x="40" y="622">A2UI = 界面长什么样　　AG-UI = Agent 与用户应用如何交互　　A2A = Agent 之间如何协作　　MCP = Agent 如何调用工具与数据</text>
</svg>
