<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .zone { fill: none; stroke: #334155; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .zt { fill: #94a3b8; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .card { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.5; }
      .cardA { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; }
      .cardB { fill: #1e1b3a; stroke: #a78bfa; stroke-width: 1.8; }
      .dim { fill: #111827; stroke: #475569; stroke-width: 1.2; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hA { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .hB { fill: #ddd6fe; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tG { fill: #94a3b8; font-size: 13.5px; }
      .tA { fill: #fcd34d; font-size: 13.5px; }
      .tB { fill: #c4b5fd; font-size: 13.5px; }
      .m { fill: #e2e8f0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mT { fill: #5eead4; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .mA { fill: #fcd34d; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .f { stroke: #2dd4bf; stroke-width: 2.4; fill: none; stroke-dasharray: 9 6; animation: dash 1.2s linear infinite; }
      .fA { stroke: #fbbf24; stroke-width: 2.4; fill: none; stroke-dasharray: 9 6; animation: dash 1.2s linear infinite; }
      .fB { stroke: #a78bfa; stroke-width: 2; fill: none; stroke-dasharray: 5 5; animation: dash 1.6s linear infinite; }
      .fBack { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: dashR 1.6s linear infinite; }
      .num { fill: #0f766e; stroke: #5eead4; stroke-width: 1.6; }
      .numA { fill: #92400e; stroke: #fcd34d; stroke-width: 1.6; }
      .numB { fill: #4c1d95; stroke: #c4b5fd; stroke-width: 1.6; }
      .nt { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -30; } }
      @keyframes dashR { to { stroke-dashoffset: 30; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="800" rx="16"/>
  <text class="title" x="30" y="44">两种问答后端，一条 Work IQ 管道：区别只在 agentId</text>
  <text class="sub" x="30" y="72">Work IQ 是应用把问题送进 Microsoft 365 Copilot 的入口；Web IQ / Bing 是 agent 内部上网的能力，应用不直接调用</text>

  <!-- zone app -->
  <rect class="zone" x="24" y="94" width="330" height="470" rx="12"/>
  <text class="zt" x="40" y="120">浏览器 · managed app</text>
  <rect class="card" x="40" y="136" width="298" height="128" rx="9"/>
  <circle class="num" cx="62" cy="160" r="11"/><text class="nt" x="62" y="165">1</text>
  <text class="h" x="82" y="165">本地检索</text>
  <text class="t" x="56" y="194">构建期索引 → 取 5 篇最相关的</text>
  <text class="t" x="56" y="216">文章，每篇挑 2 段</text>
  <text class="tG" x="56" y="244">两种后端用同一份检索结果</text>

  <rect class="card" x="40" y="278" width="298" height="190" rx="9"/>
  <text class="h" x="56" y="304">拼提示词：规则分两支</text>
  <text class="tA" x="56" y="334">本体：ONLY from SOURCES，</text>
  <text class="tA" x="56" y="356">不准搜邮件、聊天和网页</text>
  <text class="tB" x="56" y="388">agent：SOURCES 优先，没有</text>
  <text class="tB" x="56" y="410">才上网，开头写明来自公开网络，</text>
  <text class="tB" x="56" y="432">网页事实不得标成 [n]</text>
  <text class="tG" x="56" y="458">其余规则相同：[n]、RELATED 行</text>

  <rect class="dim" x="40" y="482" width="298" height="66" rx="9"/>
  <text class="t" x="56" y="508">界面上一个切换按钮</text>
  <text class="tG" x="56" y="532">每条回答标注由哪个后端作答</text>

  <!-- zone connector -->
  <rect class="zone" x="380" y="94" width="320" height="470" rx="12"/>
  <text class="zt" x="396" y="120">Connector · 用户身份</text>
  <rect class="card" x="396" y="136" width="288" height="250" rx="9"/>
  <circle class="num" cx="418" cy="160" r="11"/><text class="nt" x="418" y="165">2</text>
  <text class="h" x="438" y="165">Work IQ Copilot MCP</text>
  <text class="m" x="412" y="194">shared_a365copilotchatmcp</text>
  <text class="t" x="412" y="222">JSON-RPC tools/call：</text>
  <text class="m" x="412" y="248">name: copilot_chat</text>
  <text class="m" x="412" y="272">arguments:</text>
  <text class="m" x="432" y="296">message: 提示词</text>
  <text class="mT" x="432" y="320">agentId?: "T_…"</text>
  <text class="tG" x="412" y="352">不传 = 本体；传 = 指定 agent</text>
  <text class="tG" x="412" y="374">首次授权一次，两种后端共用</text>

  <rect class="dim" x="396" y="400" width="288" height="148" rx="9"/>
  <text class="h" x="412" y="426">附带发现：fileUris</text>
  <text class="t" x="412" y="454">返回外层还有 fileUris /</text>
  <text class="t" x="412" y="476">autoExtractedFileUris：工具自动</text>
  <text class="t" x="412" y="498">把提示词里的网址取出来当</text>
  <text class="t" x="412" y="520">grounding 资料</text>
  <text class="tG" x="412" y="540">可能拖慢回答、带进摘录外内容</text>

  <!-- zone M365 -->
  <rect class="zone" x="726" y="94" width="650" height="470" rx="12"/>
  <text class="zt" x="742" y="120">Graph Copilot Chat API · Microsoft 365 Copilot</text>

  <rect class="cardA" x="742" y="136" width="300" height="168" rx="9"/>
  <circle class="numA" cx="764" cy="160" r="11"/><text class="nt" x="764" y="165">3</text>
  <text class="hA" x="784" y="165">不带 agentId：本体作答</text>
  <text class="t" x="758" y="194">模型由 M365 Copilot 自动路由</text>
  <text class="mA" x="758" y="220">webSearchEnabled: false</text>
  <text class="t" x="758" y="248">资料外的问题只能说没有</text>
  <text class="tA" x="758" y="280">实测 15–26 秒</text>

  <rect class="cardB" x="742" y="324" width="300" height="224" rx="9"/>
  <circle class="numB" cx="764" cy="348" r="11"/><text class="nt" x="764" y="353">4</text>
  <text class="hB" x="784" y="353">带 agentId：交给 agent</text>
  <text class="t" x="758" y="382">「Mindforge Ask」</text>
  <text class="t" x="758" y="404">Copilot Studio Standard harness</text>
  <text class="t" x="758" y="426">模型 GPT Chat Latest（可换）</text>
  <text class="t" x="758" y="456">按指令：先用 SOURCES；</text>
  <text class="t" x="758" y="478">没有答案才上网并标明</text>
  <text class="tB" x="758" y="510">实测 31–36 秒</text>
  <text class="tG" x="758" y="532">（多一次网页检索）</text>

  <rect class="cardB" x="1068" y="324" width="292" height="224" rx="9"/>
  <text class="hB" x="1084" y="350">Web IQ / Bing</text>
  <text class="t" x="1084" y="378">Grounding with Bing Search</text>
  <text class="t" x="1084" y="400">= agent 的 Web Search 开关</text>
  <text class="t" x="1084" y="430">先把问题改写成一句短英文</text>
  <text class="t" x="1084" y="452">查询，检索 1–2 秒</text>
  <text class="t" x="1084" y="482">回答附编号与 URL，应用</text>
  <text class="t" x="1084" y="504">显示为外链，与 [n] 分开</text>
  <text class="tG" x="1084" y="532">只在资料没答案时触发</text>

  <rect class="dim" x="1068" y="136" width="292" height="168" rx="9"/>
  <text class="h" x="1084" y="162">怎么确认真是 agent 在答</text>
  <text class="t" x="1084" y="190">问知识库里没有的问题：</text>
  <text class="t" x="1084" y="212">回答以"知识库里没有相关内容，</text>
  <text class="t" x="1084" y="234">以下来自公开网络："开头，</text>
  <text class="t" x="1084" y="256">并引用了公开文档页</text>
  <text class="tG" x="1084" y="284">本体不会这样答</text>

  <!-- flows -->
  <path class="f" d="M338,200 C360,200 370,250 396,250"/>
  <path class="f" d="M338,370 C364,370 370,280 396,280"/>
  <path class="fA" d="M684,230 C712,230 716,220 742,220"/>
  <path class="fB" d="M684,320 C716,320 712,420 742,420"/>
  <path class="fB" d="M1042,436 L1068,436"/>
  <circle r="5" fill="#a78bfa"><animateMotion dur="3.2s" repeatCount="indefinite" path="M338,370 C364,370 370,280 396,280 L684,320 C716,320 712,420 742,420 L1068,436"/></circle>
  <circle r="5" fill="#fbbf24"><animateMotion dur="2.6s" repeatCount="indefinite" path="M338,200 C360,200 370,250 396,250 L684,230 C712,230 716,220 742,220"/></circle>

  <!-- return -->
  <rect class="zone" x="24" y="584" width="1352" height="92" rx="12"/>
  <circle class="num" cx="50" cy="614" r="11"/><text class="nt" x="50" y="619">5</text>
  <text class="h" x="70" y="619">返回（两种后端结构相同）</text>
  <text class="t" x="70" y="648">外层 JSON（带 agentId 时回显 agentId）→ 去掉 CorrelationId 行 → reply 为空 → 解析 rawResponse → messages 最后一条 → 拆出 [n] 与 RELATED → 渲染成原文链接</text>
  <path class="fBack" d="M1300,564 L1300,584"/>
  <path class="fBack" d="M190,584 L190,564"/>

  <!-- legend -->
  <rect class="zone" x="24" y="692" width="1352" height="92" rx="12"/>
  <text class="lg" x="44" y="720">① 同一份检索结果、同一套引用协议，对比才公平；提示词只在"能不能上网"一句上分支</text>
  <text class="lg" x="44" y="746">② 代码层面的差别只是多传一个可选参数；③④ 的分叉发生在 M365 Copilot 里，应用看不到中间过程</text>
  <text class="lg" x="44" y="772">⑤ 解析逻辑完全复用；Work IQ 与 Web IQ 名字相近但不在同一层——一个是送问题进去的管道，一个是 agent 自己上网的工具</text>
</svg>
