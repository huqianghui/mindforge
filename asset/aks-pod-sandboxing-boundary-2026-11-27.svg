<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .wall { fill: none; stroke: #2dd4bf; stroke-width: 3; stroke-dasharray: 10 6; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#0f172a"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#f1f5f9">Pod Sandboxing 的墙只围住计算</text>
  <text x="40" y="74" font-size="14" fill="#94a3b8">每个 Kata Pod 一台 VM、一个独立的 guest kernel；控制面、cluster-admin、存储和网络都在墙外，hostPath 会把墙打穿</text>

  <!-- node -->
  <rect x="40" y="100" width="720" height="610" rx="14" fill="#111c33" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="128" font-size="15" font-weight="600" fill="#cbd5e1">AKS 节点（Azure Linux，Kata 节点镜像）</text>

  <!-- Kata Pod A -->
  <rect x="70" y="150" width="250" height="300" rx="12" fill="#0b2a2a"/>
  <rect x="70" y="150" width="250" height="300" rx="12" class="wall"/>
  <text x="90" y="178" font-size="15" font-weight="600" fill="#5eead4">Kata Pod VM · A</text>
  <rect x="90" y="196" width="210" height="64" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="195" y="224" font-size="15" text-anchor="middle" fill="#f0fdfa">agent 生成的代码</text>
  <text x="195" y="246" font-size="13" text-anchor="middle" fill="#99f6e4">容器进程</text>
  <rect x="90" y="274" width="210" height="44" rx="8" fill="#123c3a" stroke="#14b8a6" stroke-width="1"/>
  <text x="195" y="302" font-size="14" text-anchor="middle" fill="#ccfbf1">kata-agent</text>
  <rect x="90" y="332" width="210" height="52" rx="8" fill="#0f766e"/>
  <text x="195" y="356" font-size="15" font-weight="600" text-anchor="middle" fill="#f0fdfa">guest kernel</text>
  <text x="195" y="375" font-size="13" text-anchor="middle" fill="#ccfbf1">漏洞被利用也先落在这里</text>
  <text x="195" y="420" font-size="13" text-anchor="middle" fill="#5eead4">VM 规格 = Pod 的 limits</text>

  <!-- Kata Pod B -->
  <rect x="340" y="150" width="250" height="300" rx="12" fill="#0b2a2a"/>
  <rect x="340" y="150" width="250" height="300" rx="12" class="wall"/>
  <text x="360" y="178" font-size="15" font-weight="600" fill="#5eead4">Kata Pod VM · B</text>
  <rect x="360" y="196" width="210" height="64" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="465" y="224" font-size="15" text-anchor="middle" fill="#f0fdfa">另一个租户的沙箱</text>
  <text x="465" y="246" font-size="13" text-anchor="middle" fill="#99f6e4">容器进程</text>
  <rect x="360" y="274" width="210" height="44" rx="8" fill="#123c3a" stroke="#14b8a6" stroke-width="1"/>
  <text x="465" y="302" font-size="14" text-anchor="middle" fill="#ccfbf1">kata-agent</text>
  <rect x="360" y="332" width="210" height="52" rx="8" fill="#0f766e"/>
  <text x="465" y="356" font-size="15" font-weight="600" text-anchor="middle" fill="#f0fdfa">guest kernel</text>
  <text x="465" y="375" font-size="13" text-anchor="middle" fill="#ccfbf1">和 A 互不相通</text>

  <!-- runc pod -->
  <rect x="610" y="150" width="130" height="300" rx="12" fill="#2a2110" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="675" y="178" font-size="15" font-weight="600" text-anchor="middle" fill="#fcd34d">runc Pod</text>
  <rect x="625" y="196" width="100" height="64" rx="8" fill="#3f2f0c" stroke="#f59e0b" stroke-width="1"/>
  <text x="675" y="233" font-size="14" text-anchor="middle" fill="#fef3c7">普通容器</text>
  <text x="675" y="300" font-size="13" text-anchor="middle" fill="#fde68a">没有 VM</text>
  <text x="675" y="320" font-size="13" text-anchor="middle" fill="#fde68a">直接用</text>
  <text x="675" y="340" font-size="13" text-anchor="middle" fill="#fde68a">宿主内核</text>
  <text x="675" y="400" font-size="13" text-anchor="middle" fill="#fde68a">漏写</text>
  <text x="675" y="420" font-size="13" text-anchor="middle" fill="#fde68a">runtimeClassName</text>
  <text x="675" y="440" font-size="13" text-anchor="middle" fill="#fde68a">就是它</text>
  <line x1="675" y1="450" x2="675" y2="565" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- host components -->
  <rect x="70" y="480" width="520" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="330" y="505" font-size="15" text-anchor="middle" fill="#e2e8f0">shim · Cloud Hypervisor · virtiofsd</text>
  <text x="330" y="525" font-size="13" text-anchor="middle" fill="#94a3b8">每个 Kata Pod 在宿主上一组，开销记在 RuntimeClass overhead</text>

  <!-- host kernel -->
  <rect x="70" y="566" width="670" height="52" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="405" y="598" font-size="15" font-weight="600" text-anchor="middle" fill="#e2e8f0">宿主机内核（mshv，Pod VM 由 hypervisor 创建）</text>

  <!-- host fs -->
  <rect x="70" y="640" width="670" height="48" rx="8" fill="#2a1414" stroke="#7f1d1d"/>
  <text x="405" y="670" font-size="15" text-anchor="middle" fill="#fecaca">宿主机文件系统</text>

  <!-- hostPath piercing path -->
  <path d="M 84 640 L 56 640 L 56 228 L 90 228" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="7 5" class="pulse"/>
  <polygon points="90,228 80,222 80,234" fill="#f87171"/>

  <!-- markers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="56" cy="430" r="14" fill="#ef4444"/><text x="56" y="435" fill="#fff">1</text>
    <circle cx="440" cy="140" r="14" fill="#64748b"/><text x="440" y="145" fill="#fff">2</text>
    <circle cx="560" cy="140" r="14" fill="#64748b"/><text x="560" y="145" fill="#fff">3</text>
    <circle cx="600" cy="508" r="14" fill="#64748b"/><text x="600" y="513" fill="#fff">4</text>
    <circle cx="590" cy="250" r="14" fill="#64748b"/><text x="590" y="255" fill="#fff">5</text>
  </g>

  <!-- right column: outside the wall -->
  <text x="790" y="128" font-size="17" font-weight="700" fill="#f1f5f9">墙外：Kata 不管的部分</text>

  <rect x="790" y="146" width="370" height="92" rx="10" fill="#2a1414" stroke="#ef4444"/>
  <circle cx="814" cy="172" r="12" fill="#ef4444"/><text x="814" y="177" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="836" y="178" font-size="15" font-weight="600" fill="#fecaca">hostPath 卷</text>
  <text x="808" y="204" font-size="13" fill="#fca5a5">宿主目录直接挂进容器，隔离被削弱</text>
  <text x="808" y="224" font-size="13" fill="#fca5a5">用 Azure Policy 限定允许的卷类型来禁掉</text>

  <rect x="790" y="250" width="370" height="76" rx="10" fill="#172033" stroke="#475569"/>
  <circle cx="814" cy="276" r="12" fill="#64748b"/><text x="814" y="281" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="836" y="282" font-size="15" font-weight="600" fill="#e2e8f0">AKS 控制面</text>
  <text x="808" y="308" font-size="13" fill="#94a3b8">调度、Secret、RBAC 都不在 VM 里</text>

  <rect x="790" y="338" width="370" height="76" rx="10" fill="#172033" stroke="#475569"/>
  <circle cx="814" cy="364" r="12" fill="#64748b"/><text x="814" y="369" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="836" y="370" font-size="15" font-weight="600" fill="#e2e8f0">cluster-admin</text>
  <text x="808" y="396" font-size="13" fill="#94a3b8">kubectl exec 照样能进到 VM 里</text>

  <rect x="790" y="426" width="370" height="76" rx="10" fill="#172033" stroke="#475569"/>
  <circle cx="814" cy="452" r="12" fill="#64748b"/><text x="814" y="457" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <text x="836" y="458" font-size="15" font-weight="600" fill="#e2e8f0">存储与数据路径</text>
  <text x="808" y="484" font-size="13" fill="#94a3b8">卷经 virtiofsd 共享进 VM，数据另行保护</text>

  <rect x="790" y="514" width="370" height="92" rx="10" fill="#172033" stroke="#475569"/>
  <circle cx="814" cy="540" r="12" fill="#64748b"/><text x="814" y="545" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">5</text>
  <text x="836" y="546" font-size="15" font-weight="600" fill="#e2e8f0">网络出站</text>
  <text x="808" y="572" font-size="13" fill="#94a3b8">Pod VM 默认照样能连外网</text>
  <text x="808" y="592" font-size="13" fill="#94a3b8">靠 NetworkPolicy、egress 代理或 Agent Grid</text>

  <!-- legend -->
  <g font-size="13" fill="#cbd5e1">
    <line x1="40" y1="742" x2="80" y2="742" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="90" y="747">计算隔离边界（墙）</text>
    <line x1="250" y1="742" x2="290" y2="742" stroke="#f87171" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="300" y="747">打穿墙的路径</text>
    <rect x="420" y="734" width="18" height="16" rx="3" fill="#2a2110" stroke="#fbbf24"/>
    <text x="448" y="747">没有 VM 隔离</text>
    <circle cx="570" cy="742" r="9" fill="#64748b"/>
    <text x="586" y="747">编号对应右侧说明</text>
  </g>
</svg>
