<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .col { fill: #0f1a2e; stroke: #334155; stroke-width: 1.2; }
      .colA { fill: #1a160b; stroke: #fbbf24; stroke-width: 1.8; animation: pulse 2.6s ease-in-out infinite; }
      .colG { fill: #0f141f; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .h { fill: #e2e8f0; font-size: 18px; font-weight: 700; }
      .hA { fill: #fde68a; font-size: 18px; font-weight: 700; }
      .hG { fill: #94a3b8; font-size: 18px; font-weight: 700; }
      .h15 { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tg { fill: #94a3b8; font-size: 13.5px; }
      .code { fill: #a7f3d0; font-size: 13px; font-family: Menlo, monospace; }
      .codeA { fill: #fde68a; font-size: 13px; font-family: Menlo, monospace; }
      .in { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.4; }
      .inA { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 1.4; }
      .inG { fill: #111827; stroke: #475569; stroke-width: 1.2; }
      .model { fill: #1c1534; stroke: #a78bfa; stroke-width: 1.6; }
      .out { fill: #0f2a24; stroke: #5eead4; stroke-width: 1.4; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowA { fill: none; stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowG { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .chip { fill: #0f766e; } .chipN { fill: #334155; }
      .ct { fill: #f0fdfa; font-size: 13px; font-weight: 600; }
      .ctN { fill: #cbd5e1; font-size: 13px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="800" rx="16"/>
  <text class="title" x="30" y="44">同样是“给图、给视频”，输入在生成里扮演的角色完全不同</text>
  <text class="sub" x="30" y="72">区别不在文件类型，而在模型把它当作首帧、身份约束，还是被编辑的原片</text>

  <!-- I2V -->
  <rect class="col" x="30" y="96" width="430" height="520" rx="14"/>
  <text class="h" x="50" y="128">Image-to-Video：首帧</text>
  <rect class="in" x="50" y="148" width="180" height="70" rx="8"/>
  <text class="h15" x="64" y="174">首帧图</text>
  <text class="code" x="64" y="200">image_url</text>
  <rect class="inG" x="250" y="148" width="190" height="70" rx="8"/>
  <text class="h15" x="264" y="174">尾帧图（可选）</text>
  <text class="code" x="264" y="200">end_image_url</text>
  <rect class="model" x="120" y="258" width="250" height="60" rx="8"/>
  <text class="h15" x="140" y="294">从第一帧开始往后生成</text>
  <rect class="out" x="120" y="358" width="250" height="56" rx="8"/>
  <text class="t" x="140" y="392">视频第一帧 ≈ 输入图</text>
  <path class="flow" d="M140,220 L200,256" marker-end="url(#arr)"/>
  <path class="flowG" d="M345,220 L290,256"/>
  <path class="flow" d="M245,320 L245,356" marker-end="url(#arr)"/>
  <text class="t" x="50" y="448">适合：让一张已定稿的图动起来，</text>
  <text class="t" x="50" y="472">产品图、海报、分镜关键帧。</text>
  <text class="tg" x="50" y="500">Kling 首帧字段叫 start_image_url；</text>
  <text class="tg" x="50" y="524">首尾帧都给时，模型补中间过程。</text>
  <rect class="chip" x="50" y="552" width="76" height="26" rx="13"/><text class="ct" x="64" y="570">Kling</text>
  <rect class="chip" x="134" y="552" width="64" height="26" rx="13"/><text class="ct" x="148" y="570">LTX</text>
  <rect class="chip" x="206" y="552" width="98" height="26" rx="13"/><text class="ct" x="220" y="570">H3 Max</text>
  <rect class="chip" x="312" y="552" width="120" height="26" rx="13"/><text class="ct" x="326" y="570">H3 Turbo</text>

  <!-- R2V -->
  <rect class="colA" x="485" y="96" width="430" height="520" rx="14"/>
  <text class="hA" x="505" y="128">Reference-to-Video：约束条件</text>
  <rect class="inA" x="505" y="148" width="190" height="64" rx="8"/>
  <text class="h15" x="519" y="172">参考图：谁、长什么样</text>
  <text class="codeA" x="519" y="196">reference_image_urls</text>
  <rect class="inA" x="705" y="148" width="190" height="64" rx="8"/>
  <text class="h15" x="719" y="172">参考视频：怎么动</text>
  <text class="codeA" x="719" y="196">reference_video_urls</text>
  <rect class="inA" x="505" y="220" width="190" height="64" rx="8"/>
  <text class="h15" x="519" y="244">参考音频：声音风格</text>
  <text class="codeA" x="519" y="268">reference_audio_urls</text>
  <rect class="inA" x="705" y="220" width="190" height="64" rx="8"/>
  <text class="h15" x="719" y="244">目标音轨：用这段音</text>
  <text class="codeA" x="719" y="268">target_audio_url</text>
  <rect class="model" x="575" y="316" width="250" height="60" rx="8"/>
  <text class="h15" x="593" y="342">提取身份、动作、声音</text>
  <text class="tg" x="593" y="364">Prompt 说明每个素材是谁</text>
  <rect class="out" x="575" y="404" width="250" height="56" rx="8"/>
  <text class="t" x="595" y="438">新视频，不是原片的改写</text>
  <path class="flowA" d="M600,286 L660,314" marker-end="url(#arrA)"/>
  <path class="flowA" d="M800,286 L740,314" marker-end="url(#arrA)"/>
  <path class="flowA" d="M700,378 L700,402" marker-end="url(#arrA)"/>
  <text class="t" x="505" y="490">适合：多个主体保持身份一致（人 + 狗），</text>
  <text class="t" x="505" y="514">静态角色按参考视频的动作表演。</text>
  <text class="tg" x="505" y="540">最多 12 个文件；视频、音频单段 2–15 秒、各自合计 ≤15 秒</text>
  <rect class="chip" x="505" y="556" width="98" height="26" rx="13"/><text class="ct" x="519" y="574">H3 Max</text>
  <rect class="chipN" x="611" y="556" width="290" height="26" rx="13"/><text class="ctN" x="625" y="574">Foundry 上其余四个都没有此路由</text>

  <!-- V2V -->
  <rect class="colG" x="940" y="96" width="430" height="520" rx="14"/>
  <text class="hG" x="960" y="128">Video-to-Video：被编辑的原片</text>
  <rect class="inG" x="960" y="148" width="390" height="70" rx="8"/>
  <text class="h15" x="976" y="174">原视频本身就是输出的骨架</text>
  <text class="tg" x="976" y="200">保留几何结构、运动轨迹和时间节奏</text>
  <rect class="model" x="1030" y="258" width="250" height="60" rx="8"/>
  <text class="h15" x="1048" y="294">逐段改风格或局部编辑</text>
  <rect class="out" x="1030" y="358" width="250" height="56" rx="8"/>
  <text class="t" x="1048" y="392">同一段视频，换了外观</text>
  <path class="flowG" d="M1155,220 L1155,256"/>
  <path class="flowG" d="M1155,320 L1155,356"/>
  <text class="t" x="960" y="448">适合：真人舞蹈转 3D 动画风格、</text>
  <text class="t" x="960" y="472">局部替换、严格保留原镜头运动。</text>
  <text class="tg" x="960" y="500">R2V 的参考视频只提供动作参考，</text>
  <text class="tg" x="960" y="524">不能当作逐帧编辑来用。</text>
  <rect class="chipN" x="960" y="552" width="300" height="26" rx="13"/><text class="ctN" x="974" y="570">Foundry 上这五个模型都未提供</text>

  <rect class="colG" x="30" y="636" width="1340" height="144" rx="12"/>
  <text class="h15" x="50" y="666">三份能力清单不要混用</text>
  <text class="t" x="50" y="694">Foundry：只有 H3 Max 有 Reference-to-Video 路由，五个都有文生视频和图生视频。</text>
  <text class="t" x="50" y="720">fal 原生平台：另有 H3 Max Turbo 的 Reference-to-Video、LTX 2.5 的 Audio-to-Video、Kling v3 Pro 的参考元素（elements）。</text>
  <text class="t" x="50" y="746">模型厂商产品：Kling 3.0 本身把文生、图生、参考生成与视频内编辑做在一个架构里；Foundry 上的 Kling 只开放其中两项。</text>
</svg>
