<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .panel { fill: #0d1729; stroke: #334155; stroke-width: 1.2; }
      .zl { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .cA { fill: #2dd4bf; fill-opacity: 0.13; stroke: #2dd4bf; stroke-width: 2; }
      .cB { fill: #a78bfa; fill-opacity: 0.13; stroke: #a78bfa; stroke-width: 2; }
      .cC { fill: #38bdf8; fill-opacity: 0.13; stroke: #38bdf8; stroke-width: 2; }
      .core { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2.4; animation: pulse 2s ease-in-out infinite; }
      .vh { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .vt { fill: #cbd5e1; font-size: 13px; text-anchor: middle; }
      .coreT { fill: #fde68a; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .th { fill: #94a3b8; font-size: 13.5px; font-weight: 600; }
      .thc { fill: #94a3b8; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .row { fill: #111827; stroke: #1f2937; stroke-width: 1; }
      .rowA { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 1.6; }
      .rh { fill: #f1f5f9; font-size: 14.5px; font-weight: 600; }
      .rt { fill: #cbd5e1; font-size: 13px; }
      .ok { fill: #2dd4bf; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .no { fill: #f87171; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .g { fill: #5eead4; font-size: 13.5px; font-weight: 600; }
      .r { fill: #fca5a5; font-size: 13.5px; font-weight: 600; }
      .a { fill: #fde68a; font-size: 13.5px; font-weight: 600; }
      .lg { fill: #cbd5e1; font-size: 13.5px; }
      .lgh { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="860" rx="16"/>
  <text class="title" x="30" y="44">有效权限 = 申请 ∧ 批准 ∧ 发布，三份声明分属三个人</text>
  <text class="sub" x="30" y="72">左边是 OpenFGA 里的计算方式；右边是我在同一个应用上依次改声明时，运行中的会话和新会话各自的表现</text>

  <!-- 左：三方交集 -->
  <rect class="panel" x="30" y="96" width="520" height="560" rx="14"/>
  <text class="zl" x="50" y="126">三条关系各自投影进 OpenFGA</text>
  <circle class="cA" cx="215" cy="300" r="130"/>
  <circle class="cB" cx="365" cy="300" r="130"/>
  <circle class="cC" cx="290" cy="425" r="130"/>
  <text class="vh" x="170" y="248" fill="#5eead4">申请</text>
  <text class="vt" x="170" y="272">应用作者</text>
  <text class="vt" x="170" y="292">写在应用声明里</text>
  <text class="vh" x="410" y="248" fill="#c4b5fd">批准</text>
  <text class="vt" x="410" y="272">资源 owner</text>
  <text class="vt" x="410" y="292">单独的批准对象</text>
  <text class="vh" x="290" y="500" fill="#7dd3fc">发布</text>
  <text class="vt" x="290" y="524">平台 / provider</text>
  <text class="vt" x="290" y="544">资源就绪且开启该动作</text>
  <rect class="core" x="232" y="338" width="116" height="44" rx="10"/>
  <text class="coreT" x="290" y="366">perform</text>
  <text class="lg" x="50" y="594">任何一条被删，下一次检查就失败</text>
  <text class="lg" x="50" y="618">动作是不透明字符串：read 不蕴含 write，没有通配符</text>
  <text class="lg" x="50" y="642">主体和对象用 Kubernetes UID，删了重建同名对象不会继承旧授权</text>

  <!-- 右：实测矩阵 -->
  <rect class="panel" x="580" y="96" width="790" height="560" rx="14"/>
  <text class="zl" x="600" y="126">实测：一个应用，两个仓库动作（target / other）</text>
  <text class="th" x="600" y="164">场景</text>
  <text class="thc" x="895" y="164">申请</text>
  <text class="thc" x="955" y="164">批准</text>
  <text class="thc" x="1015" y="164">发布</text>
  <text class="th" x="1060" y="164">运行中的会话</text>
  <text class="th" x="1230" y="164">新会话</text>

  <rect class="row" x="596" y="178" width="758" height="78" rx="8"/>
  <text class="rh" x="612" y="208">target：三项都有</text>
  <text class="rt" x="612" y="232">读私有仓库元数据和 README</text>
  <text class="ok" x="895" y="224">✓</text><text class="ok" x="955" y="224">✓</text><text class="ok" x="1015" y="224">✓</text>
  <text class="g" x="1060" y="214">200</text>
  <text class="rt" x="1060" y="236">0.27 ~ 0.43 秒</text>
  <text class="g" x="1230" y="224">可以建</text>

  <rect class="row" x="596" y="268" width="758" height="78" rx="8"/>
  <text class="rh" x="612" y="298">other：只发布，没申请</text>
  <text class="rt" x="612" y="322">资源上开了这个动作</text>
  <text class="no" x="895" y="314">✗</text><text class="no" x="955" y="314">✗</text><text class="ok" x="1015" y="314">✓</text>
  <text class="r" x="1060" y="304">403</text>
  <text class="rt" x="1060" y="326">凭据代理没被调用</text>
  <text class="g" x="1230" y="314">可以建</text>

  <rect class="rowA" x="596" y="358" width="758" height="92" rx="8"/>
  <text class="rh" x="612" y="388">other：申请了，还没批准</text>
  <text class="rt" x="612" y="412">应用状态变成"缺批准"</text>
  <text class="ok" x="895" y="404">✓</text><text class="no" x="955" y="404">✗</text><text class="ok" x="1015" y="404">✓</text>
  <text class="r" x="1060" y="390">other 403</text>
  <text class="g" x="1060" y="412">target 照常 200</text>
  <text class="a" x="1230" y="390">503</text>
  <text class="rt" x="1230" y="412">整个应用</text>
  <text class="rt" x="1230" y="432">都建不了</text>

  <rect class="row" x="596" y="462" width="758" height="78" rx="8"/>
  <text class="rh" x="612" y="492">other：补上批准</text>
  <text class="rt" x="612" y="516">只新建一个批准对象</text>
  <text class="ok" x="895" y="508">✓</text><text class="ok" x="955" y="508">✓</text><text class="ok" x="1015" y="508">✓</text>
  <text class="g" x="1060" y="498">5 秒内变 200</text>
  <text class="rt" x="1060" y="520">不用新开会话</text>
  <text class="g" x="1230" y="508">可以建</text>

  <text class="lg" x="600" y="584">运行中的会话按"当前"声明逐请求重算，不受创建时的快照限制</text>
  <text class="lg" x="600" y="608">新会话在准备阶段就把整份申请算一遍，有一项缺批准就整体拒绝</text>
  <text class="lg" x="600" y="632">所以加新权限的顺序应当是：资源 owner 先批，应用再加申请</text>

  <!-- 底部 -->
  <text class="lgh" x="40" y="706">怎么读这张图</text>
  <text class="lg" x="40" y="736">· 三条关系分别由应用作者、资源 owner、平台写，没有哪一方能单独让一个动作生效，也没有哪一方的声明能单独当成权限</text>
  <text class="lg" x="40" y="764">· 琥珀色那一行是我没预料到的：缺一项批准时，运行中的会话只是那一个动作被拒，新会话却被整个挡掉，错误信息也只是笼统的 503</text>
  <text class="lg" x="40" y="792">· 网关上的授权只回答"这个沙箱此刻能不能对这个资源做这个动作"，至于请求里具体写了什么（分支名、PR 目标），要交给懂协议的 provider 再判一次</text>
  <text class="lg" x="40" y="820">· OpenFGA 这一步只占 2.5 ms；一次授权的 105 ms 大部分花在核实"这个证书背后确实是一个活着、绑定了会话的 Pod"</text>
</svg>
