<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" width="1360" height="960" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .boxRed { fill: #2a1215; stroke: #f87171; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .zone { fill: #0d1729; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zoneAmber { fill: #120f08; stroke: #fbbf24; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .zlA { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .hRed { fill: #fecaca; font-size: 15px; font-weight: 600; }
      .hGray { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13px; }
      .tGray { fill: #94a3b8; font-size: 13px; }
      .warn { fill: #fca5a5; font-size: 13px; }
      .ok { fill: #5eead4; font-size: 13px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .badgeGray { fill: #334155; stroke: #94a3b8; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #a7f3d0; font-size: 13px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
    </style>
  </defs>

  <rect class="bg" width="1360" height="960" rx="16"/>
  <text class="title" x="30" y="44">两个循环：会话里的在线强化，与 Dreaming 的离线整理</text>
  <text class="sub" x="30" y="70">Dreaming 改的是上下文，不是模型；它的三类产出走三种不同的门，只有改仓库文件那一路有人审</text>

  <!-- ===== 在线循环 ===== -->
  <rect class="zone" x="20" y="92" width="1320" height="186" rx="12"/>
  <text class="zl" x="36" y="118">在线循环 —— 每个 session 里实时发生（Memory GA）</text>

  <rect class="box" x="36" y="134" width="330" height="128" rx="10"/>
  <text class="h" x="52" y="160">Copilot session（任意入口）</text>
  <text class="t" x="52" y="186">读：相关记忆 + instructions + skills</text>
  <text class="t" x="52" y="210">干活时写：新事实、新偏好</text>
  <text class="tGray" x="52" y="240">本地会话经 session syncing 上传</text>

  <path class="flow" d="M 366 186 L 446 186" marker-end="url(#arr)"/>
  <path class="flow" d="M 446 216 L 366 216" marker-end="url(#arr)"/>
  <circle class="badge" cx="406" cy="160" r="12"/><text class="bn" x="406" y="165">1</text>

  <rect class="boxAmber" x="450" y="134" width="330" height="128" rx="10"/>
  <text class="hAmber" x="466" y="160">Memory store（GitHub 后端）</text>
  <text class="t" x="466" y="186">仓库事实 / 个人偏好，带 citations</text>
  <text class="t" x="466" y="210">使用时核对 → 自动 upvote / downvote</text>
  <text class="tGray" x="466" y="240">不在 git 里，票数不可见</text>

  <rect class="box" x="794" y="134" width="530" height="128" rx="10"/>
  <text class="h" x="810" y="160">仓库里的 guidance 文件（在 git 里）</text>
  <text class="t" x="810" y="186">.github/copilot-instructions.md、.github/instructions/**</text>
  <text class="t" x="810" y="210">.github/agents/**、.github/skills/**、REVIEW.md</text>
  <text class="t" x="810" y="234">AGENTS.md、CLAUDE.md、GEMINI.md（其他工具的也读）</text>

  <!-- 在线 → 离线 输入 -->
  <path class="flowAmber" d="M 200 262 L 200 340" marker-end="url(#arrAmber)"/>
  <path class="flowAmber" d="M 615 262 L 615 300 L 260 300 L 260 340" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="228" cy="300" r="12"/><text class="bn" x="228" y="305">2</text>

  <!-- ===== 离线循环 ===== -->
  <rect class="zoneAmber" x="20" y="320" width="1320" height="440" rx="12"/>
  <text class="zlA" x="36" y="346">离线循环 —— Copilot Dreaming 在后台定期运行（公开预览，需主动开启）</text>

  <rect class="box" x="36" y="362" width="300" height="250" rx="10"/>
  <text class="h" x="52" y="390">输入</text>
  <text class="t" x="52" y="418">已同步的历史 session</text>
  <text class="t" x="52" y="442">现有记忆（个人 / 仓库）</text>
  <text class="t" x="52" y="466">仓库代码与 guidance 文件</text>
  <text class="t" x="52" y="490">已合并 PR 上被接受的 review 反馈</text>
  <text class="warn" x="52" y="526">前提：session syncing 打开，</text>
  <text class="warn" x="52" y="548">本地会话要上传到 GitHub</text>
  <text class="tGray" x="52" y="584">每次运行只用其中一部分</text>

  <path class="flowAmber" d="M 336 486 L 376 486" marker-end="url(#arrAmber)"/>

  <rect class="boxAmber" x="380" y="362" width="300" height="250" rx="10"/>
  <text class="hAmber" x="396" y="390">Dreaming run</text>
  <text class="t" x="396" y="418">个人记忆整理</text>
  <text class="t" x="396" y="442">仓库定制：记忆 + 文件</text>
  <text class="t" x="396" y="466">code review 定制</text>
  <text class="tGray" x="396" y="500">找有用信息、修正过时指引、</text>
  <text class="tGray" x="396" y="522">合并重复记忆</text>
  <text class="tGray" x="396" y="556">不需要开着会话</text>
  <text class="tGray" x="396" y="580">不是每次都有改动</text>

  <!-- 三路输出 -->
  <path class="flowAmber" d="M 680 410 L 740 410" marker-end="url(#arrAmber)"/>
  <path class="flowAmber" d="M 680 486 L 740 486" marker-end="url(#arrAmber)"/>
  <path class="flowAmber" d="M 680 562 L 740 562" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="710" cy="386" r="12"/><text class="bn" x="710" y="391">3</text>

  <rect class="boxRed" x="744" y="362" width="290" height="70" rx="10"/>
  <text class="hRed" x="760" y="388">记忆：直接增删改</text>
  <text class="warn" x="760" y="414">不逐条审批，事后可删</text>

  <rect class="box" x="744" y="446" width="290" height="80" rx="10"/>
  <text class="h" x="760" y="472">instructions / skills：开 PR</text>
  <text class="ok" x="760" y="498">合并前文件不变，人审才生效</text>
  <text class="tGray" x="760" y="516">个人的 instruction / skill 文件不改</text>

  <rect class="boxRed" x="744" y="540" width="290" height="72" rx="10"/>
  <text class="hRed" x="760" y="566">review 指引：内部更新</text>
  <text class="warn" x="760" y="592">不开 PR，不在仓库文件里</text>

  <!-- 产出回到在线循环 -->
  <path class="flowAmber" d="M 1034 397 L 1070 397 L 1070 290 L 700 290 L 700 266" marker-end="url(#arrAmber)"/>
  <path class="flow" d="M 1034 486 L 1100 486 L 1100 266" marker-end="url(#arr)"/>
  <circle class="badge" cx="1100" cy="380" r="12"/><text class="bn" x="1100" y="385">4</text>

  <!-- 缺失的一环 -->
  <rect class="boxGray" x="1130" y="362" width="194" height="250" rx="10"/>
  <circle class="badgeGray" cx="1152" cy="388" r="12"/><text class="bn" x="1152" y="393">5</text>
  <text class="hGray" x="1172" y="393">缺的一环</text>
  <text class="tGray" x="1146" y="422">离线评估：改动前后</text>
  <text class="tGray" x="1146" y="444">在同一批任务上比</text>
  <text class="tGray" x="1146" y="476">Dream-RSI：回放</text>
  <text class="tGray" x="1146" y="498">仿真器给候选打分</text>
  <text class="tGray" x="1146" y="530">SkillOpt：验证集</text>
  <text class="tGray" x="1146" y="552">门控决定接不接受</text>
  <text class="tGray" x="1146" y="590">Dreaming 未公开此类机制</text>

  <!-- 关闭语义 -->
  <rect class="boxRed" x="36" y="628" width="1288" height="116" rx="10"/>
  <text class="hRed" x="52" y="656">关掉 Dreaming 不等于回滚</text>
  <text class="t" x="52" y="684">不撤销已做的改动、不恢复被删的记忆、不关闭它开的 PR；运行详情不是完整活动记录，也没有"撤销本次运行"</text>
  <text class="t" x="52" y="708">关个人 Dreaming 不影响组织仓库的运行；进行中的运行可能继续跑完</text>
  <text class="tGray" x="52" y="732">能回滚的只有走了 PR 的那一路——它在 git 里</text>

  <!-- 粒子 -->
  <circle r="4" fill="#fcd34d"><animateMotion dur="4s" repeatCount="indefinite" path="M 200 262 L 200 340 M 336 486 L 376 486 M 680 486 L 740 486"/></circle>
  <circle r="4" fill="#fcd34d"><animateMotion dur="5s" repeatCount="indefinite" path="M 1034 397 L 1070 397 L 1070 290 L 700 290 L 700 266"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="3s" repeatCount="indefinite" path="M 366 186 L 446 186"/></circle>

  <!-- ===== 图例 ===== -->
  <text class="h" x="30" y="792">编号说明</text>
  <text class="el" x="30" y="818">① 在线：session 读记忆、写记忆、投票，强化发生在使用当下</text>
  <text class="el" x="700" y="818">② 历史会话、记忆和 review 反馈成为离线循环的"经验"</text>
  <text class="el" x="30" y="844">③ 一次运行的产出分三路，门控完全不同</text>
  <text class="el" x="700" y="844">④ 产出回到下一次 session 的上下文里，循环闭合</text>
  <text class="el" x="30" y="870">⑤ 灰色虚线 = 研究里有、这里没有：改动在上线前没有被系统地比较过</text>
  <text class="tGray" x="30" y="900">红框 = 没有人审或不可回滚的路径；青绿 = 有门控、可回滚；琥珀 = Dreaming 本身与它的数据流</text>
  <text class="tGray" x="30" y="926">它会读 CLAUDE.md、GEMINI.md：同一仓库里别的 agent 的指令文件，也被当成要维护的 guidance</text>
</svg>
