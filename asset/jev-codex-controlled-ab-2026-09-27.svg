  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">B1 受控对照：同一执行器，只换"下一步做什么"的判断模型</text>
  <text x="36" y="70" font-size="13" fill="#475569">筛选显示器 · 价格 ≤ 1000 · 仅看有货 · 选择 M24｜两次正式运行均值｜同一系统 Browser、DOM 观察器、候选动作、Azure Astra writer（medium）、停止条件与验收器</text>

