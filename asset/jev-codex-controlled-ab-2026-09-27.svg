  <text x="36" y="580" font-size="11.5" fill="#475569" class="pulse">Jev 组 6.096 s 里真正花在 Jev 判断上的只有 1.794 s；最大的单项是让 Astra 再生成一次用户已给定的 "1000"（2.728 s，约 45%）。</text>
  <text x="36" y="596" font-size="11" fill="#475569">费用估算按 Azure Global 公开价：Astra 组 $0.059 / 次，Jev 组 $0.0021 / 次；均为估算，非实际账单。</text>
