<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="zoneL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="zoneR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="particle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    @keyframes flowDash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 14 16; animation: flowDash 1.6s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .breathe { animation: breathe 3s ease-in-out infinite; }
  </style>

  <rect width="1160" height="600" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="598" rx="17" fill="none" stroke="#1e293b"/>

  <text x="36" y="46" font-size="21" font-weight="700" fill="#e2e8f0">AI 任务的两变量边界与任务完成花费</text>
  <text x="470" y="46" font-size="13" fill="#475569">验证成本 × 错误成本 决定一个任务落在哪一栏 · 飞轮把任务从右栏推向左栏</text>

  <!-- ================= left: two-axis map ================= -->
  <g transform="translate(70,90)">
    <!-- zones -->
    <rect x="40" y="20" width="560" height="380" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <!-- lower band (below threshold curve) = left column zone -->
    <path d="M 40 400 L 40 210 Q 320 300 600 190 L 600 400 Z" fill="url(#zoneL)"/>
    <!-- upper region (above threshold curve) = right column zone -->
    <path d="M 40 210 Q 320 300 600 190 L 600 20 L 40 20 Z" fill="url(#zoneR)"/>
    <!-- axes -->
    <line x1="40" y1="400" x2="600" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <line x1="40" y1="400" x2="40" y2="20" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <text x="600" y="425" font-size="12" fill="#94a3b8" text-anchor="end">验证成本 →（人能否当场判对错）</text>
    <text x="-380" y="28" font-size="12" fill="#94a3b8" transform="rotate(-90)" text-anchor="start">错误成本 →（可逆 / 不可逆）</text>

    <!-- threshold curve -->
    <path d="M 40 210 Q 320 300 600 190" fill="none" stroke="#fbbf24" stroke-width="2" class="flow" opacity="0.9"/>
    <text x="270" y="268" font-size="12" fill="#fbbf24" class="breathe">可靠性阈值：(1−成功率)×错误成本 ≈ 人工复核成本</text>

    <!-- left column items (low error or cheap verification) -->
    <g font-size="12" fill="#ccfbf1">
      <rect x="58" y="300" width="172" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="144" y="317" text-anchor="middle">Copilots / Coding agents</text>
      <rect x="58" y="335" width="172" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="144" y="352" text-anchor="middle">NotebookLM / DeepResearch</text>
      <rect x="58" y="370" width="172" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="144" y="387" text-anchor="middle">Slop / Spam（错了没人在意）</text>
      <rect x="245" y="335" width="200" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="345" y="352" text-anchor="middle">Customer Service w/o decisions</text>
      <rect x="245" y="370" width="200" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="345" y="387" text-anchor="middle">Voice agents（人在场当场纠正）</text>
      <text x="58" y="290" font-size="11" fill="#2dd4bf">Too good to be true：第三项 ≈ 0</text>
    </g>

    <!-- right column items (expensive verification and expensive error) -->
    <g font-size="12" fill="#ffe4e6">
      <rect x="400" y="40" width="180" height="24" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.6"/>
      <text x="490" y="57" text-anchor="middle">Accounting / Taxes · Insurance</text>
      <rect x="400" y="75" width="180" height="24" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.6"/>
      <text x="490" y="92" text-anchor="middle">Customer Service（含决策）</text>
      <rect x="400" y="110" width="180" height="24" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.6"/>
      <text x="490" y="127" text-anchor="middle">Data entry · QA · Drive thrus</text>
      <rect x="400" y="145" width="180" height="24" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.6"/>
      <text x="490" y="162" text-anchor="middle">无人在环 = 要求可靠性</text>
      <text x="580" y="190" font-size="11" fill="#fb7185" text-anchor="end">Too bad to be useful：第三项主导</text>
    </g>

    <!-- migration path -->
    <path id="migrate" d="M 470 175 C 400 260, 380 300, 300 328" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrowAmber)"/>
    <circle r="5" fill="url(#particle)" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 470 175 C 400 260, 380 300, 300 328"/>
    </circle>
    <circle r="5" fill="url(#particle)" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" to="1" begin="1.2s" dur="0.01s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 470 175 C 400 260, 380 300, 300 328"/>
    </circle>
    <text x="58" y="196" font-size="11.5" fill="#fde68a" class="pulse">人在环做验证器 → 成功率↑ → 越过阈值 → 迁栏</text>
  </g>

  <!-- ================= right: cost formula ================= -->
  <g transform="translate(720,100)">
    <rect x="0" y="0" width="400" height="120" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#e2e8f0">任务完成花费（FinOps 的新分子）</text>
    <text x="20" y="62" font-size="13" fill="#2dd4bf">模型调用</text>
    <text x="84" y="62" font-size="13" fill="#64748b">+</text>
    <text x="100" y="62" font-size="13" fill="#38bdf8">人工验证成本</text>
    <text x="196" y="62" font-size="13" fill="#64748b">+</text>
    <text x="212" y="62" font-size="13" fill="#fb7185">(1 − 成功率) × 错误成本</text>
    <text x="20" y="92" font-size="12" fill="#94a3b8">token 价格只影响第一项；右栏任务由第三项主导，</text>
    <text x="20" y="110" font-size="12" fill="#94a3b8">95% 成功率意味着人仍要复核 100%。</text>

    <rect x="0" y="140" width="400" height="120" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="170" font-size="14" font-weight="700" fill="#e2e8f0">分界不是行业，是两个变量</text>
    <text x="20" y="196" font-size="12.5" fill="#cbd5e1">① 验证成本：人能否当场判断输出对不对</text>
    <text x="20" y="218" font-size="12.5" fill="#cbd5e1">② 错误成本：错了会怎样，动作可逆还是不可逆</text>
    <text x="20" y="246" font-size="12" fill="#64748b">左栏 = 至少一个便宜；右栏 = 两个都贵</text>

    <rect x="0" y="280" width="400" height="120" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="20" y="310" font-size="14" font-weight="700" fill="#fbbf24">反直觉的接口</text>
    <text x="20" y="336" font-size="12.5" fill="#fde68a">右栏恰是可验证 reward 最充足的领域：</text>
    <text x="20" y="356" font-size="12" fill="#cbd5e1">报税 accept/reject · 数据录入对源单据 · QA 有测试结果</text>
    <text x="20" y="384" font-size="12" fill="#94a3b8">左栏开放式生成无 ground truth，反而难做 RL/RSI</text>

    <text x="0" y="440" font-size="12" fill="#475569">图例：</text>
    <rect x="50" y="430" width="14" height="14" rx="3" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="70" y="441" font-size="12" fill="#94a3b8">左栏任务</text>
    <rect x="140" y="430" width="14" height="14" rx="3" fill="#4c0519" stroke="#f43f5e"/>
    <text x="160" y="441" font-size="12" fill="#94a3b8">右栏任务</text>
    <line x1="230" y1="437" x2="270" y2="437" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="278" y="441" font-size="12" fill="#94a3b8">飞轮迁移方向</text>
  </g>

  <text x="36" y="575" font-size="12" fill="#475569">slide 是一张快照；飞轮讲的是快照怎么随时间变 · ROI 必须站在接收方算，否则优化会朝量产 slop 方向走</text>
</svg>
