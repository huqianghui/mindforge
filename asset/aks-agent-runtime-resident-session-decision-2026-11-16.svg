<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .q { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.4; }
      .qt { fill: #f1f5f9; font-size: 15.5px; font-weight: 700; }
      .qs { fill: #94a3b8; font-size: 13.5px; }
      .rR { fill: #1e1638; stroke: #a78bfa; stroke-width: 1.8; }
      .rS { fill: #0e2238; stroke: #38bdf8; stroke-width: 1.8; }
      .rH { fill: #10302d; stroke: #2dd4bf; stroke-width: 1.8; }
      .rhR { fill: #c4b5fd; font-size: 17px; font-weight: 700; }
      .rhS { fill: #7dd3fc; font-size: 17px; font-weight: 700; }
      .rhH { fill: #5eead4; font-size: 17px; font-weight: 700; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .el { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .note { fill: #2a1416; stroke: #f87171; stroke-width: 1.4; }
      .nh { fill: #fca5a5; font-size: 15.5px; font-weight: 700; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
      .ph { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
      .plan { fill: #0f172a; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .pt { fill: #94a3b8; font-size: 13px; font-weight: 600; }
      .conv { stroke: #2dd4bf; stroke-width: 2.4; fill: none; stroke-dasharray: 10 7; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900" rx="16"/>
  <text class="title" x="30" y="44">选哪种形态：先问 agent 跟着谁、状态要活多久，再问算力能不能按人常驻</text>
  <text class="sub" x="30" y="72">左边按顺序回答三个问题；右边是两种形态各自缺的那一块，补上之后就是同一个混合形态</text>

  <!-- Q1 -->
  <rect class="q" x="30" y="100" width="340" height="78" rx="10"/>
  <text class="qt" x="48" y="130">① agent 跟着谁？</text>
  <text class="qs" x="48" y="156">一个固定的人，还是很多调用方</text>
  <path class="edge" d="M370,139 L470,139" marker-end="url(#ar)"/>
  <text class="el" x="382" y="128">很多调用方</text>
  <rect class="rS" x="474" y="100" width="380" height="78" rx="10"/>
  <text class="rhS" x="492" y="130">会话调度</text>
  <text class="t" x="492" y="156">人、渠道、别的 agent 按次调用，按会话计费</text>

  <path class="edge" d="M200,178 L200,236" marker-end="url(#ar)"/>
  <text class="el" x="212" y="212">一个固定的人</text>

  <!-- Q2 -->
  <rect class="q" x="30" y="240" width="340" height="78" rx="10"/>
  <text class="qt" x="48" y="270">② 状态要活多久？</text>
  <text class="qs" x="48" y="296">一个任务内，还是跨周、跨月</text>
  <path class="edge" d="M370,279 L470,279" marker-end="url(#ar)"/>
  <text class="el" x="382" y="268">一个任务内</text>
  <rect class="rS" x="474" y="240" width="380" height="78" rx="10"/>
  <text class="rhS" x="492" y="270">会话调度（Ephemeral 即可）</text>
  <text class="t" x="492" y="296">一个沙箱用到底，TTL 兜底，不做快照</text>

  <path class="edge" d="M200,318 L200,376" marker-end="url(#ar)"/>
  <text class="el" x="212" y="352">跨周、跨月，要记得这个人</text>

  <!-- Q3 -->
  <rect class="q" x="30" y="380" width="340" height="78" rx="10"/>
  <text class="qt" x="48" y="410">③ 算力能按人常驻吗？</text>
  <text class="qs" x="48" y="436">每人至少 4 vCPU / 8Gi 的请求量</text>
  <path class="edge" d="M370,419 L470,419" marker-end="url(#ar)"/>
  <text class="el" x="382" y="408">人多且常闲着</text>
  <rect class="rH" x="474" y="380" width="380" height="118" rx="10"/>
  <text class="rhH" x="492" y="410">混合</text>
  <text class="t" x="492" y="436">轻量的常驻入口保管记忆和人的界面，</text>
  <text class="t" x="492" y="458">长任务和批量活交给会话执行池，</text>
  <text class="t" x="492" y="480">做完把结论写回这个人的记忆</text>

  <path class="edge" d="M200,458 L200,526" marker-end="url(#ar)"/>
  <text class="el" x="212" y="496">能：人数有限，岗位价值高</text>

  <rect class="rR" x="30" y="530" width="824" height="96" rx="10"/>
  <text class="rhR" x="48" y="560">常驻实例</text>
  <text class="t" x="48" y="586">每人一个 Pod 和 HOME 盘，原生界面直接用，记忆和会话都在盘上；值班、开发助手、跨时区接力这类</text>
  <text class="t" x="48" y="608">"人不在它也在推进"的场景。代价是算力和盘按人付，暂停要人去点，单副本没有故障切换</text>

  <!-- 横切提醒 -->
  <rect class="note" x="30" y="652" width="824" height="226" rx="12"/>
  <text class="nh" x="48" y="684">不论选哪种，下面几条要单独判断</text>
  <text class="t" x="48" y="714">• agent 要对企业资源做写操作（推代码、改工单、调配置）：出站要收成只剩网关一条路，</text>
  <text class="t" x="64" y="736">按"agent × 资源 × 动作"逐请求授权（系列 04）。公网默认放行加黑名单只适合读资料、查文档这类场景</text>
  <text class="t" x="48" y="768">• 令牌永远不进沙箱：两种形态都已经这样做，一个用 Broker 换凭据只回结果，一个由网关在授权后注入（系列 09）</text>
  <text class="t" x="48" y="800">• 记忆不授予任何权限：记忆里写着"上次批准过"，这次也要按当前的策略重新判断</text>
  <text class="t" x="48" y="832">• 预算要算硬上限还是软上限：网关的花费和 token 限流多在响应之后结算，单次超支挡不住</text>
  <text class="t" x="64" y="854">（系列 08 补充），月度预算是"超了之后拒绝下一次"</text>

  <!-- 右：两种形态在往一起走 -->
  <rect class="panel" x="880" y="100" width="490" height="778" rx="14"/>
  <text class="ph" x="902" y="134">两种形态在往一起走</text>

  <rect class="rR" x="902" y="156" width="446" height="62" rx="10"/>
  <text class="rhR" x="920" y="184">常驻实例</text>
  <text class="t" x="920" y="206">已有：人的入口、私有记忆、团队 Skills</text>

  <rect class="plan" x="902" y="236" width="446" height="148" rx="10"/>
  <text class="pt" x="920" y="262">路线图上计划补的</text>
  <text class="t" x="920" y="290">Run / Session 层：长任务的检查点与恢复，</text>
  <text class="t" x="920" y="312">权限随任务收放</text>
  <text class="t" x="920" y="342">共享 agent 池：多副本可互换、HOME 随用随弃、</text>
  <text class="t" x="920" y="364">一把网关 key 按任务归因、无入站路由、队列驱动</text>

  <rect class="rS" x="902" y="510" width="446" height="62" rx="10"/>
  <text class="rhS" x="920" y="538">会话调度</text>
  <text class="t" x="920" y="560">已有：会话 API、checkpoint、lease 与 fencing</text>

  <rect class="plan" x="902" y="590" width="446" height="110" rx="10"/>
  <text class="pt" x="920" y="616">它缺的</text>
  <text class="t" x="920" y="644">跨会话、按人归属的长期记忆</text>
  <text class="t" x="920" y="672">给人用的入口和原生界面</text>

  <path class="conv" d="M1125,384 L1125,448" marker-end="url(#ag)"/>
  <path class="conv" d="M1125,510 L1125,474" marker-end="url(#ag)"/>
  <rect class="rH" x="960" y="448" width="330" height="0.1" rx="0"/>
  <text class="rhH" x="1125" y="467" text-anchor="middle">补上之后就是对方已有的那一块</text>

  <rect class="rH" x="902" y="726" width="446" height="132" rx="10"/>
  <text class="rhH" x="920" y="756">会合点</text>
  <text class="t" x="920" y="784">共享 agent 池就是会话调度的执行池；</text>
  <text class="t" x="920" y="808">会话调度缺的记忆层，常驻实例的盘上已经有了。</text>
  <text class="t" x="920" y="840">两边最后都会长成：常驻入口 + 会话执行池</text>
</svg>
