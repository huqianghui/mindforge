<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .boxHost { fill: #0f1a2e; stroke: #38bdf8; stroke-width: 1.4; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="760" rx="16"/>
  <text class="title" x="30" y="44">Azure 资源标签守护：事件订阅 + 定时扫描</text>
  <text class="sub" x="30" y="72">两条路径发现偏差，共用一套幂等修复；日志记录一切，邮件只交接自动化解决不了的问题</text>

  <!-- A: 变更来源 -->
  <rect class="box" x="30" y="100" width="240" height="140" rx="10"/>
  <text class="h" x="46" y="128">资源变更来源</text>
  <text class="t" x="46" y="156">Portal 手工改标签</text>
  <text class="t" x="46" y="180">部署流程覆盖标签</text>
  <text class="t" x="46" y="204">其他自动化重配资源</text>
  <text class="t" x="46" y="228">新资源加入资源组</text>

  <!-- B1: Event Grid -->
  <rect class="box" x="320" y="100" width="270" height="120" rx="10"/>
  <text class="h" x="336" y="128">事件路径 · Event Grid</text>
  <text class="t" x="336" y="156">Write / Delete Success 事件</text>
  <text class="t" x="336" y="180">按两个资源组前缀过滤</text>
  <text class="t" x="336" y="204">最多重试 30 次 + 死信存储</text>

  <!-- B2: Timer -->
  <rect class="box" x="320" y="250" width="270" height="120" rx="10"/>
  <text class="h" x="336" y="278">扫描路径 · 每 15 秒</text>
  <text class="t" x="336" y="306">列出两个资源组的资源清单</text>
  <text class="t" x="336" y="330">8 线程并行检查当前状态</text>
  <text class="t" x="336" y="354">兜底事件遗漏与投递延迟</text>

  <!-- C: 统一检查与修复 -->
  <rect class="box" x="640" y="100" width="280" height="270" rx="10"/>
  <text class="h" x="656" y="128">统一检查与修复（幂等）</text>
  <text class="t" x="656" y="158">① 范围校验：只处理两个资源组</text>
  <text class="t" x="656" y="183">② 归一化到真正可标记的父资源</text>
  <text class="t" x="656" y="208">③ 跳过控制事件与不可标记类型</text>
  <text class="t" x="656" y="233">④ 读当前标签，已合规直接返回</text>
  <text class="t" x="656" y="258">⑤ 确认父资源存在，再 Merge</text>
  <text class="t" x="656" y="283">⑥ 写后再读，确认标签已生效</text>
  <text class="tGray" x="656" y="320">ARM 超时 / 429 / 5xx：最多 3 次</text>
  <text class="tGray" x="656" y="345">资源已删除：结束，不重建</text>

  <!-- D1: ARM -->
  <rect class="box" x="970" y="100" width="240" height="120" rx="10"/>
  <text class="h" x="986" y="128">ARM Tags API</text>
  <text class="t" x="986" y="156">PATCH，operation=Merge</text>
  <text class="t" x="986" y="180">只提交需修正的键</text>
  <text class="t" x="986" y="204">其他业务标签原样保留</text>

  <!-- D2: 实测 -->
  <rect class="boxGray" x="970" y="250" width="240" height="120" rx="10"/>
  <text class="h" x="986" y="278">实测恢复（删除→确认）</text>
  <text class="tGray" x="986" y="306">双路正常：2.3 ~ 11.1 秒</text>
  <text class="tGray" x="986" y="330">仅事件路径：5.8 秒</text>
  <text class="tGray" x="986" y="354">仅扫描路径：24.0 秒</text>

  <!-- 运行底座 -->
  <rect class="boxHost" x="30" y="430" width="560" height="250" rx="10"/>
  <text class="h" x="46" y="460">守护程序自身的运行底座（独立资源组）</text>
  <text class="t" x="46" y="492">Functions Premium 计划，至少 1 个常驻实例，避开冷启动</text>
  <text class="t" x="46" y="518">系统托管身份：两个资源组上 Reader + Tag Contributor</text>
  <text class="t" x="46" y="544">订阅级只读 provider 元数据，用来判定类型是否支持标签</text>
  <text class="t" x="46" y="570">Function 存储禁公网和共享密钥，走 Blob/Queue/Table 私有终结点</text>
  <text class="t" x="46" y="596">NAT Gateway 提供访问 ARM 的固定出站路径</text>
  <text class="t" x="46" y="622">Event Grid 死信写入独立存储，留给事后排查</text>
  <text class="t" x="46" y="648">底座资源组自身也受双标签守护，避免被外围治理停掉</text>

  <!-- 日志 -->
  <rect class="box" x="640" y="430" width="280" height="120" rx="10"/>
  <text class="h" x="656" y="458">结构化日志 → Log Analytics</text>
  <text class="t" x="656" y="486">每轮扫描：心跳 + 失败计数</text>
  <text class="t" x="656" y="510">修复最终失败：repair_failed</text>
  <text class="t" x="656" y="534">人工介入信号（如 Key 被禁用）</text>

  <!-- 告警 -->
  <rect class="box" x="970" y="430" width="240" height="120" rx="10"/>
  <text class="h" x="986" y="458">日志告警 · 每分钟评估</text>
  <text class="t" x="986" y="486">5 分钟无扫描心跳，或</text>
  <text class="t" x="986" y="510">2 分钟内 ≥3 次失败、跨 60s</text>
  <text class="t" x="986" y="534">且期间没有成功扫描</text>

  <!-- 邮件 -->
  <rect class="boxAmber" x="970" y="600" width="240" height="80" rx="10"/>
  <text class="hAmber" x="986" y="628">邮件 · 只发人工介入</text>
  <text class="t" x="986" y="656">标签补不上 / Key 被禁用</text>

  <!-- Resolved 抑制 -->
  <rect class="boxGray" x="640" y="600" width="280" height="80" rx="10"/>
  <text class="h" x="656" y="628">恢复通知：不发邮件</text>
  <text class="tGray" x="656" y="656">处理规则移除 Resolved 的动作</text>

  <!-- edges -->
  <path id="e1" class="flow" d="M270,160 L318,160" marker-end="url(#arr)"/>
  <path id="e2" class="flow" d="M590,160 L638,160" marker-end="url(#arr)"/>
  <path id="e3" class="flow" d="M590,310 L638,310" marker-end="url(#arr)"/>
  <path id="e4" class="flow" d="M920,160 L968,160" marker-end="url(#arr)"/>
  <path id="e5" class="flow" d="M780,370 L780,428" marker-end="url(#arr)"/>
  <path id="e6" class="flow" d="M920,490 L968,490" marker-end="url(#arr)"/>
  <path id="e7" class="flowAmber" d="M1090,550 L1090,598" marker-end="url(#arrAmber)"/>
  <path class="flowGray" d="M1010,550 L1010,575 L780,575 L780,598" marker-end="url(#arrGray)"/>

  <!-- particles -->
  <circle r="4" fill="#5eead4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M270,160 L318,160"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M590,160 L638,160"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M590,310 L638,310"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M920,160 L968,160"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M780,370 L780,428"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite" path="M920,490 L968,490"/></circle>
  <circle r="4" fill="#fcd34d"><animateMotion dur="2.4s" repeatCount="indefinite" path="M1090,550 L1090,598"/></circle>

  <text class="tGray" x="30" y="728">图例：青绿=常态处理链路　琥珀=交接给人　灰色虚线=只留记录，不打扰人。测试只在新建 NSG 上删除标签。</text>
</svg>
