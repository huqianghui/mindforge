<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .err { fill: #2a1215; stroke: #f87171; stroke-width: 1.6; }
      .ok { fill: #0f2a24; stroke: #2dd4bf; stroke-width: 1.6; }
      .zone { fill: #0d1729; stroke: #38bdf8; stroke-width: 1.3; stroke-dasharray: 8 6; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hR { fill: #fca5a5; font-size: 15px; font-weight: 600; }
      .hG { fill: #5eead4; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .code { fill: #fecaca; font-size: 13px; font-family: Menlo, monospace; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowR { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 6 6; }
      .badge { fill: #7f1d1d; stroke: #fca5a5; stroke-width: 1.4; }
      .bn { fill: #fff1f2; font-size: 13px; font-weight: 700; text-anchor: middle; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
  </defs>
  <rect class="bg" width="1400" height="720" rx="16"/>
  <text class="title" x="30" y="44">部署 Kling v3 Pro 时遇到的三个报错，对应三种不同的区域约束</text>
  <text class="sub" x="30" y="72">LTX 与 MiniMax 的四个 Global Standard deployment 在同一个 East US 项目一次成功；只有 Kling 卡在区域上</text>

  <rect class="box" x="30" y="110" width="260" height="170" rx="10"/>
  <text class="h" x="48" y="140">起点</text>
  <text class="t" x="48" y="168">Foundry 项目在 East US</text>
  <text class="t" x="48" y="194">目标：Fal-Kling-V3-Pro</text>
  <text class="t" x="48" y="220">文档：Kling 只走 US Data Zone</text>
  <text class="tGray" x="48" y="248">其余四个走 Global Standard</text>

  <!-- 三个报错 -->
  <rect class="err" x="350" y="100" width="560" height="140" rx="10"/>
  <circle class="badge" cx="374" cy="126" r="12"/><text class="bn" x="374" y="131">1</text>
  <text class="hR" x="396" y="131">选了 Global Standard</text>
  <text class="code" x="370" y="160">'Fal-Kling-V3-Pro' (Global Standard) isn't available</text>
  <text class="code" x="370" y="180">to deploy in your project's region (eastus)</text>
  <text class="t" x="370" y="208">约束：部署类型。Kling 不提供 Global Standard，换 Data Zone Standard</text>
  <text class="tGray" x="370" y="230">这一条是选错，改选项即可</text>

  <rect class="err" x="350" y="260" width="560" height="140" rx="10"/>
  <circle class="badge" cx="374" cy="286" r="12"/><text class="bn" x="374" y="291">2</text>
  <text class="hR" x="396" y="291">改成 Data Zone Standard，仍然报错</text>
  <text class="code" x="370" y="320">Data Zone Standard is not supported in your</text>
  <text class="code" x="370" y="340">project's region East US</text>
  <text class="t" x="370" y="368">约束：模型级的项目区域白名单。通用 Data Zone 支持 East US 不算数</text>
  <text class="tGray" x="370" y="390">Learn 页面没有列出 Kling 的可用区域，只能换区试或问产品组</text>

  <rect class="err" x="350" y="420" width="560" height="140" rx="10"/>
  <circle class="badge" cx="374" cy="446" r="12"/><text class="bn" x="374" y="451">3</text>
  <text class="hR" x="396" y="451">换到 West Central US 新建资源</text>
  <text class="code" x="370" y="480">location 'westcentralus' is not available for</text>
  <text class="code" x="370" y="500">resource type 'microsoft.insights/components'</text>
  <text class="t" x="370" y="528">约束：附带创建的 Application Insights 不支持该区域</text>
  <text class="tGray" x="370" y="550">和模型无关，是向导里顺带建的遥测资源</text>

  <path class="flowR" d="M290,170 L348,170" marker-end="url(#arrR)"/>
  <path class="flowR" d="M630,240 L630,258" marker-end="url(#arrR)"/>
  <path class="flowR" d="M630,400 L630,418" marker-end="url(#arrR)"/>

  <!-- 右侧：三种区域概念 -->
  <rect class="zone" x="960" y="100" width="410" height="460" rx="12"/>
  <text class="zl" x="980" y="128">三种区域概念，各管各的</text>
  <rect class="ok" x="980" y="146" width="370" height="120" rx="10"/>
  <text class="hG" x="996" y="174">Foundry 资源 / 项目区域</text>
  <text class="t" x="996" y="200">决定能部署哪些模型与部署类型</text>
  <text class="t" x="996" y="224">对应报错 ①②</text>
  <text class="tGray" x="996" y="248">资源存储留在所属 geography</text>
  <rect class="ok" x="980" y="280" width="370" height="120" rx="10"/>
  <text class="hG" x="996" y="308">Data Zone / Global 处理范围</text>
  <text class="t" x="996" y="334">推理数据允许在哪个地理范围处理</text>
  <text class="t" x="996" y="358">Kling：美国数据区</text>
  <text class="tGray" x="996" y="382">fal 一段另在 Microsoft 设施之外</text>
  <rect class="ok" x="980" y="414" width="370" height="128" rx="10"/>
  <text class="hG" x="996" y="442">附属资源区域</text>
  <text class="t" x="996" y="468">Application Insights 有自己的区域表</text>
  <text class="t" x="996" y="492">对应报错 ③</text>
  <text class="tGray" x="996" y="516">可单独选 eastus2 等支持区</text>

  <path class="flow" d="M912,170 L978,206" marker-end="url(#arr)"/>
  <path class="flow" d="M912,330 L978,226" marker-end="url(#arr)"/>
  <path class="flow" d="M912,490 L978,478" marker-end="url(#arr)"/>

  <rect class="zone" x="30" y="590" width="1340" height="106" rx="12"/>
  <text class="h" x="50" y="620">排查顺序</text>
  <text class="t" x="50" y="648">先看部署类型是否和文档一致 → 再判断是模型级区域白名单还是通用区域 → 最后把向导顺带创建的资源（Application Insights 等）单独指定区域。</text>
  <text class="tGray" x="50" y="676">报错文本里出现的 resource type 是最快的分辨线索：microsoft.insights/components 说明卡在附属资源，而不是模型本身。</text>
</svg>
