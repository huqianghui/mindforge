<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { fill: #2e4c6b; font-size: 22px; font-weight: 700; }
      .sub { fill: #5e718d; font-size: 14px; }
      .panR { fill: #f4f2fa; stroke: #2a0693; stroke-width: 1.8; }
      .panS { fill: #f1f6fb; stroke: #0c89c0; stroke-width: 1.8; }
      .hdR { fill: #220495; font-size: 20px; font-weight: 700; }
      .hdS { fill: #036696; font-size: 20px; font-weight: 700; }
      .hs { fill: #5e718d; font-size: 13.5px; }
      .box { fill: #f6f8fb; stroke: #7087a9; stroke-width: 1.2; }
      .boxR { fill: #f4f2fa; stroke: #440fbd; stroke-width: 1.4; }
      .boxS { fill: #f1f6fb; stroke: #1087bc; stroke-width: 1.4; }
      .boxG { fill: #f2fbfa; stroke: #26a696; stroke-width: 1.4; }
      .boxW { fill: #f9f3f3; stroke: #920707; stroke-width: 1.4; }
      .zone { fill: none; stroke: #7688a2; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .zl { fill: #5e718d; font-size: 13px; font-weight: 600; }
      .bt { fill: #2e4d6b; font-size: 15px; font-weight: 700; }
      .t { fill: #384b61; font-size: 13.5px; }
      .tg { fill: #1bb199; font-size: 13.5px; font-weight: 600; }
      .tr { fill: #940505; font-size: 13.5px; font-weight: 600; }
      .ty { fill: #c49808; font-size: 13.5px; font-weight: 600; }
      .numR { fill: #440fbd; }
      .numS { fill: #1087bc; }
      .nt { fill: #2b2b2b; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .flowR { stroke: #2a0693; stroke-width: 2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .flowS { stroke: #0c89c0; stroke-width: 2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .flowW { stroke: #920707; stroke-width: 2; fill: none; stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .lgh { fill: #344965; font-size: 15px; font-weight: 700; }
      .lg { fill: #384b61; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.3; } }
    </style>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a0693"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c89c0"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#920707"/></marker>
  </defs>
  <rect class="bg" width="1400" height="1000" rx="16"/>
  <text class="title" x="30" y="44">常驻实例与会话调度：同样把 harness 关进 Kata，状态和控制点放在不同地方</text>
  <text class="sub" x="30" y="72">左边是每人一个长期在线的 agent，右边是控制面按会话领沙箱；编号对应底部图例</text>

  <!-- ========== 左：常驻实例 ========== -->
  <rect class="panR" x="30" y="92" width="660" height="608" rx="14"/>
  <text class="hdR" x="52" y="126">常驻实例</text>
  <text class="hs" x="150" y="126">每人一个长期在线的 agent，状态就在它自己的 HOME 盘上</text>

  <rect class="box" x="50" y="146" width="290" height="76" rx="10"/>
  <text class="bt" x="66" y="174">门户 · 入口网关</text>
  <text class="t" x="66" y="198">Entra 登录，按实例名校验归属</text>
  <text class="t" x="66" y="216">建实例、选模型、打开原生界面</text>

  <rect class="box" x="370" y="146" width="300" height="76" rx="10"/>
  <text class="bt" x="386" y="174">Operator</text>
  <text class="t" x="386" y="198">Agent / Team / AgentPolicy</text>
  <text class="t" x="386" y="216">每个实例一个 namespace 和 Helm release</text>

  <rect class="zone" x="50" y="262" width="620" height="262" rx="12"/>
  <text class="zl" x="66" y="284">用户 namespace（一人一个）</text>

  <rect class="boxR" x="66" y="298" width="380" height="210" rx="10"/>
  <text class="bt" x="82" y="324">StatefulSet · 固定 1 副本 · Kata</text>
  <rect class="box" x="82" y="338" width="348" height="50" rx="8"/>
  <text class="t" x="96" y="359">harness：Hermes / OpenClaw / 自带镜像</text>
  <text class="t" x="96" y="379">用 harness 自己的界面和会话</text>
  <rect class="box" x="82" y="396" width="348" height="44" rx="8"/>
  <text class="t" x="96" y="423">旁路容器：桌面（noVNC）· 终端 · 日志</text>
  <rect class="boxG" x="82" y="448" width="348" height="46" rx="8"/>
  <text class="tg" x="96" y="476">不挂 SA token · 准入策略拒绝 exec</text>

  <rect class="boxG pulse" x="462" y="298" width="192" height="210" rx="10"/>
  <text class="bt" x="478" y="324">HOME 盘</text>
  <text class="t" x="478" y="350">100Gi · RWO</text>
  <text class="t" x="478" y="372">删除和缩容都保留</text>
  <text class="t" x="478" y="404">里面是：</text>
  <text class="tg" x="478" y="426">原生会话历史</text>
  <text class="tg" x="478" y="448">私有记忆</text>
  <text class="tg" x="478" y="470">配置与工作文件</text>

  <rect class="box" x="50" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="64" y="588">AI 网关</text>
  <text class="t" x="64" y="612">每实例一把 Virtual Key</text>
  <text class="t" x="64" y="634">按策略授权模型</text>
  <text class="t" x="64" y="656">月度美元预算</text>

  <rect class="box" x="262" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="276" y="588">凭据 Broker</text>
  <text class="t" x="276" y="612">每次调用 OBO 换凭据</text>
  <text class="t" x="276" y="634">只把过滤后的结果</text>
  <text class="t" x="276" y="656">返回给 agent</text>

  <rect class="boxW" x="474" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="488" y="588">直接出站</text>
  <text class="tr" x="488" y="612">公网默认放行</text>
  <text class="t" x="488" y="634">按网段 / 域名 / 端口拉黑</text>
  <text class="t" x="488" y="656">内网走白名单 · 有审计</text>

  <!-- 左侧数据流 -->
  <path class="flowR" d="M300,222 L300,298" marker-end="url(#aR)"/>
  <circle class="numR" cx="320" cy="242" r="12"/><text class="nt" x="320" y="247">1</text>
  <path class="flowR" d="M520,222 L520,262" marker-end="url(#aR)"/>
  <circle class="numR" cx="540" cy="242" r="12"/><text class="nt" x="540" y="247">2</text>
  <path class="flowR" d="M148,508 L148,560" marker-end="url(#aR)"/>
  <circle class="numR" cx="128" cy="534" r="12"/><text class="nt" x="128" y="539">3</text>
  <path class="flowR" d="M360,508 L360,560" marker-end="url(#aR)"/>
  <circle class="numR" cx="340" cy="534" r="12"/><text class="nt" x="340" y="539">4</text>
  <path class="flowW" d="M430,508 Q470,534 540,560" marker-end="url(#aW)"/>
  <circle class="numR" cx="500" cy="530" r="12"/><text class="nt" x="500" y="535">5</text>

  <!-- ========== 右：会话调度 ========== -->
  <rect class="panS" x="710" y="92" width="660" height="608" rx="14"/>
  <text class="hdS" x="732" y="126">会话调度</text>
  <text class="hs" x="830" y="126">控制面按会话领沙箱，状态在快照镜像和状态库里</text>

  <rect class="box" x="730" y="146" width="270" height="76" rx="10"/>
  <text class="bt" x="746" y="174">会话 API · 收件箱</text>
  <text class="t" x="746" y="198">调用方可以是人、渠道</text>
  <text class="t" x="746" y="216">或另一个 agent</text>

  <rect class="box" x="1030" y="146" width="320" height="76" rx="10"/>
  <text class="bt" x="1046" y="174">控制面</text>
  <text class="t" x="1046" y="198">状态机 · 执行器 · 适配器</text>
  <text class="t" x="1046" y="216">每 15 秒一次维护循环</text>

  <rect class="zone" x="730" y="262" width="620" height="262" rx="12"/>
  <text class="zl" x="746" y="284">Kata 节点池（沙箱按会话来去）</text>

  <rect class="box" x="746" y="298" width="170" height="210" rx="10"/>
  <text class="bt" x="762" y="324">预热池</text>
  <text class="t" x="762" y="350">现成的 Pod</text>
  <text class="t" x="762" y="372">等着被领取</text>
  <text class="tg" x="762" y="410">领取约 1.2 秒</text>
  <text class="t" x="762" y="448">领走后池子</text>
  <text class="t" x="762" y="470">自动补一个</text>

  <rect class="boxS" x="932" y="298" width="236" height="210" rx="10"/>
  <text class="bt" x="948" y="324">会话沙箱</text>
  <rect class="box" x="946" y="338" width="208" height="50" rx="8"/>
  <text class="t" x="958" y="359">编码 CLI 免确认运行</text>
  <text class="t" x="958" y="379">适配器统一成事件流</text>
  <rect class="box" x="946" y="396" width="208" height="44" rx="8"/>
  <text class="t" x="958" y="423">只开执行守护进程一个口</text>
  <rect class="boxG" x="946" y="448" width="208" height="46" rx="8"/>
  <text class="tg" x="958" y="476">无凭据 · 出站默认拒绝</text>

  <rect class="box" x="1184" y="298" width="150" height="210" rx="10"/>
  <text class="bt" x="1198" y="324">快照仓库</text>
  <text class="t" x="1198" y="350">rootfs 打成镜像</text>
  <text class="ty" x="1198" y="384">每次 31~41 秒</text>
  <text class="t" x="1198" y="418">恢复 9.5~11.2 秒</text>
  <text class="t" x="1198" y="452">进程与 VM</text>
  <text class="t" x="1198" y="474">每次都是新的</text>

  <rect class="box" x="730" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="744" y="588">状态库</text>
  <text class="t" x="744" y="612">会话 · 轮次 · 副作用意图</text>
  <text class="t" x="744" y="634">多副本时加 lease</text>
  <text class="t" x="744" y="656">和 fencing token</text>

  <rect class="boxG" x="942" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="956" y="588">出站网关</text>
  <text class="tg" x="956" y="612">唯一的出站路径</text>
  <text class="t" x="956" y="634">申请 ∩ 批准 ∩ 发布</text>
  <text class="t" x="956" y="656">授权后才注入凭据</text>

  <rect class="box" x="1154" y="560" width="196" height="122" rx="10"/>
  <text class="bt" x="1168" y="588">模型网关</text>
  <text class="t" x="1168" y="612">按请求体 model 授权</text>
  <text class="t" x="1168" y="634">Messages 转 Responses</text>
  <text class="t" x="1168" y="656">凭据只在网关里</text>

  <!-- 右侧数据流 -->
  <path class="flowS" d="M1000,184 L1030,184" marker-end="url(#aS)"/>
  <circle class="numS" cx="1015" cy="160" r="12"/><text class="nt" x="1015" y="165">1</text>
  <path class="flowS" d="M1190,222 L1190,250 L1050,250 L1050,298" marker-end="url(#aS)"/>
  <circle class="numS" cx="1120" cy="250" r="12"/><text class="nt" x="1120" y="255">2</text>
  <path class="flowS" d="M916,404 L932,404" marker-end="url(#aS)"/>
  <path class="flowS" d="M1168,404 L1184,404" marker-end="url(#aS)"/>
  <circle class="numS" cx="1176" cy="380" r="12"/><text class="nt" x="1176" y="385">3</text>
  <path class="flowS" d="M1040,508 L1040,560" marker-end="url(#aS)"/>
  <circle class="numS" cx="1020" cy="534" r="12"/><text class="nt" x="1020" y="539">4</text>
  <path class="flowS" d="M1300,222 L1300,246 L1362,246 L1362,540 L828,540 L828,560" marker-end="url(#aS)"/>
  <circle class="numS" cx="1362" cy="400" r="12"/><text class="nt" x="1362" y="405">5</text>

  <!-- ========== 图例 ========== -->
  <rect class="box" x="30" y="720" width="1340" height="262" rx="14"/>
  <text class="lgh" x="52" y="752">常驻实例</text>
  <circle class="numR" cx="62" cy="780" r="10"/><text class="nt" x="62" y="785">1</text>
  <text class="lg" x="82" y="785">用户经入口网关和归属校验，直接打开自己实例里 harness 的原生界面</text>
  <circle class="numR" cx="62" cy="812" r="10"/><text class="nt" x="62" y="817">2</text>
  <text class="lg" x="82" y="817">Operator 建 namespace、StatefulSet 和 HOME 盘；暂停就是缩到 0，盘留着</text>
  <circle class="numR" cx="62" cy="844" r="10"/><text class="nt" x="62" y="849">3</text>
  <text class="lg" x="82" y="849">模型请求只走 AI 网关，实例手里只有自己那把 Virtual Key</text>
  <circle class="numR" cx="62" cy="876" r="10"/><text class="nt" x="62" y="881">4</text>
  <text class="lg" x="82" y="881">访问 Azure 资源走 Broker，令牌不进 Pod，只拿回过滤后的结果</text>
  <circle class="numR" cx="62" cy="908" r="10"/><text class="nt" x="62" y="913">5</text>
  <text class="lg" x="82" y="913">其余出站直接出 Pod：公网默认放行，内网和 IMDS 默认挡住</text>
  <text class="lg" x="82" y="945">状态的单位是"人"，Pod 和盘一直跟着这个人</text>

  <text class="lgh" x="712" y="752">会话调度</text>
  <circle class="numS" cx="722" cy="780" r="10"/><text class="nt" x="722" y="785">1</text>
  <text class="lg" x="742" y="785">调用方把消息投进会话收件箱，控制面先写状态库再动手</text>
  <circle class="numS" cx="722" cy="812" r="10"/><text class="nt" x="722" y="817">2</text>
  <text class="lg" x="742" y="817">控制面从预热池领一个沙箱给这个会话，经执行守护进程驱动 harness</text>
  <circle class="numS" cx="722" cy="844" r="10"/><text class="nt" x="722" y="849">3</text>
  <text class="lg" x="742" y="849">Durable 会话每轮做 checkpoint，空闲就暂停，下次从镜像恢复</text>
  <circle class="numS" cx="722" cy="876" r="10"/><text class="nt" x="722" y="881">4</text>
  <text class="lg" x="742" y="881">沙箱只有出站网关这一条路，逐请求授权，通过后才注入凭据</text>
  <circle class="numS" cx="722" cy="908" r="10"/><text class="nt" x="722" y="913">5</text>
  <text class="lg" x="742" y="913">会话、轮次和"谁能写结果"都记在状态库，沙箱随时可以换</text>
  <text class="lg" x="742" y="945">状态的单位是"会话"，沙箱只是它临时借用的执行环境</text>
</svg>
