<text class="lgh" x="30" y="818">怎么用</text>
<text class="lg" x="30" y="846">时间少就只读每条路径的前三站；补充篇是对某个组件的深挖和实测，正篇读完觉得"这块到底怎么做"时再去读。所有篇都能单独读，引用前文时会给出链接</text>
