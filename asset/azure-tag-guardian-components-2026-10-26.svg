<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .zone { fill: none; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zoneV { fill: #0d1729; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .zl { fill: #7dd3fc; font-size: 14px; font-weight: 600; }
      .zlv { fill: #94a3b8; font-size: 13.5px; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .h15 { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #a7f3d0; font-size: 13px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="830" rx="16"/>
  <text class="title" x="30" y="44">Azure 组件视角：标签守护的处理流程</text>
  <text class="sub" x="30" y="72">编号对应一次"标签被删除 → 补回 → 必要时通知人"的数据流；扫描路径从 ④ 起独立运行，不依赖事件</text>

  <!-- ===== 外部与控制平面 ===== -->
  <rect class="box" x="30" y="110" width="200" height="90" rx="10"/>
  <text class="h" x="46" y="138">变更发起方</text>
  <text class="t" x="46" y="164">Portal / CLI / 部署</text>
  <text class="t" x="46" y="186">其他自动化</text>

  <rect class="box" x="30" y="220" width="200" height="120" rx="10"/>
  <text class="h" x="46" y="248">业务资源组</text>
  <text class="t" x="46" y="274">Azure OpenAI / 应用 / 网络</text>
  <text class="t" x="46" y="298">缺失时补保护标签</text>
  <text class="tGray" x="46" y="322">已有同名键保留原值</text>

  <rect class="boxBlue" x="300" y="110" width="260" height="180" rx="10"/>
  <text class="h" x="316" y="138">Azure Resource Manager</text>
  <text class="t" x="316" y="166">所有资源写入的控制平面</text>
  <text class="t" x="316" y="192">Resources API：列出清单</text>
  <text class="t" x="316" y="218">Tags API：读 / Merge 写</text>
  <text class="t" x="316" y="244">Providers API：是否支持标签</text>
  <text class="tGray" x="316" y="272">超时 / 429 / 5xx：重试 3 次</text>

  <rect class="boxBlue" x="640" y="110" width="250" height="150" rx="10"/>
  <text class="h" x="656" y="138">Event Grid</text>
  <text class="t" x="656" y="166">系统主题：订阅级资源事件</text>
  <text class="t" x="656" y="190">Write / Delete Success</text>
  <text class="t" x="656" y="214">事件订阅：资源组前缀过滤</text>
  <text class="t" x="656" y="238">重试 30 次 · TTL 1440 分钟</text>

  <rect class="boxGray" x="970" y="110" width="210" height="110" rx="10"/>
  <text class="h15" x="986" y="138">Storage（死信）</text>
  <text class="tGray" x="986" y="164">投递彻底失败的事件</text>
  <text class="tGray" x="986" y="188">禁共享密钥 · 默认拒绝</text>
  <text class="tGray" x="986" y="210">Event Grid 身份写入</text>

  <rect class="boxBlue" x="30" y="430" width="200" height="90" rx="10"/>
  <text class="h" x="46" y="458">Microsoft Entra ID</text>
  <text class="t" x="46" y="484">签发托管身份 token</text>
  <text class="tGray" x="46" y="506">无密钥、无个人登录</text>

  <!-- ===== 守护资源组 ===== -->
  <rect class="zone" x="280" y="360" width="1100" height="360" rx="14"/>
  <text class="zl" x="296" y="384">守护资源组（独立，自身及资源同样受双标签守护）</text>

  <rect class="zoneV" x="300" y="398" width="640" height="310" rx="10"/>
  <text class="zlv" x="668" y="416">VNet（集成 / 私有终结点 / 部署子网）</text>

  <rect class="box" x="320" y="425" width="330" height="170" rx="10"/>
  <text class="h" x="336" y="452">Function App · Premium 常驻</text>
  <text class="t" x="336" y="480">事件处理函数　Event Grid 触发</text>
  <text class="t" x="336" y="504">定时扫描函数　Timer 每 15 秒</text>
  <text class="t" x="336" y="528">健康检查函数　HTTP</text>
  <text class="t" x="336" y="554">系统托管身份：Reader + Tag Contributor</text>
  <text class="tGray" x="336" y="578">8 线程并行 · 写后再读确认</text>

  <rect class="box" x="320" y="615" width="330" height="80" rx="10"/>
  <text class="h15" x="336" y="642">NAT Gateway + 公网 IP</text>
  <text class="t" x="336" y="668">固定出站路径，访问 ARM 与 Entra</text>

  <rect class="box" x="690" y="425" width="230" height="75" rx="10"/>
  <text class="h15" x="706" y="451">私有终结点 + Private DNS</text>
  <text class="t" x="706" y="477">Blob / Queue / Table</text>

  <rect class="box" x="690" y="510" width="230" height="75" rx="10"/>
  <text class="h15" x="706" y="536">Storage（运行时 + 代码包）</text>
  <text class="t" x="706" y="562">禁公网 · 禁共享密钥</text>

  <rect class="boxGray" x="690" y="630" width="230" height="65" rx="10"/>
  <text class="h15" x="706" y="656">临时 ACI · 私网发布</text>
  <text class="tGray" x="706" y="680">部署身份，用后删除</text>

  <!-- 监控列 -->
  <rect class="box" x="980" y="400" width="380" height="58" rx="10"/>
  <text class="h15" x="996" y="424">Application Insights</text>
  <text class="t" x="996" y="446">函数日志：心跳 / 修复失败 / 人工介入信号</text>

  <rect class="box" x="980" y="474" width="380" height="58" rx="10"/>
  <text class="h15" x="996" y="498">Log Analytics 工作区</text>
  <text class="t" x="996" y="520">AppTraces 表，供告警查询</text>

  <rect class="box" x="980" y="548" width="380" height="70" rx="10"/>
  <text class="h15" x="996" y="573">日志告警规则 · 每分钟评估</text>
  <text class="t" x="996" y="597">5 分钟无心跳，或持续失败 ≥60 秒且无成功扫描</text>

  <rect class="boxAmber" x="980" y="634" width="180" height="70" rx="10"/>
  <text class="hAmber" x="996" y="660">Action Group</text>
  <text class="t" x="996" y="684">邮件：需人工介入</text>

  <rect class="boxGray" x="1180" y="634" width="180" height="70" rx="10"/>
  <text class="h15" x="1196" y="660">Alert Processing</text>
  <text class="tGray" x="1196" y="684">Resolved 移除通知</text>

  <!-- ===== edges ===== -->
  <!-- ① 变更 → ARM -->
  <path class="flow" d="M230,155 L298,155" marker-end="url(#arr)"/>
  <!-- ② ARM → Event Grid -->
  <path class="flow" d="M560,165 L638,165" marker-end="url(#arr)"/>
  <!-- ③ Event Grid → Function -->
  <path class="flow" d="M765,260 L765,340 L600,340 L600,423" marker-end="url(#arr)"/>
  <!-- 死信 -->
  <path class="flowGray" d="M890,165 L968,165" marker-end="url(#arrGray)"/>
  <!-- ④⑥ Function ↔ ARM -->
  <path class="flow" d="M430,423 L430,292" marker-end="url(#arr)"/>
  <!-- ⑤ Function → Entra -->
  <path class="flow" d="M320,475 L232,475" marker-end="url(#arr)"/>
  <!-- ⑥ ARM → 业务资源组 -->
  <path class="flow" d="M300,280 L232,280" marker-end="url(#arr)"/>
  <!-- Function → NAT -->
  <path class="flowGray" d="M485,595 L485,613" marker-end="url(#arrGray)"/>
  <!-- Function → 私有终结点 → Storage -->
  <path class="flowGray" d="M650,462 L688,462" marker-end="url(#arrGray)"/>
  <path class="flowGray" d="M805,500 L805,508" marker-end="url(#arrGray)"/>
  <path class="flowGray" d="M805,630 L805,587" marker-end="url(#arrGray)"/>
  <!-- ⑦ Function → App Insights -->
  <path class="flow" d="M650,580 L670,580 L670,610 L955,610 L955,429 L978,429" marker-end="url(#arr)"/>
  <path class="flow" d="M1170,458 L1170,472" marker-end="url(#arr)"/>
  <path class="flow" d="M1170,532 L1170,546" marker-end="url(#arr)"/>
  <!-- ⑧ Alert → Action Group / APR -->
  <path class="flowAmber" d="M1070,618 L1070,632" marker-end="url(#arrAmber)"/>
  <path class="flowGray" d="M1270,618 L1270,632" marker-end="url(#arrGray)"/>

  <!-- particles -->
  <circle r="4" fill="#5eead4"><animateMotion dur="1.4s" repeatCount="indefinite" path="M230,155 L298,155"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M560,165 L638,165"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M765,260 L765,340 L600,340 L600,423"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M430,423 L430,292"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M320,475 L232,475"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="1.4s" begin="1.5s" repeatCount="indefinite" path="M300,280 L232,280"/></circle>
  <circle r="4" fill="#5eead4"><animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M650,580 L670,580 L670,610 L955,610 L955,429 L978,429"/></circle>
  <circle r="4" fill="#fcd34d"><animateMotion dur="1.6s" repeatCount="indefinite" path="M1070,618 L1070,632"/></circle>

  <!-- badges -->
  <circle class="badge" cx="264" cy="137" r="12"/><text class="bn" x="264" y="142">1</text>
  <circle class="badge" cx="599" cy="147" r="12"/><text class="bn" x="599" y="152">2</text>
  <circle class="badge" cx="682" cy="324" r="12"/><text class="bn" x="682" y="329">3</text>
  <text class="el" x="700" y="329">推送事件</text>
  <circle class="badge" cx="412" cy="330" r="12"/><text class="bn" x="412" y="335">4</text>
  <text class="el" x="442" y="326">列清单 / 读标签</text>
  <text class="el" x="442" y="346">Merge 写入（经 NAT）</text>
  <circle class="badge" cx="276" cy="456" r="12"/><text class="bn" x="276" y="461">5</text>
  <circle class="badge" cx="266" cy="262" r="12"/><text class="bn" x="266" y="267">6</text>
  <circle class="badge" cx="880" cy="610" r="12"/><text class="bn" x="880" y="615">7</text>
  <circle class="badgeAmber" cx="1048" cy="625" r="12"/><text class="bn" x="1048" y="630">8</text>

  <!-- step legend -->
  <text class="t" x="30" y="752">① 资源或标签变更写入 ARM　② ARM 向订阅系统主题发布 Write/Delete 事件　③ 事件订阅过滤后推给事件处理函数（失败重试，超限进死信）</text>
  <text class="t" x="30" y="778">④ 函数（或 15 秒定时扫描）经 NAT 调 ARM 列清单、读标签　⑤ 托管身份向 Entra 取 token　⑥ Tags API 以 Merge 补齐，再读一次确认</text>
  <text class="t" x="30" y="804">⑦ 心跳与失败写入 Application Insights / Log Analytics　⑧ 告警只在持续未恢复时经 Action Group 发邮件，Resolved 被处理规则移除</text>
</svg>
