<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2dd4bf"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#fbbf24"/></marker>
    <marker id="aV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a78bfa"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    @keyframes flowDash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%,100% { opacity: 0.18; } 50% { opacity: 0.7; } }
    @keyframes shimmer { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .flow  { stroke-dasharray: 10 12; animation: flowDash 1.4s linear infinite; }
    .flowA { stroke-dasharray: 8 12;  animation: flowDash 1.7s linear infinite; }
    .flowV { stroke-dasharray: 8 12;  animation: flowDash 1.9s linear infinite; }
    .halo  { animation: pulse 2s ease-in-out infinite; }
    .live  { animation: shimmer 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="540" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="538" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="21" font-weight="700" fill="#e2e8f0">应答门控状态机 — 在 ③ 判停与 ④ 开轮之间，应用自己决定回不回、回几次、说什么</text>
  <text x="36" y="66" font-size="12" fill="#64748b">create_response=false 之后的 dialog policy 层 · 每道题最多致谢一次由状态保证，不靠提示词 · 2026.09</text>

  <!-- return arcs (behind nodes) -->
  <path d="M330 200 C 330 120, 115 120, 115 200" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aA)"/>
  <text x="222" y="128" font-size="10.5" fill="#fcd34d" text-anchor="middle">speech_started → 取消计时</text>
  <path d="M555 200 C 555 88, 115 88, 115 198" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aA)"/>
  <text x="335" y="96" font-size="10.5" fill="#fcd34d" text-anchor="middle">speech_started → 丢弃已准备的内容，回到聆听</text>

  <!-- LISTENING -->
  <g filter="url(#softGlow)"><rect x="40" y="200" width="150" height="80" rx="12" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5" class="live"/></g>
  <text x="115" y="228" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">LISTENING</text>
  <text x="115" y="248" font-size="10.5" fill="#94a3b8" text-anchor="middle">候选人在答题</text>
  <text x="115" y="264" font-size="10" fill="#64748b" text-anchor="middle">转写累计进答案缓冲区</text>

  <path d="M190 240 L 248 240" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#aT)"/>
  <text x="219" y="230" font-size="10" fill="#5eead4" text-anchor="middle">speech_stopped</text>

  <!-- PENDING -->
  <g filter="url(#softGlow)"><rect x="250" y="200" width="160" height="80" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="1.5"/></g>
  <text x="330" y="228" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">PENDING</text>
  <text x="330" y="248" font-size="10.5" fill="#94a3b8" text-anchor="middle">计时 T1 ≈ 1.2s</text>
  <text x="330" y="264" font-size="10" fill="#64748b" text-anchor="middle">或 EOU 概率过阈值</text>

  <path d="M410 240 L 468 240" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flowA" marker-end="url(#aA)"/>
  <text x="439" y="230" font-size="10" fill="#fcd34d" text-anchor="middle">试探完成</text>

  <!-- PREPARING -->
  <g filter="url(#softGlow)"><rect x="470" y="200" width="170" height="80" rx="12" fill="#1c1738" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="555" y="226" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">PREPARING</text>
  <text x="555" y="244" font-size="10.5" fill="#94a3b8" text-anchor="middle">预生成致谢 · 预取下一题</text>
  <text x="555" y="260" font-size="10.5" fill="#c4b5fd" text-anchor="middle">完成度判断（LLM judge）</text>
  <text x="555" y="274" font-size="10" fill="#64748b" text-anchor="middle">不出声</text>

  <path d="M640 240 L 698 240" fill="none" stroke="#a78bfa" stroke-width="2.5" class="flowV" marker-end="url(#aV)"/>
  <text x="669" y="230" font-size="10" fill="#c4b5fd" text-anchor="middle">T2 ≈ 2.5s / 按钮</text>

  <!-- COMPLETE -->
  <g filter="url(#softGlow)"><rect x="700" y="200" width="140" height="80" rx="12" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="770" y="228" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">COMPLETE</text>
  <text x="770" y="248" font-size="10.5" fill="#94a3b8" text-anchor="middle">这道题答完了</text>
  <text x="770" y="264" font-size="10" fill="#64748b" text-anchor="middle">acked 标志仍为 false</text>

  <path d="M840 240 L 868 240" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="flow" marker-end="url(#aT)"/>

  <!-- policy diamond -->
  <g filter="url(#softGlow)"><polygon points="920,205 972,240 920,275 868,240" fill="#2a2210" stroke="#fbbf24" stroke-width="2"/></g>
  <polygon points="920,205 972,240 920,275 868,240" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.3" class="halo"/>
  <text x="920" y="236" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">致谢?</text>
  <text x="920" y="252" font-size="9.5" fill="#fcd34d" text-anchor="middle">频率策略</text>

  <path d="M920 205 V 155 H 998" fill="none" stroke="#fbbf24" stroke-width="2" class="flowA" marker-end="url(#aA)"/>
  <text x="960" y="147" font-size="10" fill="#fcd34d" text-anchor="middle">是</text>
  <path d="M920 275 V 325 H 998" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#aA)"/>
  <text x="960" y="318" font-size="10" fill="#fcd34d" text-anchor="middle">否</text>

  <!-- ACK -->
  <g filter="url(#softGlow)"><rect x="1000" y="120" width="130" height="70" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="1.5"/></g>
  <text x="1065" y="144" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">致谢 ×1</text>
  <text x="1065" y="162" font-size="10" fill="#94a3b8" text-anchor="middle">脚本池 / 模板 / 受约束生成</text>
  <text x="1065" y="178" font-size="10" fill="#fcd34d" text-anchor="middle">代码校验后逐字朗读</text>

  <path d="M1065 190 V 288" fill="none" stroke="#2dd4bf" stroke-width="2" class="flow" marker-end="url(#aT)"/>

  <!-- NEXT -->
  <g filter="url(#softGlow)"><rect x="1000" y="290" width="130" height="70" rx="12" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="1065" y="314" font-size="12.5" font-weight="700" fill="#2dd4bf" text-anchor="middle">读下一题</text>
  <text x="1065" y="332" font-size="10" fill="#94a3b8" text-anchor="middle">response.create 逐字朗读</text>
  <text x="1065" y="348" font-size="10" fill="#5eead4" text-anchor="middle">acked 重置</text>

  <!-- follow-up branch -->
  <path d="M555 280 V 328" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aV)"/>
  <text x="565" y="308" font-size="10" fill="#c4b5fd">判为跑题</text>
  <rect x="470" y="330" width="170" height="50" rx="10" fill="#1c1738" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="555" y="350" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">显式追问 ×1</text>
  <text x="555" y="367" font-size="10" fill="#94a3b8" text-anchor="middle">应用触发一次 response.create</text>
  <path d="M470 355 H 160 V 282" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aV)"/>

  <!-- return NEXT -> LISTENING -->
  <path d="M1065 360 V 400 H 115 V 282" fill="none" stroke="#2dd4bf" stroke-width="2" class="flow" marker-end="url(#aT)"/>
  <text x="600" y="414" font-size="10.5" fill="#5eead4" text-anchor="middle">读完下一题，回到聆听</text>

  <!-- particles -->
  <circle r="4" fill="#2dd4bf"><animateMotion dur="1.4s" repeatCount="indefinite" path="M190 240 L 248 240"/></circle>
  <circle r="4" fill="#fbbf24"><animateMotion dur="1.6s" repeatCount="indefinite" path="M410 240 L 468 240"/></circle>
  <circle r="4" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite" path="M640 240 L 698 240"/></circle>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="6s" repeatCount="indefinite" path="M1065 360 V 400 H 115 V 282"/></circle>

  <!-- two-stage commit timeline -->
  <rect x="36" y="440" width="1100" height="86" rx="12" fill="#0e1626" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="462" font-size="12" font-weight="700" fill="#e2e8f0">两段式提交：把判断的延迟藏进候选人自己的停顿里</text>
  <line x1="100" y1="496" x2="1100" y2="496" stroke="#334155" stroke-width="2"/>
  <rect x="420" y="490" width="340" height="12" rx="6" fill="#a78bfa" opacity="0.35"/>
  <circle cx="100" cy="496" r="5" fill="#2dd4bf"/><text x="100" y="518" font-size="10.5" fill="#5eead4" text-anchor="middle">0：speech_stopped</text>
  <circle cx="420" cy="496" r="5" fill="#fbbf24"/><text x="420" y="518" font-size="10.5" fill="#fcd34d" text-anchor="middle">T1 ≈ 1.2s：开始准备（不出声）</text>
  <circle cx="760" cy="496" r="5" fill="#a78bfa"/><text x="760" y="518" font-size="10.5" fill="#c4b5fd" text-anchor="middle">T2 ≈ 2.5s 或按钮：播出（准备已完成，体感延迟≈0）</text>
  <text x="1040" y="484" font-size="10" fill="#64748b" text-anchor="middle">T1~T2 间用户再开口</text>
  <text x="1040" y="518" font-size="10" fill="#64748b" text-anchor="middle">→ 丢弃，回 LISTENING</text>
</svg>
