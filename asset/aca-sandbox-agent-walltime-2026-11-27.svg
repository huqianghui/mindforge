<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#fcfcfb"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">同一个修 bug 任务，四种接法的端到端耗时</text>
<text x="40" y="70" font-size="14" fill="#52514e">任务相同：装依赖、跑测试、修 median、复测、清理；区域 eastasia。本地 agent 每一步都要经 aca 往返一次</text>
<line x1="300.0" y1="100" x2="300.0" y2="395" stroke="#e7e6e2"/>
<text x="300.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">0 秒</text>
<line x1="432.0" y1="100" x2="432.0" y2="395" stroke="#e7e6e2"/>
<text x="432.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">60 秒</text>
<line x1="564.0" y1="100" x2="564.0" y2="395" stroke="#e7e6e2"/>
<text x="564.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">120 秒</text>
<line x1="696.0" y1="100" x2="696.0" y2="395" stroke="#e7e6e2"/>
<text x="696.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">180 秒</text>
<line x1="828.0" y1="100" x2="828.0" y2="395" stroke="#e7e6e2"/>
<text x="828.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">240 秒</text>
<line x1="960.0" y1="100" x2="960.0" y2="395" stroke="#e7e6e2"/>
<text x="960.0" y="415" font-size="13" text-anchor="middle" fill="#52514e">300 秒</text>
<text x="40" y="132" font-size="15" font-weight="600" fill="#0b0b0b">Copilot CLI（本地）</text>
<text x="40" y="152" font-size="13" fill="#52514e">第二轮；第一轮被路径校验拦下</text>
<rect x="300.0" y="118" width="288.2" height="28" rx="4" fill="#2a78d6"/>
<text x="598.2" y="138" font-size="15" font-weight="600" fill="#0b0b0b">131 秒</text>
<text x="40" y="204" font-size="15" font-weight="600" fill="#0b0b0b">VS Code Copilot（本地）</text>
<text x="40" y="224" font-size="13" fill="#52514e">含 15 次审批，其中 1 次等人点了 22 秒</text>
<rect x="300.0" y="190" width="605.0" height="28" rx="4" fill="#2a78d6"/>
<text x="915.0" y="210" font-size="15" font-weight="600" fill="#0b0b0b">275 秒</text>
<text x="40" y="276" font-size="15" font-weight="600" fill="#0b0b0b">Claude Code（本地）</text>
<text x="40" y="296" font-size="13" fill="#52514e">模型调用 51 秒，其余是 aca 往返和装依赖</text>
<rect x="300.0" y="262" width="503.8" height="28" rx="4" fill="#2a78d6"/>
<text x="813.8" y="282" font-size="15" font-weight="600" fill="#0b0b0b">229 秒</text>
<text x="40" y="348" font-size="15" font-weight="600" fill="#0b0b0b">Claude Code 装进沙箱</text>
<text x="40" y="368" font-size="13" fill="#52514e">up 4 + push 3 + run 17 + pull 4 + down 7</text>
<rect x="300.0" y="334" width="77.0" height="28" rx="4" fill="#eb6834"/>
<text x="387.0" y="354" font-size="15" font-weight="600" fill="#0b0b0b">35 秒</text>
<g font-size="13" fill="#52514e"><rect x="40" y="436" width="16" height="14" rx="3" fill="#2a78d6"/><text x="64" y="448">agent 在本地，命令经 aca 送进沙箱</text><rect x="330" y="436" width="16" height="14" rx="3" fill="#eb6834"/><text x="354" y="448">agent 本身在沙箱里，本地只发指令</text><text x="640" y="448">模型不同，耗时只作量级参考</text></g>
</svg>