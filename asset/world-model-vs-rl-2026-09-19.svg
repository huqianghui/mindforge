<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="pTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <style>
    @keyframes flowDash { to { stroke-dashoffset: -76; } }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    @keyframes shimmer { 0%,100% { opacity: 0.82; } 50% { opacity: 1; } }
    .flowSlow { stroke-dasharray: 14 24; animation: flowDash 4.5s linear infinite; }
    .flowFast { stroke-dasharray: 14 24; animation: flowDash 0.9s linear infinite; }
    .flowMid  { stroke-dasharray: 14 24; animation: flowDash 2.4s linear infinite; }
    .halo { animation: pulse 1.8s ease-in-out infinite; }
    .node { animation: shimmer 3.5s ease-in-out infinite; }
  </style>

  <rect width="1160" height="600" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="598" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="42" font-size="20" font-weight="700" fill="#e2e8f0">Model-Free vs Model-Based RL：世界模型 = 可以在脑内反复试动作的虚拟环境</text>
  <text x="1124" y="42" font-size="12" fill="#475569" text-anchor="end">粒子速度 ≈ 试错成本的倒数</text>

  <!-- ================= 左：Model-Free RL ================= -->
  <text x="70" y="88" font-size="15" font-weight="600" fill="#fcd34d">Model-Free RL：每一步试错都发生在真实世界</text>
  <text x="70" y="108" font-size="12" fill="#94a3b8">只学 π(a|s)，不学世界怎么变化——(s, a, r, s′) 直接更新策略</text>

  <!-- loop path: Policy(top) -> Action(right) -> Real Env(bottom) -> feedback(left) -->
  <path d="M 150 160 H 400 Q 430 160 430 190 V 430 Q 430 460 400 460 H 150 Q 120 460 120 430 V 190 Q 120 160 150 160"
        fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowSlow" d="M 150 160 H 400 Q 430 160 430 190 V 430 Q 430 460 400 460 H 150 Q 120 460 120 430 V 190 Q 120 160 150 160"
        fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <circle r="7" fill="url(#pAmber)" filter="url(#softGlow)">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M 150 160 H 400 Q 430 160 430 190 V 430 Q 430 460 400 460 H 150 Q 120 460 120 430 V 190 Q 120 160 150 160"/>
  </circle>

  <g class="node">
    <rect x="190" y="138" width="170" height="44" rx="10" fill="#2a2210" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="275" y="160" font-size="14" fill="#fef3c7" text-anchor="middle">Policy π(a|s)</text>
    <text x="275" y="176" font-size="11" fill="#d4be7a" text-anchor="middle">这个状态下该做什么</text>

    <rect x="360" y="288" width="140" height="40" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
    <text x="430" y="313" font-size="13" fill="#cbd5e1" text-anchor="middle">Action aₜ</text>

    <rect x="185" y="438" width="180" height="44" rx="10" fill="#2a1414" stroke="#f87171" stroke-width="1.4"/>
    <text x="275" y="459" font-size="14" fill="#fecaca" text-anchor="middle">真实环境</text>
    <text x="275" y="475" font-size="11" fill="#d49a9a" text-anchor="middle">摔一次杯子，成本真实发生</text>

    <rect x="55" y="288" width="130" height="40" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
    <text x="120" y="306" font-size="13" fill="#cbd5e1" text-anchor="middle">sₜ₊₁ , rₜ</text>
    <text x="120" y="321" font-size="11" fill="#7a8aa3" text-anchor="middle">更新 Q(s,a) / π</text>
  </g>

  <text x="275" y="530" font-size="12.5" fill="#94a3b8" text-anchor="middle">试 1000 万次？机器人和自动驾驶付不起这个学费</text>

  <!-- ================= 分隔线 ================= -->
  <line x1="560" y1="72" x2="560" y2="560" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- ================= 右：Model-Based RL ================= -->
  <text x="620" y="88" font-size="15" font-weight="600" fill="#5eead4">Model-Based RL：先学世界模型，在脑内演练，再去真实世界</text>
  <text x="620" y="108" font-size="12" fill="#94a3b8">额外学 P(s′|s, a)——候选动作先在内部 rollout，比较预测后果再选</text>

  <!-- inner fast loop: Planner(top) -> candidate a -> World Model -> predicted s',r̂ -> back -->
  <path d="M 700 160 H 1020 Q 1050 160 1050 190 V 330 Q 1050 360 1020 360 H 700 Q 670 360 670 330 V 190 Q 670 160 700 160"
        fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowFast" d="M 700 160 H 1020 Q 1050 160 1050 190 V 330 Q 1050 360 1020 360 H 700 Q 670 360 670 330 V 190 Q 670 160 700 160"
        fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <circle r="6" fill="url(#pTeal)" filter="url(#softGlow)">
    <animateMotion dur="1.6s" repeatCount="indefinite"
      path="M 700 160 H 1020 Q 1050 160 1050 190 V 330 Q 1050 360 1020 360 H 700 Q 670 360 670 330 V 190 Q 670 160 700 160"/>
  </circle>
  <circle r="6" fill="url(#pTeal)" filter="url(#softGlow)">
    <animateMotion dur="1.6s" begin="0.55s" repeatCount="indefinite"
      path="M 700 160 H 1020 Q 1050 160 1050 190 V 330 Q 1050 360 1020 360 H 700 Q 670 360 670 330 V 190 Q 670 160 700 160"/>
  </circle>
  <circle r="6" fill="url(#pTeal)" filter="url(#softGlow)">
    <animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite"
      path="M 700 160 H 1020 Q 1050 160 1050 190 V 330 Q 1050 360 1020 360 H 700 Q 670 360 670 330 V 190 Q 670 160 700 160"/>
  </circle>

  <g class="node">
    <rect x="735" y="138" width="250" height="44" rx="10" fill="#1a1430" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="860" y="160" font-size="14" fill="#ede9fe" text-anchor="middle">Planning / Policy</text>
    <text x="860" y="176" font-size="11" fill="#b3a3d9" text-anchor="middle">比较各候选动作的预测后果 → 选最优</text>

    <rect x="980" y="238" width="140" height="40" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
    <text x="1050" y="256" font-size="13" fill="#cbd5e1" text-anchor="middle">候选 a₁ a₂ a₃</text>
    <text x="1050" y="271" font-size="11" fill="#7a8aa3" text-anchor="middle">还没真的做</text>

    <rect x="740" y="338" width="240" height="46" rx="10" fill="#0f2a26" stroke="#2dd4bf" stroke-width="1.6" filter="url(#softGlow)"/>
    <text x="860" y="359" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">World Model  P(s′|s, a)</text>
    <text x="860" y="376" font-size="11" fill="#7fd4c8" text-anchor="middle">脑内模拟：预测 ŝ′ 与 r̂，想多少次都不摔杯子</text>

    <rect x="600" y="238" width="130" height="40" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
    <text x="665" y="256" font-size="13" fill="#cbd5e1" text-anchor="middle">预测 ŝ′ , r̂</text>
    <text x="665" y="271" font-size="11" fill="#7a8aa3" text-anchor="middle">想象中的未来</text>
  </g>

  <!-- outer slow amber path to real world -->
  <path class="flowMid" d="M 860 384 V 448" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" marker-end="url(#arrowAmber)"/>
  <circle r="6" fill="url(#pAmber)" filter="url(#softGlow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 860 384 V 448"/>
  </circle>
  <g class="node">
    <rect x="740" y="452" width="240" height="46" rx="10" fill="#2a1414" stroke="#f87171" stroke-width="1.4"/>
    <text x="860" y="473" font-size="14" fill="#fecaca" text-anchor="middle">真实环境</text>
    <text x="860" y="490" font-size="11" fill="#d49a9a" text-anchor="middle">只执行选出的那一步</text>
  </g>
  <path class="flowMid" d="M 985 475 H 1090 V 200 H 1056" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.45" marker-end="url(#arrowAmber)"/>
  <text x="1102" y="340" font-size="11" fill="#d4be7a" transform="rotate(90 1102 340)" text-anchor="middle">真实反馈：修正世界模型 + 更新状态</text>

  <text x="860" y="540" font-size="12.5" fill="#94a3b8" text-anchor="middle">内圈青绿高速转（想象很便宜），外圈琥珀慢速转（现实很贵）——Dreamer 系就是这个结构</text>
</svg>
