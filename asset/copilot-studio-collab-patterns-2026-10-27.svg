<style>@keyframes flowDash { to { stroke-dashoffset: -76; } } .flow { stroke-dasharray: 18 20; animation: flowDash 1.6s linear infinite; } @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } } .pulse { animation: pulse 2.2s ease-in-out infinite; }</style>
<rect width="1400" height="500" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="498" rx="17" fill="none" stroke="#1e293b"/>
<text x="36" y="46" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start">app 与 agent、workflow 互动的三种模式</text>
<text x="36" y="72" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">官方主推 A；B 路很窄；C 没有直接入口，实际上回到 A</text>
<rect x="40" y="100" width="420" height="200" rx="12" fill="#0b2a2a" stroke="#2dd4bf" stroke-width="1.6" class="pulse"/>
<text x="56" y="127" font-size="17" font-weight="700" fill="#ccfbf1" text-anchor="start">A · 共享数据（主推）</text>
<text x="56" y="151" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">后台 workflow / agent 写表</text>
<text x="56" y="175" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">app 读出来让人决定、写回</text>
<text x="56" y="199" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">写回触发下一步 workflow</text>
<rect x="40" y="320" width="420" height="116" rx="12" fill="#0b2a2a" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="56" y="347" font-size="15" font-weight="700" fill="#ccfbf1" text-anchor="start">适合</text>
<text x="56" y="371" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">审批、工单、评审</text>
<text x="56" y="395" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">报表、看板（或构建期预计算）</text>
<text x="56" y="419" font-size="13" font-weight="400" fill="#99f6e4" text-anchor="start">定期分析、生成报告文件</text>
<text x="50" y="464" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">异步 · 可审计 · 人在回路 · 绕开 harness 限制</text>
<rect x="490" y="100" width="420" height="200" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="506" y="127" font-size="17" font-weight="700" fill="#fef3c7" text-anchor="start">B · app 同步调用 agent</text>
<text x="506" y="151" font-size="13" font-weight="400" fill="#fca5a5" text-anchor="start">Copilot Studio agent ✗（回调式 / agentId 被忽略）</text>
<text x="506" y="175" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">Work IQ → M365 Copilot ✓ · Azure OpenAI ✓</text>
<text x="506" y="199" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">GitHub Copilot harness ✗ · iframe ✗</text>
<rect x="490" y="320" width="420" height="116" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="506" y="347" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="start">适合</text>
<text x="506" y="371" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">当场问答</text>
<text x="506" y="395" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">术语解释（多数可预写）</text>
<text x="500" y="464" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">一次性纯文本 · 无流式 · 每用户自建连接</text>
<rect x="940" y="100" width="420" height="200" rx="12" fill="#111827" stroke="#64748b" stroke-width="1.6"/>
<text x="956" y="127" font-size="17" font-weight="700" fill="#cbd5e1" text-anchor="start">C · app 触发 workflow</text>
<text x="956" y="151" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">没有"按钮直接调 workflow"的官方方式</text>
<text x="956" y="175" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">① 改一行数据 → 行新增 / 修改触发器</text>
<text x="956" y="199" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">② 调 Standard agent，由它把 workflow 当工具</text>
<rect x="940" y="320" width="420" height="116" rx="12" fill="#111827" stroke="#64748b" stroke-width="1.6"/>
<text x="956" y="347" font-size="15" font-weight="700" fill="#cbd5e1" text-anchor="start">适合</text>
<text x="956" y="371" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">需要"点一下就跑"的动作</text>
<text x="950" y="464" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">推荐 ①，本质就是模式 A 的回路</text>
