<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxGray { fill: #111827; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .zone { fill: none; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .h15 { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 15px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .tAmber { fill: #fcd34d; font-size: 13.5px; }
      .mono { fill: #e2e8f0; font-size: 13px; font-family: Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .lbl { fill: #a7f3d0; font-size: 13px; }
      .lblG { fill: #94a3b8; font-size: 13px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .axis { stroke: #475569; stroke-width: 2; }
      .tick { stroke: #64748b; stroke-width: 1.5; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .el { fill: #a7f3d0; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" rx="16"/>
  <text class="title" x="30" y="44">前端的读写逻辑：四种状态与一次写入的时间线</text>
  <text class="sub" x="30" y="72">左：打开应用时决定数据后端；右：滚动一次之后，本机立即写、云端去抖写；状态显示在左栏底部</text>

  <!-- ===== 左：状态机 ===== -->
  <rect class="zone" x="20" y="96" width="560" height="560" rx="12"/>
  <text class="zl" x="36" y="122">启动时：决定后端</text>

  <rect class="boxAmber" x="200" y="140" width="200" height="70" rx="10"/>
  <text class="hAmber" x="216" y="168">loading</text>
  <text class="t" x="216" y="192">确认身份、读取中</text>

  <rect class="boxGray" x="40" y="290" width="200" height="100" rx="10"/>
  <text class="h15" x="56" y="318">local</text>
  <text class="tGray" x="56" y="344">不在宿主里</text>
  <text class="tGray" x="56" y="368">只用 localStorage</text>

  <rect class="boxBlue" x="350" y="270" width="210" height="80" rx="10"/>
  <text class="h15" x="366" y="298">读取全部记录</text>
  <text class="mono" x="366" y="324">getAll(private)</text>

  <rect class="box" x="350" y="430" width="210" height="110" rx="10"/>
  <text class="h15" x="366" y="458">cloud</text>
  <text class="t" x="366" y="484">读写都走 App state</text>
  <text class="tGray" x="366" y="508">本机副本同时更新</text>

  <rect class="boxGray" x="40" y="440" width="220" height="110" rx="10"/>
  <text class="h15" x="56" y="468">offline</text>
  <text class="tGray" x="56" y="494">请求失败，新改动</text>
  <text class="tGray" x="56" y="518">只存本机，显示错误</text>

  <path class="flowGray" d="M240,210 L160,286" marker-end="url(#arrGray)"/>
  <text class="lblG" x="92" y="246">getUser 超时 / 报错</text>
  <path class="flow" d="M360,210 L430,266" marker-end="url(#arr)"/>
  <text class="lbl" x="410" y="238">拿到 objectId</text>
  <path class="flow" d="M455,350 L455,426" marker-end="url(#arr)"/>
  <text class="lbl" x="466" y="394">成功 → 合并</text>
  <path class="flowGray" d="M350,330 C300,360 240,400 180,436" marker-end="url(#arrGray)"/>
  <text class="lblG" x="236" y="372">失败</text>
  <path class="flowGray" d="M350,500 L264,500" marker-end="url(#arrGray)"/>
  <text class="lblG" x="272" y="490">写入失败</text>

  <rect class="boxGray" x="40" y="572" width="520" height="70" rx="10"/>
  <text class="t" x="56" y="598">合并规则：同一篇以 lastReadAt 较新者为准</text>
  <text class="tGray" x="56" y="622">本机键名带 objectId，换账号不会串数据</text>

  <!-- ===== 右：写入时间线 ===== -->
  <rect class="zone" x="600" y="96" width="780" height="560" rx="12"/>
  <text class="zl" x="616" y="122">一次滚动之后：写入时间线</text>

  <line class="axis" x1="640" y1="230" x2="1350" y2="230"/>
  <line class="tick" x1="660" y1="220" x2="660" y2="240"/>
  <line class="tick" x1="820" y1="220" x2="820" y2="240"/>
  <line class="tick" x1="1020" y1="220" x2="1020" y2="240"/>
  <line class="tick" x1="1240" y1="220" x2="1240" y2="240"/>
  <circle class="badge" cx="660" cy="190" r="12"/><text class="bn" x="660" y="195">1</text>
  <circle class="badge" cx="820" cy="190" r="12"/><text class="bn" x="820" y="195">2</text>
  <circle class="badge" cx="1020" cy="190" r="12"/><text class="bn" x="1020" y="195">3</text>
  <circle class="badge" cx="1240" cy="190" r="12"/><text class="bn" x="1240" y="195">4</text>
  <text class="tGray" x="644" y="160">0 ms</text>
  <text class="tGray" x="790" y="160">+600 ms</text>
  <text class="tGray" x="980" y="160">+1.5 s 去抖</text>
  <text class="tGray" x="1206" y="160">返回</text>

  <rect class="box" x="620" y="270" width="170" height="150" rx="10"/>
  <text class="h15" x="634" y="296">滚动停止</text>
  <text class="t" x="634" y="322">顶部 2% 以内</text>
  <text class="t" x="634" y="346">不算阅读</text>
  <text class="tGray" x="634" y="372">也不覆盖已有</text>
  <text class="tGray" x="634" y="396">进度</text>

  <rect class="box" x="805" y="270" width="190" height="150" rx="10"/>
  <text class="h15" x="819" y="296">本机立即写</text>
  <text class="t" x="819" y="322">更新内存快照</text>
  <text class="t" x="819" y="346">写 localStorage</text>
  <text class="tGray" x="819" y="372">界面即时刷新</text>
  <text class="tGray" x="819" y="396">（订阅式 store）</text>

  <rect class="boxAmber" x="1010" y="270" width="200" height="150" rx="10"/>
  <text class="hAmber" x="1024" y="296">云端写一次</text>
  <text class="t" x="1024" y="322">无 itemId → POST</text>
  <text class="t" x="1024" y="346">有 itemId → PUT</text>
  <text class="tAmber" x="1024" y="372">PUT 整条覆盖</text>
  <text class="tAmber" x="1024" y="396">每次写全部字段</text>

  <rect class="box" x="1225" y="270" width="140" height="150" rx="10"/>
  <text class="h15" x="1239" y="296">记住 itemId</text>
  <text class="t" x="1239" y="322">下次走 PUT</text>
  <text class="tGray" x="1239" y="348">失败则切到</text>
  <text class="tGray" x="1239" y="372">offline</text>

  <path class="flow" d="M790,345 L801,345" marker-end="url(#arr)"/>
  <path class="flowAmber" d="M995,345 L1006,345" marker-end="url(#arrAmber)"/>
  <path class="flow" d="M1210,345 L1221,345" marker-end="url(#arr)"/>

  <rect class="boxGray" x="620" y="446" width="745" height="196" rx="10"/>
  <text class="h15" x="636" y="474">为什么这样排</text>
  <text class="t" x="636" y="502">· 本机先写：网络慢或失败都不影响"继续阅读"，换文章再回来进度还在</text>
  <text class="t" x="636" y="530">· 去抖 1.5 秒：连续滚动只产生一次云端写入，收藏的连点也会被合并</text>
  <text class="t" x="636" y="558">· PUT 是整条覆盖：只传改动的字段会把其他字段清掉，所以每次都写全</text>
  <text class="t" x="636" y="586">· 文章组件以路径为 key 渲染：换文章即重新挂载，不必在 effect 里手动重置状态</text>
  <text class="tGray" x="636" y="618">实测：收藏 → POST 201；刷新后同一篇变成 PUT 200，证明 itemId 是从云端读回的</text>

  <!-- 图例 -->
  <rect class="boxGray" x="20" y="676" width="1360" height="124" rx="12"/>
  <text class="h15" x="40" y="704">编号说明</text>
  <circle class="badge" cx="52" cy="734" r="11"/><text class="bn" x="52" y="739">1</text>
  <text class="el" x="72" y="739">阅读器监听滚动，停下 600 ms 才记录一次</text>
  <circle class="badge" cx="52" cy="766" r="11"/><text class="bn" x="52" y="771">2</text>
  <text class="el" x="72" y="771">同步写本机，界面马上显示新的进度与星标</text>
  <circle class="badge" cx="712" cy="734" r="11"/><text class="bn" x="712" y="739">3</text>
  <text class="el" x="732" y="739">去抖到期后才发请求；首次创建、之后整条更新</text>
  <circle class="badge" cx="712" cy="766" r="11"/><text class="bn" x="712" y="771">4</text>
  <text class="el" x="732" y="771">保存平台返回的 itemId，失败时如实切换为"仅保存在本机"</text>
</svg>
