<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #f1f5f9; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 16px; font-weight: 700; fill: #f1f5f9; }
    .hs { font-size: 13px; fill: #94a3b8; }
    .t { font-size: 14px; fill: #cbd5e1; }
    .m { font-size: 13px; fill: #e2e8f0; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .bt { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
    .bs { font-size: 13px; fill: #cbd5e1; }
    .note { font-size: 13px; fill: #94a3b8; }
    .warn { fill: #fbbf24; }
    .ok { fill: #2dd4bf; }
    .audio { stroke: #2dd4bf; stroke-width: 2.5; fill: none; }
    .text { stroke: #fbbf24; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; animation: flow 1.2s linear infinite; }
    .plan { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 6 8; }
    .think { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes breathe { 0%,100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }
  </style>
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1480" height="1060" rx="18" fill="#0f172a"/>
  <text x="40" y="48" class="title">一次语音面试会话的全链路：两条管线只差一个 EoU 检测器，「说」与数字人完全相同</text>
  <text x="40" y="76" class="sub">检测器与管线由管理端所选的语音模型唯一决定，没有人工开关　｜　青绿实线 = 音频　琥珀虚线 = 文本　灰虚线 = 会话之外的 HTTP 调用</text>

  <!-- row 1 -->
  <rect x="40" y="110" width="400" height="190" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="60" y="142" class="h">① 浏览器</text>
  <text x="60" y="172" class="t">麦克风上行：PCM 16 kHz 单声道</text>
  <text x="60" y="198" class="t">下行：音频 + WebRTC 视频 + 字幕</text>
  <text x="60" y="224" class="t">一条 WebSocket 承载全部控制与音频</text>
  <text x="60" y="250" class="hs">数字人视频轨经 WebRTC 单独回到页面</text>

  <rect x="540" y="110" width="400" height="190" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="560" y="142" class="h">② 后端代理</text>
  <text x="560" y="172" class="t">持有 Azure Voice Live SDK 连接</text>
  <text x="560" y="198" class="t">浏览器与 Azure 之间双向中继</text>
  <text x="560" y="224" class="t">按人物与语言装配 session.update</text>
  <text x="560" y="250" class="hs">只在这里决定走哪条管线</text>

  <rect x="1040" y="110" width="400" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="1060" y="142" class="h">③ 会话装配</text>
  <text x="1060" y="170" class="t">外层 VAD：<tspan class="m">azure_semantic_vad_multilingual</tspan></text>
  <text x="1060" y="194" class="t">音色：<tspan class="m">session.voice = azure-standard</tspan></text>
  <text x="1060" y="218" class="t">输入转写 <tspan class="m">azure-speech</tspan>　数字人 <tspan class="m">session.avatar</tspan></text>
  <text x="1060" y="244" class="t"><tspan class="warn">EoU 检测器按管线二选一</tspan>，这是两条路线唯一的差别</text>
  <text x="1060" y="270" class="hs">其余字段两条路线完全相同</text>

  <line x1="440" y1="205" x2="538" y2="205" class="audio" marker-end="url(#aA)"/>
  <line x1="940" y1="205" x2="1038" y2="205" class="audio" marker-end="url(#aA)"/>
  <circle r="5" fill="#2dd4bf"><animateMotion dur="2s" repeatCount="indefinite" path="M440,205 L1040,205"/></circle>

  <!-- branch -->
  <path d="M1240,300 L1240,340 L380,340 L380,378" class="audio" marker-end="url(#aA)"/>
  <path d="M1240,340 L1100,340 L1100,378" class="audio" marker-end="url(#aA)"/>
  <circle r="5" fill="#2dd4bf"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1240,300 L1240,340 L380,340 L380,380"/></circle>
  <circle r="5" fill="#2dd4bf"><animateMotion dur="1.4s" begin="0.6s" repeatCount="indefinite" path="M1240,300 L1240,340 L1100,340 L1100,380"/></circle>

  <!-- left panel: cascaded -->
  <rect x="100" y="380" width="620" height="330" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="120" y="412" class="h">级联式 · 选 chat 模型时（今天线上的默认，本次一个字节未动）</text>
  <text x="120" y="436" class="hs">触发条件：<tspan class="m">gpt-5-mini</tspan> 等 chat 部署，或 BYOM 的 chat-completion profile</text>
  <rect x="120" y="456" width="170" height="140" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="136" y="486" class="bt">听</text><text x="136" y="512" class="bs">Azure STT</text><text x="136" y="536" class="bs"><tspan class="m">azure-speech</tspan></text><text x="136" y="562" class="bs">产出识别文本</text>
  <rect x="320" y="456" width="170" height="140" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="336" y="486" class="bt">轮次检测 EoU</text><text x="336" y="512" class="bs">文本型（读 transcript）</text><text x="336" y="536" class="bs"><tspan class="m">semantic_detection</tspan></text><text x="336" y="556" class="bs"><tspan class="m">_v1_multilingual</tspan></text><text x="336" y="582" class="bs">timeout 1500 ms</text>
  <rect x="520" y="456" width="180" height="140" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2" class="think"/>
  <text x="536" y="486" class="bt">想</text><text x="536" y="512" class="bs">你的 chat 部署</text><text x="536" y="536" class="bs"><tspan class="m">gpt-5-mini</tspan></text><text x="536" y="562" class="bs">文本进 / 文本出</text>
  <line x1="290" y1="526" x2="318" y2="526" class="text" marker-end="url(#aT)"/>
  <line x1="490" y1="526" x2="518" y2="526" class="text" marker-end="url(#aT)"/>
  <text x="120" y="630" class="note">1500 ms 是它一直在跑的值。音频型检测器在这条路上也被 Azure 接受，</text>
  <text x="120" y="654" class="note">但 A/B 只证明两者等价（英文末次判停 7.57 s 对 7.68 s，中文 8.98 s 对 8.96 s）。</text>
  <text x="120" y="678" class="note">等价不是更好，所以唯一在线上跑的这条路不动。</text>

  <!-- right panel: hybrid -->
  <rect x="760" y="380" width="680" height="330" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="780" y="412" class="h">混合式 · 选 realtime 模型时（本次新增可用）</text>
  <text x="780" y="436" class="hs">触发条件：实测 6 个原生 <tspan class="m">gpt-realtime-*</tspan> / <tspan class="m">azure-realtime</tspan>，或 BYOM 的 realtime profile</text>
  <rect x="780" y="456" width="190" height="140" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="796" y="486" class="bt">听</text><text x="796" y="512" class="bs">音频直通模型</text><text x="796" y="536" class="bs">无 Voice Live 识别器</text><text x="796" y="562" class="bs">（转写仍另行开启）</text>
  <rect x="1010" y="456" width="190" height="140" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1026" y="486" class="bt">轮次检测 EoU</text><text x="1026" y="512" class="bs">音频型（直接读音频）</text><text x="1026" y="536" class="bs"><tspan class="m">smart_end_of_turn</tspan></text><text x="1026" y="556" class="bs"><tspan class="m">_detection</tspan></text><text x="1026" y="582" class="bs">timeout 1000 ms</text>
  <rect x="1240" y="456" width="180" height="140" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2" class="think"/>
  <text x="1256" y="486" class="bt">想</text><text x="1256" y="512" class="bs">Speech-LLM</text><text x="1256" y="536" class="bs"><tspan class="m">gpt-realtime-2.1</tspan></text><text x="1256" y="562" class="bs">音频进 / 文本出</text>
  <line x1="970" y1="526" x2="1008" y2="526" class="audio" marker-end="url(#aA)"/>
  <line x1="1200" y1="526" x2="1238" y2="526" class="audio" marker-end="url(#aA)"/>
  <text x="780" y="630" class="note">文本型检测器在这条路上会把整个会话拒掉：“Text-based end-of-utterance detection</text>
  <text x="780" y="654" class="note">requires a local speech recognizer…”，这一行就是 realtime 唯一的拦路石。</text>
  <text x="780" y="678" class="note">1000 ms 是实测点：1500 ms 晚 0.45～0.6 s，700 ms 行为变质（并段）。</text>

  <!-- merge to speak -->
  <path d="M380,710 L380,748 L740,748 L740,768" class="text" marker-end="url(#aT)"/>
  <path d="M1100,710 L1100,748 L740,748" class="text"/>
  <circle r="5" fill="#fbbf24"><animateMotion dur="1.6s" repeatCount="indefinite" path="M380,710 L380,748 L740,748 L740,770"/></circle>
  <circle r="5" fill="#fbbf24"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M1100,710 L1100,748 L740,748 L740,770"/></circle>

  <!-- speak box -->
  <rect x="240" y="770" width="1000" height="130" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="260" y="802" class="h">④ 说 + 数字人 —— 两条路线<tspan class="warn">完全相同</tspan></text>
  <text x="260" y="832" class="t">Azure Speech TTS（<tspan class="m">session.voice = azure-standard</tspan>）→ viseme 口型 → 服务端渲染数字人 → WebRTC 回浏览器</text>
  <text x="260" y="858" class="note">所以 realtime 走的是架构图里的混合式：realtime 当大脑，<tspan class="ok">嘴仍然是 Azure TTS</tspan>，口型照旧由 TTS 驱动，音色不随模型变。</text>
  <text x="260" y="882" class="note">逐字念题（<tspan class="m">pre_generated_assistant_message</tspan>）绕过大脑直接进 TTS，两条路线都保证题目逐字一致。</text>

  <!-- return to browser -->
  <path d="M240,835 L70,835 L70,302" class="audio" marker-end="url(#aA)"/>
  <circle r="5" fill="#2dd4bf"><animateMotion dur="2.2s" repeatCount="indefinite" path="M240,835 L70,835 L70,300"/></circle>
  <text x="88" y="560" class="hs" text-anchor="middle" transform="rotate(-90 88 560)">音频 + 视频 + 字幕回到浏览器</text>

  <!-- inference leg -->
  <line x1="740" y1="900" x2="740" y2="938" class="plan" marker-end="url(#aP)"/>
  <rect x="40" y="940" width="1400" height="100" rx="12" fill="#111827" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="60" y="970" class="h">推理腿 —— 不在会话里，<tspan class="warn">永远用 chat 部署</tspan></text>
  <text x="60" y="996" class="t">judge（<tspan class="m">wait / nudge</tspan>）· 打分 / checklist / SOP 覆盖 · Foundry agent 的底层模型 → Responses API（HTTP）</text>
  <text x="60" y="1022" class="note">realtime 部署在 7 个 HTTP 文本面与 Responses 的 WebSocket 模式上全部被拒（实测），所以评估必须留在 chat 上；管理端里它是独立于语音模型的另一个字段。</text>
</svg>
