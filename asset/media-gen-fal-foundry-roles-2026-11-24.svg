<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #13213a; stroke: #2dd4bf; stroke-width: 1.6; }
      .boxBlue { fill: #10203a; stroke: #38bdf8; stroke-width: 1.6; }
      .boxPurple { fill: #1c1534; stroke: #a78bfa; stroke-width: 1.6; }
      .boxAmber { fill: #2a1f0b; stroke: #fbbf24; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
      .zone { fill: #0d1729; stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zoneP { fill: #120f22; stroke: #a78bfa; stroke-width: 1.4; stroke-dasharray: 10 6; }
      .zoneG { fill: #0f141f; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .zl { fill: #7dd3fc; font-size: 15px; font-weight: 600; }
      .zlp { fill: #c4b5fd; font-size: 15px; font-weight: 600; }
      .zlg { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .hAmber { fill: #fde68a; font-size: 16px; font-weight: 600; }
      .t { fill: #cbd5e1; font-size: 13.5px; }
      .tGray { fill: #94a3b8; font-size: 13.5px; }
      .tAmber { fill: #fcd34d; font-size: 13.5px; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 14px; }
      .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .flowGray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
      .badge { fill: #0f766e; stroke: #5eead4; stroke-width: 1.4; }
      .badgeAmber { fill: #92400e; stroke: #fcd34d; stroke-width: 1.4; }
      .bn { fill: #f0fdfa; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .wall { stroke: #f87171; stroke-width: 2.4; stroke-dasharray: 12 8; }
      .wl { fill: #fca5a5; font-size: 14px; font-weight: 600; }
      .el { fill: #cbd5e1; font-size: 13.5px; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860" rx="16"/>
  <text class="title" x="30" y="44">Foundry 上一次视频生成请求经过的四类角色</text>
  <text class="sub" x="30" y="72">模型研发方 ≠ 后训练方 ≠ 推理服务方 ≠ 接入平台；红色虚线是数据离开 Microsoft 设施的位置</text>

  <!-- 应用 -->
  <rect class="box" x="30" y="120" width="200" height="200" rx="10"/>
  <text class="h" x="46" y="148">我的应用</text>
  <text class="t" x="46" y="176">Prompt / 首帧图</text>
  <text class="t" x="46" y="200">参考图、参考视频、音频</text>
  <text class="t" x="46" y="224">az 取 Entra token</text>
  <text class="t" x="46" y="248">轮询任务状态</text>
  <text class="t" x="46" y="272">下载 MP4</text>
  <text class="tGray" x="46" y="300">素材要先放到可访问 URL</text>

  <!-- Microsoft 区 -->
  <rect class="zone" x="270" y="100" width="380" height="440" rx="14"/>
  <text class="zl" x="290" y="126">Microsoft Foundry（接入平台）</text>
  <rect class="boxBlue" x="290" y="142" width="340" height="120" rx="10"/>
  <text class="h" x="306" y="170">Deployment 与计费</text>
  <text class="t" x="306" y="196">US Data Zone：Kling v3 Pro</text>
  <text class="t" x="306" y="220">Global Standard PayGo：LTX、MiniMax</text>
  <text class="tGray" x="306" y="244">配额：Tier 1–4 为 2 RPM，Tier 5+ 为 40</text>
  <rect class="boxBlue" x="290" y="278" width="340" height="120" rx="10"/>
  <text class="h" x="306" y="306">统一入口与身份</text>
  <text class="t" x="306" y="332">Entra ID Bearer token</text>
  <text class="t" x="306" y="356">/providers/falai/{厂商}/{模型}/{模态}</text>
  <text class="tGray" x="306" y="380">fal 原生 key 与 deployment 不能复用</text>
  <rect class="boxBlue" x="290" y="414" width="340" height="106" rx="10"/>
  <text class="h" x="306" y="442">Playground 与订阅开关</text>
  <text class="t" x="306" y="468">订阅注册 Fal.EnableDeploy 预览功能</text>
  <text class="tGray" x="306" y="494">Playground 的能力提示与 API 不一定一致</text>

  <!-- 边界 -->
  <line class="wall" x1="680" y1="96" x2="680" y2="560"/>
  <text class="wl" x="692" y="118">数据出 Microsoft</text>
  <text class="wl" x="692" y="138">产品条款 / DPA 不适用</text>

  <!-- fal 区 -->
  <rect class="zoneP" x="860" y="100" width="260" height="440" rx="14"/>
  <text class="zlp" x="878" y="126">fal（推理服务 + 后训练）</text>
  <rect class="boxPurple" x="876" y="142" width="228" height="140" rx="10"/>
  <text class="h" x="892" y="170">推理平台</text>
  <text class="t" x="892" y="196">请求队列 · GPU 调度</text>
  <text class="t" x="892" y="220">面向扩散模型的推理引擎</text>
  <text class="t" x="892" y="244">request_id / 结果 URL</text>
  <text class="tGray" x="892" y="268">首批模型托管在美国</text>
  <rect class="boxAmber" x="876" y="300" width="228" height="140" rx="10"/>
  <text class="hAmber" x="892" y="328">后训练产品</text>
  <text class="t" x="892" y="354">H3 Max：基于 MiniMax H3</text>
  <text class="t" x="892" y="378">提示遵循、美感数据 + RL</text>
  <text class="t" x="892" y="402">H3 Max Turbo：吞吐优先</text>
  <text class="tAmber" x="892" y="426">不等于 MiniMax 官方 H3</text>
  <rect class="boxPurple" x="876" y="456" width="228" height="68" rx="10"/>
  <text class="t" x="892" y="482">原生平台 1500+ 媒体模型</text>
  <text class="tGray" x="892" y="506">Foundry 只开放其中 5 个</text>

  <!-- 模型厂商 -->
  <rect class="zoneG" x="1150" y="100" width="220" height="440" rx="14"/>
  <text class="zlg" x="1168" y="126">模型研发方</text>
  <rect class="box" x="1166" y="142" width="188" height="110" rx="10"/>
  <text class="h" x="1180" y="170">快手 Kling</text>
  <text class="t" x="1180" y="196">3.0 系列 2026-02-05</text>
  <text class="t" x="1180" y="220">闭源</text>
  <text class="tGray" x="1180" y="242">Foundry 用 v3 Pro</text>
  <rect class="box" x="1166" y="266" width="188" height="120" rx="10"/>
  <text class="h" x="1180" y="294">Lightricks LTX</text>
  <text class="t" x="1180" y="320">LTX-2.5 2026-08</text>
  <text class="t" x="1180" y="344">开放权重</text>
  <text class="tGray" x="1180" y="368">大公司商用需授权</text>
  <rect class="box" x="1166" y="400" width="188" height="124" rx="10"/>
  <text class="h" x="1180" y="428">MiniMax</text>
  <text class="t" x="1180" y="454">H3 基础模型</text>
  <text class="t" x="1180" y="478">开放权重</text>
  <text class="tGray" x="1180" y="502">2025-04 起与 fal 合作</text>

  <!-- 流 -->
  <path class="flow" d="M230,200 L288,200" marker-end="url(#arr)"/>
  <circle class="badge" cx="258" cy="182" r="13"/><text class="bn" x="258" y="187">1</text>
  <path class="flowAmber" d="M630,338 L874,212" marker-end="url(#arrAmber)"/>
  <circle class="badgeAmber" cx="760" cy="262" r="13"/><text class="bn" x="760" y="267">2</text>
  <path class="flowGray" d="M1164,456 L1106,384" marker-end="url(#arrGray)"/>
  <circle class="badge" cx="1134" cy="436" r="13"/><text class="bn" x="1134" y="441">3</text>
  <path class="flowGray" d="M1164,200 L1106,200" marker-end="url(#arrGray)"/>
  <path class="flowGray" d="M1164,320 L1106,240" marker-end="url(#arrGray)"/>
  <path class="flow" d="M990,542 L990,578 L130,578 L130,324" marker-end="url(#arr)"/>
  <circle class="badge" cx="560" cy="578" r="13"/><text class="bn" x="560" y="583">4</text>
  <text class="tGray" x="580" y="600">结果 URL 回到应用</text>

  <!-- 图例 -->
  <rect class="zoneG" x="30" y="610" width="1340" height="226" rx="12"/>
  <text class="h" x="50" y="640">编号说明</text>
  <circle class="badge" cx="62" cy="670" r="12"/><text class="bn" x="62" y="675">1</text>
  <text class="el" x="84" y="675">应用用 Entra token 调 Foundry 资源域名下的 /providers/falai 路由，请求体里的 model 字段填自己的 deployment 名。</text>
  <circle class="badgeAmber" cx="62" cy="706" r="12"/><text class="bn" x="62" y="711">2</text>
  <text class="el" x="84" y="711">Foundry 把请求和输入素材转给 fal。这一跳之后由 fal 服务条款约束，Microsoft 的产品条款、DPA 与合规认证不覆盖 fal 这一段。</text>
  <circle class="badge" cx="62" cy="742" r="12"/><text class="bn" x="62" y="747">3</text>
  <text class="el" x="84" y="747">fal 运行的是厂商模型或它自己的后训练版本：Kling 与 LTX 按厂商模型托管，H3 Max / Turbo 是 fal 在开放权重 H3 上后训练的产物。</text>
  <circle class="badge" cx="62" cy="778" r="12"/><text class="bn" x="62" y="783">4</text>
  <text class="el" x="84" y="783">生成是异步任务：提交拿 request_id，轮询 status 到 COMPLETED，再取结果里的 video.url 下载。</text>
  <text class="tGray" x="84" y="816">依据：Microsoft Learn《Fal models on Microsoft Foundry》（2026-11-07 更新）、fal H3 Max 介绍页、LTX 官方版本说明。</text>
</svg>
