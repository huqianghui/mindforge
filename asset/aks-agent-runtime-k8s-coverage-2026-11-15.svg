<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 964" width="1400" height="964" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
<style>.title{fill:#f8fafc;font-size:22px;font-weight:700}.sub{fill:#94a3b8;font-size:14px}.hc{fill:#f1f5f9;font-size:15px;font-weight:700;text-anchor:middle}.rl{fill:#e2e8f0;font-size:14px;font-weight:600}.c{font-size:13px}.own{fill:#cbd5e1;font-size:13px}.lg{fill:#cbd5e1;font-size:13.5px}.lgh{fill:#e2e8f0;font-size:15px;font-weight:600}.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}</style>
<rect width="1400" height="964" rx="16" fill="#0b1220"/>
<text class="title" x="30" y="44">agent 平台要管的事：Kubernetes 原生、agent-sandbox、OpenSandbox 各覆盖到哪</text>
<text class="sub" x="30" y="72">青绿 = 提供了，琥珀 = 部分提供或要额外配置，灰 = 没有。最右一列是要自己补的东西，括号里是系列中讲它的那一篇</text>
<rect x="30" y="96" width="250" height="40" rx="8" fill="#1e293b" stroke="#475569"/>
<text class="hc" x="155.0" y="122">要管的事</text>
