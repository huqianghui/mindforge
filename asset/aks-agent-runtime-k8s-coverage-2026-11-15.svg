<rect x="290" y="150" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="302" y="175" fill="#5eead4">RuntimeClass + Kata</text>
<rect x="550" y="150" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="562" y="175" fill="#fde68a">借用：模板写 runtimeClassName</text>
<rect x="810" y="150" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="822" y="175" fill="#fde68a">借用：Pool 要自己写</text>
<rect x="1070" y="150" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="175">—（01 补充）</text>
<rect x="30" y="196" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="221">沙箱生命周期与预热</text>
<rect x="290" y="196" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="221" fill="#fde68a">Deployment / StatefulSet 不顺手</text>
<rect x="550" y="196" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="562" y="221" fill="#5eead4">WarmPool、Claim、到期回收</text>
<rect x="810" y="196" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="822" y="221" fill="#5eead4">Pool、TTL、BatchSandbox</text>
<rect x="1070" y="196" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="221">—</text>
<rect x="30" y="242" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="267">进沙箱执行、读写文件</text>
<rect x="290" y="242" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="267" fill="#fde68a">kubectl exec，权限太大</text>
<rect x="550" y="242" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="562" y="267" fill="#fde68a">sandboxd，尚早期</text>
<rect x="810" y="242" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="822" y="267" fill="#5eead4">execd，镜像不用改</text>
<rect x="1070" y="242" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="267">—</text>
<rect x="30" y="288" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="313">暂停后保留状态</text>
<rect x="290" y="288" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="313" fill="#fde68a">PVC</text>
<rect x="550" y="288" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="562" y="313" fill="#fde68a">Suspended，只留 PVC</text>
<rect x="810" y="288" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="822" y="313" fill="#5eead4">rootfs 快照到镜像仓库</text>
<rect x="1070" y="288" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="313">快照仓库清理（05）</text>
<rect x="30" y="334" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="359">会话状态与绑定</text>
