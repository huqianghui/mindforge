<text class="c" x="302" y="359" fill="#64748b">无</text>
<rect x="550" y="334" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="359" fill="#64748b">无</text>
<rect x="810" y="334" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="359" fill="#64748b">无</text>
<rect class="pulse" x="1070" y="334" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="359">状态库、收件箱、lease（03、05、06）</text>
<rect x="30" y="380" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="405">终端用户与 OBO</text>
<rect x="290" y="380" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="302" y="405" fill="#64748b">集群用户不是业务用户</text>
<rect x="550" y="380" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="405" fill="#64748b">无</text>
<rect x="810" y="380" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="405" fill="#64748b">只有一个 API key</text>
<rect class="pulse" x="1070" y="380" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="405">会话 API + Entra、OBO（09）</text>
<rect x="30" y="426" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="451">资源 + 动作逐请求授权</text>
<rect x="290" y="426" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="451" fill="#fde68a">只管集群 API；可借 SAR 查 RBAC</text>
<rect x="550" y="426" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="451" fill="#64748b">无</text>
<rect x="810" y="426" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="822" y="451" fill="#fde68a">边车按域名放行</text>
<rect x="1070" y="426" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="451">网关 + 授权决策点（04）</text>
<rect x="30" y="472" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="497">凭据不进沙箱</text>
<rect x="290" y="472" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="302" y="497" fill="#64748b">Secret 挂进去就暴露</text>
<rect x="550" y="472" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="497" fill="#64748b">无</text>
<rect x="810" y="472" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="822" y="497" fill="#fde68a">Credential Vault，恢复后要重注入</text>
<rect x="1070" y="472" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="497">凭据代理（04）</text>
<rect x="30" y="518" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="543">出站只剩一条路</text>
<rect x="290" y="518" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="302" y="543" fill="#5eead4">NetworkPolicy（IP / 端口）</text>
<rect x="550" y="518" width="250" height="40" rx="7" fill="#10302d" stroke="#2dd4bf"/>
<text class="c" x="562" y="543" fill="#5eead4">模板默认封内网段</text>
<rect x="810" y="518" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="822" y="543" fill="#fde68a">请求带策略才生效</text>
<rect x="1070" y="518" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="543">命名空间兜底策略</text>
<rect x="30" y="564" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="589">模型调用治理</text>
<rect x="290" y="564" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="302" y="589" fill="#64748b">无</text>
<rect x="550" y="564" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="589" fill="#64748b">无</text>
<rect x="810" y="564" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="589" fill="#64748b">无</text>
<rect class="pulse" x="1070" y="564" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="589">模型网关、协议转换（08）</text>
<rect x="30" y="610" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="635">harness 非交互与确认</text>
<rect x="290" y="610" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="302" y="635" fill="#64748b">无</text>
<rect x="550" y="610" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="635" fill="#64748b">无</text>
<rect x="810" y="610" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="635" fill="#64748b">无</text>
<rect class="pulse" x="1070" y="610" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="635">适配器、权限档位（03）</text>
<rect x="30" y="656" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="681">agent 调 agent</text>
<rect x="290" y="656" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="302" y="681" fill="#64748b">无</text>
<rect x="550" y="656" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="681" fill="#64748b">无</text>
<rect x="810" y="656" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="681" fill="#64748b">无</text>
<rect class="pulse" x="1070" y="656" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="681">子会话、只允许一跳（03、07）</text>
<rect x="30" y="702" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="727">审批与审计</text>
<rect x="290" y="702" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="727" fill="#fde68a">审计日志只覆盖 API server</text>
<rect x="550" y="702" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="727" fill="#64748b">无</text>
<rect x="810" y="702" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="822" y="727" fill="#64748b">无</text>
<rect x="1070" y="702" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="727">控制面审计、审批（03、09）</text>
<rect x="30" y="748" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
<text class="rl" x="44" y="773">配额与成本</text>
<rect x="290" y="748" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="302" y="773" fill="#fde68a">ResourceQuota：CPU、内存</text>
<rect x="550" y="748" width="250" height="40" rx="7" fill="#111827" stroke="#334155"/>
<text class="c" x="562" y="773" fill="#64748b">无</text>
<rect x="810" y="748" width="250" height="40" rx="7" fill="#2a2110" stroke="#fbbf24"/>
<text class="c" x="822" y="773" fill="#fde68a">池满返回 429</text>
<rect x="1070" y="748" width="300" height="40" rx="7" fill="#13213a" stroke="#38bdf8"/>
<text class="own" x="1082" y="773">token 预算、并发上限（06、08）</text>
<text class="lgh" x="30" y="824">怎么读</text>
<text class="lg" x="30" y="852">前四行是"房间"：Kubernetes 给墙，agent-sandbox 和 OpenSandbox 给分配、进入和暂停，这一段基本有现成的。</text>
<text class="lg" x="30" y="876">从"会话状态与绑定"往下是"住户和规矩"：会话、终端用户、外部资源、模型、harness、审批。三列几乎全灰，最右一列闪烁的那几行三者都没有。</text>
<text class="lg" x="30" y="900">"出站只剩一条路"是 NetworkPolicy 能做好的底线；它之上的"这条路上放不放行、以谁的名义"要靠网关和授权决策点。</text>
<text class="lg" x="30" y="924">OpenSandbox 的边车和 Credential Vault 覆盖了出站与凭据的一部分，但它只认识沙箱，不认识会话、用户和资源 owner 的批准。</text>
</svg>