<text class="lgh" x="30" y="870">怎么读</text>
<text class="lg" x="30" y="898">前四行是"房间"：Kubernetes 给墙，agent-sandbox 和 OpenSandbox 给分配、进入和暂停，基本都有现成的。</text>
<text class="lg" x="30" y="922">从"会话状态与绑定"往下，中间三列几乎全灰，但紫色列大多有社区组件可以当底座：Dapr 管会话状态，OpenFGA 和 ext_authz 管授权，agentgateway 管出站和模型，cert-manager 管身份。</text>
<text class="lg" x="30" y="946">最右一列复用不了：它们都要认识会话、终端用户和外部资源上的动作，而社区组件只认识工作负载、请求和规则。闪烁的几行是两个沙箱项目和 Kubernetes 都没有的。</text>
<text class="lg" x="30" y="970">"（在用）"指前面几篇的参考实现或安全沙箱实现已经用上；没标的是社区里有、两套实现都还没用的选项。</text>
</svg>