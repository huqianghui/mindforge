<text class="hc" x="675.0" y="122">agent-sandbox</text>
<rect x="810" y="96" width="250" height="40" rx="8" fill="#1e293b" stroke="#475569"/>
<text class="hc" x="935.0" y="122">OpenSandbox</text>
<rect x="1070" y="96" width="300" height="40" rx="8" fill="#1e293b" stroke="#475569"/>
<text class="hc" x="1220.0" y="122">要自己补（系列哪篇）</text>
<rect x="30" y="150" width="250" height="40" rx="7" fill="#0f172a" stroke="#334155"/>
