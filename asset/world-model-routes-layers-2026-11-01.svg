<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgRL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <marker id="aRL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aRLg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    @keyframes dashRL { to { stroke-dashoffset: -28; } }
    .flow { fill: none; stroke: #2dd4bf; stroke-width: 2.2; stroke-dasharray: 8 6; animation: dashRL 1.2s linear infinite; }
    .flowG { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 4 6; animation: dashRL 2s linear infinite; }
    .zl { font-size: 15px; font-weight: 600; }
    .h { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
    .t { fill: #cbd5e1; font-size: 13.5px; }
    .tG { fill: #94a3b8; font-size: 13.5px; }
    .k { fill: #7dd3fc; font-size: 13.5px; font-weight: 600; }
    .bad { fill: #fca5a5; font-size: 13.5px; }
    .good { fill: #86efac; font-size: 13.5px; }
  </style>

  <rect width="1400" height="920" rx="18" fill="url(#bgRL)"/>
  <rect x="1" y="1" width="1398" height="918" rx="17" fill="none" stroke="#1e293b"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#f8fafc">世界模型的路线：同一个范式，四种表示，四种用法</text>
  <text x="30" y="72" font-size="14" fill="#94a3b8">自下而上读：底层所有路线都一样；分歧在中间"用什么表示世界"；上层看模拟出来的世界拿去干什么。箭头是"这种表示最常被拿去做的事"</text>

  <!-- ===== 用途层 ===== -->
  <rect x="30" y="96" width="1340" height="200" rx="14" fill="#0b1a1c" stroke="#2dd4bf" stroke-width="1.3" stroke-dasharray="10 6"/>
  <text class="zl" x="48" y="122" fill="#5eead4">③ 用途层 · 模拟出来的世界拿去做什么</text>
  <rect x="48" y="136" width="310" height="144" rx="10" fill="#0f2626" stroke="#2dd4bf" stroke-width="1.4"/>
  <text class="h" x="64" y="164">训练场 · 数据工厂</text>
  <text class="t" x="64" y="192">SIMA 2 在 Genie 3 世界里自我改进</text>
  <text class="t" x="64" y="216">Waymo 用世界模型合成长尾路况</text>
  <text class="t" x="64" y="240">Cosmos 把少量数据放大成训练视频</text>
  <text class="tG" x="64" y="266">落地实践 02 · 世界模型 05</text>
  <rect x="380" y="136" width="310" height="144" rx="10" fill="#0f2626" stroke="#2dd4bf" stroke-width="1.4"/>
  <text class="h" x="396" y="164">可以走进去的世界</text>
  <text class="t" x="396" y="192">Marble 导出到 Unreal / Unity</text>
  <text class="t" x="396" y="216">游戏、VR、数字孪生的场景底座</text>
  <text class="t" x="396" y="240">接上物理仿真才能训练机器人</text>
  <text class="tG" x="396" y="266">空间智能 03 · 04</text>
  <rect x="712" y="136" width="310" height="144" rx="10" fill="#0f2626" stroke="#2dd4bf" stroke-width="1.4"/>
  <text class="h" x="728" y="164">高保真训练与验证</text>
  <text class="t" x="728" y="192">Isaac Lab 里几千个环境并行跑 RL</text>
  <text class="t" x="728" y="216">上真机前做回归测试</text>
  <text class="t" x="728" y="240">结果可复现，便于定位问题</text>
  <text class="tG" x="728" y="266">落地实践 03</text>
  <rect x="1044" y="136" width="310" height="144" rx="10" fill="#0f2626" stroke="#2dd4bf" stroke-width="1.4"/>
  <text class="h" x="1060" y="164">在想象中规划</text>
  <text class="t" x="1060" y="192">V-JEPA 2-AC 采样候选动作，</text>
  <text class="t" x="1060" y="216">在潜空间里比较后果（MPC）</text>
  <text class="t" x="1060" y="240">Dreamer 在梦里训练策略</text>
  <text class="tG" x="1060" y="266">世界模型 03 · 04</text>

  <!-- ===== 表现层 ===== -->
  <rect x="30" y="326" width="1340" height="340" rx="14" fill="#14120a" stroke="#facc15" stroke-width="1.3" stroke-dasharray="10 6"/>
  <text class="zl" x="48" y="352" fill="#fde68a">② 表现层 · 用什么表示世界（分歧在这里）</text>

  <rect x="48" y="366" width="310" height="282" rx="10" fill="#221c08" stroke="#facc15" stroke-width="1.5"/>
  <text class="h" x="64" y="394">像素 · 视频生成</text>
  <text class="k" x="64" y="422">代表</text><text class="t" x="104" y="422">Sora · Genie 3 · Cosmos</text>
  <text class="k" x="64" y="448">世界在哪</text><text class="t" x="132" y="448">权重里的像素统计</text>
  <text class="good" x="64" y="482">✓ 互联网视频取之不尽</text>
  <text class="good" x="64" y="506">✓ 画面直观，一眼看出对不对</text>
  <text class="bad" x="64" y="540">✕ 转一圈回来东西会漂</text>
  <text class="bad" x="64" y="564">✕ 读不出尺寸、摩擦这类物理量</text>
  <text class="bad" x="64" y="588">✕ 生成每一帧都很贵</text>
  <text class="tG" x="64" y="626">世界模型 01 · 05</text>

  <rect x="380" y="366" width="310" height="282" rx="10" fill="#221c08" stroke="#facc15" stroke-width="1.5"/>
  <text class="h" x="396" y="394">显式 3D · 空间生成</text>
  <text class="k" x="396" y="422">代表</text><text class="t" x="436" y="422">Marble · HY-World 2.0</text>
  <text class="k" x="396" y="448">世界在哪</text><text class="t" x="464" y="448">3DGS / mesh 本身</text>
  <text class="good" x="396" y="482">✓ 一致性由表示保证</text>
  <text class="good" x="396" y="506">✓ 可测量、可编辑、可导出</text>
  <text class="bad" x="396" y="540">✕ 3D 训练数据少且贵</text>
  <text class="bad" x="396" y="564">✕ 1024² ≈ 100 万像素，</text>
  <text class="bad" x="396" y="588">    1024³ ≈ 10 亿体素</text>
  <text class="tG" x="396" y="626">空间智能 02 · 04</text>

  <rect x="712" y="366" width="310" height="282" rx="10" fill="#221c08" stroke="#facc15" stroke-width="1.5"/>
  <text class="h" x="728" y="394">物理方程 · 手写仿真</text>
  <text class="k" x="728" y="422">代表</text><text class="t" x="768" y="422">Isaac Sim · MuJoCo</text>
  <text class="k" x="728" y="448">世界在哪</text><text class="t" x="796" y="448">状态变量 + 方程</text>
  <text class="good" x="728" y="482">✓ 不穿墙，结果可复现</text>
  <text class="good" x="728" y="506">✓ 物理量就是输出</text>
  <text class="bad" x="728" y="540">✕ 布料、液体、软体难建模</text>
  <text class="bad" x="728" y="564">✕ 场景要人一个个搭</text>
  <text class="bad" x="728" y="588">✕ sim-to-real 差距靠调参补</text>
  <text class="tG" x="728" y="626">世界模型 01 · 落地实践 03</text>

  <rect x="1044" y="366" width="310" height="282" rx="10" fill="#221c08" stroke="#facc15" stroke-width="1.5"/>
  <text class="h" x="1060" y="394">潜空间 · 只预测特征</text>
  <text class="k" x="1060" y="422">代表</text><text class="t" x="1100" y="422">JEPA · V-JEPA 2 · Dreamer</text>
  <text class="k" x="1060" y="448">世界在哪</text><text class="t" x="1128" y="448">几百到上千维的向量</text>
  <text class="good" x="1060" y="482">✓ 丢掉树叶纹理这类无关细节</text>
  <text class="good" x="1060" y="506">✓ rollout 便宜，适合高频规划</text>
  <text class="bad" x="1060" y="540">✕ 人看不见它学到了什么</text>
  <text class="bad" x="1060" y="564">✕ 该保留什么，目标很难定义</text>
  <text class="bad" x="1060" y="588">✕ 缺统一的 benchmark</text>
  <text class="tG" x="1060" y="626">世界模型 04</text>

  <!-- 表现层 → 用途层 -->
  <line class="flow" x1="203" y1="364" x2="203" y2="284" marker-end="url(#aRL)"/>
  <line class="flow" x1="535" y1="364" x2="535" y2="284" marker-end="url(#aRL)"/>
  <line class="flow" x1="867" y1="364" x2="867" y2="284" marker-end="url(#aRL)"/>
  <line class="flow" x1="1199" y1="364" x2="1199" y2="284" marker-end="url(#aRL)"/>
  <path class="flowG" d="M640,364 L640,320 L300,320 L300,284" marker-end="url(#aRLg)"/>
  <text class="tG" x="312" y="314">3D + 物理引擎也能当训练场</text>

  <!-- ===== 范式层 ===== -->
  <rect x="30" y="696" width="1340" height="130" rx="14" fill="#101828" stroke="#64748b" stroke-width="1.3" stroke-dasharray="10 6"/>
  <text class="zl" x="48" y="722" fill="#cbd5e1">① 范式层 · 所有路线共用</text>
  <rect x="48" y="736" width="420" height="74" rx="10" fill="#111c2e" stroke="#64748b" stroke-width="1.3"/>
  <text class="h" x="64" y="764">潜在状态：o → s</text>
  <text class="t" x="64" y="790">把高维观测压成可计算的状态（Latent MDP）</text>
  <rect x="490" y="736" width="420" height="74" rx="10" fill="#111c2e" stroke="#64748b" stroke-width="1.3"/>
  <text class="h" x="506" y="764">动力学：P(s′ | s, a)</text>
  <text class="t" x="506" y="790">学"动作之后世界怎么变"，对任务中立</text>
  <rect x="932" y="736" width="422" height="74" rx="10" fill="#111c2e" stroke="#64748b" stroke-width="1.3"/>
  <text class="h" x="948" y="764">模拟器：反复 rollout</text>
  <text class="t" x="948" y="790">沿时间往前推，回答"如果当时换个做法"</text>
  <line class="flow" x1="258" y1="734" x2="258" y2="652" marker-end="url(#aRL)"/>
  <line class="flow" x1="700" y1="734" x2="700" y2="652" marker-end="url(#aRL)"/>
  <line class="flow" x1="1142" y1="734" x2="1142" y2="652" marker-end="url(#aRL)"/>

  <!-- legend -->
  <rect x="30" y="846" width="1340" height="58" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text class="t" x="52" y="880">读法：先在 ① 确认它有没有"状态 + 动作条件化的转移"（没有就只是视频预测器）→ 在 ② 看它把世界存成什么、代价是什么 → 在 ③ 看它被谁调用</text>
</svg>
