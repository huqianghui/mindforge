<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgER" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="glowER" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloER" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="pTealER" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pVioletER" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pAmberER" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes flowDashER { to { stroke-dashoffset: -60; } }
    @keyframes pulseER { 0%,100% { opacity: 0.12; } 50% { opacity: 0.55; } }
    @keyframes shimmerER { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    .flowER  { stroke-dasharray: 14 16; animation: flowDashER 1.6s linear infinite; }
    .haloER  { animation: pulseER 2.2s ease-in-out infinite; }
    .nodeER  { animation: shimmerER 3.6s ease-in-out infinite; }
  </style>

  <rect width="1160" height="700" rx="18" fill="url(#bgER)"/>
  <rect x="1" y="1" width="1158" height="698" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="36" y="44" font-size="21" font-weight="700" fill="#e2e8f0">显式与隐式空间表达：两条路线，一个汇合点</text>
  <text x="1124" y="44" font-size="13" fill="#475569" text-anchor="end">青绿 = 显式路线 · 紫 = 隐式路线 · 琥珀 = 汇合与行动</text>

  <!-- source node -->
  <g class="nodeER">
    <rect x="450" y="66" width="260" height="52" rx="12" fill="#152238" stroke="#64748b" stroke-width="1.5"/>
    <text x="580" y="88" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Camera / Video</text>
    <text x="580" y="107" font-size="11" fill="#94a3b8" text-anchor="middle">同一份原始视觉观测</text>
  </g>

  <!-- split paths from source -->
  <path d="M 500 118 C 420 150, 330 160, 300 190" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowER" d="M 500 118 C 420 150, 330 160, 300 190" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 660 118 C 740 150, 830 160, 860 190" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowER" d="M 660 118 C 740 150, 830 160, 860 190" fill="none" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

  <!-- left column spine (explicit) -->
  <path d="M 300 190 V 505" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flowER" d="M 300 190 V 505" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <circle r="6" fill="url(#pTealER)" filter="url(#glowER)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 500 118 C 420 150, 330 160, 300 190 V 505 C 300 560, 420 585, 500 600"/>
  </circle>
  <circle r="5" fill="url(#pTealER)" filter="url(#glowER)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M 500 118 C 420 150, 330 160, 300 190 V 505 C 300 560, 420 585, 500 600"/>
  </circle>

  <!-- right column spine (implicit) -->
  <path d="M 860 190 V 505" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path class="flowER" d="M 860 190 V 505" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <circle r="6" fill="url(#pVioletER)" filter="url(#glowER)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 660 118 C 740 150, 830 160, 860 190 V 505 C 860 560, 740 585, 660 600"/>
  </circle>
  <circle r="5" fill="url(#pVioletER)" filter="url(#glowER)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M 660 118 C 740 150, 830 160, 860 190 V 505 C 860 560, 740 585, 660 600"/>
  </circle>

  <!-- column headers -->
  <text x="300" y="178" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle">路线 A：显式空间表示</text>
  <text x="860" y="178" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle">路线 B：隐式 learned 表示</text>

  <!-- explicit route nodes -->
  <g class="nodeER">
    <rect x="120" y="196" width="360" height="66" rx="12" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="300" y="222" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">VGGT / SLAM —— 前馈几何感知</text>
    <text x="300" y="243" font-size="10.5" fill="#5eead4" opacity="0.85" text-anchor="middle">多图整体进 Transformer → camera pose + depth + point map</text>
  </g>
  <g class="nodeER">
    <rect x="120" y="288" width="360" height="66" rx="12" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="300" y="314" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">3DGS（可渲染场景）＋ 3D Semantic Map</text>
    <text x="300" y="335" font-size="10.5" fill="#5eead4" opacity="0.85" text-anchor="middle">几何层"长什么样" ＋ 语义层"里面有什么"（对象·位姿·关系）</text>
  </g>
  <g class="nodeER">
    <rect x="120" y="380" width="360" height="66" rx="12" fill="#10312e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="300" y="406" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">Spatial Memory —— 可查询的空间数据库</text>
    <text x="300" y="427" font-size="10.5" fill="#5eead4" opacity="0.85" text-anchor="middle">3D + Semantic + Temporal：对象·历史·置信度，支持 query 与更新</text>
  </g>
  <text x="300" y="490" font-size="11.5" fill="#5eead4" opacity="0.75" text-anchor="middle">可测量 · 可解释 · 可查询 · 可多传感器融合</text>

  <!-- implicit route nodes -->
  <g class="nodeER">
    <rect x="680" y="196" width="360" height="66" rx="12" fill="#221a3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="860" y="222" font-size="14" font-weight="600" fill="#ede9fe" text-anchor="middle">Tokenizer —— 视频变 latent tokens</text>
    <text x="860" y="243" font-size="10.5" fill="#c4b5fd" opacity="0.85" text-anchor="middle">不产出 (x,y,z)，产出模型自己学出的压缩表示</text>
  </g>
  <g class="nodeER">
    <rect x="680" y="288" width="360" height="66" rx="12" fill="#221a3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="860" y="314" font-size="14" font-weight="600" fill="#ede9fe" text-anchor="middle">Latent World Representation</text>
    <text x="860" y="335" font-size="10.5" fill="#c4b5fd" opacity="0.85" text-anchor="middle">空间结构·遮挡·物体恒存性隐含在特征里（隐式 3D）</text>
  </g>
  <g class="nodeER">
    <rect x="680" y="380" width="360" height="66" rx="12" fill="#221a3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="860" y="406" font-size="14" font-weight="600" fill="#ede9fe" text-anchor="middle">Latent Dynamics —— Z(t) + A(t) → Z(t+1)</text>
    <text x="860" y="427" font-size="10.5" fill="#c4b5fd" opacity="0.85" text-anchor="middle">Cosmos 这类 World Foundation Model：直接学时间·运动·物理规律</text>
  </g>
  <text x="860" y="490" font-size="11.5" fill="#c4b5fd" opacity="0.75" text-anchor="middle">端到端 · 免维护 3D pipeline · 天然做未来预测</text>

  <!-- converge paths -->
  <path d="M 300 505 C 300 560, 420 585, 500 600" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowER" d="M 300 505 C 300 560, 420 585, 500 600" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 860 505 C 860 560, 740 585, 660 600" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flowER" d="M 860 505 C 860 560, 740 585, 660 600" fill="none" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <!-- converged node with amber pulse -->
  <rect class="haloER" x="444" y="566" width="272" height="78" rx="18" fill="none" stroke="#fbbf24" stroke-width="10" filter="url(#haloER)"/>
  <g>
    <rect x="450" y="572" width="260" height="66" rx="14" fill="#33270a" stroke="#fbbf24" stroke-width="2"/>
    <text x="580" y="598" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">Hybrid：显式几何 ＋ 学习动力学</text>
    <text x="580" y="620" font-size="11" fill="#fcd34d" text-anchor="middle">显式管"在哪里"，隐式管"接下来会怎样" → VLA → Action</text>
  </g>

  <!-- side annotations -->
  <text x="80" y="672" font-size="11.5" fill="#5eead4" opacity="0.8">A 答"这个东西的准确位置是什么"</text>
  <text x="1080" y="672" font-size="11.5" fill="#c4b5fd" opacity="0.8" text-anchor="end">B 答"接下来会发生什么"</text>
</svg>
